# Builds the PokéBench site (packages/site) from this repository's data and publishes it to GitHub Pages.
# Runs on every push to main that touches the site's inputs, and by hand. The site is static: no secrets,
# no third-party services; the only token is GitHub's own short-lived GITHUB_TOKEN for the Pages deploy.
name: site

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - "site/data/**"
      - "site/updates/**"
      - "docs/explainers/**"
      - "docs/images/**"
      - "packages/viewer/static/fonts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @pokebench/site...
      - run: pnpm --filter @pokebench/site test
      - run: pnpm --filter @pokebench/site build
      - run: node packages/site/dist/cli.js "$GITHUB_WORKSPACE"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
