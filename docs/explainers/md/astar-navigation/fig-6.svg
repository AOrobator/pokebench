<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 0 484 470" role="img" aria-label="Our execution loop" width="484" height="470">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ef;--card:#fffdf8;--fg:#1f2328;--muted:#5d6470;--line:#d9d4c7;--ours:#0f8a7e;--ours-soft:#d5efeb;--theirs:#c46a12;--theirs-soft:#f8e4cc;
--ground:#ece6d6;--grass:#b9dca0;--blade:#5f9a45;--water:#a9cdea;--wave:#4f8cc0;--bldg:#b7aea0;--tree:#8fb98a;--treec:#4e8a4c;--door:#8b5a2b;--npc:#d9534f;--fog:rgba(40,40,40,.42);--goal:#e6b422;--gridline:rgba(0,0,0,.06);--node:#fff}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#15171a;--card:#1d2024;--fg:#e8e6e1;--muted:#a2a8b2;--line:#33373d;--ours:#3cc7b7;--ours-soft:#173a37;--theirs:#f0a050;--theirs-soft:#3d2a16;
--ground:#3a3730;--grass:#3e5a33;--blade:#86c26a;--water:#2f4d68;--wave:#7fb6e3;--bldg:#5d5850;--tree:#33503a;--treec:#5f9d5c;--door:#c08a55;--npc:#ef6b67;--fog:rgba(0,0,0,.55);--goal:#f4c842;--gridline:rgba(255,255,255,.05);--node:#25292e}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1d2024;--fg:#e8e6e1;--muted:#a2a8b2;--line:#33373d;--ours:#3cc7b7;--ours-soft:#173a37;--theirs:#f0a050;--theirs-soft:#3d2a16;
--ground:#3a3730;--grass:#3e5a33;--blade:#86c26a;--water:#2f4d68;--wave:#7fb6e3;--bldg:#5d5850;--tree:#33503a;--treec:#5f9d5c;--door:#c08a55;--npc:#ef6b67;--fog:rgba(0,0,0,.55);--goal:#f4c842;--gridline:rgba(255,255,255,.05);--node:#25292e}
*{box-sizing:border-box}
svg{width:100%;height:auto;display:block}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.box.o{stroke:var(--ours);fill:var(--ours-soft)}
.box.stop{fill:var(--card);stroke:var(--muted);stroke-dasharray:4 3}
.bt{font-size:13px;fill:var(--fg);font-weight:600;text-anchor:middle}
.bs{font-size:11px;fill:var(--muted);text-anchor:middle}
.arr{stroke:var(--muted);stroke-width:1.6;fill:none}
.arr.o{stroke:var(--ours)}
.lab{font-size:11px;fill:var(--muted)}
:root{--open:#cfe6f7;--closed:#efe3c4;--cur:#f6c453;--gk:#2f6fb3;--hk:#a0522d;--fk:#1f2328}
@media (min-width:1000000px){:root:not([data-theme="light"]){--open:#1f3a52;--closed:#3c3526;--cur:#8a6a17;--gk:#7fb3ea;--hk:#e39a6f;--fk:#f1efe9}}
:root[data-theme="dark"]{--open:#1f3a52;--closed:#3c3526;--cur:#8a6a17;--gk:#7fb3ea;--hk:#e39a6f;--fk:#f1efe9}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="-24" y="0" width="484" height="470" style="fill:#ffffff;stroke:none" /><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke" /></marker></defs>
<rect x="20" y="10" width="250" height="52" rx="10" class="box o" /><text x="145" y="32" class="bt">read game state</text><text x="145" y="50" class="bs">same map? field controls free?</text>
<rect x="20" y="96" width="250" height="52" rx="10" class="box o" /><text x="145" y="118" class="bt">plan with A*</text><text x="145" y="136" class="bs">on the current 15×15 window</text>
<rect x="20" y="182" width="250" height="52" rx="10" class="box o" /><text x="145" y="204" class="bt">press only the first direction</text><text x="145" y="222" class="bs">through the normal checked press tool</text>
<rect x="20" y="268" width="250" height="52" rx="10" class="box o" /><text x="145" y="290" class="bt">did I move exactly one tile?</text><text x="145" y="308" class="bs">or only turn to face that way?</text>
<path d="M145 62V92" class="arr o" marker-end="url(#ah2)" /><path d="M145 148V178" class="arr o" marker-end="url(#ah2)" /><path d="M145 234V264" class="arr o" marker-end="url(#ah2)" />
<path d="M20 294H6V36H16" class="arr o" marker-end="url(#ah2)" /><text x="-6" y="165" class="lab" transform="rotate(-90 -6 165)" text-anchor="middle">yes, under 8 presses: loop</text>
<g><rect x="300" y="10" width="150" height="38" rx="8" class="box stop" /><text x="375" y="34" class="bs">map changed</text>
<rect x="300" y="96" width="150" height="38" rx="8" class="box stop" /><text x="375" y="120" class="bs">no supported path</text>
<rect x="300" y="270" width="150" height="38" rx="8" class="box stop" /><text x="375" y="294" class="bs">blocked or moved oddly</text>
<rect x="300" y="350" width="150" height="38" rx="8" class="box stop" /><text x="375" y="374" class="bs">arrived, or 8 presses</text></g>
<path d="M270 30H296" class="arr" marker-end="url(#ah2)" /><path d="M270 118H296" class="arr" marker-end="url(#ah2)" /><path d="M270 290H296" class="arr" marker-end="url(#ah2)" /><path d="M200 320V369H296" class="arr" marker-end="url(#ah2)" />
<rect x="20" y="410" width="430" height="50" rx="10" class="box" /><text x="235" y="431" class="bt">observe, then return status + fresh state</text><text x="235" y="449" class="bs">the model reads it and picks the next waypoint</text>
<path d="M375 388V406" class="arr" marker-end="url(#ah2)" />
</svg>
