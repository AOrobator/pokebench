<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Four model requests: two during a battle, then two on the free field, with what auto-talk does OFF and ON" width="900" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .tile{fill:var(--tile);stroke:var(--grid);stroke-width:1}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="330" style="fill:#ffffff;stroke:none" /><text x="20" y="30">Model requests while the same call keeps repeating (a loop auto-talk would act on)</text>
<g transform="translate(20,50)">
<rect class="tile" x="0" y="0" width="200" height="40" /><text x="12" y="26">request 1 · battle</text>
<rect class="tile" x="215" y="0" width="200" height="40" /><text x="227" y="26">request 2 · battle</text>
<rect class="tile" x="430" y="0" width="200" height="40" /><text x="442" y="26">request 3 · field free</text>
<rect class="tile" x="645" y="0" width="200" height="40" /><text x="657" y="26">request 4 · field</text>
</g>
<rect class="offbox" x="20" y="110" width="860" height="95" rx="8" />
<text x="35" y="135">OFF</text>
<text x="35" y="160" class="small">not_free event</text><text x="250" y="160" class="small">not_free event</text>
<text x="35" y="180" class="small">+ "the game is showing the battle input" note</text>
<text x="35" y="198" class="small">(with field-ownership-feedback-v1)</text>
<text x="465" y="160" class="small">walks to the nearest untalked</text><text x="465" y="180" class="small">person, presses A, sends what they said</text>
<rect class="onbox" x="20" y="220" width="860" height="95" rx="8" />
<text x="35" y="245">ON</text>
<text x="35" y="270" class="small">nothing: no event, no note,</text><text x="35" y="290" class="small">no walk, no press</text>
<text x="250" y="270" class="small">nothing</text>
<text x="465" y="270" class="small">the loop was not used up, so it walks,</text><text x="465" y="290" class="small">presses A and sends what they said</text>
</svg>
