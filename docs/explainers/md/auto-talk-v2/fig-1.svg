<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Route 102 with the player, beaten Calvin next to him and a boy farther away, and the candidate list off and on" width="900" height="420">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .coord{font-size:11px;fill:var(--muted)}
svg .white{fill:#ffffff}
svg .tile{fill:var(--tile);stroke:var(--grid);stroke-width:1}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .struck{stroke:var(--off);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="420" style="fill:#ffffff;stroke:none" /><g transform="translate(20,40)">
<rect class="tile" x="0" y="0" width="300" height="150" />
<path d="M50 0V150M100 0V150M150 0V150M200 0V150M250 0V150M0 50H300M0 100H300" stroke="#b9c8bf" stroke-width="1" />
<circle cx="25" cy="75" r="18" fill="#546562" /><text x="19" y="81" class="white">B</text>
<circle cx="125" cy="75" r="16" fill="#2d5f8a" /><text x="118" y="81" class="white">P</text>
<circle cx="175" cy="75" r="18" fill="#a8432c" /><text x="169" y="81" class="white">C</text>
<text x="0" y="172" class="coord">x=12</text><text x="100" y="172" class="coord">x=14</text><text x="150" y="172" class="coord">x=15</text><text x="250" y="172" class="coord">x=17</text>
<text x="0" y="200" class="small">ROUTE 102 (map 0/17), row y=10. P: player at (14,10).</text>
<text x="0" y="220" class="small">C: object 5, YOUNGSTER (Calvin) at (15,10), defeated.</text>
<text x="0" y="240" class="small">B: object 3, BOY_1 at (12,10), not a trainer.</text>
</g>
<rect class="box" x="360" y="20" width="530" height="110" rx="8" />
<text x="373" y="45">Candidates, sorted by rank, then by tile distance</text>
<text x="373" y="70" class="small">rank 0: untalked story characters on this map</text>
<text x="373" y="90" class="small">rank 1: other people (no items, no unbeaten trainers, none already talked to)</text>
<text x="373" y="110" class="small">rank 2: signs. The first 3 are tried in order.</text>
<rect class="offbox" x="360" y="150" width="255" height="260" rx="8" />
<text x="373" y="175">OFF (auto-talk-v1 alone)</text>
<text x="373" y="205">1. YOUNGSTER, rank 1, 1 tile</text>
<text x="373" y="230">2. BOY_1, rank 1, 2 tiles</text>
<text x="373" y="270">Talks to YOUNGSTER, the</text>
<text x="373" y="292">beaten trainer, as e9ee did</text>
<text x="373" y="314">with Calvin.</text>
<rect class="onbox" x="635" y="150" width="255" height="260" rx="8" />
<text x="648" y="175">ON (auto-talk-v2)</text>
<text x="648" y="205">YOUNGSTER, rank 1, 1 tile</text>
<line class="struck" x1="646" y1="200" x2="855" y2="200" />
<text x="648" y="225" class="small">defeated in heal_before_trainers</text>
<text x="648" y="250">1. BOY_1, rank 1, 2 tiles</text>
<text x="648" y="290">Talks to BOY_1.</text>
<text x="648" y="330" class="small">An unbeaten YOUNGSTER is</text>
<text x="648" y="348" class="small">left out OFF and ON alike, so</text>
<text x="648" y="366" class="small">BOY_1 is picked either way.</text>
</svg>
