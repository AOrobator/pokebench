<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="A counter of turns on one map, reset by a new map, a story milestone or a talk, firing at 10" width="900" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .tile{fill:var(--tile);stroke:var(--grid);stroke-width:1}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="300" style="fill:#ffffff;stroke:none" /><text x="20" y="28">Turns on the free field of one map (battles, menus and dialogue are not counted)</text>
<g transform="translate(20,45)">
<rect class="tile" x="0" y="0" width="60" height="40" /><text x="24" y="26">1</text>
<rect class="tile" x="70" y="0" width="60" height="40" /><text x="94" y="26">2</text>
<rect class="tile" x="140" y="0" width="60" height="40" /><text x="164" y="26">3</text>
<text x="215" y="26">…</text>
<rect class="tile" x="250" y="0" width="60" height="40" /><text x="274" y="26">9</text>
<rect class="onbox" x="320" y="0" width="80" height="40" /><text x="342" y="26">10</text>
<path class="arrow" d="M400 20H450" />
<rect class="box" x="455" y="-10" width="410" height="60" rx="8" />
<text x="468" y="14" class="small">walk to one person not talked to since the</text>
<text x="468" y="34" class="small">latest story milestone, face them, press A</text>
</g>
<g transform="translate(20,135)">
<text x="0" y="0">The count starts over at 0 when:</text>
<text x="0" y="28" class="small">• the player is on a different map than last counted</text>
<text x="0" y="50" class="small">• a story milestone the game observed arrives (not a measurement-only one, not present at start)</text>
<text x="0" y="72" class="small">• the harness has just talked, or found no one to talk to (so the next try is 10 more quiet turns away)</text>
<text x="0" y="110">The model then gets:</text>
<text x="0" y="135" class="small">"SUPERVISOR: Your last 10 turns on this map brought no story milestone, so the harness walked you to BOY_1</text>
<text x="0" y="155" class="small">at (6,5) and pressed A. It has not chosen where to go next; this is what they said." + the press result</text>
</g>
</svg>
