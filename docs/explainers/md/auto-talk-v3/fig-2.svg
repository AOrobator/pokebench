<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="MAY's house 1F: the mother talked to before the milestone ranks ahead of a nearer stranger" width="900" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .white{fill:#ffffff}
svg .tile{fill:var(--tile);stroke:var(--grid);stroke-width:1}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="300" style="fill:#ffffff;stroke:none" /><g transform="translate(20,30)">
<rect class="tile" x="0" y="0" width="300" height="200" />
<path d="M50 0V200M100 0V200M150 0V200M200 0V200M250 0V200M0 50H300M0 100H300M0 150H300" stroke="#b9c8bf" stroke-width="1" />
<circle cx="75" cy="75" r="18" fill="#a8432c" /><text x="69" y="81" class="white">W</text>
<circle cx="225" cy="125" r="18" fill="#546562" /><text x="219" y="131" class="white">B</text>
<circle cx="225" cy="175" r="16" fill="#2d5f8a" /><text x="218" y="181" class="white">P</text>
<text x="0" y="225" class="small">W: WOMAN_4, talked to before the latest milestone. B: BOY_1, never talked to. P: player.</text>
</g>
<rect class="offbox" x="360" y="30" width="250" height="200" rx="8" />
<text x="373" y="55">Rank OFF (v1)</text>
<text x="373" y="85" class="small">0 untalked story characters</text>
<text x="373" y="105" class="small">1 other people, nearest first</text>
<text x="373" y="125" class="small">2 signs</text>
<text x="373" y="165">Picks B (nearer)</text>
<rect class="onbox" x="630" y="30" width="250" height="200" rx="8" />
<text x="643" y="55">Rank ON (v3)</text>
<text x="643" y="85" class="small">0 untalked story characters</text>
<text x="643" y="105" class="small">1 people talked to earlier in the run</text>
<text x="643" y="125" class="small">2 people never talked to</text>
<text x="643" y="145" class="small">3 signs</text>
<text x="643" y="185">Picks W</text>
</svg>
