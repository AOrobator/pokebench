 <rect x="166" y="284" width="168" height="44" rx="6" fill="var(--hi)" stroke="var(--ok)" stroke-width="2" /><text x="178" y="303">PROF. BIRCH'S HOUSE 2F</text><text x="178" y="320" class="m">map 1/3</text>
 <path d="M247 248 V284" stroke="var(--fg)" />
 <rect x="346" y="204" width="125" height="44" rx="6" fill="var(--hi)" stroke="var(--ok)" stroke-width="2" /><text x="354" y="223">PROF. BIRCH'S</text><text x="354" y="240">POKéMON LAB 1/4</text>

 <text x="490" y="14" class="b">Story goal names RUSTBORO CITY</text>
 <rect x="490" y="24" width="220" height="46" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="2" /><text x="500" y="44" class="b">RUSTBORO CITY (0/3)</text><text x="500" y="61" class="m">the named place; N, S, E edges</text>
