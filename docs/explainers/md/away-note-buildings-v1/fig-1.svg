 <rect x="610" y="124" width="100" height="52" rx="6" fill="var(--card)" stroke="var(--dash)" /><text x="618" y="145">ROUTE104</text><text x="618" y="164" class="m">0/19, outdoor</text>
 <path d="M660 176 V230" stroke="var(--fg)" /><text x="666" y="207" class="m">door</text>
