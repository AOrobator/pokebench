 <rect x="20" y="350" width="18" height="14" fill="var(--hi)" stroke="var(--ok)" stroke-width="2" /><text x="44" y="362">building of the named place: ON, moves here are not counted</text>
 <path d="M440 357 H480" stroke="var(--fg)" stroke-width="4" /><text x="486" y="362">N/S/E/W map connection</text>
