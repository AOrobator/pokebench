 <path d="M80 150 V204 M150 150 L245 204 M200 150 L405 204" stroke="var(--fg)" fill="none" />
 <text x="235" y="176" class="m">doors</text>
 <rect x="20" y="204" width="135" height="44" rx="6" fill="var(--hi)" stroke="var(--ok)" stroke-width="2" /><text x="28" y="223">RED's HOUSE 1F</text><text x="28" y="240" class="m">map 1/0</text>
 <rect x="20" y="284" width="135" height="44" rx="6" fill="var(--hi)" stroke="var(--ok)" stroke-width="2" /><text x="28" y="303">RED's HOUSE 2F</text><text x="28" y="320" class="m">map 1/1</text>
