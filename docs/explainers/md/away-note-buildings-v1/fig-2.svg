<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Before and after on RED's HOUSE 2F">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f6f8;--fg:#162333;--card:#fff;--muted:#5a6878;--floor:#e9efe3;--grass:#9fd08a;--ledge:#c9a46a;--wall:#55606c;--walk:#2b6b9d;--later:#6aa0c8;--stop:#c0392b;--ok:#2e7d32;--dash:#8a96a3;--hi:#fff4c2}
*{box-sizing:border-box}
svg{display:block;width:100%;height:auto;min-width:560px}
svg text{font:12px system-ui,-apple-system,sans-serif;fill:var(--fg)}
svg text.b{font-weight:700}
svg text.m{fill:var(--muted)}
svg text.ax{font-size:10px;fill:var(--muted)}
svg .floor{fill:var(--floor);stroke:#cfd6c8;stroke-width:.5}
svg .wall{fill:var(--wall);stroke:#46505a;stroke-width:.5}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="w" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--walk)" /></marker></defs>
 <text x="20" y="20" class="b">RED's HOUSE 2F (map 1/1), 6bc3 seq 1053</text>
 <g transform="translate(20,34)">
  <rect x="0" y="0" width="240" height="40" class="wall" />
  <rect x="0" y="40" width="240" height="40" class="floor" />
  <rect x="160" y="0" width="40" height="40" fill="var(--hi)" stroke="var(--ok)" stroke-width="2" /><text x="166" y="25">door</text>
  <text x="20" y="98" class="ax">x=3</text><text x="60" y="98" class="ax">4</text><text x="100" y="98" class="ax">5</text><text x="140" y="98" class="ax">6</text><text x="180" y="98" class="ax">7</text><text x="220" y="98" class="ax">8</text>
  <text x="246" y="25" class="ax">y=1</text><text x="246" y="65" class="ax">y=2</text>
  <circle cx="180" cy="60" r="8" fill="var(--walk)" /><circle cx="100" cy="60" r="6" fill="var(--walk)" opacity=".6" /><circle cx="60" cy="60" r="8" fill="var(--walk)" />
  <path d="M170 60 H110" stroke="var(--walk)" stroke-width="3" marker-end="url(#w)" /><path d="M94 60 H70" stroke="var(--walk)" stroke-width="3" marker-end="url(#w)" />
  <text x="0" y="122">(7,2) → (5,2) → (4,2)</text>
  <text x="0" y="140">door at (7,1): 1 → 3 → 4 tiles away</text>
 </g>
 <rect x="300" y="30" width="410" height="120" rx="8" fill="var(--card)" stroke="var(--stop)" stroke-width="2" />
 <text x="312" y="52" class="b">OFF: two moves farther, the note fires</text>
 <text x="312" y="74">SUPERVISOR: Your last two moves took you farther from</text>
 <text x="312" y="92">LITTLEROOT TOWN (map 0/9), the place in MOM's line above</text>
 <text x="312" y="110">(turn 59): on RED's HOUSE 2F (map 1/1) you went from (7,2)</text>
 <text x="312" y="128">to (5,2), and the door at (7,1) … went from 1 to 3 tiles away …</text>
 <rect x="300" y="170" width="410" height="80" rx="8" fill="var(--card)" stroke="var(--ok)" stroke-width="2" />
 <text x="312" y="192" class="b">ON: RED's HOUSE 2F is a building of LITTLEROOT TOWN</text>
 <text x="312" y="214">No note. Each move here starts the count over, as a</text>
 <text x="312" y="232">move inside LITTLEROOT TOWN itself does.</text>
 <text x="20" y="200" class="m">Two moves away in a row (no closer</text>
 <text x="20" y="218" class="m">move between) fire one note. ON,</text>
 <text x="20" y="236" class="m">the counter is cleared on every result</text>
 <text x="20" y="254" class="m">whose state is in such a building.</text>
</svg>
