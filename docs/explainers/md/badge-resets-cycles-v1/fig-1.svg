<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="Trips before the badge are dropped; trips after it count" width="760" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="150" style="fill:#ffffff;stroke:none" /><rect x="20" y="40" width="210" height="60" rx="8" fill="#e3eaf3" stroke="#345779" /><text x="125" y="66" text-anchor="middle">Trips before the badge</text><text x="125" y="84" text-anchor="middle" class="small">dropped when it is earned</text>
<rect x="280" y="40" width="180" height="60" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="370" y="66" text-anchor="middle">New badge or gym win</text><text x="370" y="84" text-anchor="middle" class="small">first time seen</text>
<rect x="510" y="40" width="230" height="60" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="625" y="66" text-anchor="middle">Trips after it</text><text x="625" y="84" text-anchor="middle" class="small">count toward the note as before</text>
<path d="M230 70H280M460 70H510" stroke="#5a6b80" fill="none" />
</svg>
