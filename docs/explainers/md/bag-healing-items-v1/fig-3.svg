<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" role="img" aria-label="Field and battle use paths" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
@media (max-width:600px){svg{max-width:none;width:640px}}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.nav{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2.4}
.label{font:500 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="150" style="fill:#ffffff;stroke:none" /><text x="10" y="30" class="label s">Field</text>
<rect x="70" y="12" width="110" height="30" rx="6" class="box" /><text x="82" y="32">START menu</text>
<rect x="210" y="12" width="70" height="30" rx="6" class="nav" /><text x="226" y="32" class="t">BAG</text>
<rect x="310" y="12" width="90" height="30" rx="6" class="box" /><text x="322" y="32">POTION</text>
<rect x="430" y="12" width="70" height="30" rx="6" class="nav" /><text x="446" y="32" class="t">USE</text>
<rect x="530" y="12" width="220" height="30" rx="6" class="game hot" /><text x="542" y="32">"Use on which POKéMON?"</text>
<path class="arr" d="M180 27 H210" /><path class="arr" d="M280 27 H310" /><path class="arr" d="M400 27 H430" /><path class="arr g" d="M500 27 H530" />
<text x="10" y="100" class="label s">Battle</text>
<rect x="70" y="82" width="110" height="30" rx="6" class="box" /><text x="82" y="102">battle menu</text>
<rect x="210" y="82" width="70" height="30" rx="6" class="nav" /><text x="226" y="102" class="t">BAG</text>
<rect x="310" y="82" width="90" height="30" rx="6" class="box" /><text x="322" y="102">POTION</text>
<rect x="430" y="82" width="70" height="30" rx="6" class="nav" /><text x="446" y="102" class="t">USE</text>
<rect x="530" y="82" width="220" height="30" rx="6" class="game hot" /><text x="542" y="102">"Use on which POKéMON?"</text>
<path class="arr" d="M180 97 H210" /><path class="arr" d="M280 97 H310" /><path class="arr" d="M400 97 H430" /><path class="arr g" d="M500 97 H530" />
<text x="70" y="140" class="s">battle_action bag (battle-move-tool-v1) reaches the BAG screen and stops; the rest is press.</text>
</svg>
