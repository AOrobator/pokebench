<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="The 2 by 2 battle action menu with the rule that can refuse each action" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --bld:#d9d5ca; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --bld:#3a3c40; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --bld:#3a3c40; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="300" style="fill:#ffffff;stroke:none" /><text x="20" y="20" class="t">The game always draws all four options (gText_BattleMenu)</text>
<rect x="20" y="34" width="150" height="56" rx="6" class="navb hot" /><text x="32" y="58" class="t">▶ FIGHT</text><text x="32" y="78" class="s">no action-level refusal</text>
<rect x="180" y="34" width="150" height="56" rx="6" class="box" /><text x="192" y="58" class="t">BAG</text><text x="192" y="78" class="s">refused in link/Frontier</text>
<rect x="20" y="100" width="150" height="56" rx="6" class="box" /><text x="32" y="124" class="t">POKéMON</text><text x="32" y="144" class="s">opens; switch can be refused</text>
<rect x="180" y="100" width="150" height="56" rx="6" class="prior" /><text x="192" y="124" class="t">RUN</text><text x="192" y="144" class="s">refused here (first battle)</text>
<text x="360" y="44" class="t">FIGHT</text>
<text x="360" y="62" class="s">Skipped if a multi-turn move or recharge is due.</text>
<text x="360" y="76" class="s">Every move at 0 PP: the game uses STRUGGLE.</text>
<text x="360" y="90" class="s">A 0-PP move is REFUSED in the move menu.</text>
<text x="360" y="114" class="t">BAG</text>
<text x="360" y="132" class="s">"Items can't be used now." for LINK, Frontier (not Pyramid),</text>
<text x="360" y="146" class="s">e-Reader and recorded-link battles. Balls: blocked and lost</text>
<text x="360" y="160" class="s">in trainer battles; refused when party and every BOX are full.</text>
<text x="360" y="184" class="t">POKéMON (switching)</text>
<text x="360" y="202" class="s">"X can't be switched out!": wrapped, MEAN LOOK/BLOCK, INGRAIN, Arena.</text>
<text x="360" y="216" class="s">"Y's SHADOW TAG/ARENA TRAP/MAGNET PULL prevents switching!"</text>
<text x="360" y="230" class="s">Per member: fainted, EGG, already in battle.</text>
<text x="20" y="190" class="t">Cursor</text>
<text x="20" y="208" class="m">gActionSelectionCursor 0x020244AC</text>
<text x="20" y="224" class="s">0 FIGHT · 1 BAG · 2 POKéMON · 3 RUN</text>
<text x="20" y="262" class="s">Refusals happen after the choice, in HandleTurnActionSelectionState</text>
<text x="20" y="278" class="s">(battle_main.c), so the readout says it before the model presses A.</text>
</svg>
