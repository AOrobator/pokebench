<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="The 2x2 move menu with the model's path to GROWL and the tool's path to EMBER" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg{min-width:520px}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--prior)" /></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--game)" /></marker></defs>
<rect class="box" x="20" y="30" width="190" height="70" rx="6" /><text class="t" x="34" y="60">▶ SCRATCH</text><text class="s" x="34" y="80">slot 0 · PP 0/35 · cursor here</text>
<rect class="prior" x="230" y="30" width="190" height="70" rx="6" /><text class="t" x="244" y="60">GROWL</text><text class="s" x="244" y="80">slot 1 · PP 38/40</text>
<rect class="box" x="20" y="120" width="190" height="70" rx="6" /><text class="t" x="34" y="150">FOCUS ENERGY</text><text class="s" x="34" y="170">slot 2 · PP 30/30</text>
<rect class="game" x="230" y="120" width="190" height="70" rx="6" /><text class="t" x="244" y="150">EMBER</text><text class="s" x="244" y="170">slot 3 · PP 13/25</text>
<path d="M150,44H226" stroke="var(--prior)" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#r)" />
<path d="M160,86H300V116" stroke="var(--game)" stroke-width="2.2" fill="none" marker-end="url(#g)" />
<text x="440" y="50" class="t">Model (recorded)</text>
<text x="440" y="68" class="s">A, RIGHT, A, A: RIGHT lands on GROWL,</text>
<text x="440" y="84" class="s">A chooses it ("TORCHIC used GROWL!")</text>
<text x="440" y="130" class="t">battle_action fight EMBER</text>
<text x="440" y="148" class="s">A on FIGHT, then RIGHT (cursor 0→1, checked),</text>
<text x="440" y="164" class="s">DOWN (1→3, checked), A on EMBER</text>
<text x="20" y="220" class="s">Grid rule (pret HandleInputChooseMove): LEFT if cursor&amp;1, RIGHT if !(cursor&amp;1) and (cursor^1) &lt; moves,</text>
<text x="20" y="236" class="s">UP if cursor&amp;2, DOWN if !(cursor&amp;2) and (cursor^2) &lt; moves. The action menu is the same 2x2 without the move count.</text>
</svg>
