<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" role="img" aria-label="battle_action flow" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg{min-width:520px}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navf{fill:var(--nav-bg);stroke:var(--nav)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="740" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--soft)" /></marker></defs>
<rect class="box" x="10" y="20" width="160" height="80" rx="8" /><text class="t" x="22" y="42">read the state</text><text class="s" x="22" y="60">battle input ready?</text><text class="s" x="22" y="74">active POKéMON's moves</text><text class="s" x="22" y="88">and PP from RAM</text>
<rect class="prior" x="200" y="20" width="210" height="80" rx="8" /><text class="t" x="212" y="42">refuse, nothing pressed</text><text class="s" x="212" y="60">no battle · not waiting for a choice</text><text class="s" x="212" y="74">not its move · no PP · target,</text><text class="s" x="212" y="88">YES/NO or Safari choice open</text>
<rect class="navf" x="440" y="20" width="290" height="80" rx="8" /><text class="t" x="452" y="42">one button, through press</text><text class="s" x="452" y="60">executeChecked: just before sending, the battle</text><text class="s" x="452" y="74">input, menu and cursor must still be the ones</text><text class="s" x="452" y="88">this step was planned from, else nothing is sent</text>
<path class="arr" d="M170,60H196" marker-end="url(#b)" />
<path class="arr" d="M300,100V130H585V104" marker-end="url(#b)" />
<text class="s" x="320" y="124">valid</text>
<rect class="game" x="10" y="170" width="220" height="100" rx="8" /><text class="t" x="22" y="192">check the cursor</text><text class="s" x="22" y="210">after LEFT/RIGHT/UP/DOWN the cursor</text><text class="s" x="22" y="224">must be where the game moves it,</text><text class="s" x="22" y="238">else stop: "the highlight stayed</text><text class="s" x="22" y="252">on FIGHT"</text>
<rect class="game" x="260" y="170" width="220" height="100" rx="8" /><text class="t" x="272" y="192">between menus</text><text class="s" x="272" y="210">after A on FIGHT or B out of the</text><text class="s" x="272" y="224">move menu: the game server's battle</text><text class="s" x="272" y="238">wait, held to the first emulated</text><text class="s" x="272" y="252">frame with input (at most 3 waits)</text>
<rect class="box" x="510" y="170" width="220" height="100" rx="8" /><text class="t" x="522" y="192">A, then the result</text><text class="s" x="522" y="210">"Battle action: chose …; buttons</text><text class="s" x="522" y="224">pressed: …; " + what the battle</text><text class="s" x="522" y="238">shows now, then a fresh observe</text><text class="s" x="522" y="252">(battle text auto-advance after)</text>
<path class="arr" d="M585,140H120V166" marker-end="url(#b)" />
<path class="arr" d="M230,220H256" marker-end="url(#b)" />
<path class="arr" d="M480,220H506" marker-end="url(#b)" />
</svg>
