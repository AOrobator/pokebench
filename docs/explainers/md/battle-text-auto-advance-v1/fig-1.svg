<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="Off: five model turns for one battle turn. On: one model turn." height="250">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="20" class="t">OFF: the model presses through the turn itself</text>
 <g>
  <rect x="10" y="32" width="120" height="44" rx="6" class="prior" /><text x="18" y="50">turn 722: A</text><text x="18" y="66" class="s">resolving · unchanged</text>
  <rect x="140" y="32" width="120" height="44" rx="6" class="prior" /><text x="148" y="50">turn 723: A</text><text x="148" y="66" class="s">resolving · unchanged</text>
  <rect x="270" y="32" width="120" height="44" rx="6" class="prior" /><text x="278" y="50">turn 724: A</text><text x="278" y="66" class="s">page waits · advanced</text>
  <rect x="400" y="32" width="120" height="44" rx="6" class="prior" /><text x="408" y="50">turn 725: A</text><text x="408" y="66" class="s">resolving · unchanged</text>
  <rect x="530" y="32" width="160" height="44" rx="6" class="prior" /><text x="538" y="50">turn 726: action menu</text><text x="538" y="66" class="s">FIGHT highlighted</text>
 </g>
 <text x="10" y="120" class="t">ON: one call, the harness advances and lists the messages</text>
 <rect x="10" y="132" width="680" height="104" rx="8" class="game" />
 <text x="22" y="152" class="m">press ["A","A","A"]  →  sent A; 2 inputs not sent</text>
 <text x="22" y="172" class="m">  wait (server, per frame) → "Wild WURMPLE appeared!" waits → B</text>
 <text x="22" y="192" class="m">  wait (server, per frame) → action menu ready → stop</text>
 <text x="22" y="214" class="m">result: pages listed whole; stopped at FIGHT/BAG/POKEMON/RUN, FIGHT highlighted</text>
</svg>
