<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="Battle messages go through printer 0 on gDisplayedStringBattle; healthbox names reuse the buffer without a printer." height="270">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.nav{fill:var(--nav-bg);stroke:var(--nav)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="270" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="200" height="60" rx="6" class="box" /><text x="20" y="42" class="t">PlayerHandlePrintString</text><text x="20" y="62" class="s">BufferStringBattle(id)</text>
 <rect x="250" y="20" width="200" height="60" rx="6" class="nav" /><text x="260" y="42" class="t">gDisplayedStringBattle</text><text x="260" y="62" class="m">0x02022E2C · 300 bytes</text>
 <rect x="490" y="20" width="200" height="60" rx="6" class="game" /><text x="500" y="42" class="t">sTextPrinters[0]</text><text x="500" y="62" class="m">0x020201B0 · B_WIN_MSG</text>
 <path d="M210 50 H250" class="arr" /><path d="M450 50 H490" class="arr" />
 <text x="214" y="44" class="s">writes</text><text x="454" y="44" class="s">prints</text>
 <rect x="250" y="110" width="200" height="56" rx="6" class="prior" /><text x="260" y="132" class="t">Healthbox, move, PP, type</text><text x="260" y="150" class="s">same buffer, speed 0, other window</text>
 <path d="M350 110 V80" class="arr" /><text x="356" y="100" class="s">overwrites</text>
 <text x="470" y="132" class="s">no printer stays active,</text><text x="470" y="148" class="s">so the reader reports "idle"</text>
 <rect x="10" y="190" width="680" height="66" rx="6" class="box" />
 <text x="20" y="210" class="m">printer 0 active, windowId 0, cursor inside the buffer, state 1/2/3, no autoScroll → waiting_for_input (A or B advances)</text>
 <text x="20" y="228" class="m">printer 0 active, other state → printing (the battle script's waitmessage advances it on its own)</text>
 <text x="20" y="246" class="m">printer 0 idle → idle: no text is reported, whatever the buffer holds</text>
</svg>
