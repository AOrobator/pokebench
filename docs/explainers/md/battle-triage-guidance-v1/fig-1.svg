<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" role="img" aria-label="The 2 by 2 battle menu: FIGHT, BAG on top, POKéMON, RUN below. From FIGHT, RIGHT goes to BAG and DOWN goes to RUN." height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
svg .big{font-family:var(--mono);font-size:15px;font-weight:600}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="560" height="200" style="fill:#ffffff;stroke:none" /><rect x="20" y="20" width="150" height="60" rx="8" class="box" /><text x="95" y="55" text-anchor="middle" class="big">▶ FIGHT</text>
<rect x="190" y="20" width="150" height="60" rx="8" class="box" /><text x="265" y="55" text-anchor="middle" class="big">BAG</text>
<rect x="20" y="100" width="150" height="60" rx="8" class="box" /><text x="95" y="135" text-anchor="middle" class="big">POKéMON</text>
<rect x="190" y="100" width="150" height="60" rx="8" class="game" /><text x="265" y="135" text-anchor="middle" class="big">RUN</text>
<path d="M170 50 H188" class="arr g" marker-end="url(#ah)" /><text x="179" y="42" text-anchor="middle" class="m">RIGHT</text>
<path d="M265 80 V98" class="arr g" marker-end="url(#ah)" /><text x="292" y="93" class="m">DOWN</text>
<text x="360" y="40" class="t">cursor 0 FIGHT · 1 BAG</text>
<text x="360" y="58" class="t">cursor 2 POKéMON · 3 RUN</text>
<text x="360" y="84" class="s">RIGHT/LEFT flips bit 0; DOWN/UP flips bit 1</text>
<text x="360" y="102" class="s">src/battle_controller_player.c</text>
<text x="360" y="118" class="s">HandleInputChooseAction, case 3 "Bottom right"</text>
<text x="360" y="146" class="s">The run's T611 RIGHT, A chose BAG.</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke" /></marker></defs>
</svg>
