<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" role="img" aria-label="Decision chain for the battle line" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.nav{fill:var(--nav-bg);stroke:var(--nav)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="680" height="330" style="fill:#ffffff;stroke:none" /><g>
<rect x="10" y="10" width="200" height="44" rx="8" class="box" /><text x="20" y="30" class="t">Battle details readable?</text><text x="20" y="46" class="s">no harness-bug diagnostic</text>
<rect x="10" y="72" width="200" height="44" rx="8" class="box" /><text x="20" y="92" class="t">Plain wild battle?</text><text x="20" y="108" class="s">no TRAINER, LINK, SAFARI, WALLY, RECORDED bit</text>
<rect x="10" y="134" width="200" height="44" rx="8" class="box" /><text x="20" y="154" class="t">Your battler's menu open?</text><text x="20" y="170" class="s">input ready in action or move select</text>
<rect x="10" y="196" width="200" height="44" rx="8" class="box" /><text x="20" y="216" class="t">0 &lt; HP and 2 × HP &lt; max HP?</text><text x="20" y="232" class="s">the player's active Pokémon only</text>
<rect x="10" y="258" width="200" height="56" rx="8" class="nav" /><text x="20" y="278" class="t">run_verdict(...).allowed is True</text><text x="20" y="294" class="s">battle-details-v2's one RUN rule</text><text x="20" y="308" class="s">(traps, MEAN LOOK, wrap, INGRAIN, items)</text>
<path d="M110 54 V70" class="arr" marker-end="url(#ah2)" /><path d="M110 116 V132" class="arr" marker-end="url(#ah2)" /><path d="M110 178 V194" class="arr" marker-end="url(#ah2)" /><path d="M110 240 V256" class="arr" marker-end="url(#ah2)" />
<path d="M210 286 H300" class="arr g" marker-end="url(#ah2)" /><text x="230" y="279" class="s">all yes</text>
<rect x="302" y="258" width="368" height="56" rx="8" class="game" /><text x="312" y="280" class="m">Your TORCHIC has 5/20 HP (below half). This is a</text><text x="312" y="296" class="m">wild battle: RUN is allowed (bottom-right of the battle menu).</text>
<path d="M210 32 H300" class="arr" /><path d="M210 94 H300" class="arr" /><path d="M210 156 H300" class="arr" /><path d="M210 218 H300" class="arr" />
<path d="M300 32 V218" class="arr" /><path d="M300 125 H322" class="arr" marker-end="url(#ah2)" /><text x="232" y="26" class="s">any no</text>
<rect x="324" y="96" width="346" height="58" rx="8" class="prior" /><text x="334" y="118" class="t">No line.</text><text x="334" y="136" class="s">Trainer battles, the PROF. BIRCH rescue (battle_type 20)</text><text x="334" y="150" class="s">and trapped battlers get nothing from this switch.</text>
</g>
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke" /></marker></defs>
</svg>
