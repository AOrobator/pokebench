<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" role="img" aria-label="Intro state timeline" height="190">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f4f7fa; --card:#fff; --ink:#22303c; --muted:#5a6b7a; --line:#c9d4de; --yes:#2f7d4f; --no:#b0413e; --accent:#3a6ea5; --room:#e8eef4;}
@media (min-width:1000000px){:root{--bg:#141a20; --card:#1d252d; --ink:#e3e9ee; --muted:#9aabb9; --line:#3a4651; --yes:#6cc28f; --no:#e07a76; --accent:#7fb0e6; --room:#26303a;}}
svg text{fill:var(--ink); font:12px system-ui, sans-serif;}
svg .muted{fill:var(--muted);}
svg .yes{fill:var(--yes);}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="820" height="190" style="fill:#ffffff;stroke:none" /><g>
<rect x="10" y="50" width="180" height="56" rx="8" fill="var(--room)" stroke="var(--line)" /><text x="20" y="72">2F, intro state 5</text><text x="20" y="92" class="muted">clock not set</text>
<rect x="240" y="50" width="180" height="56" rx="8" fill="var(--room)" stroke="var(--accent)" stroke-width="2" /><text x="250" y="72">2F, intro state 6</text><text x="250" y="92" class="muted">clock flag set</text>
<rect x="470" y="50" width="150" height="56" rx="8" fill="var(--room)" stroke="var(--accent)" stroke-width="2" /><text x="480" y="72">1F, state 6</text><text x="480" y="92" class="muted">just arrived</text>
<rect x="660" y="50" width="150" height="56" rx="8" fill="var(--room)" stroke="var(--line)" /><text x="670" y="72">1F, state 7</text><text x="670" y="92" class="muted">Mom's TV talk done</text>
</g>
<g fill="none" stroke="var(--ink)" stroke-width="1.5">
<path d="M190 78 H236" /><path d="M420 78 H466" /><path d="M620 78 H656" />
</g>
<text x="196" y="40" class="muted">set the clock</text><text x="426" y="40" class="muted">take stairs</text><text x="624" y="40" class="muted">1F script</text>
<path d="M330 120 V150 H545 V120" fill="none" stroke="var(--yes)" stroke-width="2" /><text x="350" y="172" class="yes">Leave bedroom fires here: evidence [last settled 2F state, first settled 1F state]</text>
</svg>
