<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" width="820" role="img" aria-label="Recorded run with repeat trips" height="130">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f4f7fa; --card:#fff; --ink:#22303c; --muted:#5a6b7a; --line:#c9d4de; --yes:#2f7d4f; --no:#b0413e; --accent:#3a6ea5; --room:#e8eef4;}
@media (min-width:1000000px){:root{--bg:#141a20; --card:#1d252d; --ink:#e3e9ee; --muted:#9aabb9; --line:#3a4651; --yes:#6cc28f; --no:#e07a76; --accent:#7fb0e6; --room:#26303a;}}
svg text{fill:var(--ink); font:12px system-ui, sans-serif;}
svg .muted{fill:var(--muted);}
svg .yes{fill:var(--yes);}
svg .no{fill:var(--no);}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="820" height="130" style="fill:#ffffff;stroke:none" /><g>
<rect x="10" y="30" width="110" height="40" rx="6" fill="var(--room)" stroke="var(--accent)" /><text x="18" y="55">2F · 6 · seq 2</text>
<rect x="150" y="30" width="120" height="40" rx="6" fill="var(--room)" stroke="var(--accent)" /><text x="158" y="55">1F · 6 · seq 116</text>
<rect x="300" y="30" width="110" height="40" rx="6" fill="var(--room)" stroke="var(--line)" /><text x="308" y="55">1F · 7 · seq 271</text>
<rect x="440" y="30" width="110" height="40" rx="6" fill="var(--room)" stroke="var(--line)" /><text x="448" y="55">2F · 7 · seq 477</text>
<rect x="580" y="30" width="110" height="40" rx="6" fill="var(--room)" stroke="var(--line)" /><text x="588" y="55">1F · 7 · seq 513</text>
<rect x="710" y="30" width="100" height="40" rx="6" fill="var(--room)" stroke="var(--line)" /><text x="716" y="55">town · seq 593</text>
</g>
<text x="150" y="95" class="yes">✓ Leave bedroom (once)</text><text x="440" y="95" class="no">✗ state 7: room already left</text><text x="700" y="95" class="muted">Leave home</text>
</svg>
