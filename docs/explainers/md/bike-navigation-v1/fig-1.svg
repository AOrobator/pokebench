<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-label="navigate_to asks the game server for three frame-owned bike actions">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--floor:#f4f1e6;--wall:#8a7a66;--player:#d8452f;--ride:#2f6fd8;--run:#8a8f9c;--ok:#2f8f4e;--bad:#b23a3a;--hot:#e2b23c}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ink)" /></marker></defs>
<rect x="10" y="80" width="170" height="70" rx="8" fill="#fff" stroke="var(--line)" />
<text x="95" y="110" text-anchor="middle" font-weight="600">navigate_to</text>
<text x="95" y="130" text-anchor="middle" font-size="12">decides when (agent)</text>
<rect x="280" y="10" width="190" height="56" rx="8" fill="#fff" stroke="var(--ride)" stroke-width="2" />
<text x="375" y="34" text-anchor="middle" font-size="13">POST /pokebench/bike/register</text>
<text x="375" y="52" text-anchor="middle" font-size="12">menus, one press at a time</text>
<rect x="280" y="88" width="190" height="56" rx="8" fill="#fff" stroke="var(--ride)" stroke-width="2" />
<text x="375" y="112" text-anchor="middle" font-size="13">POST /pokebench/bike/toggle</text>
<text x="375" y="130" text-anchor="middle" font-size="12">one SELECT, flags confirm</text>
<rect x="280" y="166" width="190" height="56" rx="8" fill="#fff" stroke="var(--ride)" stroke-width="2" />
<text x="375" y="190" text-anchor="middle" font-size="13">POST /pokebench/stride (bike)</text>
<text x="375" y="208" text-anchor="middle" font-size="12">hold or release, per frame</text>
<rect x="560" y="80" width="150" height="70" rx="8" fill="var(--floor)" stroke="var(--line)" />
<text x="635" y="110" text-anchor="middle" font-weight="600">game server</text>
<text x="635" y="130" text-anchor="middle" font-size="12">reads RAM every frame</text>
<path d="M180,105 L278,40" stroke="var(--ink)" marker-end="url(#a)" fill="none" />
<path d="M180,115 L278,116" stroke="var(--ink)" marker-end="url(#a)" fill="none" />
<path d="M180,125 L278,192" stroke="var(--ink)" marker-end="url(#a)" fill="none" />
<path d="M470,38 L558,100" stroke="var(--ink)" marker-end="url(#a)" fill="none" />
<path d="M470,116 L558,116" stroke="var(--ink)" marker-end="url(#a)" fill="none" />
<path d="M470,194 L558,132" stroke="var(--ink)" marker-end="url(#a)" fill="none" />
</svg>
