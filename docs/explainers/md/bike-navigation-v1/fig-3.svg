<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-label="Mach Bike eight-tile stride: held for five tiles, coasting for three">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--floor:#f4f1e6;--wall:#8a7a66;--player:#d8452f;--ride:#2f6fd8;--run:#8a8f9c;--ok:#2f8f4e;--bad:#b23a3a;--hot:#e2b23c}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="150" style="fill:#ffffff;stroke:none" /><g font-size="11" text-anchor="middle">
<text x="10" y="20" text-anchor="start" font-weight="600">MACH BIKE, 8-tile corridor, from standing</text>
</g>
<g>
<rect x="10" y="40" width="70" height="40" fill="var(--floor)" stroke="var(--line)" />
<rect x="80" y="40" width="70" height="40" fill="var(--ride)" opacity=".85" /><rect x="150" y="40" width="70" height="40" fill="var(--ride)" opacity=".85" /><rect x="220" y="40" width="70" height="40" fill="var(--ride)" opacity=".85" /><rect x="290" y="40" width="70" height="40" fill="var(--ride)" opacity=".85" /><rect x="360" y="40" width="70" height="40" fill="var(--ride)" opacity=".85" />
<rect x="430" y="40" width="70" height="40" fill="var(--hot)" /><rect x="500" y="40" width="70" height="40" fill="var(--hot)" /><rect x="570" y="40" width="70" height="40" fill="var(--hot)" />
<path d="M640,36 L640,84" stroke="var(--player)" stroke-width="3" />
</g>
<g font-size="12" text-anchor="middle" fill="#fff">
<text x="45" y="65" fill="var(--ink)">start</text>
<text x="115" y="65">16</text><text x="185" y="65">8</text><text x="255" y="65">4</text><text x="325" y="65">4</text><text x="395" y="65">4</text>
<text x="465" y="65" fill="var(--ink)">4</text><text x="535" y="65" fill="var(--ink)">8</text><text x="605" y="65" fill="var(--ink)">16</text>
</g>
<g font-size="12">
<text x="80" y="104">held (blue): the step it starts still leaves room to coast to a stop</text>
<text x="80" y="122">released (amber): it coasts 3, 2, 1 speeds; frames per tile shown</text>
<text x="80" y="140" fill="var(--muted)">64 frames in all: the same as running 8 tiles, so a ridden stride may run 16 tiles</text>
</g>
</svg>
