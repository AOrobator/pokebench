</style><rect x="0" y="0" width="920" height="168" style="fill:#ffffff;stroke:none" /><title id="owners-title">Three speech tasks, in order</title>
<desc id="owners-desc">ThisIsAPokemon waits on the welcome text, then MainSpeech waits on the Pokémon sentence, then AndYouAre waits on the main speech.</desc>
<rect x="8" y="28" width="280" height="112" fill="none" stroke="currentColor" stroke-width="2" />
<text x="20" y="52" font-size="14">ThisIsAPokemon</text>
<text x="20" y="74" font-size="13">0x080309CD</text>
<text x="20" y="100" font-size="13">waits on</text>
<text x="20" y="120" font-size="13">gText_Birch_Welcome</text>
<polygon points="300,84 328,84 328,76 348,90 328,104 328,96 300,96" fill="currentColor" />
<rect x="360" y="28" width="240" height="112" fill="none" stroke="currentColor" stroke-width="2" />
<text x="372" y="52" font-size="14">MainSpeech</text>
<text x="372" y="74" font-size="13">0x08030A2D</text>
<text x="372" y="100" font-size="13">waits on</text>
<text x="372" y="120" font-size="13">gText_ThisIsAPokemon</text>
<polygon points="612,84 640,84 640,76 660,90 640,104 640,96 612,96" fill="currentColor" />
<rect x="672" y="28" width="236" height="112" fill="none" stroke="currentColor" stroke-width="2" />
<text x="684" y="52" font-size="14">AndYouAre</text>
<text x="684" y="74" font-size="13">0x08030BCD</text>
<text x="684" y="100" font-size="13">waits on</text>
<text x="684" y="120" font-size="13">gText_Birch_MainSpeech</text>
</svg>
