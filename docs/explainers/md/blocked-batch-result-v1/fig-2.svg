<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Decision steps from the press to the blocked result" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)" /></marker></defs>
<rect class="box" x="10" y="10" width="330" height="40" rx="8" /><text x="22" y="35">One direction, 2 or more presses (LEFT, LEFT, …)</text>
<rect class="box" x="10" y="70" width="330" height="40" rx="8" /><text x="22" y="95">Same map, same tile before and after</text>
<rect class="box" x="10" y="130" width="330" height="40" rx="8" /><text x="22" y="155">Overworld, no battle, no menu, controls free in both</text>
<rect class="box" x="10" y="190" width="330" height="40" rx="8" /><text x="22" y="215">Player ends facing the pressed direction</text>
<rect class="game hot" x="10" y="250" width="330" height="40" rx="8" /><text class="t" x="22" y="275">blocked / turned … but did not move / no movement</text>
<path class="arr" d="M175,50 L175,68" marker-end="url(#b)" /><path class="arr" d="M175,110 L175,128" marker-end="url(#b)" /><path class="arr" d="M175,170 L175,188" marker-end="url(#b)" /><path class="arr" d="M175,230 L175,248" marker-end="url(#b)" />
<rect class="prior" x="390" y="70" width="300" height="160" rx="8" />
<text class="t" x="402" y="94">Any step fails → today's text</text>
<text class="s" x="402" y="116">single press: "blocked or unavailable (…)"</text>
<text class="s" x="402" y="136">LEFT, UP or A, A: "unchanged … batch or …"</text>
<text class="s" x="402" y="156">moved, warped, locked, unready: unchanged</text>
<text class="s" x="402" y="176">facing unknown or another way: unchanged</text>
<text class="s" x="402" y="196">field lock hidden: "cause not reported"</text>
<path class="arr" d="M340,90 L388,110" marker-end="url(#b)" /><path class="arr" d="M340,150 L388,150" marker-end="url(#b)" /><path class="arr" d="M340,210 L388,190" marker-end="url(#b)" />
</svg>
