<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 140" width="700" role="img" aria-label="Wiring from FeatureSet to the blocked batch result" height="140">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="140" style="fill:#ffffff;stroke:none" /><defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)" /></marker></defs>
<rect class="box" x="10" y="40" width="120" height="56" rx="8" /><text class="t" x="22" y="62">FeatureSet</text><text class="s" x="22" y="82">run preset</text>
<rect class="box" x="160" y="40" width="150" height="56" rx="8" /><text class="t" x="172" y="62">toolSwitches</text><text class="s" x="172" y="82">blockedBatch, liveMap</text>
<rect class="box" x="340" y="10" width="150" height="40" rx="8" /><text class="s" x="352" y="34">press tool</text>
<rect class="box" x="340" y="55" width="150" height="40" rx="8" /><text class="s" x="352" y="79">dialogue auto-advance</text>
<rect class="box" x="340" y="100" width="150" height="40" rx="8" /><text class="s" x="352" y="124">decision probe replay</text>
<rect class="hot game" x="520" y="40" width="170" height="56" rx="8" /><text class="t" x="532" y="62">blockedBatchResult</text><text class="s" x="532" y="82">inside pressResult</text>
<path class="arr" d="M130,68 L158,68" marker-end="url(#c)" />
<path class="arr" d="M310,68 L338,30" marker-end="url(#c)" /><path class="arr" d="M310,68 L338,75" marker-end="url(#c)" /><path class="arr" d="M310,68 L338,120" marker-end="url(#c)" />
<path class="arr" d="M490,30 L518,60" marker-end="url(#c)" /><path class="arr" d="M490,75 L518,70" marker-end="url(#c)" /><path class="arr" d="M490,120 L518,80" marker-end="url(#c)" />
</svg>
