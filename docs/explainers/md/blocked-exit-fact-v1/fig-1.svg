<line x1="116" y1="125" x2="66" y2="125" class="arr p" /><text x="40" y="112" class="s" text-anchor="middle">to ROUTE102</text>
<g transform="translate(300,30)"><rect width="410" height="200" rx="8" class="box" />
<text x="16" y="26" class="t">At T247 (press LEFT from (1,10), facing left)</text>
<text x="16" y="50">1. the step onto (0,10) runs the coordinate event there</text>
<text x="16" y="70" class="m">   var 0x4051 = 0, needs 0: condition matches</text>
<text x="16" y="92">2. OldaleTown_EventScript_BlockedPath: lockall,</text>
<text x="16" y="110" class="m">   applymovement PLAYER, PlayerStepBack (delay_8, walk_right)</text>
<text x="16" y="132">3. the player ends on (1,10), same map, controls locked</text>
<text x="16" y="154">4. the harness records a refusal at (0,10)</text>
<text x="16" y="180" class="s">T = trigger on the WEST edge tile; N = the MANIAC (object 3); @ = player</text></g>
