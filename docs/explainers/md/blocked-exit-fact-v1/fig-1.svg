nd" /><rect x="100" y="200" width="36" height="30" class="wall" /><rect x="136" y="200" width="36" height="30" class="wall" /><rect x="172" y="200" width="36" height="30" class="ground" /><rect x="208" y="200" width="36" height="30" class="ground" /><rect x="244" y="200" width="36" height="30" class="ground" /><rect x="100" y="230" width="36" height="30" class="wall" /><rect x="136" y="230" width="36" height="30" class="wall" /><rect x="172" y="230" width="36" height="30" class="ground" /><rect x="208" y="230" width="36" height="30" class="ground" /><rect x="244" y="230" width="36" height="30" class="ground" />
