<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" role="img" aria-label="Count flow" height="120">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f}}
.muted{color:var(--muted)}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="800" height="120" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)" /></marker></defs>
<rect x="10" y="30" width="220" height="60" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="24" y="56">tool result</text><text x="24" y="76" class="muted">label + outcome</text>
<rect x="290" y="30" width="220" height="60" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="304" y="56">recent attempts list</text><text x="304" y="76">same label+outcome: count+1</text>
<rect x="570" y="30" width="220" height="60" rx="6" fill="var(--fill)" stroke="var(--accent)" stroke-width="2" /><text x="584" y="56">focused briefing</text><text x="584" y="76">prints ×N when ON</text>
<line x1="230" y1="60" x2="288" y2="60" stroke="var(--muted)" marker-end="url(#a)" /><line x1="510" y1="60" x2="568" y2="60" stroke="var(--muted)" marker-end="url(#a)" />
</svg>
