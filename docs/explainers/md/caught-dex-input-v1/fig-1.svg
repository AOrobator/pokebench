<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" role="img" aria-label="Same native task with the switch off and on" width="800" height="190"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f5f5f0;--fg:#202626;--card:#fff;--accent:#167a64;--muted:#555}
@media(min-width:1000000px){:root{--bg:#151d20;--fg:#e9efed;--card:#233034;--accent:#69d1b4;--muted:#bcc8c6}}
svg{min-width:620px;width:100%;color:var(--fg)}
svg text{fill:currentColor;font:17px system-ui}
svg rect{fill:none;stroke:var(--accent);stroke-width:2}
svg path{fill:none;stroke:var(--accent);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="800" height="190" style="fill:#ffffff;stroke:none" /><rect x="5" y="45" width="220" height="100" rx="10" /><text x="20" y="75">Registration task</text><text x="20" y="105">waiting for A or B</text><path d="M225 95H280V35H320M280 95V150H320" /><rect x="320" y="5" width="470" height="65" rx="10" /><text x="335" y="32">OFF → battle busy</text><text x="335" y="56">Waits reach the busy bound.</text><rect x="320" y="115" width="470" height="65" rx="10" /><text x="335" y="142">ON → registration input ready</text><text x="335" y="166">Wait ends; the model can press A or B.</text></svg>
