<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Which battle main functions the prompt reader accepts">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--wall:#8f8a7f;--floor:#f4f1ea;}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--wall:#55524b;--floor:#2a2925}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="250" height="60" rx="6" fill="var(--fill)" stroke="var(--line)" />
<text x="24" y="44">Script runner 0x0803E019</text><text x="24" y="66" class="small">RunBattleScriptCommands_PopCallbacksStack</text>
<rect x="10" y="100" width="250" height="60" rx="6" fill="var(--fill)" stroke="var(--line)" />
<text x="24" y="124">Script runner 0x0803E08D</text><text x="24" y="146" class="small">RunBattleScriptCommands</text>
<rect x="10" y="180" width="250" height="60" rx="6" fill="var(--panel)" stroke="var(--drop)" stroke-width="2" />
<text x="24" y="204">RunTurnActionsFunctions 0x0803D819</text><text x="24" y="226" class="small">action 10 = EXEC_SCRIPT (the thrown ball)</text>
<rect x="330" y="90" width="220" height="80" rx="6" fill="var(--panel)" stroke="var(--accent)" stroke-width="2" />
<text x="344" y="116">read_battle_prompt</text><text x="344" y="138" class="small">script op 0xF3 trygivecaughtmonnick</text><text x="344" y="156" class="small">state 1 = input, cursor byte 0 YES / 1 NO</text>
<line x1="260" y1="50" x2="330" y2="110" stroke="var(--keep)" stroke-width="2" /><text x="270" y="72" class="small">accepted</text>
<line x1="260" y1="130" x2="330" y2="130" stroke="var(--keep)" stroke-width="2" />
<line x1="260" y1="210" x2="330" y2="150" stroke="var(--drop)" stroke-width="2" stroke-dasharray="6 4" /><text x="268" y="236" class="small">OFF: rejected · ON: accepted</text>
<rect x="620" y="40" width="230" height="60" rx="6" fill="var(--panel)" stroke="var(--drop)" />
<text x="634" y="64">OFF: text phase busy</text><text x="634" y="86" class="small">"resolving", battle wait bound</text>
<rect x="620" y="160" width="230" height="60" rx="6" fill="var(--panel)" stroke="var(--keep)" />
<text x="634" y="184">ON: text phase prompt</text><text x="634" y="206" class="small">YES/NO box open, cursor on NO</text>
<line x1="550" y1="115" x2="620" y2="75" stroke="var(--drop)" stroke-width="2" /><line x1="550" y1="145" x2="620" y2="185" stroke="var(--keep)" stroke-width="2" />
</svg>
