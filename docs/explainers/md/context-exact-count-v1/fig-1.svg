<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="Estimate versus server count after dropping turns with images">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#556070;--ok:#2f7d4f;--bad:#b23a3a;--line:#8a94a6;--fill:#eef2f8;--img:#d9a520}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:var(--ink)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="210" style="fill:#ffffff;stroke:none" /><text x="10" y="20">Dropping 4 turns, each with one frame (illustrative, from the unit test's shape)</text>
<rect x="10" y="40" width="460" height="28" fill="var(--fill)" stroke="var(--line)" />
<text x="16" y="59">estimate: prompt minus 4 × (text + 1,000)</text>
<rect x="10" y="90" width="540" height="28" fill="var(--fill)" stroke="var(--line)" />
<text x="16" y="109">server: prompt minus 4 × (text + 72)</text>
<line x1="490" y1="30" x2="490" y2="130" stroke="var(--ok)" stroke-dasharray="4 3" />
<text x="420" y="145" fill="var(--ok)">limit for the prompt</text>
<line x1="470" y1="54" x2="550" y2="104" stroke="var(--bad)" />
<text x="10" y="175">The estimate says the request fits; the server's count is over by 928 × (dropped − 1) in this shape.</text>
<text x="10" y="195">In e1f1 that came to 3,070 tokens once text estimation is included.</text>
</svg>
