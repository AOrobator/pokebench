<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-label="Wiring of the exact count">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#556070;--ok:#2f7d4f;--bad:#b23a3a;--line:#8a94a6;--fill:#eef2f8;--img:#d9a520}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:var(--ink)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line)" /></marker></defs>
<rect x="10" y="20" width="150" height="50" fill="var(--fill)" stroke="var(--line)" /><text x="20" y="42">history + injected</text><text x="20" y="58">blocks (ledger, battle)</text>
<rect x="200" y="20" width="150" height="50" fill="var(--fill)" stroke="var(--line)" /><text x="210" y="42">pi builds the final</text><text x="210" y="58">chat request body</text>
<rect x="390" y="20" width="250" height="50" fill="#fff6d8" stroke="var(--img)" stroke-width="2" /><text x="400" y="42">ExactContext.fit(body)</text><text x="400" y="58">count, drop oldest turn, count again</text>
<line x1="160" y1="45" x2="198" y2="45" stroke="var(--line)" marker-end="url(#a)" />
<line x1="350" y1="45" x2="388" y2="45" stroke="var(--line)" marker-end="url(#a)" />
<rect x="390" y="110" width="250" height="44" fill="var(--fill)" stroke="var(--line)" /><text x="400" y="130">vLLM POST /tokenize (same template,</text><text x="400" y="146">tools, images): exact count</text>
<rect x="110" y="110" width="250" height="44" fill="var(--fill)" stroke="var(--line)" /><text x="120" y="130">llama.cpp /apply-template + /tokenize,</text><text x="120" y="146">plus images × measured per-image count</text>
<line x1="515" y1="70" x2="515" y2="108" stroke="var(--line)" marker-end="url(#a)" />
<line x1="440" y1="70" x2="300" y2="108" stroke="var(--line)" marker-end="url(#a)" />
<rect x="390" y="190" width="250" height="44" fill="var(--fill)" stroke="var(--line)" /><text x="400" y="210">server usage or 400: excess over</text><text x="400" y="226">our count is reserved next time</text>
<line x1="515" y1="188" x2="515" y2="156" stroke="var(--line)" marker-end="url(#a)" />
<text x="10" y="200">Sent when count + max tokens ≤ context,</text>
<text x="10" y="216">or when only the task and newest turn remain.</text>
</svg>
