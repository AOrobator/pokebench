<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" role="img" aria-label="Oldest turns dropped until the request fits" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f}}
.muted{color:var(--muted)}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="800" height="210" style="fill:#ffffff;stroke:none" /><text x="0" y="16">Off: the whole window is sent</text>
<rect x="0" y="26" width="60" height="30" fill="var(--fill)" stroke="var(--line)" /><text x="10" y="46">task</text>
<g fill="var(--fill)" stroke="var(--line)">
<rect x="66" y="26" width="70" height="30" /><rect x="142" y="26" width="70" height="30" /><rect x="218" y="26" width="70" height="30" /><rect x="294" y="26" width="70" height="30" /><rect x="370" y="26" width="70" height="30" /><rect x="446" y="26" width="70" height="30" /><rect x="522" y="26" width="70" height="30" /><rect x="598" y="26" width="70" height="30" />
</g>
<text x="80" y="46">turn 1</text><text x="156" y="46">turn 2</text><text x="232" y="46">turn 3</text><text x="384" y="46">…</text><text x="606" y="46">newest</text>
<text x="680" y="46" fill="var(--drop)">over budget → 400 error</text>
<text x="0" y="104">On: drop oldest whole turns until it fits</text>
<rect x="0" y="114" width="60" height="30" fill="var(--fill)" stroke="var(--keep)" /><text x="10" y="134">task</text>
<g fill="none" stroke="var(--drop)" stroke-dasharray="4 3">
<rect x="66" y="114" width="70" height="30" /><rect x="142" y="114" width="70" height="30" /><rect x="218" y="114" width="70" height="30" />
</g>
<text x="76" y="134" fill="var(--drop)">dropped</text><text x="152" y="134" fill="var(--drop)">dropped</text><text x="228" y="134" fill="var(--drop)">dropped</text>
<g fill="var(--fill)" stroke="var(--keep)">
<rect x="294" y="114" width="70" height="30" /><rect x="370" y="114" width="70" height="30" /><rect x="446" y="114" width="70" height="30" /><rect x="522" y="114" width="70" height="30" /><rect x="598" y="114" width="70" height="30" />
</g>
<text x="384" y="134">…</text><text x="606" y="134">newest</text>
<text x="680" y="134" fill="var(--keep)">fits → sent</text>
<text x="0" y="186" class="muted">A turn is one assistant reply with its tool results. The task and the newest turn are always kept. No text inside a message is cut.</text>
</svg>
