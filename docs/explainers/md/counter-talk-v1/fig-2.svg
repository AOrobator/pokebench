*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
*{min-width:0}
.ax{font:11px ui-monospace,Menlo,monospace;fill:var(--muted);text-anchor:middle}
.glyph{font:700 11px ui-monospace,Menlo,monospace;fill:var(--fg);opacity:.55;text-anchor:end}
.glyph.gon{fill:var(--accent2);opacity:1;font-size:14px}
