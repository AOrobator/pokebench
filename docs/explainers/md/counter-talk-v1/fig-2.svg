.route{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.stepdot{fill:var(--card);stroke:var(--accent);stroke-width:2}
.stepn{font:700 10px ui-monospace,Menlo,monospace;fill:var(--accent);text-anchor:middle}
.talk{fill:none;stroke:var(--good);stroke-width:3.5;stroke-dasharray:2 7;stroke-linecap:round}
.talkt{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--good)}
.ghost{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:4 5;opacity:.8}
.x{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
