<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" role="img" aria-label="How navigate_to builds the counter hint" width="860" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor1:#f3ead6;--floor2:#e8dcc0;--wall1:#7d776d;--wall2:#6a645b;--ctr1:#f6d9a8;--ctr2:#e9be78;--nurse:#e86a92;--npc:#8c8f86;--warp:#7ab8e8;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#3a362c;--floor2:#312d25;--wall1:#5b5750;--wall2:#4a4640;--ctr1:#8a6a3a;--ctr2:#6e532c;--nurse:#d65a84;--npc:#6d7068;--warp:#3f78a8;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#3a362c;--floor2:#312d25;--wall1:#5b5750;--wall2:#4a4640;--ctr1:#8a6a3a;--ctr2:#6e532c;--nurse:#d65a84;--npc:#6d7068;--warp:#3f78a8;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--accent2) 22%,var(--card));stroke:var(--accent2);stroke-width:2}
.nt{font:600 13.5px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:12px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
.fl{font:11.5px -apple-system,Helvetica,sans-serif;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="aflow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker>
</defs><g class="node"><rect x="10" y="90" width="150" height="66" rx="10" /><text x="85" y="118" class="nt">Goal: nurse (7,2)</text><text x="85" y="138" class="ns">or the counter (7,3)</text></g>
<path d="M160,123 H205" class="flow" marker-end="url(#aflow)" />
<g class="node"><rect x="210" y="90" width="170" height="66" rx="10" /><text x="295" y="118" class="nt">A* finds no path</text><text x="295" y="138" class="ns">counters are never walkable</text></g>
<path d="M380,123 H425" class="flow" marker-end="url(#aflow)" />
<g class="node hot"><rect x="430" y="80" width="180" height="86" rx="10" /><text x="520" y="108" class="nt">Find counter + person</text><text x="520" y="128" class="ns">stand tile = one past</text><text x="520" y="146" class="ns">the counter, facing it</text></g>
<path d="M610,105 C650,105 650,55 690,55" class="flow" marker-end="url(#aflow)" /><text x="612" y="70" class="fl">A* reaches it</text>
<path d="M610,141 C650,141 650,195 690,195" class="flow" marker-end="url(#aflow)" /><text x="590" y="200" class="fl">no stand tile works</text>
<g class="node"><rect x="695" y="20" width="160" height="74" rx="10" /><text x="775" y="46" class="nt">"walk to (7,4),</text><text x="775" y="64" class="nt">face UP ... press A"</text><text x="775" y="82" class="ns">0 presses</text></g>
<g class="node"><rect x="695" y="160" width="160" height="74" rx="10" /><text x="775" y="186" class="nt">generic counter hint</text><text x="775" y="204" class="ns">no coordinates</text><text x="775" y="222" class="ns">0 presses</text></g>
</svg>
