<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" role="img" aria-label="How the switch travels to the code it changes" width="860" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor1:#f3ead6;--floor2:#e8dcc0;--wall1:#7d776d;--wall2:#6a645b;--ctr1:#f6d9a8;--ctr2:#e9be78;--nurse:#e86a92;--npc:#8c8f86;--warp:#7ab8e8;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#3a362c;--floor2:#312d25;--wall1:#5b5750;--wall2:#4a4640;--ctr1:#8a6a3a;--ctr2:#6e532c;--nurse:#d65a84;--npc:#6d7068;--warp:#3f78a8;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#3a362c;--floor2:#312d25;--wall1:#5b5750;--wall2:#4a4640;--ctr1:#8a6a3a;--ctr2:#6e532c;--nurse:#d65a84;--npc:#6d7068;--warp:#3f78a8;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--accent2) 22%,var(--card));stroke:var(--accent2);stroke-width:2}
.nt{font:600 13.5px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:12px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
.fl{font:11.5px -apple-system,Helvetica,sans-serif;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="170" style="fill:#ffffff;stroke:none" /><defs><marker id="aflow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker>
</defs><g class="node"><rect x="10" y="50" width="150" height="66" rx="10" /><text x="85" y="78" class="nt">Preset / switchboard</text><text x="85" y="98" class="ns">counter-talk-v1</text></g>
<path d="M160,70 C200,70 200,35 240,35" class="flow" marker-end="url(#aflow)" /><text x="172" y="40" class="fl">server env</text>
<path d="M160,96 C200,96 200,131 240,131" class="flow" marker-end="url(#aflow)" /><text x="168" y="140" class="fl">agent tools</text>
<g class="node"><rect x="245" y="5" width="190" height="60" rx="10" /><text x="340" y="30" class="nt">POKEBENCH_FEATURES_OFF</text><text x="340" y="50" class="ns">readout.py</text></g>
<g class="node hot"><rect x="485" y="5" width="190" height="60" rx="10" /><text x="580" y="30" class="nt">Local / whole-map text</text><text x="580" y="50" class="ns">counters= : = glyph + legend</text></g>
<path d="M435,35 H480" class="flow" marker-end="url(#aflow)" />
<g class="node"><rect x="245" y="101" width="190" height="60" rx="10" /><text x="340" y="126" class="nt">withNavigation</text><text x="340" y="146" class="ns">ports.counters</text></g>
<g class="node hot"><rect x="485" y="101" width="190" height="60" rx="10" /><text x="580" y="126" class="nt">counterHint()</text><text x="580" y="146" class="ns">only on a failed plan</text></g>
<path d="M435,131 H480" class="flow" marker-end="url(#aflow)" />
<g class="node"><rect x="715" y="50" width="135" height="66" rx="10" /><text x="782" y="78" class="nt">run_start</text><text x="782" y="98" class="ns">harness_features</text></g>
<path d="M675,35 C700,35 700,65 712,70" class="flow" /><path d="M675,131 C700,131 700,100 712,96" class="flow" />
</svg>
