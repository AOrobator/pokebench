<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" style="min-width:640px" role="img" aria-label="Walk loop decision: read state, compare map_id, then branch on whether any press has been made" width="900" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor:#f3ead6;--wall:#7d776d;--water:#8cc3ea;--npc:#8c8f86;--obj:#b08a5a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--accent2) 22%,var(--card));stroke:var(--accent2);stroke-width:2}
.nt{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:11.5px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
.fl{font:11px -apple-system,Helvetica,sans-serif;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker>
</defs><g class="node"><rect x="20" y="120" width="150" height="56" rx="10" /><text class="nt" x="95" y="144">read state</text><text class="ns" x="95" y="162">start of each step</text></g>
<g class="node"><rect x="220" y="120" width="170" height="56" rx="10" /><text class="nt" x="305" y="144">map_id = goal map?</text><text class="ns" x="305" y="162">sameMap()</text></g>
<g class="node hot"><rect x="440" y="120" width="170" height="56" rx="10" /><text class="nt" x="525" y="144">any press yet?</text><text class="ns" x="525" y="162">ON only: commands = 0</text></g>
<g class="node"><rect x="670" y="30" width="210" height="64" rx="10" /><text class="nt" x="775" y="56">map changed;</text><text class="ns" x="775" y="76">inspect destination</text></g>
<g class="node hot"><rect x="670" y="200" width="210" height="64" rx="10" /><text class="nt" x="775" y="226">target is on another map</text><text class="ns" x="775" y="246">0 presses, true reason</text></g>
<g class="node"><rect x="220" y="230" width="170" height="50" rx="10" /><text class="nt" x="305" y="260">readiness, plan, press</text></g>
<path class="flow" d="M170 148 H218" marker-end="url(#a)" />
<path class="flow" d="M390 148 H438" marker-end="url(#a)" /><text class="fl" x="404" y="140">no</text>
<path class="flow" d="M305 176 V228" marker-end="url(#a)" /><text class="fl" x="312" y="206">yes</text>
<path class="flow" d="M610 140 L668 70" marker-end="url(#a)" /><text class="fl" x="520" y="104">yes, or switch OFF</text>
<path class="flow" d="M610 156 L668 226" marker-end="url(#a)" /><text class="fl" x="652" y="196">no (ON)</text>
</svg>
