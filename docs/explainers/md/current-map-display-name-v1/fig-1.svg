<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Map 1/3 has a map-table name and a displayed name; which lines use which">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f6f8;--fg:#162333;--card:#fff;--muted:#5a6878;--floor:#e9efe3;--grass:#9fd08a;--ledge:#c9a46a;--wall:#55606c;--walk:#2b6b9d;--later:#6aa0c8;--stop:#c0392b;--ok:#2e7d32;--dash:#8a96a3;--hi:#fff4c2}
*{box-sizing:border-box}
svg{display:block;width:100%;height:auto;min-width:560px}
svg text{font:12px system-ui,-apple-system,sans-serif;fill:var(--fg)}
svg text.b{font-weight:700}
svg text.m{fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)" /></marker>
 <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--stop)" /></marker>
 <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--ok)" /></marker></defs>
 <rect x="10" y="20" width="250" height="250" rx="10" fill="var(--card)" stroke="var(--dash)" />
 <text x="24" y="44" class="b">State at 47c3 seq 4775: map 1/3</text>
 <rect x="24" y="64" width="222" height="70" rx="6" fill="#fdecea" stroke="var(--stop)" />
 <text x="34" y="86" class="m">location (map-table name)</text>
 <text x="34" y="108">LITTLEROOT TOWN</text><text x="34" y="124">MAYS HOUSE 2F</text>
 <rect x="24" y="160" width="222" height="70" rx="6" fill="#e8f5e9" stroke="var(--ok)" />
 <text x="34" y="182" class="m">location_display (shown name)</text>
 <text x="34" y="206">PROF. BIRCH'S HOUSE 2F</text>

 <rect x="440" y="24" width="270" height="34" rx="6" fill="var(--card)" stroke="var(--dash)" /><text x="450" y="46">Header and Location line</text>
 <rect x="440" y="70" width="270" height="34" rx="6" fill="var(--card)" stroke="var(--dash)" /><text x="450" y="92">Exits list (names of other maps)</text>
 <rect x="440" y="140" width="270" height="44" rx="6" fill="#fdecea" stroke="var(--stop)" stroke-width="2" /><text x="450" y="160" class="b">OFF: Current map line</text><text x="450" y="176">LITTLEROOT TOWN MAYS HOUSE 2F</text>
 <rect x="440" y="214" width="270" height="44" rx="6" fill="#e8f5e9" stroke="var(--ok)" stroke-width="2" /><text x="450" y="234" class="b">ON: Current map line</text><text x="450" y="250">PROF. BIRCH'S HOUSE 2F</text>
 <path d="M246 190 C340 190 360 41 436 41" stroke="var(--fg)" fill="none" marker-end="url(#b)" />
 <path d="M246 196 C350 196 360 87 436 87" stroke="var(--fg)" fill="none" marker-end="url(#b)" />
 <path d="M246 100 C340 100 360 162 436 162" stroke="var(--stop)" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#r)" />
 <path d="M246 206 C340 206 360 236 436 236" stroke="var(--ok)" stroke-width="2" fill="none" marker-end="url(#g)" />
</svg>
