<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-label="Watch opens the selected event stream; history loads only when requested" width="680" height="190"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f6f8fb;--fg:#26364b;--box:#fff;--line:#627a93;--live:#2583bd}
@media(min-width:1000000px){:root{--bg:#17212d;--fg:#e5edf5;--box:#253546;--line:#a4b6c9;--live:#69b7ed}}
svg{width:100%;height:auto}
rect{fill:var(--box);stroke:var(--line)}
text{fill:var(--fg);font:14px system-ui}
path{fill:none;stroke:var(--line);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="680" height="190" style="fill:#ffffff;stroke:none" /><rect x="10" y="15" width="200" height="55" rx="8" /><text x="24" y="47">Stable Watch link</text><path d="M210 42H300" /><rect x="300" y="15" width="360" height="55" rx="8" /><text x="318" y="47">Selected run → events → live frame</text><rect x="10" y="105" width="650" height="55" rx="8" /><text x="25" y="136">Open Splits or Load comparison history → historical validation</text></svg>
