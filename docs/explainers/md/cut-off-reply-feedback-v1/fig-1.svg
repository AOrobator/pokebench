<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="A reply cut off at max_tokens, then the next message with the switch off and on" width="900" height="400">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--note:#2d5f8a;--notebg:#e9f0f8;--grid:#b9c8bf}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="400" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker></defs>
<rect class="box" x="10" y="20" width="270" height="200" rx="8" />
<text x="24" y="46">Model reply</text>
<text x="24" y="72" class="mono">thinking: (0,0) (1,0) (2,0) …</text>
<text x="24" y="92" class="mono">… counting map cells …</text>
<text x="24" y="124">output: 4096 tokens</text>
<text x="24" y="146">stopReason: <tspan class="mono">"length"</tspan></text>
<text x="24" y="168">tool calls: 0</text>
<text x="24" y="200" class="small">Nothing happens in the game.</text>
<path class="arrow" d="M280 120 H330" marker-end="url(#a)" />
<rect class="box" x="335" y="60" width="200" height="120" rx="8" />
<text x="348" y="86">Governor</text>
<text x="348" y="110" class="small">failure +1: "reply hit</text>
<text x="348" y="128" class="small">max_tokens" (unchanged)</text>
<text x="348" y="156" class="small">cutOff = no calls and "length"</text>
<path class="arrow" d="M535 100 C 560 100, 560 60, 585 60" marker-end="url(#a)" />
<path class="arrow" d="M535 140 C 560 140, 560 250, 585 250" marker-end="url(#a)" />
<rect class="offbox" x="590" y="15" width="300" height="100" rx="8" />
<text x="603" y="40">OFF: next user message</text>
<text x="603" y="66" class="mono">Keep playing: call observe or</text>
<text x="603" y="84" class="mono">press. Only tool calls advance</text>
<text x="603" y="102" class="mono">the game.</text>
<rect class="onbox" x="590" y="135" width="300" height="255" rx="8" />
<text x="603" y="160">ON: next user message</text>
<text x="603" y="186" class="mono">Your last reply reached the</text>
<text x="603" y="204" class="mono">output limit (4096 tokens)</text>
<text x="603" y="222" class="mono">before it made a tool call, so</text>
<text x="603" y="240" class="mono">nothing happened in the game.</text>
<text x="603" y="258" class="mono">Make one tool call now. To walk</text>
<text x="603" y="276" class="mono">somewhere, call</text>
<text x="603" y="294" class="mono">navigate_to_target or</text>
<text x="603" y="312" class="mono">navigate_to: they work out the</text>
<text x="603" y="330" class="mono">path from the game's map, so the</text>
<text x="603" y="348" class="mono">route does not have to be worked</text>
<text x="603" y="366" class="mono">out in your reply.</text>
</svg>
