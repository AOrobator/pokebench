<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Precedence of follow-up messages after a reply with no tool call" width="900" height="260">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--note:#2d5f8a;--notebg:#e9f0f8;--grid:#b9c8bf}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .notebox{fill:var(--notebg);stroke:var(--note);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="260" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker></defs>
<rect class="box" x="10" y="95" width="160" height="70" rx="8" />
<text x="22" y="122">Reply with no</text>
<text x="22" y="144">tool call</text>
<path class="arrow" d="M170 130 H210" marker-end="url(#b)" />
<rect class="notebox" x="215" y="15" width="200" height="70" rx="8" />
<text x="228" y="42">1. Text-only</text>
<text x="228" y="64">cap notice + briefing</text>
<rect class="onbox" x="215" y="105" width="200" height="60" rx="8" />
<text x="228" y="132">2. Cut-off notice</text>
<text x="228" y="152" class="small">stopReason "length" only</text>
<rect class="box" x="215" y="185" width="200" height="65" rx="8" />
<text x="228" y="210">3. Reminder or NUDGE</text>
<text x="228" y="232" class="small">ordinary text-only reply</text>
<text x="440" y="42" class="small">A streak of replies with no tool call reaching the failure limit</text>
<text x="440" y="60" class="small">(3 in the test) earns a briefing after the cut-off notice.</text>
<text x="440" y="132" class="small">Replaces NUDGE, and also the text-only reminder sent after the</text>
<text x="440" y="150" class="small">third note (TEXT_ONLY_NOTE_LIMIT = 3).</text>
<text x="440" y="212" class="small">A reply that stopped normally ("stop") with no tool call still</text>
<text x="440" y="230" class="small">gets NUDGE, or the reminder after the third note.</text>
</svg>
