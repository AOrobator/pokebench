<svg xmlns="http://www.w3.org/2000/svg" class="flow" role="img" aria-label="Five conditions in order: free field, map in the requires_flash table, not already lit, not fired on this visit, then one paragraph and one event" viewBox="0 0 700 210" width="700" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{max-width:100%;height:auto}
svg{width:700px;max-width:none;height:auto}
@media (min-width:760px){svg{width:100%}}
.flow text{font-family:system-ui,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="210" style="fill:#ffffff;stroke:none" /><rect x="10" y="52" width="120" height="76" rx="8" fill="#eaf4ec" stroke="#587882" /><text x="70" y="78" font-size="13" text-anchor="middle">free field</text><text x="70" y="96" font-size="11" text-anchor="middle">overworld, no battle,</text><text x="70" y="112" font-size="11" text-anchor="middle">party owned by player</text>
<rect x="150" y="52" width="120" height="76" rx="8" fill="#eaf4ec" stroke="#587882" /><text x="210" y="78" font-size="13" text-anchor="middle">map is dark</text><text x="210" y="96" font-size="11" text-anchor="middle">one of 7 ids in</text><text x="210" y="112" font-size="11" text-anchor="middle">FLASH_MAPS</text>
<rect x="290" y="52" width="120" height="76" rx="8" fill="#eaf4ec" stroke="#587882" /><text x="350" y="78" font-size="13" text-anchor="middle">not lit yet</text><text x="350" y="96" font-size="11" text-anchor="middle">flash level above 1,</text><text x="350" y="112" font-size="11" text-anchor="middle">or not reported</text>
<rect x="430" y="52" width="120" height="76" rx="8" fill="#eaf4ec" stroke="#587882" /><text x="490" y="78" font-size="13" text-anchor="middle">first of the visit</text><text x="490" y="96" font-size="11" text-anchor="middle">re-armed on any</text><text x="490" y="112" font-size="11" text-anchor="middle">map change</text>
<rect x="570" y="52" width="120" height="76" rx="8" fill="#f7dcd2" stroke="#cc3143" /><text x="630" y="78" font-size="13" text-anchor="middle">one paragraph</text><text x="630" y="96" font-size="11" text-anchor="middle">after the result text</text><text x="630" y="112" font-size="11" text-anchor="middle">+ one event</text>
<g stroke="#587882" stroke-width="2" fill="none"><path d="M130 90H150" /><path d="M270 90H290" /><path d="M410 90H430" /><path d="M550 90H570" /></g>
<g fill="#587882"><path d="M150 90l-7-4v8z" /><path d="M290 90l-7-4v8z" /><path d="M430 90l-7-4v8z" /><path d="M570 90l-7-4v8z" /></g>
<text x="10" y="34" font-size="14">every game-tool result passes through; the first row of this table that holds decides</text>
<text x="10" y="170" font-size="13">A state with no map (a warp mid-frame) changes nothing. A battle, menu or transition result never fires it.</text>
<text x="10" y="192" font-size="13">Nothing else is added: no plan, no destination, no button.</text>
</svg>
