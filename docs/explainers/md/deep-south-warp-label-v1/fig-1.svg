<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Route 104 north tiles with the woods entrance labelled deep water exit when off and entrance when on">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#5a6475;--water:#5b9bd5;--grass:#7cc36b;--tree:#2f6b3a;--warp:#e0a020;--bad:#c0392b;--good:#2e8b57;--line:#c9d2de}
