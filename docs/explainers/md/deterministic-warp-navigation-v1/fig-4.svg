<svg xmlns="http://www.w3.org/2000/svg" class="mobile-diagram" viewBox="0 0 340 314" role="img" aria-label="Known directional behavior maps to one checked direction press and either a changed map or a stop" width="340" height="314">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f5f0;--fg:#202124;--muted:#62656b;--panel:#fff;--rule:#d8d6cf;--on:#126b4d;--onbg:#def2e9;--off:#a3422f;--offbg:#f8e3dd;--blue:#315da8;--bluebg:#e3ebf8;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(min-width:1000000px){:root{--bg:#151719;--fg:#ececea;--muted:#a7a9ad;--panel:#1d2023;--rule:#34373b;--on:#59c99a;--onbg:#18342c;--off:#ff8069;--offbg:#3c211c;--blue:#86aef6;--bluebg:#1d2b45;color-scheme:dark}}
svg{display:block;width:740px;max-width:none;height:auto}
svg text{font-family:var(--body);fill:var(--fg);font-size:12px}
.t{font-size:14px;font-weight:700}
.s{fill:var(--muted)}
.panel{fill:var(--panel);stroke:var(--rule)}
.on{fill:var(--onbg);stroke:var(--on)}
.blue{fill:var(--bluebg);stroke:var(--blue)}
.arrow{stroke:var(--muted);stroke-width:1.5;marker-end:url(#a)}
.mobile-diagram{display:none}
@media(max-width:600px){.mobile-diagram{display:block;width:100%}}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="340" height="314" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9z" fill="currentColor" /></marker></defs><defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L8 5L0 9z" fill="currentColor" /></marker></defs>
<rect class="blue" x="16" y="1" width="308" height="78" rx="9" /><text class="t" x="30" y="30">Already on known arrow warp</text><text class="s" x="30" y="53">0x62/63/64/65, 0x1B/1C/6D</text><line class="arrow" style="marker-end:url(#am)" x1="170" y1="79" x2="170" y2="112" />
<rect class="on" x="16" y="116" width="308" height="78" rx="9" /><text class="t" x="30" y="145">one checked direction press</text><text class="s" x="30" y="168">fresh map + position + identity</text><line class="arrow" style="marker-end:url(#am)" x1="170" y1="194" x2="170" y2="227" />
<rect class="panel" x="16" y="231" width="308" height="82" rx="9" /><text class="t" x="30" y="254">Map changed: success</text><text class="s" x="30" y="275">Same map: stop; map unknown: unverified</text><text class="s" x="30" y="296">Never press a second time</text>
</svg>
