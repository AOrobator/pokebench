<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="Timeline of story steps with dialogue and which ones the briefing quotes off and on">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#5b6475;--off:#b03a2e;--on:#1f7a4d;--line:#c9d1e0;--box:#f4f7fc}
text{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:13px}
text{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:13px}
text{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:13px}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="170" style="fill:#ffffff;stroke:none" /><style>text{font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:13px}</style>
<line x1="30" y1="60" x2="870" y2="60" stroke="#1d2433" />
<g><circle cx="80" cy="60" r="7" fill="#b03a2e" /><text x="40" y="40">T578 rock tomb</text></g>
<g><circle cx="330" cy="60" r="7" fill="#1f7a4d" /><text x="270" y="40">T621 devon goods recovered</text><text x="270" y="90" fill="#5b6475">Briney's cottage pages</text></g>
<g><circle cx="520" cy="60" r="7" fill="#1f7a4d" /><text x="460" y="40">T630 devon president scene</text><text x="460" y="90" fill="#5b6475">Stone's DEWFORD request</text></g>
<g><circle cx="680" cy="60" r="7" fill="#1f7a4d" /><text x="640" y="40">T634 match call</text></g>
<g><circle cx="820" cy="60" r="7" fill="#1f7a4d" /><text x="770" y="40">T663 tutorial done</text></g>
<text x="30" y="130" fill="#b03a2e">OFF quotes only T578 (red): extended steps never enter the briefing.</text>
<text x="30" y="152" fill="#1f7a4d">ON quotes the latest story step and up to three before it (green), newest first, every page whole.</text>
