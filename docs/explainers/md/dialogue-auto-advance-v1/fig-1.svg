<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img" aria-label="Off: eight A presses reopen the conversation. On: one A, B through two pages, seven A dropped">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f8f7f3;--ink:#1d1c1a;--muted:#67635b;--panel:#fff;--edge:#ddd8ce;--accent:#2f5d9e;--bad:#b3352b;--good:#2e7d4f;--warn:#a8701a}
@media(min-width:1000000px){:root{--bg:#151514;--ink:#ecebe7;--muted:#a19d94;--panel:#1f1f1d;--edge:#35342f;--accent:#7fa8e6;--bad:#ee7d72;--good:#6cc495;--warn:#e0b060}}
*{box-sizing:border-box}
svg text{fill:var(--ink);font:12px -apple-system,sans-serif}
svg .m{fill:var(--muted)}
svg .b{fill:var(--bad)}
svg .g{fill:var(--good)}
svg .box{fill:none;stroke:var(--edge);stroke-width:1.5}
svg .hl{fill:none;stroke:var(--accent);stroke-width:2.5}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="230" style="fill:#ffffff;stroke:none" /><text x="10" y="20" font-weight="600">OFF (today)</text>
<g transform="translate(10,32)">
<rect class="box" x="0" y="0" width="60" height="34" /><text x="22" y="22">A</text>
<rect class="box" x="68" y="0" width="60" height="34" /><text x="90" y="22">A</text>
<rect class="box" x="136" y="0" width="60" height="34" /><text x="158" y="22">A</text>
<rect class="box" x="204" y="0" width="60" height="34" stroke="var(--bad)" /><text x="226" y="22" class="b">A</text>
<rect class="box" x="272" y="0" width="60" height="34" stroke="var(--bad)" /><text x="294" y="22" class="b">A</text>
<rect class="box" x="340" y="0" width="60" height="34" stroke="var(--bad)" /><text x="362" y="22" class="b">A</text>
<rect class="box" x="408" y="0" width="60" height="34" stroke="var(--bad)" /><text x="430" y="22" class="b">A</text>
<rect class="box" x="476" y="0" width="60" height="34" stroke="var(--bad)" /><text x="498" y="22" class="b">A</text>
<text x="0" y="52" class="m">opens · page 2 · closes</text><text x="204" y="52" class="b">re-opens the same line, pages again, re-opens …</text>
<text x="550" y="22" class="b">turn ends mid-print; repeat next turn</text>
</g>
<text x="10" y="120" font-weight="600">ON</text>
<g transform="translate(10,132)">
<rect class="hl" x="0" y="0" width="60" height="34" /><text x="22" y="22">A</text>
<rect class="box" x="68" y="0" width="76" height="34" stroke="var(--good)" /><text x="76" y="22" class="g">wait print</text>
<rect class="box" x="152" y="0" width="60" height="34" stroke="var(--good)" /><text x="160" y="22" class="g">B auto</text>
<rect class="box" x="220" y="0" width="76" height="34" stroke="var(--good)" /><text x="228" y="22" class="g">wait print</text>
<rect class="box" x="304" y="0" width="60" height="34" stroke="var(--good)" /><text x="312" y="22" class="g">B auto</text>
<text x="380" y="14">field free → stop</text><text x="380" y="30" class="m">7 A not sent; result lists 2 pages</text>
<text x="0" y="58" class="m">model's input</text><text x="152" y="58" class="m">harness presses B only when the page waits for input (never while printing)</text>
</g>
</svg>
