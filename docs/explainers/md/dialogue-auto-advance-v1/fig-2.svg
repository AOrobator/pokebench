<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Decision order for each state read">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f8f7f3;--ink:#1d1c1a;--muted:#67635b;--panel:#fff;--edge:#ddd8ce;--accent:#2f5d9e;--bad:#b3352b;--good:#2e7d4f;--warn:#a8701a}
@media(min-width:1000000px){:root{--bg:#151514;--ink:#ecebe7;--muted:#a19d94;--panel:#1f1f1d;--edge:#35342f;--accent:#7fa8e6;--bad:#ee7d72;--good:#6cc495;--warn:#e0b060}}
*{box-sizing:border-box}
svg text{fill:var(--ink);font:12px -apple-system,sans-serif}
svg .m{fill:var(--muted)}
svg .b{fill:var(--bad)}
svg .g{fill:var(--good)}
svg .hl{fill:none;stroke:var(--accent);stroke-width:2.5}
svg .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="300" style="fill:#ffffff;stroke:none" /><rect class="hl" x="10" y="10" width="190" height="40" rx="6" /><text x="22" y="34">read game state</text>
<path class="ln" d="M200 30 H240" />
<g transform="translate(240,0)">
<text x="10" y="24">in_battle → <tspan class="b">stop: battle</tspan></text>
<text x="10" y="46">naming screen → <tspan class="b">stop: naming</tspan></text>
<text x="10" y="68">active_ui ready → <tspan class="b">stop: menu</tspan> (options + highlighted named)</text>
<text x="10" y="90">active_ui not ready (field_transition …) → wait</text>
<text x="10" y="112">screen not overworld → <tspan class="b">stop: screen change</tspan></text>
<text x="10" y="134">message ready (page_wait, scroll_wait, button_wait, dismiss_wait) → <tspan class="g">capture page, press B</tspan></text>
<text x="10" y="156">message printing / scrolling / initializing → wait 100 ms, read again</text>
<text x="10" y="178">no message, field controls locked (cutscene, script) → wait</text>
<text x="10" y="200">no message, controls free → <tspan class="b">stop: conversation closed</tspan></text>
<text x="10" y="236" class="m">Loud caps (each stop is named in the result and the event):</text>
<text x="10" y="256" class="m">50 automatic B presses per call · 90 s per call · 10 s in one wait kind (locked, not-ready interface, never-ready message)</text>
</g>
</svg>
