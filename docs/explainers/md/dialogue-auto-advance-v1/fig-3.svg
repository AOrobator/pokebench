<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120" role="img" aria-label="Switch wiring">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f8f7f3;--ink:#1d1c1a;--muted:#67635b;--panel:#fff;--edge:#ddd8ce;--accent:#2f5d9e;--bad:#b3352b;--good:#2e7d4f;--warn:#a8701a}
@media(min-width:1000000px){:root{--bg:#151514;--ink:#ecebe7;--muted:#a19d94;--panel:#1f1f1d;--edge:#35342f;--accent:#7fa8e6;--bad:#ee7d72;--good:#6cc495;--warn:#e0b060}}
*{box-sizing:border-box}
svg text{fill:var(--ink);font:12px -apple-system,sans-serif}
svg .m{fill:var(--muted)}
svg .box{fill:none;stroke:var(--edge);stroke-width:1.5}
svg .hl{fill:none;stroke:var(--accent);stroke-width:2.5}
svg .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="120" style="fill:#ffffff;stroke:none" /><rect class="box" x="10" y="40" width="150" height="40" rx="6" /><text x="22" y="64">preset / switchboard</text>
<path class="ln" d="M160 60 H200" />
<rect class="box" x="200" y="40" width="120" height="40" rx="6" /><text x="214" y="64">FeatureSet</text>
<path class="ln" d="M320 60 H360" />
<rect class="box" x="360" y="40" width="140" height="40" rx="6" /><text x="372" y="64">playGameTools()</text>
<path class="ln" d="M500 60 H540" />
<rect class="hl" x="540" y="30" width="200" height="60" rx="6" /><text x="550" y="54">withDialogueAutoAdvance</text><text x="550" y="74" class="m">wraps press + navigate_to, adds get_dialogue</text>
<text x="360" y="110" class="m">also: system prompt section and tool list (play-config), dependency + state-only checks (features)</text>
</svg>
