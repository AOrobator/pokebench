<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" role="img" aria-label="Which tool results are whole and which are collapsed in the context built for turn 107" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --lost:#c2432f; --lost-bg:#fbe7e2; --full:#2a62c9; --full-bg:#e4edfb;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --lost:#ff7a63; --lost-bg:#3a1f1a; --full:#7aa7ff; --full-bg:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --lost:#ff7a63; --lost-bg:#3a1f1a; --full:#7aa7ff; --full-bg:#1a2740; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.full{fill:var(--full-bg);stroke:var(--full)}
.col{fill:var(--panel);stroke:var(--rule)}
.lost{fill:var(--lost-bg);stroke:var(--lost)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="170" style="fill:#ffffff;stroke:none" /><text x="0" y="16" class="t">Context built for turn 107: results from turns 91 to 106</text>
<g transform="translate(0,30)">
<rect class="col" x="0" y="0" width="38" height="34" rx="3" /><text x="19" y="21" text-anchor="middle">91</text>
<rect class="col" x="42" y="0" width="38" height="34" rx="3" /><text x="61" y="21" text-anchor="middle">92</text>
<rect class="col" x="84" y="0" width="38" height="34" rx="3" /><text x="103" y="21" text-anchor="middle">93</text>
<rect class="col" x="126" y="0" width="38" height="34" rx="3" /><text x="145" y="21" text-anchor="middle">94</text>
<rect class="col" x="168" y="0" width="38" height="34" rx="3" /><text x="187" y="21" text-anchor="middle">95</text>
<rect class="col" x="210" y="0" width="38" height="34" rx="3" /><text x="229" y="21" text-anchor="middle">96</text>
<rect class="col" x="252" y="0" width="38" height="34" rx="3" /><text x="271" y="21" text-anchor="middle">97</text>
<rect class="lost" x="294" y="0" width="38" height="34" rx="3" stroke-width="2" /><text x="313" y="21" text-anchor="middle">98</text>
<rect class="col" x="336" y="0" width="38" height="34" rx="3" /><text x="355" y="21" text-anchor="middle">99</text>
<rect class="col" x="378" y="0" width="38" height="34" rx="3" /><text x="397" y="21" text-anchor="middle">100</text>
<rect class="col" x="420" y="0" width="38" height="34" rx="3" /><text x="439" y="21" text-anchor="middle">101</text>
<rect class="col" x="462" y="0" width="38" height="34" rx="3" /><text x="481" y="21" text-anchor="middle">102</text>
<rect class="full" x="504" y="0" width="38" height="34" rx="3" /><text x="523" y="21" text-anchor="middle">103</text>
<rect class="full" x="546" y="0" width="38" height="34" rx="3" /><text x="565" y="21" text-anchor="middle">104</text>
<rect class="full" x="588" y="0" width="38" height="34" rx="3" /><text x="607" y="21" text-anchor="middle">105</text>
<rect class="full" x="630" y="0" width="38" height="34" rx="3" /><text x="649" y="21" text-anchor="middle">106</text>
</g>
<path class="arr" d="M313 68 V96" />
<text x="313" y="112" text-anchor="middle" class="s">turn 98: Mom's 8 pages</text>
<text x="313" y="128" text-anchor="middle" class="s">OFF: one line, pages gone · ON: one line + the 8 pages</text>
<rect class="full" x="440" y="146" width="14" height="12" /><text x="460" y="156" class="s">whole, with frame (newest 4)</text>
<rect class="col" x="0" y="146" width="14" height="12" /><text x="20" y="156" class="s">collapsed to one line (frame dropped)</text>
</svg>
