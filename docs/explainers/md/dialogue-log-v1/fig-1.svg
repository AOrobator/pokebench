<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" role="img" aria-label="Capture pipeline from game state to the log" width="700" height="230">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="230" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="150" height="66" rx="10" class="box" />
 <text x="24" y="44" class="t">state event</text>
 <text x="24" y="62" class="s">sampled by the recorder</text>
 <rect x="200" y="20" width="170" height="66" rx="10" class="box hot" />
 <text x="214" y="44" class="t">delivered?</text>
 <text x="214" y="62" class="s">a tool_result carries its</text>
 <text x="214" y="76" class="s">state_seq to the model</text>
 <rect x="410" y="20" width="130" height="66" rx="10" class="box" />
 <text x="424" y="44" class="t">filters</text>
 <text x="424" y="62" class="s">started, overworld,</text>
 <text x="424" y="76" class="s">non-empty buffer</text>
 <rect x="580" y="20" width="110" height="66" rx="10" class="game" />
 <text x="594" y="44" class="t">append</text>
 <text x="594" y="62" class="s">unless same page,</text>
 <text x="594" y="76" class="s">same room as last</text>
 <path d="M160 53 H198" class="arr" marker-end="url(#a)" />
 <path d="M370 53 H408" class="arr" marker-end="url(#a)" />
 <path d="M540 53 H578" class="arr" marker-end="url(#a)" />
 <rect x="200" y="140" width="170" height="60" rx="10" class="prior" />
 <text x="214" y="164" class="t">dropped</text>
 <text x="214" y="182" class="s">samples never shown</text>
 <path d="M285 86 V138" class="arr p" marker-end="url(#a)" />
 <rect x="410" y="140" width="280" height="60" rx="10" class="navb" />
 <text x="424" y="164" class="t">recall_dialogue</text>
 <text x="424" y="182" class="s">filter, newest first, every page whole</text>
 <path d="M635 86 V138" class="arr g" marker-end="url(#a)" />
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--soft)" /></marker></defs>
</svg>
