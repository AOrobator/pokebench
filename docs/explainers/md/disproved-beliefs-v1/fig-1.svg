<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Two sources feed the ledger" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.nav{fill:var(--nav-bg);stroke:var(--nav)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="300" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="200" height="110" rx="8" class="box" /><text x="22" y="44" class="t">Scripted push-back</text><text x="22" y="64" class="s">press or navigate_to call</text><text x="22" y="80" class="s">auto-advance pages begin at Q</text><text x="22" y="96" class="s">call ends one tile back at R</text><text x="22" y="112" class="s">against the way it was going</text>
<rect x="10" y="170" width="200" height="110" rx="8" class="box" /><text x="22" y="194" class="t">Absent story character</text><text x="22" y="214" class="s">model sentence: NAME … at (x,y)</text><text x="22" y="230" class="s">NAME from the readout's own</text><text x="22" y="246" class="s">"Not on this map" list</text><text x="22" y="262" class="s">just shown on that map</text>
<rect x="260" y="20" width="190" height="110" rx="8" class="prior" /><text x="272" y="44" class="t">Pursuit (model side)</text><text x="272" y="64" class="s">tool args: press UP, navigate_to</text><text x="272" y="80" class="s">or the model's whole sentence</text><text x="272" y="96" class="s">with every turn it recurred</text>
<rect x="260" y="170" width="190" height="110" rx="8" class="game" /><text x="272" y="194" class="t">Evidence (game side)</text><text x="272" y="214" class="s">pages the script showed, whole</text><text x="272" y="230" class="s">the readout's presence line</text><text x="272" y="246" class="s">conversation on that map that</text><text x="272" y="262" class="s">names the character</text>
<rect x="500" y="95" width="190" height="110" rx="8" class="nav" /><text x="512" y="119" class="t">Ledger entry</text><text x="512" y="139" class="s">shown before every decision</text><text x="512" y="155" class="s">recorded as belief_ledger</text><text x="512" y="171" class="s">with the events it cites</text>
<path d="M210 75 H258" class="arr" marker-end="url(#ah)" /><path d="M210 225 H258" class="arr" marker-end="url(#ah)" />
<path d="M210 75 L258 220" class="arr" marker-end="url(#ah)" /><path d="M210 225 L258 80" class="arr" marker-end="url(#ah)" />
<path d="M450 75 L498 140" class="arr g" marker-end="url(#ah)" /><path d="M450 225 L498 160" class="arr g" marker-end="url(#ah)" />
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke" /></marker></defs>
</svg>
