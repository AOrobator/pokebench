<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Timeline of the drought clock: held briefings during a battle and a heal trip, clock restarts when each ends" width="900" height="400">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--battle:#f3d6cf;--sight:#f6e3b4;--heal:#d8ebf7;--grid:#b9c8bf}
*{box-sizing:border-box}
svg{min-width:700px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .axis{stroke:var(--muted);stroke-width:1.5}
svg .tick{stroke:var(--grid);stroke-width:1}
svg .battle{fill:var(--battle);stroke:var(--off);stroke-width:1.5}
svg .sight{fill:var(--sight);stroke:#b07d12;stroke-width:1.5}
svg .heal{fill:var(--heal);stroke:#2d5f8a;stroke-width:1.5}
svg .fire{fill:var(--off)}
svg .held{fill:#ffffff;stroke:var(--off);stroke-width:2}
svg .restart{stroke:var(--on);stroke-width:3}
svg .clock{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="400" style="fill:#ffffff;stroke:none" /><line class="axis" x1="40" y1="300" x2="880" y2="300" />
<g class="small">
<text x="34" y="322" class="small">0</text><text x="134" y="322" class="small">5</text><text x="234" y="322" class="small">10</text><text x="334" y="322" class="small">15</text><text x="434" y="322" class="small">20</text><text x="534" y="322" class="small">25</text><text x="634" y="322" class="small">30</text><text x="734" y="322" class="small">35</text><text x="834" y="322" class="small">40</text>
</g>
<path class="tick" d="M40 60V300M140 60V300M240 60V300M340 60V300M440 60V300M540 60V300M640 60V300M740 60V300M840 60V300" />
<text x="40" y="345" class="small">Minutes of active play (illustrative timings). 1 minute = 20 px. Last story milestone at 0.</text>

<rect class="sight" x="100" y="80" width="20" height="40" />
<rect class="battle" x="120" y="80" width="140" height="40" />
<text x="124" y="105">battle</text>
<text x="84" y="72" class="small">sight script</text>
<rect class="heal" x="420" y="80" width="200" height="40" />
<text x="426" y="105">heal trip (≤ 48 tool results)</text>
<text x="404" y="72" class="small">heal warning</text>

<text x="40" y="160" class="small">drought clock</text>
<path class="clock" d="M40 280 L260 170" />
<path class="clock" d="M260 280 L620 100" />
<path class="clock" d="M620 280 L880 150" />
<line class="restart" x1="260" y1="170" x2="260" y2="290" />
<line class="restart" x1="620" y1="100" x2="620" y2="290" />
<text x="266" y="230" class="small">restart</text>
<text x="626" y="230" class="small">restart</text>

<circle class="held" cx="140" cy="250" r="9" /><text x="152" y="256" class="small">5 min: held</text>
<circle class="held" cx="240" cy="200" r="9" /><text x="188" y="186" class="small">10: held</text>
<circle class="fire" cx="360" cy="230" r="9" /><text x="372" y="236" class="small">5 min after restart: sent</text>
<circle class="held" cx="460" cy="180" r="9" /><text x="440" y="162" class="small">10: held</text>
<circle class="held" cx="560" cy="150" r="9" /><text x="572" y="156" class="small">15: held</text>
<circle class="fire" cx="720" cy="240" r="9" /><text x="732" y="246" class="small">5: sent</text>

<circle class="fire" cx="50" cy="380" r="7" /><text x="64" y="385" class="small">briefing sent</text>
<circle class="held" cx="190" cy="380" r="7" /><text x="204" y="385" class="small">due but held, recorded as a diagnostic</text>
<line class="restart" x1="490" y1="372" x2="490" y2="388" /><text x="500" y="385" class="small">held hold ends, or heal done: clock restarts</text>
</svg>
