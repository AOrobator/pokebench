<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="Thirty actions without a story milestone bring the note; a story milestone restarts the count" width="760" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="150" style="fill:#ffffff;stroke:none" /><rect x="20" y="40" width="210" height="60" rx="8" fill="#e3eaf3" stroke="#345779" /><text x="125" y="66" text-anchor="middle">Each action counts</text><text x="125" y="84" text-anchor="middle" class="small">whatever the wall clock</text>
<rect x="280" y="40" width="200" height="60" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="380" y="66" text-anchor="middle">30 with no milestone</text><text x="380" y="84" text-anchor="middle" class="small">the note</text>
<rect x="530" y="40" width="210" height="60" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="635" y="66" text-anchor="middle">Story milestone</text><text x="635" y="84" text-anchor="middle" class="small">restarts the count</text>
<path d="M230 70H280M480 70H530" stroke="#5a6b80" fill="none" />
</svg>
