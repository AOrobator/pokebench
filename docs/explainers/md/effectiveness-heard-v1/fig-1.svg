<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="Turn 715 and 153 battle pages folded into records">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--box:#f4f1ea}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--box:#2a2925}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
svg .mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="420" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--fg)" /></marker></defs>
<text x="10" y="20">dialogue_auto_advance, turn 715 (state seq 30182: player TORCHIC at position 0, one foe GEODUDE at position 1)</text>
<rect x="10" y="32" width="300" height="30" rx="4" fill="var(--fill)" stroke="var(--keep)" stroke-width="2" /><text x="20" y="52" class="mono">TORCHIC used EMBER!       bt 1</text>
<rect x="10" y="68" width="300" height="30" rx="4" fill="var(--fill)" stroke="var(--keep)" stroke-width="2" /><text x="20" y="88" class="mono">It's not very effective…  bt 1</text>
<rect x="10" y="104" width="300" height="30" rx="4" fill="var(--box)" stroke="var(--line)" /><text x="20" y="124" class="mono">Foe GEODUDE used ROCK TOMB! bt 1</text>
<rect x="10" y="140" width="300" height="30" rx="4" fill="var(--box)" stroke="var(--line)" /><text x="20" y="160" class="mono">It's super effective!     bt 1</text>
<rect x="10" y="176" width="300" height="30" rx="4" fill="var(--box)" stroke="var(--line)" /><text x="20" y="196" class="mono">TORCHIC's SPEED fell!     bt 1</text>
<line x1="310" y1="47" x2="420" y2="62" stroke="var(--fg)" marker-end="url(#a)" />
<text x="330" y="44" class="small">"X used MOVE!", X is the player's</text>
<line x1="310" y1="83" x2="420" y2="83" stroke="var(--fg)" marker-end="url(#a)" />
<text x="326" y="100" class="small">same battle turn, an effectiveness line</text>
<rect x="420" y="50" width="420" height="50" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" />
<text x="432" y="72">record: EMBER on GEODUDE: "It's not very effective…"</text><text x="432" y="90" class="small">turn 715 added (turn 716 adds itself the same way)</text>
<line x1="310" y1="119" x2="420" y2="140" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#a)" />
<rect x="420" y="120" width="420" height="50" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="432" y="142">foe's move: the attacker is not the player's POKéMON</text><text x="432" y="160" class="small">so the "super effective!" after it is not recorded</text>
<text x="10" y="236">dialogue_auto_advance, turn 153 (wild WINGULL)</text>
<rect x="10" y="248" width="300" height="30" rx="4" fill="var(--fill)" stroke="var(--line)" /><text x="20" y="268" class="mono">TORCHIC used SCRATCH!     bt 1</text>
<rect x="10" y="284" width="300" height="30" rx="4" fill="var(--box)" stroke="var(--line)" /><text x="20" y="304" class="mono">Wild WINGULL used WATER GUN!</text>
<rect x="10" y="320" width="300" height="30" rx="4" fill="var(--box)" stroke="var(--line)" /><text x="20" y="340" class="mono">It's super effective!     bt 1</text>
<line x1="310" y1="300" x2="420" y2="300" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#a)" />
<rect x="420" y="276" width="420" height="50" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="432" y="298">SCRATCH had no effectiveness line; then the foe's</text><text x="432" y="316">move resets it: nothing recorded</text>
<text x="10" y="378" class="small">Also skipped: an effectiveness page in another battle turn than the "used" page (tested by moving it to battle turn 9); a doubles battle (more than one foe on</text>
<text x="10" y="394" class="small">the field: which foe was hit is not certain); a page with no battle turn or battle message id (it resets the match). Recorded words: "It's super effective!",</text>
<text x="10" y="410" class="small">"It's not very effective…" and "It doesn't affect …" (sText_SuperEffective, sText_NotVeryEffective, sText_ItDoesntAffect in src/battle_message.c).</text>
</svg>
