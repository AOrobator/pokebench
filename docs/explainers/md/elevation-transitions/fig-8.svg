<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 95" role="img" aria-label="Wiring from run preset through withNavigation and the navigate_to port to the planner rule" width="640" height="95">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f4f3ed;--ink:#20271f;--muted:#5d665a;--panel:#fff;--edge:#b8c1b2;--accent:#28613b;--good:#1f7a3f;--bad:#b3261e;--e0:#f2d27a;--e3:#cfe5c4;--e4:#a9c8e8;--e15:#d9c2ec;--wall:#8a8f86;--water:#7fb3d5}
@media(min-width:1000000px){:root{--bg:#151c17;--ink:#e2eadf;--muted:#a8b3a4;--panel:#202b22;--edge:#536650;--accent:#a5db8d;--good:#6fdc8c;--bad:#ff8a80;--e0:#8a6d1f;--e3:#2f5a33;--e4:#2c4f74;--e15:#5a3d75;--wall:#4a4f48;--water:#1f4f6e}}
*{box-sizing:border-box}
svg{width:100%;height:auto;min-width:260px}
.t{stroke:var(--edge);stroke-width:1}
.e15{fill:var(--e15)}
.other{fill:var(--panel)}
.el{fill:var(--ink);font:600 14px system-ui}
.ax{fill:var(--muted);font:12px system-ui}
.good{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="95" style="fill:#ffffff;stroke:none" /><rect class="t other" x="5" y="20" width="135" height="50" rx="10" /><text class="el" x="20" y="50">run preset</text>
<rect class="t other" x="170" y="20" width="135" height="50" rx="10" /><text class="el" x="182" y="50">withNavigation</text>
<rect class="t other" x="335" y="20" width="135" height="50" rx="10" /><text class="el" x="342" y="50">navigate_to port</text>
<rect class="t e15" x="500" y="20" width="135" height="50" rx="10" /><text class="el" x="515" y="50">planner rule</text>
<path class="good" d="M140 45 L170 45 M305 45 L335 45 M470 45 L500 45" />
<text class="ax" x="335" y="90">elevation: "game" or "legacy"</text></svg>
