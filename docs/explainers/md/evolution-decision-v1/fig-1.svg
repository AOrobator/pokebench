<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Evolution animation reaches native cancellation window, waits for a choice, then evolves or cancels" width="800" height="220"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f5f6f8;--ink:#192432;--card:#fff;--line:#527081;--accent:#087f86}
@media(min-width:1000000px){:root{--bg:#111923;--ink:#e8f1f5;--card:#1e2b37;--line:#a8bdca;--accent:#68dbd4}}
*{box-sizing:border-box}
svg{width:100%;height:auto;min-width:580px}
svg text{fill:var(--ink);font:15px system-ui}
svg rect{fill:var(--card);stroke:var(--line);stroke-width:2}
svg path{stroke:var(--accent);stroke-width:3;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="800" height="220" style="fill:#ffffff;stroke:none" /><rect x="10" y="70" width="185" height="70" rx="12" /><text x="28" y="100">Evolution animation</text><text x="28" y="124">Neutral input only</text><path d="M195 105H265" /><text x="203" y="91">window</text><rect x="265" y="70" width="250" height="70" rx="12" /><text x="285" y="100">Game waits for decision</text><text x="285" y="124">choose_evolution</text><path d="M515 105H550V45H600M550 105V175H600" /><text x="548" y="30">evolve</text><text x="548" y="157">cancel</text><rect x="600" y="10" width="190" height="70" rx="12" /><text x="620" y="52">Continue neutrally</text><rect x="600" y="140" width="190" height="70" rx="12" /><text x="620" y="182">Native B input</text></svg>
