<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" style="min-width:680px" role="img" aria-label="Data path from ROM tables to readout lines" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--warn:#a86b12;--wall:#c9c3b6;--grass:#cfe3c4}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--warn:#e0a94f;--wall:#4a463e;--grass:#2c4630}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="200" height="56" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="20" y="42">MapHeader +0x14</text><text x="20" y="62" class="small">regionMapSectionId (u8)</text>
<rect x="10" y="100" width="200" height="56" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="20" y="122">gRegionMapEntries</text><text x="20" y="142" class="small">0x085A147C, 8 bytes each, name ptr +4</text>
<rect x="10" y="180" width="200" height="56" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="20" y="202">destination MapLayout</text><text x="20" y="222" class="small">blocks, tilesets, warps, connections</text>
<rect x="290" y="60" width="240" height="56" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" /><text x="300" y="82">section_name()</text><text x="300" y="102" class="small">displayed place name wins</text>
<rect x="290" y="160" width="240" height="56" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" /><text x="300" y="182">arrival_text()</text><text x="300" y="202" class="small">surf_gate.classify from warp[warpId]</text>
<rect x="610" y="100" width="240" height="70" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="620" y="122">readout (server)</text><text x="620" y="142" class="small">Warps line, interaction candidates,</text><text x="620" y="158" class="small">Warp destination lines</text>
<line x1="210" y1="48" x2="290" y2="84" stroke="var(--muted)" /><line x1="210" y1="128" x2="290" y2="92" stroke="var(--muted)" />
<line x1="210" y1="208" x2="290" y2="188" stroke="var(--muted)" /><line x1="530" y1="88" x2="610" y2="128" stroke="var(--muted)" /><line x1="530" y1="188" x2="610" y2="148" stroke="var(--muted)" />
</svg>
