<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" role="img" aria-label="Woods connect two distinct sections of Route 104" width="850" height="310"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f8f7f2;--fg:#202c2a;--panel:#fff;--line:#98aca5;--accent:#136d56;--muted:#4f615b}
@media(min-width:1000000px){:root{--bg:#14211e;--fg:#eef5ee;--panel:#20332d;--line:#6b8f80;--accent:#8cdbb0;--muted:#b2c6ba}}
*{box-sizing:border-box}
svg{width:100%;min-width:620px;height:auto}
svg text{fill:var(--fg);font-family:system-ui}
svg rect{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg path{fill:none;stroke:var(--accent);stroke-width:3}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="850" height="310" style="fill:#ffffff;stroke:none" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6" /></marker></defs><rect x="15" y="80" width="250" height="120" rx="12" /><text x="35" y="112" font-size="21">ROUTE 104</text><text x="35" y="143">Southern terrain section</text><text x="35" y="173">Entrance (10,38)/(11,38)</text><rect x="315" y="80" width="210" height="120" rx="12" /><text x="335" y="119" font-size="20">PETALBURG WOODS</text><text x="335" y="154">Distinct entrance / exit</text><rect x="575" y="80" width="260" height="120" rx="12" /><text x="595" y="112" font-size="21">ROUTE 104</text><text x="595" y="143">Northern terrain section</text><text x="595" y="173">Return (10,30)/(11,30)</text><path d="M265 140 H315 M525 140 H575" marker-end="url(#arrow)" /><text x="25" y="250">Both Route 104 sections have map ID 0/19.</text><text x="25" y="280">The section and landing coordinates distinguish the return.</text></svg>
