<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-label="Off: story event then memory plan. On: story event, talk to everyone, follow the hint." width="700" height="270">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="270" style="fill:#ffffff;stroke:none" /><text x="10" y="22" class="t">Off</text>
 <rect x="10" y="34" width="150" height="58" rx="10" class="box" />
 <text x="22" y="58" class="t">Story event</text>
 <text x="22" y="76" class="s">e.g. a milestone</text>
 <rect x="200" y="34" width="170" height="58" rx="10" class="prior" />
 <text x="212" y="58" class="t">One conversation</text>
 <text x="212" y="76" class="s">then leave the room</text>
 <rect x="410" y="34" width="280" height="58" rx="10" class="prior" />
 <text x="422" y="58" class="t">Plan from memory of the series</text>
 <text x="422" y="76" class="s">hints called "generic advice"; wandering</text>
 <path d="M160 63 H198" class="arr p" marker-end="url(#ap)" />
 <path d="M370 63 H408" class="arr p" marker-end="url(#ap)" />
 <text x="10" y="142" class="t">On</text>
 <rect x="10" y="154" width="150" height="58" rx="10" class="box" />
 <text x="22" y="178" class="t">Story event</text>
 <text x="22" y="196" class="s">or unsure where to go</text>
 <rect x="200" y="154" width="170" height="58" rx="10" class="game hot" />
 <text x="212" y="178" class="t">Talk to everyone here</text>
 <text x="212" y="196" class="s">and again to people met</text>
 <rect x="410" y="154" width="280" height="58" rx="10" class="game" />
 <text x="422" y="178" class="t">Follow what they said</text>
 <text x="422" y="196" class="s">a short remark is a direction</text>
 <path d="M160 183 H198" class="arr g" marker-end="url(#ag)" />
 <path d="M370 183 H408" class="arr g" marker-end="url(#ag)" />
 <path d="M550 212 C550 250 285 250 285 214" class="arr" marker-end="url(#an)" />
 <text x="330" y="262" class="s">the story moves on, so people may say something new</text>
 <defs>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--game)" /></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--prior)" /></marker>
  <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--soft)" /></marker>
 </defs>
</svg>
