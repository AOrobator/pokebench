<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" role="img" aria-label="System prompt order with the talk-to-people slot" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="330" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke" /></marker></defs>
<rect class="box" x="20" y="12" width="300" height="34" rx="6" /><text x="34" y="34">Base prompt, tools, auto-advance sections</text>
<rect class="box" x="20" y="54" width="300" height="34" rx="6" /><text x="34" y="76">Game evidence first, navigate_to usage</text>
<rect class="box" x="20" y="96" width="300" height="34" rx="6" /><text x="34" y="118">No nicknames · Map symbols and rules</text>
<rect class="box" x="20" y="138" width="300" height="34" rx="6" /><text x="34" y="160">Battles and healing · Trainer battles</text>
<rect class="game hot" x="20" y="180" width="300" height="44" rx="6" /><text x="34" y="200" class="t">Talk to people slot</text><text x="34" y="216" class="s">one section at most (see table below)</text>
<rect class="box" x="20" y="232" width="300" height="34" rx="6" /><text x="34" y="254">Exits you have not taken</text>
<rect class="box" x="20" y="274" width="300" height="34" rx="6" /><text x="34" y="296">Objective record (objective tracking)</text>
<path class="arr g" d="M326 202 H400" marker-end="url(#a)" />
<rect class="game" x="404" y="150" width="276" height="104" rx="6" />
<text x="418" y="172" class="t">v2 on → v2 section</text>
<text x="418" y="192">else v1 on → v1 section</text>
<text x="418" y="212">else → nothing</text>
<text x="418" y="236" class="s">+ " Talking is cheap: …" when</text>
<text x="418" y="250" class="s">dialogue-auto-advance-v1 is on</text>
</svg>
