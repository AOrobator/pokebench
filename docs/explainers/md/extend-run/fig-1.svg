<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" role="img" aria-label="Extend dialog writes a control request. The agent records its acknowledgement and updates the shared budget. Timer, turn check and viewer read the new cap." width="760" height="225"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f4f6f9;--ink:#192d3c;--card:#fff;--line:#537b8d;--accent:#125b52}
@media(min-width:1000000px){:root{--bg:#101c2a;--ink:#e6f0f7;--card:#182c3b;--line:#91b6c9;--accent:#8bdcc5}}
*{box-sizing:border-box}
svg{width:100%;min-width:560px;color:var(--ink)}
rect,path{stroke:var(--line);stroke-width:2;fill:var(--card)}
text{fill:currentColor;font-family:system-ui,sans-serif;font-size:15px}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="225" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="170" height="65" rx="8" /><text x="25" y="47">EXTEND dialog</text><text x="25" y="70">+30 min / +1 hour</text><path d="M180 53H260" /><text x="190" y="38">request</text><rect x="260" y="20" width="210" height="65" rx="8" /><text x="275" y="47">Running agent</text><text x="275" y="70">durable acknowledgement</text><path d="M470 53H560" /><text x="480" y="38">applies</text><rect x="560" y="20" width="190" height="65" rx="8" /><text x="575" y="47">Effective time cap</text><text x="575" y="70">old cap + addition</text><path d="M655 85V125H105V155M365 125V155M655 125V155" /><rect x="10" y="155" width="190" height="55" rx="8" /><text x="25" y="187">Deadline timer</text><rect x="260" y="155" width="210" height="55" rx="8" /><text x="275" y="187">Turn / target checks</text><rect x="560" y="155" width="190" height="55" rx="8" /><text x="575" y="187">Viewer and replay</text></svg>
