<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="before-title before-desc" width="700" height="260">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f5f2ea;--paper:#fffdf7;--ink:#20231f;--muted:#646b61;--line:#bbb9ae;--bad:#b44532;--good:#16745b;--accent:#315eaa;--soft:#e9e4d8}
*{box-sizing:border-box}
svg{display:block;min-width:700px;width:100%;height:auto}
@media(min-width:1000000px){:root{--bg:#151815;--paper:#20241f;--ink:#f2f0e9;--muted:#b6bcb1;--line:#4a5047;--bad:#f08a72;--good:#65d4ad;--accent:#8db3ff;--soft:#30362e}}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="260" style="fill:#ffffff;stroke:none" /><title id="before-title">The old ledger loses the target of a button batch</title>
 <desc id="before-desc">A movement and A batch reads the television, but the old rule only recognizes a request containing one A, so the untried list keeps the television.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)" /></marker></defs>
 <rect x="24" y="30" width="188" height="92" rx="12" fill="var(--soft)" stroke="var(--line)" />
 <text x="42" y="58" fill="var(--ink)" font-family="monospace" font-size="14">LEFT LEFT LEFT UP A</text>
 <text x="42" y="84" fill="var(--muted)" font-size="14">player ends at (4,2)</text>
 <text x="42" y="106" fill="var(--muted)" font-size="14">facing television (4,1)</text>
 <path d="M214 76H303" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)" />
 <rect x="306" y="30" width="172" height="92" rx="12" fill="var(--soft)" stroke="var(--line)" />
 <text x="324" y="58" fill="var(--ink)" font-size="14">2 dialogue pages</text>
 <text x="324" y="84" fill="var(--good)" font-size="14">speaker: television</text>
 <text x="324" y="106" fill="var(--good)" font-size="14">source: faced_target</text>
 <path d="M480 76H558" stroke="var(--muted)" stroke-width="2" marker-end="url(#arrow)" />
 <rect x="562" y="30" width="114" height="92" rx="12" fill="var(--soft)" stroke="var(--line)" />
 <text x="578" y="59" fill="var(--bad)" font-size="14">old rule</text>
 <text x="578" y="84" fill="var(--ink)" font-size="14">batch ≠ [A]</text>
 <text x="578" y="106" fill="var(--bad)" font-size="14">not marked</text>
 <rect x="171" y="165" width="358" height="64" rx="12" fill="none" stroke="var(--bad)" stroke-width="2" />
 <text x="190" y="192" fill="var(--ink)" font-size="14">Not tried yet: PC; notebook; GameCube;</text>
 <text x="190" y="214" fill="var(--bad)" font-size="14">region map; television at 4,1</text>
</svg>
