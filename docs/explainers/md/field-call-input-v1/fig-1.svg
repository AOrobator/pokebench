<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="The same printer bytes read with the switch off and on" width="720" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#22303a;--muted:#5d6b75;--line:#9fb0ba;--wait:#2f7d4f;--print:#b0632a;--off:#a33a3a;--paper:#ffffff}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="200" style="fill:#ffffff;stroke:none" /><rect x="10" y="60" width="170" height="80" rx="6" fill="#fff" stroke="#9fb0ba" />
<text x="24" y="84">Printer, window 1</text>
<text x="24" y="104" class="small">active = 1</text>
<text x="24" y="120" class="small">state = 2 (CLEAR)</text>
<text x="24" y="134" class="small">cursor just past \p</text>
<path d="M180 85 L270 45" stroke="#a33a3a" stroke-width="2" fill="none" />
<path d="M180 115 L270 155" stroke="#2f7d4f" stroke-width="2" fill="none" />
<text x="196" y="50" class="small">OFF reads active</text>
<text x="196" y="160" class="small">ON reads state</text>
<rect x="270" y="15" width="440" height="66" rx="6" fill="#fff" stroke="#a33a3a" />
<text x="284" y="38">Interface: field_match_call_transition; input not ready</text>
<text x="284" y="56" class="small">Directions select; A confirms; B closes or declines</text>
<text x="284" y="72" class="small">text printing: YES. The model observes and waits.</text>
<rect x="270" y="120" width="440" height="66" rx="6" fill="#fff" stroke="#2f7d4f" />
<text x="284" y="143">Interface: field_match_call_message; input ready; selected CONTINUE</text>
<text x="284" y="161" class="small">value ………………; text box waiting for A; A or B shows the next page</text>
<text x="284" y="177" class="small">text printing: NO. The harness presses A.</text>
</svg>
