<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="The corridor north from (16,102) passes one of two rocks" width="560" height="260">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--rock:#8a6a48;--wall:#9aa6b4;--floor:#f4f7fb;--you:#2a62b8;--route:#2f8f4e;--ink:#283038;--muted:#5a6b80}
svg{min-width:560px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="560" height="260" style="fill:#ffffff;stroke:none" /><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--route)" /></marker></defs>
<g transform="translate(20,20)">

<rect x="0" y="0" width="40" height="40" fill="var(--wall)" /><rect x="40" y="0" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="80" y="0" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="120" y="0" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="160" y="0" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="200" y="0" width="40" height="40" fill="var(--wall)" />
<rect x="0" y="40" width="40" height="40" fill="var(--wall)" /><rect x="40" y="40" width="40" height="40" fill="var(--wall)" /><rect x="80" y="40" width="40" height="40" fill="var(--wall)" /><rect x="120" y="40" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="160" y="40" width="40" height="40" fill="var(--rock)" /><rect x="200" y="40" width="40" height="40" fill="var(--wall)" />
<rect x="0" y="80" width="40" height="40" fill="var(--wall)" /><rect x="40" y="80" width="40" height="40" fill="var(--wall)" /><rect x="80" y="80" width="40" height="40" fill="var(--wall)" /><rect x="120" y="80" width="40" height="40" fill="var(--rock)" /><rect x="160" y="80" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="200" y="80" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" />
<rect x="0" y="120" width="40" height="40" fill="var(--wall)" /><rect x="40" y="120" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="80" y="120" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="120" y="120" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="160" y="120" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" /><rect x="200" y="120" width="40" height="40" fill="var(--floor)" stroke="#c9d6e6" />
<circle cx="60" cy="140" r="12" fill="var(--you)" />
<text x="140" y="105" text-anchor="middle" fill="#fff">15</text><text x="180" y="65" text-anchor="middle" fill="#fff">16</text>
<path d="M72,140 H140 V110" fill="none" stroke="var(--route)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#a)" />
<text x="0" y="180" class="small">x 15 to 20, y 99 to 102. Blue: you at (16,102). Brown: the rocks at (18,101) and (19,100).</text>
<text x="0" y="198" class="small">Grey: walls. Every way north passes one rock; smashing either opens it.</text>
<text x="0" y="216" class="small">Dashed: the route navigate_to finds once object 15 is off its object list.</text>
</g>
<g transform="translate(280,30)">
<text x="0" y="0">field_obstacles (server):</text>
<text x="0" y="22" class="small">rock_smash capability true</text>
<text x="0" y="40" class="small">object 15 at (18,101), open true</text>
<text x="0" y="58" class="small">object 16 at (19,100), open true</text>
<text x="0" y="90">Open means the party can smash it,</text>
<text x="0" y="108">not that it is gone. The exit flood</text>
<text x="0" y="126">ignores objects, so it walked through;</text>
<text x="0" y="144">the route planner does not.</text>
</g>
</svg>
