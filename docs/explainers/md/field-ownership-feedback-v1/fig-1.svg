<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Timeline: battle won, TryEvolvePokemon runs with gMain.inBattle still set, then ReturnFromBattleToOverworld clears it" width="900" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker></defs>
<rect class="box" x="20" y="40" width="200" height="70" rx="8" /><text x="36" y="70">battle won</text><text x="36" y="92" class="small">turn 555, seq 20434</text>
<rect class="offbox" x="300" y="40" width="300" height="70" rx="8" /><text x="316" y="70">TryEvolvePokemon</text><text x="316" y="92" class="small">screen evolution, in_battle still true</text>
<rect class="box" x="680" y="40" width="200" height="70" rx="8" /><text x="696" y="70">ReturnFromBattle-</text><text x="696" y="92">ToOverworld</text>
<path class="arrow" d="M220 75H296" marker-end="url(#f0)" /><path class="arrow" d="M600 75H676" marker-end="url(#f0)" />
<path d="M20 150H600" stroke="#a8432c" stroke-width="6" /><text x="20" y="180" class="small">gMain.inBattle set (in_battle: true)</text>
<path d="M600 150H880" stroke="#b9c8bf" stroke-width="6" /><text x="610" y="180" class="small">cleared</text>
</svg>
