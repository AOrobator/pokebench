<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Off: resolve target first, refusal without readout, the model calls again; on: field check first, refusal with reason and the whole observation" width="900" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .offarrow{stroke:var(--off);stroke-width:2;fill:none;stroke-dasharray:6 4}
svg .onarrow{stroke:var(--on);stroke-width:2.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="330" style="fill:#ffffff;stroke:none" /><defs><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8432c" /></marker><marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c7a4b" /></marker></defs>
<text x="20" y="28">OFF</text>
<rect class="offbox" x="20" y="40" width="240" height="60" rx="8" /><text x="36" y="66">navigate_to_target</text><text x="36" y="86" class="small">object 21</text>
<rect class="offbox" x="320" y="40" width="240" height="60" rx="8" /><text x="336" y="66">resolve the target</text><text x="336" y="86" class="small">object 21 not in the state</text>
<rect class="offbox" x="620" y="40" width="260" height="60" rx="8" /><text x="636" y="66">"target is not listed …"</text><text x="636" y="86" class="small">no Screen, no Interface</text>
<path class="offarrow" d="M260 70H316" marker-end="url(#f1)" /><path class="offarrow" d="M560 70H616" marker-end="url(#f1)" />
<path class="offarrow" d="M750 100V130H140V104" marker-end="url(#f1)" /><text x="330" y="150" class="small">the model calls again: 85 turns</text>
<text x="20" y="198">ON</text>
<rect class="onbox" x="20" y="210" width="240" height="60" rx="8" /><text x="36" y="236">navigate_to_target</text><text x="36" y="256" class="small">object 21</text>
<rect class="onbox" x="320" y="210" width="240" height="60" rx="8" /><text x="336" y="236">fieldOwner(state)</text><text x="336" y="256" class="small">screen evolution, not overworld</text>
<rect class="onbox" x="620" y="210" width="260" height="100" rx="8" /><text x="636" y="236">refused: the reason</text><text x="636" y="256" class="small">+ the whole observation</text><text x="636" y="276" class="small">(Screen, Interface, controls)</text><text x="636" y="296" class="small">nothing pressed</text>
<path class="onarrow" d="M260 240H316" marker-end="url(#f2)" /><path class="onarrow" d="M560 240H616" marker-end="url(#f2)" />
</svg>
