<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="Timeline of ten held calls after a first entry, then normal delivery" width="760" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="210" style="fill:#ffffff;stroke:none" /><rect x="20" y="70" width="110" height="56" rx="8" fill="#e3eaf3" stroke="#345779" />
<text x="75" y="94" text-anchor="middle">First entry</text>
<text x="75" y="112" text-anchor="middle" class="small">pair counts keep counting</text>
<rect x="150" y="70" width="400" height="56" rx="8" fill="#fff3c9" stroke="#b08a1e" />
<text x="350" y="94" text-anchor="middle">Next 10 tool results: hold</text>
<text x="350" y="112" text-anchor="middle" class="small">map_cycle and milestone_drought recorded as would_warn, not sent</text>
<rect x="570" y="70" width="170" height="56" rx="8" fill="#e0f2e6" stroke="#2f7d4f" />
<text x="655" y="94" text-anchor="middle">Hold ends</text>
<text x="655" y="112" text-anchor="middle" class="small">still due: sent. Not due: recorded</text>
<path d="M350 150 L350 128" stroke="#5a6b80" fill="none" />
<text x="350" y="170" text-anchor="middle" class="small">another first entry restarts the 10 calls</text>
<text x="350" y="40" text-anchor="middle" class="small">interface dwell, text-only and battle guards keep firing throughout</text>
</svg>
