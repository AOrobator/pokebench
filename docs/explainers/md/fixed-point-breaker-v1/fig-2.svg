<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" role="img" aria-label="Request before and after collapse" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="800" height="170" style="fill:#ffffff;stroke:none" /><text x="0" y="16">Off: every copy is in the request</text>
<rect x="0" y="26" width="60" height="30" fill="var(--fill)" stroke="var(--line)" /><text x="12" y="46">task</text>
<rect x="66" y="26" width="90" height="30" fill="var(--fill)" stroke="var(--line)" /><text x="72" y="46">walk north</text>
<g fill="var(--fill)" stroke="var(--drop)"><rect x="162" y="26" width="110" height="30" /><rect x="278" y="26" width="110" height="30" /><rect x="394" y="26" width="110" height="30" /><rect x="510" y="26" width="110" height="30" /></g>
<text x="170" y="46">nav (10,5) ×1</text><text x="286" y="46">nav (10,5) ×2</text><text x="402" y="46">nav (10,5) ×3</text><text x="518" y="46">nav (10,5) ×4</text>
<text x="0" y="104">On: one copy, the newest, byte for byte; then the note</text>
<rect x="0" y="114" width="60" height="30" fill="var(--fill)" stroke="var(--keep)" /><text x="12" y="134">task</text>
<rect x="66" y="114" width="90" height="30" fill="var(--fill)" stroke="var(--keep)" /><text x="72" y="134">walk north</text>
