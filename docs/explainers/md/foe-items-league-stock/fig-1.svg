<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" style="width:100%;height:auto;min-width:640px" role="img" aria-label="Turn 3931 with the switch off and on" width="880" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#4f5a6e;--line:#9aa6bd;--foe:#c8463c;--you:#2f6fb5;--ok:#2e8b57;--note:#f3efe2}
svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;fill:var(--ink)}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="880" height="300" style="fill:#ffffff;stroke:none" /><rect x="10" y="10" width="420" height="280" rx="8" fill="#fff" stroke="#9aa6bd" />
<rect x="450" y="10" width="420" height="280" rx="8" fill="#fff" stroke="#9aa6bd" />
<text x="24" y="36" font-weight="bold">Off (what Opus saw)</text>
<text x="464" y="36" font-weight="bold">Switch on (same RAM, rerendered)</text>
<text x="24" y="66">Foe GLALIE · HP 2/… </text>
<text x="24" y="88">No line about GLACIA's items.</text>
<text x="24" y="122" fill="#2f6fb5">Opus: "QUICK ATTACK always goes first …</text>
<text x="24" y="140" fill="#2f6fb5">enough to knock out GLALIE at 2 HP"</text>
<line x1="40" y1="160" x2="40" y2="196" stroke="#c8463c" stroke-width="2" marker-end="url(#a)" />
<text x="52" y="184" fill="#c8463c">GLACIA used FULL RESTORE! GLALIE back to 146</text>
<text x="24" y="226">Then ELECTRIKE fainted to CRUNCH and</text>
<text x="24" y="244">the battle was lost.</text>
<text x="464" y="66">Foe trainer items used this battle: none</text>
<text x="464" y="88">Foe trainer items left (from game memory):</text>
<text x="476" y="106">FULL RESTORE (any turn);</text>
<text x="476" y="124">FULL RESTORE (only once 2 or fewer of its</text>
<text x="476" y="142">POKéMON can fight).</text>
<text x="464" y="166">Unless it switches, the trainer AI uses an item instead of a</text>
<text x="464" y="184">move, and the item takes effect before any move</text>
<text x="464" y="202">that turn: FULL RESTORE when its POKéMON in battle</text>
<text x="464" y="220">is below 1/4 of its max HP.</text>
<text x="464" y="252" class="small">A 2 HP GLALIE is below 1/4, so the heal comes first.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8463c" /></marker></defs>
</svg>
