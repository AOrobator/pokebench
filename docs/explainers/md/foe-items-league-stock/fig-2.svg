<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" style="width:100%;height:auto;min-width:640px" role="img" aria-label="Memory path to the trainer items" width="880" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#4f5a6e;--line:#9aa6bd;--foe:#c8463c;--you:#2f6fb5;--ok:#2e8b57;--note:#f3efe2}
svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;fill:var(--ink)}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="880" height="170" style="fill:#ffffff;stroke:none" /><rect x="10" y="40" width="190" height="60" rx="6" fill="#fff" stroke="#2f6fb5" />
<text x="22" y="64">gBattleResources</text><text x="22" y="84" class="small">pointer at 0x020244A8</text>
<rect x="240" y="40" width="190" height="60" rx="6" fill="#fff" stroke="#2f6fb5" />
<text x="252" y="64">battleHistory</text><text x="252" y="84" class="small">pointer at +0x18</text>
<rect x="470" y="20" width="400" height="100" rx="6" fill="#fff" stroke="#2e8b57" stroke-width="2" />
<text x="482" y="44">trainerItems[4] at +0x48, itemsNo at +0x50</text>
<text x="482" y="66" class="small">checked against the trainer's ROM items; a mismatch</text>
