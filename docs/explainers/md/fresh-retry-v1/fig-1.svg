<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Context sent on the retry, off versus on" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="300" style="fill:#ffffff;stroke:none" /><text x="20" y="22" class="t">OFF (today)</text>
<text x="370" y="22" class="t">ON</text>
<rect x="20" y="36" width="310" height="34" rx="6" class="box" /><text x="32" y="58">… last tool result (screen + readout)</text>
<rect x="20" y="80" width="310" height="62" rx="6" class="prior hot" /><text x="32" y="102">failed reply: long reasoning,</text><text x="32" y="120">no tool call</text><text x="32" y="136" class="s">sent back with its thinking (preserve_thinking)</text>
<rect x="20" y="152" width="310" height="34" rx="6" class="navb" /><text x="32" y="174">nudge: "Keep playing: call observe or press…"</text>
<path d="M175 196 v26" class="arr p" /><text x="185" y="214" class="s">model continues its own reply</text>
<rect x="20" y="230" width="310" height="44" rx="6" class="prior" /><text x="32" y="250">often the same reply again</text><text x="32" y="266" class="s">0c89: 217 and 218 identical</text>
<rect x="370" y="36" width="310" height="34" rx="6" class="box" /><text x="382" y="58">… last tool result (screen + readout)</text>
<rect x="370" y="80" width="310" height="62" rx="6" fill="none" stroke="var(--rule)" stroke-dasharray="5 4" /><text x="382" y="106" class="s">failed reply left out of the context</text><text x="382" y="124" class="s">(still recorded in events.jsonl)</text>
<rect x="370" y="152" width="310" height="34" rx="6" class="navb" /><text x="382" y="174">nudge: "Keep playing: call observe or press…"</text>
<path d="M525 196 v26" class="arr g" /><text x="535" y="214" class="s">new sample from the same state</text>
<rect x="370" y="230" width="310" height="44" rx="6" class="game" /><text x="382" y="250">independent second try</text><text x="382" y="266" class="s">same nudge, same failure limit</text>
</svg>
