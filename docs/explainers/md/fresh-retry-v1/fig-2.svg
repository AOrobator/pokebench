<path d="M330 52 h30" class="arr" />
<rect x="360" y="30" width="170" height="44" rx="6" class="navb hot" /><text x="372" y="50">contextTools()</text><text x="372" y="66" class="s">play-wiring.ts filter</text>
<path d="M530 52 h30" class="arr" />
<rect x="560" y="30" width="130" height="44" rx="6" class="box" /><text x="572" y="50">piLoop context</text><text x="572" y="66" class="s">sent to the model</text>
