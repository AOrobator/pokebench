<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" width="820" role="img" aria-label="Checkpoint strip showing the zoom end" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f4f7fa; --card:#fff; --ink:#22303c; --muted:#5a6b7a; --line:#c9d4de; --human:#304f7a; --agent:#af8915; --hide:#dfe6ec; --accent:#3a6ea5;}
@media (min-width:1000000px){:root{--bg:#141a20; --card:#1d252d; --ink:#e3e9ee; --muted:#9aabb9; --line:#3a4651; --human:#8fb4e6; --agent:#e2bd4a; --hide:#2a333c; --accent:#7fb0e6;}}
svg text{fill:var(--ink); font:12px system-ui, sans-serif;}
.muted{fill:var(--muted);}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="820" height="170" style="fill:#ffffff;stroke:none" /><g>
<rect x="10" y="40" width="440" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="2" />
<text x="14" y="30">Shown with FRONTIER (14 of 36 today)</text>
<rect x="455" y="40" width="355" height="40" rx="6" fill="var(--hide)" />
<text x="460" y="30" class="muted">Hidden until FULL BASELINE (22)</text>
</g>
<g>
<text x="20" y="66">New game … Rival bedroom</text>
<circle cx="300" cy="60" r="7" fill="var(--agent)" /><text x="275" y="110">Rival met</text><text x="250" y="126" class="muted">farthest agent</text>
<path d="M300 60 L 400 60" stroke="var(--human)" stroke-width="2" stroke-dasharray="4 3" />
<path d="M400 53 l2 5 5 0 -4 3 2 5 -5 -3 -5 3 2 -5 -4 -3 5 0 Z" fill="var(--human)" /><text x="375" y="110">Route 101</text><text x="345" y="126" class="muted">next human checkpoint</text>
<text x="470" y="66" class="muted">Starter … Rock Tomb</text>
</g>
</svg>
