<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="The navigate_to loop: read state, plan A star, check before the press, press one button, verify the move, then repeat until arrival or a stop condition. The loop limit grows from 8 to 512." width="660" height="270">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f3f5f1;--panel:#ffffff;--fg:#1c2420;--muted:#5d6a62;--line:#c9d2cb;
 --grass:#3f8f4f;--route:#1f6fb2;--warn:#c4502a;--soft:#e4ebe5;--water:#7fb6d9;
 --display:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}
svg{width:100%;height:auto;min-width:520px;display:block}
.t{fill:var(--fg);font:12px var(--body)}
.ts{fill:var(--muted);font:11px var(--body)}
.tm{fill:var(--fg);font:11px var(--mono)}
.th{fill:var(--fg);font:600 13px var(--body)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="270" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" /></marker></defs>
   <g style="color:var(--muted)">
   <g fill="var(--panel)" stroke="var(--line)" stroke-width="1.5">
    <rect x="16" y="40" width="110" height="52" rx="5" />
    <rect x="156" y="40" width="120" height="52" rx="5" stroke="var(--route)" stroke-width="2" />
    <rect x="306" y="40" width="120" height="52" rx="5" />
    <rect x="456" y="40" width="80" height="52" rx="5" />
    <rect x="566" y="40" width="80" height="52" rx="5" />
   </g>
   <text class="th" x="71" y="63" text-anchor="middle">Read state</text><text class="ts" x="71" y="80" text-anchor="middle">fresh snapshot</text>
   <text class="th" x="216" y="63" text-anchor="middle">Plan A*</text><text class="ts" x="216" y="80" text-anchor="middle">whole map, heap</text>
   <text class="th" x="366" y="63" text-anchor="middle">Check</text><text class="ts" x="366" y="80" text-anchor="middle">same map, tile, unlocked</text>
   <text class="th" x="496" y="63" text-anchor="middle">Press</text><text class="ts" x="496" y="80" text-anchor="middle">one button</text>
   <text class="th" x="606" y="63" text-anchor="middle">Verify</text><text class="ts" x="606" y="80" text-anchor="middle">moved 1 tile?</text>
   <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="126" y1="66" x2="154" y2="66" /><line x1="276" y1="66" x2="304" y2="66" /><line x1="426" y1="66" x2="454" y2="66" /><line x1="536" y1="66" x2="564" y2="66" />
    <path d="M606 40 V20 H71 V38" />
   </g>
   <text class="ts" x="338" y="15" text-anchor="middle">next press: re-plan from where the player actually is</text>
   <g stroke="var(--warn)" stroke-width="1.5" fill="none" marker-end="url(#a)" style="color:var(--warn)">
    <line x1="216" y1="92" x2="216" y2="150" /><line x1="366" y1="92" x2="366" y2="150" /><line x1="606" y1="92" x2="606" y2="150" />
   </g>
   </g>
   <g class="ts" style="fill:var(--warn)">
    <text x="216" y="166" text-anchor="middle" style="fill:var(--warn)">no path</text>
    <text x="366" y="166" text-anchor="middle" style="fill:var(--warn)">state changed:</text>
    <text x="366" y="180" text-anchor="middle" style="fill:var(--warn)">no button sent</text>
    <text x="606" y="166" text-anchor="middle" style="fill:var(--warn)">blocked, unexpected</text>
    <text x="606" y="180" text-anchor="middle" style="fill:var(--warn)">move, map change,</text>
    <text x="606" y="194" text-anchor="middle" style="fill:var(--warn)">lock, or arrived</text>
    <text x="216" y="180" text-anchor="middle" style="fill:var(--warn)">or no shorter route</text>
    <text x="216" y="194" text-anchor="middle" style="fill:var(--warn)">for 16 presses</text>
   </g>
   <rect x="16" y="214" width="630" height="44" rx="5" fill="var(--soft)" />
   <text class="t" x="32" y="234">Presses per call</text>
   <text class="tm" x="180" y="234">OFF: up to 8 (15×15 window)</text>
   <text class="tm" x="420" y="234">ON: up to 512 (whole map)</text>
   <text class="ts" x="32" y="250">512 is a safety bound; the longest real routes need a few hundred steps.</text>
  </svg>
