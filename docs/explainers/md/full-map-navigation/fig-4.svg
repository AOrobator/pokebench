<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-label="A route detours around a warp mat instead of crossing it, unless the warp itself is the goal." width="640" height="170">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f3f5f1;--panel:#ffffff;--fg:#1c2420;--muted:#5d6a62;--line:#c9d2cb;
 --grass:#3f8f4f;--route:#1f6fb2;--warn:#c4502a;--soft:#e4ebe5;--water:#7fb6d9;
 --display:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}
svg{width:100%;height:auto;min-width:520px;display:block}
.ts{fill:var(--muted);font:11px var(--body)}
.th{fill:var(--fg);font:600 13px var(--body)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="170" style="fill:#ffffff;stroke:none" /><g transform="translate(40,30)">
    <g fill="var(--soft)" stroke="var(--line)">
     <rect x="0" y="0" width="28" height="28" /><rect x="28" y="0" width="28" height="28" /><rect x="56" y="0" width="28" height="28" /><rect x="84" y="0" width="28" height="28" /><rect x="112" y="0" width="28" height="28" />
     <rect x="0" y="28" width="28" height="28" /><rect x="28" y="28" width="28" height="28" /><rect x="84" y="28" width="28" height="28" /><rect x="112" y="28" width="28" height="28" />
     <rect x="0" y="56" width="28" height="28" /><rect x="28" y="56" width="28" height="28" /><rect x="56" y="56" width="28" height="28" /><rect x="84" y="56" width="28" height="28" /><rect x="112" y="56" width="28" height="28" />
    </g>
    <rect x="56" y="28" width="28" height="28" fill="var(--warn)" fill-opacity=".3" stroke="var(--warn)" />
    <text class="th" x="70" y="47" text-anchor="middle">W</text>
    <text class="th" x="14" y="47" text-anchor="middle">@</text>
    <text class="th" x="126" y="47" text-anchor="middle">★</text>
    <polyline points="14,34 14,14 126,14 126,34" fill="none" stroke="var(--route)" stroke-width="2.5" />
    <text class="ts" x="0" y="108">Goal past the warp: route goes around it</text>
   </g>
   <g transform="translate(360,30)">
    <g fill="var(--soft)" stroke="var(--line)">
     <rect x="0" y="28" width="28" height="28" /><rect x="28" y="28" width="28" height="28" />
    </g>
    <rect x="56" y="28" width="28" height="28" fill="var(--warn)" fill-opacity=".3" stroke="var(--warn)" />
    <text class="th" x="70" y="47" text-anchor="middle">W★</text>
    <text class="th" x="14" y="47" text-anchor="middle">@</text>
    <line x1="18" y1="42" x2="54" y2="42" stroke="var(--route)" stroke-width="2.5" />
    <text class="ts" x="0" y="108">Warp is the goal: route ends on it.</text>
    <text class="ts" x="0" y="124">Directional exits still need the model's</text>
    <text class="ts" x="0" y="138">own press after arriving.</text>
   </g>
  </svg>
