<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Milliseconds per plan, log scale. Sorted array versus binary heap: Route 104 17 vs 0.29, Route 119 108 vs 1.4, Route 124 unreachable 371 vs 3.9." width="640" height="260">
   
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f3f5f1;--panel:#ffffff;--fg:#1c2420;--muted:#5d6a62;--line:#c9d2cb;
 --grass:#3f8f4f;--route:#1f6fb2;--warn:#c4502a;--soft:#e4ebe5;--water:#7fb6d9;
 --display:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}
svg{width:100%;height:auto;min-width:520px;display:block}
.t{fill:var(--fg);font:12px var(--body)}
.ts{fill:var(--muted);font:11px var(--body)}
.tm{fill:var(--fg);font:11px var(--mono)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="260" style="fill:#ffffff;stroke:none" /><g stroke="var(--line)"><line x1="150" y1="30" x2="150" y2="214" /><line x1="260" y1="30" x2="260" y2="214" /><line x1="370" y1="30" x2="370" y2="214" /><line x1="480" y1="30" x2="480" y2="214" /><line x1="590" y1="30" x2="590" y2="214" /></g>
   <g class="ts" text-anchor="middle"><text x="150" y="232">0.1 ms</text><text x="260" y="232">1</text><text x="370" y="232">10</text><text x="480" y="232">100</text><text x="590" y="232">1000</text></g>
   <text class="ts" x="370" y="252" text-anchor="middle">milliseconds per plan (log scale)</text>
   <g class="t" text-anchor="end"><text x="138" y="54">15×15 window</text><text x="138" y="104">Route 104</text><text x="138" y="154">Route 119</text><text x="138" y="204">Route 124*</text></g>
   
   <rect x="150" y="38" width="70.8" height="10" fill="var(--warn)" /><rect x="150" y="52" width="33.1" height="10" fill="var(--route)" />
   
   <rect x="150" y="88" width="245.5" height="10" fill="var(--warn)" /><rect x="150" y="102" width="50.9" height="10" fill="var(--route)" />
   
   <rect x="150" y="138" width="333.7" height="10" fill="var(--warn)" /><rect x="150" y="152" width="126.1" height="10" fill="var(--route)" />
   
   <rect x="150" y="188" width="392.5" height="10" fill="var(--warn)" /><rect x="150" y="202" width="175.0" height="10" fill="var(--route)" />
   <g class="tm"><text x="226" y="47">0.44</text><text x="189" y="61">0.20</text><text x="401" y="97">17</text><text x="207" y="111">0.29</text><text x="489" y="147">108</text><text x="282" y="161">1.4</text><text x="548" y="197">371</text><text x="331" y="211">3.9</text></g>
   <g transform="translate(150,10)"><rect width="10" height="10" fill="var(--warn)" /><text class="ts" x="16" y="9">sorted array (before)</text><rect x="150" width="10" height="10" fill="var(--route)" /><text class="ts" x="166" y="9">binary heap (after)</text></g>
  </svg>
