<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="Live backup map in RAM is read by read_full_map, which produces whole-map text for the model and a compact map_grid for the planner. map_grid uses 4 hex digits per tile." width="660" height="230">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f3f5f1;--panel:#ffffff;--fg:#1c2420;--muted:#5d6a62;--line:#c9d2cb;
 --grass:#3f8f4f;--route:#1f6fb2;--warn:#c4502a;--soft:#e4ebe5;--water:#7fb6d9;
 --display:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--panel:#1a221e;--fg:#e3ebe5;--muted:#9aa89f;--line:#33413a;--grass:#62b873;--route:#5aa8e8;--warn:#ef8059;--soft:#222d27;--water:#3c6f8f;color-scheme:dark}
svg{width:100%;height:auto;min-width:520px;display:block}
.ts{fill:var(--muted);font:11px var(--body)}
.tm{fill:var(--fg);font:11px var(--mono)}
.th{fill:var(--fg);font:600 13px var(--body)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" /></marker></defs>
   <g fill="var(--panel)" stroke="var(--line)" stroke-width="1.5">
    <rect x="16" y="80" width="120" height="56" rx="5" />
    <rect x="186" y="80" width="130" height="56" rx="5" stroke="var(--route)" stroke-width="2" />
    <rect x="376" y="20" width="130" height="56" rx="5" />
    <rect x="376" y="140" width="130" height="56" rx="5" />
    <rect x="546" y="20" width="100" height="56" rx="5" />
    <rect x="546" y="140" width="100" height="56" rx="5" />
   </g>
   <text class="th" x="76" y="104" text-anchor="middle">Backup map</text><text class="ts" x="76" y="121" text-anchor="middle">game RAM, live</text>
   <text class="th" x="251" y="104" text-anchor="middle">read_full_map</text><text class="ts" x="251" y="121" text-anchor="middle">one read per row</text>
   <text class="th" x="441" y="44" text-anchor="middle">Readout text</text><text class="ts" x="441" y="61" text-anchor="middle">1 char per tile</text>
   <text class="th" x="441" y="164" text-anchor="middle">map_grid</text><text class="ts" x="441" y="181" text-anchor="middle">4 hex digits per tile</text>
   <text class="th" x="596" y="44" text-anchor="middle">Model</text><text class="ts" x="596" y="61" text-anchor="middle">chooses goal</text>
   <text class="th" x="596" y="164" text-anchor="middle">Planner</text><text class="ts" x="596" y="181" text-anchor="middle">A* per press</text>
   <g stroke="var(--muted)" stroke-width="1.5" fill="none" style="color:var(--muted)" marker-end="url(#b)">
    <line x1="136" y1="108" x2="184" y2="108" />
    <path d="M316 100 L346 100 L346 48 L374 48" />
    <path d="M316 116 L346 116 L346 168 L374 168" />
    <line x1="506" y1="48" x2="544" y2="48" />
    <line x1="506" y1="168" x2="544" y2="168" />
   </g>
   <text class="tm" x="186" y="214">cell = collision&lt;&lt;12 | elevation&lt;&lt;8 | behavior   e.g. 1200 = wall, layer 2</text>
  </svg>
