<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Three folds feeding the open-battle line">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--box:#f4f1ea}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--box:#2a2925}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="400" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--fg)" /></marker></defs>
<rect x="10" y="20" width="260" height="96" rx="6" fill="var(--fill)" stroke="var(--line)" />
<text x="22" y="42">BattleOutcomes (state events)</text>
<text x="22" y="62" class="small">trainer battle, trainer 265 ROXANNE</text>
<text x="22" y="80" class="small">place RUSTBORO CITY GYM (map 11/3), turn 716</text>
<text x="22" y="98" class="small">outcome lost (battle.outcome, seq 30239+)</text>
<rect x="300" y="20" width="260" height="96" rx="6" fill="var(--fill)" stroke="var(--line)" />
<text x="312" y="42">Trainers (state events)</text>
<text x="312" y="62" class="small">trainer_opponent.battle_active:</text>
<text x="312" y="80" class="small">265 → name ROXANNE, map 11/3</text>
<rect x="590" y="20" width="260" height="96" rx="6" fill="var(--fill)" stroke="var(--line)" />
<text x="602" y="42">GymReadiness (shared fold)</text>
<text x="602" y="62" class="small">11/3 is a leader map (class 0x20)</text>
<text x="602" y="80" class="small">seen: GEODUDE Lv12 (foe battlers)</text>
<text x="602" y="98" class="small">said: field pages naming a "-type" (turn 630)</text>
<line x1="140" y1="116" x2="140" y2="160" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="10" y="160" width="260" height="70" rx="6" fill="var(--panel)" stroke="var(--accent)" />
<text x="22" y="182">open = each trainer's latest battle</text><text x="22" y="200">this run, if lost or drew</text><text x="22" y="218" class="small">ordered by when it ended</text>
<line x1="270" y1="195" x2="330" y2="250" stroke="var(--fg)" marker-end="url(#a)" />
<line x1="430" y1="116" x2="430" y2="250" stroke="var(--fg)" marker-end="url(#a)" />
<line x1="720" y1="116" x2="560" y2="250" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="160" y="250" width="540" height="70" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" />
<text x="172" y="272">"- ROXANNE (trainer 265): you lost to ROXANNE on … at turn 716, and the game</text>
<text x="172" y="290">has not recorded a win since." + seen line + "Said on that map: …"</text>
<text x="172" y="308" class="small">not a leader map: "ROXANNE sent out GEODUDE." style, from the battle's foe</text>
<text x="10" y="350" class="small">A later battle with that trainer that the game records as a win (the trainer's defeated flag set) replaces the loss as the latest, so the line goes away (tested).</text>
<text x="10" y="368" class="small">No open battle → no block. Wild battles never count. "drew" reads "you drew with".</text>
<text x="10" y="386" class="small">Non-leader example (test-modified, not recorded): "- IVAN (trainer 500): you lost to IVAN on … IVAN sent out GEODUDE."</text>
</svg>
