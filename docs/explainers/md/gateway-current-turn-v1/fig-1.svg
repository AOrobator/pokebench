<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-label="Off sends only screenshot and memory. On sends tool text, screenshot and memory together." width="720" height="245"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:620px;width:100%;height:auto}
text{font-family:system-ui,sans-serif;fill:#152b42}
rect{fill:#e9f2fa;stroke:#243e59}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="245" style="fill:#ffffff;stroke:none" /><rect x="20" y="20" width="680" height="45" rx="7" /><text x="40" y="49">Latest assistant reply → tool text → screenshot → memory</text><text x="25" y="105">OFF: last two messages</text><rect x="25" y="120" width="300" height="85" rx="7" /><text x="40" y="150">Screenshot + memory</text><text x="40" y="180">Tool text is missing</text><text x="380" y="105">ON: after latest assistant</text><rect x="380" y="120" width="315" height="85" rx="7" /><text x="395" y="150">Tool text + screenshot + memory</text><text x="395" y="180">One span for prompt and images</text><path d="M180 65 V85 M535 65 V85" stroke="#243e59" stroke-width="2" /></svg>
