<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Tool listing position before and after the switch" width="760" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;max-width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="350" height="210" rx="10" fill="#fff" stroke="#283038" stroke-width="2" /><text x="185" y="45" text-anchor="middle" font-size="15" font-weight="700">Off (before)</text>
<rect x="30" y="60" width="310" height="34" rx="6" fill="#ffe4e4" stroke="#c83030" /><text x="185" y="82" text-anchor="middle" font-size="12">Turn 1 message: full tool listing</text>
<rect x="30" y="104" width="310" height="34" rx="6" fill="#eef3fa" stroke="#345779" /><text x="185" y="126" text-anchor="middle" font-size="12">Turns 2…n: "tools unchanged: names"</text>
<rect x="30" y="148" width="310" height="34" rx="6" fill="#f8f8f8" stroke="#5a6b80" stroke-dasharray="5 4" /><text x="185" y="170" text-anchor="middle" font-size="12">Auto-compaction summarizes turn 1 away</text>
<text x="185" y="210" text-anchor="middle" font-size="12" fill="#c83030">Model sees names only</text>
<rect x="400" y="20" width="350" height="210" rx="10" fill="#fff" stroke="#283038" stroke-width="2" /><text x="575" y="45" text-anchor="middle" font-size="15" font-weight="700">On</text>
<rect x="420" y="60" width="310" height="54" rx="6" fill="#e3f4e3" stroke="#2f7d32" /><text x="575" y="82" text-anchor="middle" font-size="12">System prompt, every call:</text><text x="575" y="100" text-anchor="middle" font-size="12">harness prompt + contract + full tool listing</text>
<rect x="420" y="124" width="310" height="34" rx="6" fill="#eef3fa" stroke="#345779" /><text x="575" y="146" text-anchor="middle" font-size="12">Each turn: "Harness tools: names (schemas in system prompt)"</text>
<text x="575" y="190" text-anchor="middle" font-size="12">The system prompt is never compacted</text><text x="575" y="208" text-anchor="middle" font-size="12" fill="#2f7d32">Schemas survive every compaction</text>
</svg>
