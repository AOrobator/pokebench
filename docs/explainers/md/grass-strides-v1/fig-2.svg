<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" aria-label="Wiring from FeatureSet to the server check" width="640" height="120">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--floor:#e9e4d4;--grass:#7cc36a;--long:#3f8a3a;--route:#196778;--stop:#a34d26;--line:#c9d6e6}
svg{min-width:560px;width:100%;height:auto}
svg text{font:13px system-ui;fill:#283038}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="120" style="fill:#ffffff;stroke:none" /><g stroke="#283038" fill="#fff"><rect x="0" y="30" width="130" height="50" rx="6" /><rect x="160" y="30" width="140" height="50" rx="6" fill="#ffd447" /><rect x="330" y="30" width="140" height="50" rx="6" /><rect x="500" y="30" width="140" height="50" rx="6" fill="#ffd447" /></g>
<text x="10" y="52">FeatureSet</text><text x="10" y="70" style="font-size:11px">grass-strides-v1</text>
<text x="170" y="52">planStride</text><text x="170" y="70" style="font-size:11px">accepts 0x02</text>
<text x="340" y="52">POST /stride</text><text x="340" y="70" style="font-size:11px">tall_grass: true</text>
<text x="510" y="52">_safe_next</text><text x="510" y="70" style="font-size:11px">accepts 0x02 if asked</text>
<g stroke="#283038" stroke-width="2"><path d="M130 55h30M300 55h30M470 55h30" /></g>
<text x="0" y="110" style="font-size:12px">Yellow boxes change behavior. Without the field the server refuses grass exactly as before, and receipts omit the field.</text>
