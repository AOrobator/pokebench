<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Off and on: which notes are sent while a gym is open" width="720" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#283038;--muted:#5a6b80;--off:#c83030;--on:#2f8a4a;--line:#c9d6e6}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="22" font-weight="bold">A gym is open: its entry milestone was recorded this run and its badge was not</text>
<rect x="10" y="40" width="160" height="40" rx="6" fill="#eef3fa" stroke="#9fb2c8" /><text x="22" y="65">Gym ⇄ its town</text>
<rect x="10" y="95" width="160" height="40" rx="6" fill="#eef3fa" stroke="#9fb2c8" /><text x="22" y="120">Town ⇄ POKéMON CENTER</text>
<rect x="10" y="150" width="160" height="40" rx="6" fill="#eef3fa" stroke="#9fb2c8" /><text x="22" y="175">Town ⇄ a route</text>
<rect x="10" y="205" width="160" height="40" rx="6" fill="#eef3fa" stroke="#9fb2c8" /><text x="22" y="230">Stall note on gym map</text>
<text x="230" y="30" font-weight="bold" fill="#c83030">Off</text>
<text x="230" y="65">map-cycle note sent</text>
<text x="230" y="120">map-cycle note sent</text>
<text x="230" y="175">map-cycle note sent</text>
<text x="230" y="230">lists exits off the map</text>
<text x="470" y="30" font-weight="bold" fill="#2f8a4a">On</text>
<text x="470" y="65">held: would_warn, "Not sent (…)"</text>
<text x="470" y="120">held: would_warn, "Not sent (…)"</text>
<text x="470" y="175">map-cycle note sent (unchanged)</text>
<text x="470" y="230">no ways-off lines; note still sent</text>
</svg>
