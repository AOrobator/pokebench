<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Sources of each line">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--wall:#8f8a7f;--floor:#f4f1ea}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--wall:#55524b;--floor:#2a2925}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="10" width="290" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="22" y="37">state: location, party (every observation)</text>
<rect x="10" y="70" width="290" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="22" y="97">state in battle: trainer_opponent, battlers</text>
<rect x="10" y="130" width="290" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="22" y="157">dialogue pages printed on this map</text>
<rect x="10" y="190" width="290" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="22" y="217">heal-before-trainers facts (trainer flags)</text>
<rect x="400" y="10" width="450" height="224" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" />
<text x="414" y="37">Gym: map · GYM LEADER (class 0x20, fought here)</text>
<text x="414" y="67">Your party: species, level, HP</text>
<text x="414" y="97">Leader's POKéMON seen: per party slot, highest level</text>
<text x="414" y="157">Said on this map: pages naming an X-type, once each</text>
<text x="414" y="217">Trainers: beaten / battled, not beaten / not beaten</text>
<line x1="300" y1="32" x2="400" y2="62" stroke="var(--fg)" /><line x1="300" y1="92" x2="400" y2="34" stroke="var(--fg)" /><line x1="300" y1="92" x2="400" y2="94" stroke="var(--fg)" /><line x1="300" y1="152" x2="400" y2="154" stroke="var(--fg)" /><line x1="300" y1="212" x2="400" y2="214" stroke="var(--fg)" />
</svg>
