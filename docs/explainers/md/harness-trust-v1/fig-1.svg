<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="Three places the switch changes" width="720" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg{min-width:520px}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="210" style="fill:#ffffff;stroke:none" /><rect class="box" x="10" y="20" width="220" height="170" rx="10" /><text class="t" x="24" y="46">1. System prompt, last</text><text x="24" y="72">a numbered trust order:</text><text class="s" x="24" y="94">1 latest story line</text><text class="s" x="24" y="112">2 readout facts</text><text class="s" x="24" y="130">3 never memory</text><text class="s" x="24" y="160">appended after every other</text><text class="s" x="24" y="176">section, objectives included</text>
<rect class="game" x="250" y="20" width="220" height="170" rx="10" /><text class="t" x="264" y="46">2. Every result, first</text><text x="264" y="72">Read from game memory:</text><text class="s" x="264" y="94">Story goal line, resolved</text><text class="s" x="264" y="112">story characters on this map</text><text class="s" x="264" y="130">exits you can walk to</text><text class="s" x="264" y="160">observe, press, navigate_to</text><text class="s" x="264" y="176">(exits only with exit-reachability)</text>
<rect class="prior" x="490" y="20" width="220" height="170" rx="10" /><text class="t" x="504" y="46">3. Walk-away note</text><text x="504" y="72">SUPERVISOR under the header</text><text class="s" x="504" y="94">after two moves in a row</text><text class="s" x="504" y="112">farther from the goal's place</text><text class="s" x="504" y="130">recorded: story_goal_away</text><text class="s" x="504" y="160">Activity History, SUPERVISOR</text><text class="s" x="504" y="176">no timeline mark</text>
</svg>
