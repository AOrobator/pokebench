<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Walking north on Route 103 away from the south edge toward Oldale" width="720" height="260">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg{min-width:520px}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navf{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.ground{fill:var(--ground);stroke:var(--rule)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="260" style="fill:#ffffff;stroke:none" /><rect class="ground" x="20" y="20" width="300" height="220" /><text class="t" x="30" y="40">ROUTE103 (map 0/18), 80×22</text>
<line x1="20" y1="236" x2="320" y2="236" class="hot" /><text class="s" x="190" y="230">SOUTH edge → OLDALE TOWN</text>
<circle cx="120" cy="190" r="7" class="navf" /><text x="134" y="194">(9,13): 8 tiles</text>
<circle cx="120" cy="140" r="7" class="prior" /><text x="134" y="144">(9,10): 11 tiles · away 1</text>
<circle cx="120" cy="90" r="7" class="prior" /><text x="134" y="94">(9,7): 14 tiles · away 2 → note</text>
<path d="M120 182 L120 150 M120 132 L120 100" class="arr" />
<g transform="translate(360,30)"><text class="t" x="0" y="10">Map-table steps to the LAB</text>
<rect class="box" x="0" y="24" width="160" height="28" rx="6" /><text x="10" y="43">ROUTE103 · 4</text>
<rect class="box" x="0" y="62" width="160" height="28" rx="6" /><text x="10" y="81">OLDALE TOWN · 3</text>
<rect class="box" x="0" y="100" width="160" height="28" rx="6" /><text x="10" y="119">ROUTE101 · 2</text>
<rect class="box" x="0" y="138" width="160" height="28" rx="6" /><text x="10" y="157">LITTLEROOT TOWN · 1</text>
<rect class="game" x="0" y="176" width="160" height="28" rx="6" /><text x="10" y="195">PROF. BIRCH'S LAB · 0</text>
<text class="s" x="176" y="43">exit toward it:</text><text class="s" x="176" y="58">its SOUTH edge</text></g>
</svg>
