<g><rect x="190" y="20" width="120" height="34" rx="6" class="box" /><text x="200" y="42">RUSTBORO CITY</text></g>
<g><rect x="340" y="14" width="260" height="46" rx="6" class="game hot" /><text x="350" y="34" class="t">RUSTBORO CITY POKéMON CENTER 1F</text><text x="350" y="50" class="s">listed at (16,38) in result 14717 · 2 changes</text></g>
<path class="arr" d="M160 37 H190" /><path class="arr g" d="M310 37 H340" />
<g><rect x="190" y="90" width="410" height="34" rx="6" class="prior" /><text x="200" y="112" class="s">v1: your house in LITTLEROOT TOWN (MOM) · 8 map changes</text></g>
<path class="arr" d="M250 54 V90" />
