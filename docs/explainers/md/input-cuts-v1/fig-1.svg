<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="cutTitle cutDesc" width="720" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
@media (max-width:600px){svg{max-width:none;width:720px}}
svg text{font-family:var(--body);font-size:13px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .m{font-family:var(--mono);font-size:12px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="250" style="fill:#ffffff;stroke:none" /><title id="cutTitle">Four repeats and what replaces each</title>
<desc id="cutDesc">Off quotes this call, prints a missing citation, repeats the Story goal, and says the person has not spoken. On points at this result's dialogue list, records the miss without a Because line, keeps one Story goal, and says the person also spoke during this call.</desc>
<rect class="prior" x="16" y="36" width="330" height="196" rx="8" />
<rect class="game" x="374" y="36" width="330" height="196" rx="8" />
<text class="s" x="28" y="24">OFF</text>
<text class="s" x="386" y="24">ON</text>
<text class="m" x="28" y="64">MOM: "Go next door."</text>
<text class="m" x="28" y="92">Because: "…" is not in …</text>
<text class="m" x="28" y="120">Story goal: "… LAB."</text>
<text class="m" x="28" y="148">and the destinations block</text>
<text class="m" x="28" y="176">Has not spoken to you</text>
<text class="m" x="28" y="204">in this run.</text>
<text class="m" x="386" y="64">this result's dialogue list</text>
<text class="m" x="386" y="92">walk still runs; check recorded</text>
<text class="m" x="386" y="120">destinations block only</text>
<text class="m" x="386" y="148">Story goal line left out</text>
<text class="m" x="386" y="176">Also spoke to you during</text>
<text class="m" x="386" y="204">this call</text>
</svg>
