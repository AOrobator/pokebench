<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Ledger sections and their sources" width="700" height="260">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="260" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="200" height="60" rx="10" class="box" /><text x="24" y="44" class="t">Delivered states</text><text x="24" y="62" class="s">tool results the model saw</text>
 <rect x="10" y="110" width="200" height="60" rx="10" class="box" /><text x="24" y="134" class="t">Dialogue log capture</text><text x="24" y="152" class="s">same rules as dialogue-log-v1</text>
 <rect x="10" y="200" width="200" height="54" rx="10" class="prior" /><text x="24" y="224" class="t">note_contradiction</text><text x="24" y="242" class="s">written by the model</text>
 <rect x="300" y="14" width="390" height="240" rx="12" class="game hot" />
 <text x="316" y="40" class="t">INSTRUCTION LEDGER (whole entries, never clipped)</text>
 <text x="316" y="72">Received instructions: last 3 pages, newest first,</text>
 <text x="316" y="90" class="s">with turn, room and the faced character when named</text>
 <text x="316" y="128">Rooms visited: last 8, newest first,</text>
 <text x="316" y="146" class="s">first turn there and the last line heard there</text>
 <text x="316" y="184">Contradictions you recorded: newest 8,</text>
 <text x="316" y="202" class="s">expected · observed · evidence #seq</text>
 <text x="316" y="236" class="s">Header: quotes the game; not a walkthrough</text>
 <path d="M210 50 C250 50 260 135 298 135" class="arr" marker-end="url(#m)" />
 <path d="M210 140 C250 140 260 80 298 80" class="arr" marker-end="url(#m)" />
 <path d="M210 227 C250 227 260 192 298 192" class="arr" marker-end="url(#m)" />
 <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--soft)" /></marker></defs>
</svg>
