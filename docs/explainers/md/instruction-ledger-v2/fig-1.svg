<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Conversations in run 2fb4 from turn 241 to 316; the newest conversation with a person is pinned; signs never are" width="720" height="270">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg{min-width:520px}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="270" style="fill:#ffffff;stroke:none" /><text x="10" y="20" class="t">Run 2fb4, turns 241–316: field conversations the model was shown, oldest to newest</text>
<line x1="20" y1="120" x2="700" y2="120" class="arr" />
<g><rect x="20" y="60" width="120" height="44" rx="6" class="game" /><text x="30" y="78">T241 girl</text><text x="30" y="95" class="s">person</text></g>
<g><rect x="155" y="60" width="120" height="44" rx="6" class="game" /><text x="165" y="78">T245 MOM</text><text x="165" y="95" class="s">NAME: prefix</text></g>
<g><rect x="290" y="60" width="120" height="44" rx="6" class="box" /><text x="300" y="78">T250 sign</text><text x="300" y="95" class="s">never pinned</text></g>
<g><rect x="425" y="60" width="120" height="44" rx="6" class="game hot" /><text x="435" y="78" class="t">T255 woman</text><text x="435" y="95" class="s">pinned at T256</text></g>
<g><rect x="560" y="60" width="140" height="44" rx="6" class="game hot" /><text x="570" y="78" class="t">T316 man</text><text x="570" y="95" class="s">pinned at T320</text></g>
<text x="20" y="150" class="t">The pin is always the newest conversation with a person, named or not.</text>
<text x="20" y="172" class="s">At T256 that is the woman in PROF. BIRCH'S HOUSE 1F: "Oh, MAY went out to ROUTE 103 just a little while ago."</text>
<text x="20" y="190" class="s">At T320 it is the man in OLDALE TOWN ("Wait until I finish sketching them"): newer filler replaces it.</text>
<text x="20" y="230" class="s">The woman's line stays as that room's last line heard. The sign at T250 is a room line only,</text>
<text x="20" y="248" class="s">never the pinned conversation.</text>
</svg>
