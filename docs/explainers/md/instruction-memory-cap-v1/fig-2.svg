<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Five steps that decide each episode" width="640" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1e2c44;--muted:#5a6b82;--keep:#2f7d4f;--drop:#b0413e;--line:#9fb2c8;--cap:#d08a1c;--soft:#eef3fa}
svg{display:block;min-width:560px;max-width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="300" style="fill:#ffffff;stroke:none" /><g font-size="12">
<rect x="10" y="10" width="300" height="46" rx="8" fill="#ffffff" stroke="var(--keep)" /><text x="22" y="30" font-weight="700" fill="var(--keep)">1 Story anchor → added first</text><text x="22" y="47" fill="var(--ink)">source of the readout's story line, if not stale</text>
<rect x="10" y="66" width="300" height="46" rx="8" fill="#ffffff" stroke="var(--drop)" /><text x="22" y="86" font-weight="700" fill="var(--drop)">2 Proven done → left out</text><text x="22" y="103" fill="var(--ink)">pret templates, story checkpoints, receipts, trainer flags</text>
<rect x="10" y="122" width="300" height="46" rx="8" fill="#ffffff" stroke="var(--keep)" /><text x="22" y="142" font-weight="700" fill="var(--keep)">3 Nearby → added second</text><text x="22" y="159" fill="var(--ink)">current map, connected map, listed warp's map</text>
<rect x="10" y="178" width="300" height="46" rx="8" fill="#ffffff" stroke="var(--cap)" /><text x="22" y="198" font-weight="700" fill="var(--cap)">4 Named target → fills first</text><text x="22" y="215" fill="var(--ink)">unvisited place, unmet person, held key item</text>
<rect x="10" y="234" width="300" height="46" rx="8" fill="#ffffff" stroke="var(--cap)" /><text x="22" y="254" font-weight="700" fill="var(--cap)">5 Recency → fills the rest</text><text x="22" y="271" fill="var(--ink)">newest first, while the block fits 16,000 chars</text>
<g stroke="var(--muted)" fill="none"><path d="M160 56v10M160 112v10M160 168v10M160 224v10" /></g>
<text x="340" y="30" fill="var(--ink)">An episode stops at the first step that applies.</text>
<text x="340" y="56" fill="var(--ink)">A stale anchor (a Done line under it, or a quote naming a gym leader</text><text x="340" y="72" fill="var(--ink)">whose badge flag is set) goes on to step 2.</text>
<text x="340" y="104" fill="var(--ink)">Step 2 runs before step 3, so a beaten trainer</text><text x="340" y="120" fill="var(--ink)">next door no longer takes up room.</text>
<text x="340" y="152" fill="var(--ink)">Proven-done episodes are never kept, not even the anchor.</text>
<text x="340" y="184" fill="var(--ink)">Steps 1, 3, 4 and 5 are added in that order, newest first,</text><text x="340" y="200" fill="var(--ink)">each only if the whole block still fits:</text><text x="340" y="216" fill="var(--ink)">a hard 16,000-character cap.</text>
<text x="340" y="254" fill="var(--ink)">If anything is left out, one line says how many.</text>
</g></svg>
