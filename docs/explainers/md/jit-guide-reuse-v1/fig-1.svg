<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 145" role="img" aria-label="Reuse original guide instead of another copy" width="840" height="145"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f8f6ef;--fg:#213344;--line:#b6a785;--card:white}
@media(min-width:1000000px){:root{--bg:#17202c;--fg:#edf0e6;--line:#857d64;--card:#253142}}
svg{width:100%;height:auto;color:var(--fg)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="840" height="145" style="fill:#ffffff;stroke:none" /><g fill="currentColor" font-size="20"><text x="12" y="28">Overworld guide → Clock guide → Overworld again</text><text x="12" y="82">Reuse original matching Overworld guide at its old anchor</text><text x="12" y="132">No duplicate · no movement or deletion of earlier messages</text></g></svg>
