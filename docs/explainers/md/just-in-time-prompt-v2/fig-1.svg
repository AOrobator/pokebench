<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="Naming precedes clock in a new game. Unknown startup adds no guide. Naming and clock guides follow their observations and expire when those observations leave the window." width="900" height="390"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f1eee6;--paper:#fffef8;--ink:#252a29;--red:#a52d32;--green:#31775b;--line:#c9cbbd}
*{box-sizing:border-box}
svg{display:block;min-width:620px;width:100%;height:auto}
svg text{fill:var(--ink);font:16px system-ui}
svg rect{fill:var(--bg);stroke:var(--line)}
svg .stable{fill:var(--green)}
svg .white{fill:white}
@media(min-width:1000000px){:root{--bg:#1b2421;--paper:#25302a;--ink:#edf0e7;--red:#ff9b98;--green:#82cfa1;--line:#526056}}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="390" style="fill:#ffffff;stroke:none" /><text x="10" y="25">1 · Unknown startup: no extra guide</text><rect class="stable" x="10" y="42" width="190" height="52" /><text class="white" x="22" y="74">Fixed core + full tools</text><rect x="220" y="42" width="300" height="52" /><text x="234" y="74">Task + current observation</text><text x="10" y="125">2 · Naming first; clock comes later</text><rect class="stable" x="10" y="145" width="130" height="90" /><text class="white" x="22" y="177">Fixed core</text><text class="white" x="22" y="202">Full tools</text><rect x="155" y="145" width="210" height="90" /><text x="168" y="177">Naming observation</text><text x="168" y="202">→ naming guide</text><rect x="380" y="145" width="240" height="90" /><text x="394" y="177">Intro, truck, home</text><text x="394" y="202">Earlier decisions retained</text><rect x="635" y="145" width="250" height="90" /><text x="648" y="177">Clock observation</text><text x="648" y="202">→ clock guide</text><text x="10" y="275">3 · After those observations leave the sliding window</text><rect class="stable" x="10" y="295" width="190" height="65" /><text class="white" x="22" y="333">Fixed core + full tools</text><rect x="220" y="295" width="420" height="65" /><text x="234" y="322">Task + retained recent history</text><text x="234" y="345">Current guide re-added if still needed</text></svg>
