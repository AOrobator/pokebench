<pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="var(--grass1)" /><path d="M2,10 l1.5,-5 l1.5,5 M7,7 l1.5,-5 l1.5,5" stroke="var(--grass2)" stroke-width="1.4" fill="none" /></pattern>
<pattern id="wall" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="var(--wall1)" /><path d="M0,5 h14 M7,0 v5 M0,5 v5" stroke="var(--wall2)" stroke-width="1.2" /></pattern>
