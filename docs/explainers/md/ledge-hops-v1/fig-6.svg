<svg xmlns="http://www.w3.org/2000/svg" class="mini" viewBox="0 0 150 150" role="img" aria-label="West ledge" width="150" height="150"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor1:#efe9d8;--floor2:#e6dfca;--wall1:#7d776d;--wall2:#6a645b;--grass1:#9fd07c;--grass2:#7fb85d;--ledge1:#f2c46b;--ledge2:#c98c2e;--ledgeEdge:#a8661c;
--sky1:#dbeefe;--sky2:#f3f8ee;--grassD:#8cc56a;--grassL:#b6e08f;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#38352c;--floor2:#2f2c25;--wall1:#5b5750;--wall2:#4a4640;--grass1:#4f7a3a;--grass2:#3e6530;--ledge1:#b8862f;--ledge2:#8a5f1c;--ledgeEdge:#d48a35;
--sky1:#1b2a3a;--sky2:#1a221b;--grassD:#36592a;--grassL:#4f7a3a;--shadow:rgba(0,0,0,.35)}}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.chev{fill:none;stroke:#5a3a0c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hop{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.player{fill:var(--accent);stroke:#fff;stroke-width:3}
.player.ghosty{opacity:.35}
.x{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="150" height="150" style="fill:#ffffff;stroke:none" /><defs><marker id="ahop" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" /></marker>
<pattern id="floor" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--floor1)" /><circle cx="2" cy="2" r="1" fill="var(--floor2)" /><circle cx="7" cy="7" r="1" fill="var(--floor2)" /></pattern>
<linearGradient id="ledge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ledge1)" /><stop offset=".62" stop-color="var(--ledge1)" /><stop offset=".63" stop-color="var(--ledge2)" /><stop offset="1" stop-color="var(--ledgeEdge)" /></linearGradient>
</defs><rect x="31" y="31" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="61" y="31" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="91" y="31" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="31" y="61" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="61" y="61" width="28" height="28" rx="4" fill="url(#ledge)" /><rect x="91" y="61" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="31" y="91" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="61" y="91" width="28" height="28" rx="4" fill="url(#floor)" /><rect x="91" y="91" width="28" height="28" rx="4" fill="url(#floor)" /><g transform="rotate(90 75 75)"><path d="M67,71 L75,80 L83,71" class="chev" /><circle cx="75" cy="105" r="9" class="player ghosty" /><circle cx="75" cy="45" r="9" class="player" /><path d="M80,48 C122,56 122,94 82,101" class="hop" marker-end="url(#ahop)" /><path d="M55,70 l10,10 M65,70 l-10,10" class="x" /><path d="M70,85 l10,10 M80,85 l-10,10" class="x" /></g></svg>
