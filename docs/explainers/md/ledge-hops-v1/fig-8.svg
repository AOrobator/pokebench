<svg xmlns="http://www.w3.org/2000/svg" class="wire" viewBox="0 0 780 250" role="img" aria-label="Where the switch goes" width="780" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor1:#efe9d8;--floor2:#e6dfca;--wall1:#7d776d;--wall2:#6a645b;--grass1:#9fd07c;--grass2:#7fb85d;--ledge1:#f2c46b;--ledge2:#c98c2e;--ledgeEdge:#a8661c;
--sky1:#dbeefe;--sky2:#f3f8ee;--grassD:#8cc56a;--grassL:#b6e08f;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#38352c;--floor2:#2f2c25;--wall1:#5b5750;--wall2:#4a4640;--grass1:#4f7a3a;--grass2:#3e6530;--ledge1:#b8862f;--ledge2:#8a5f1c;--ledgeEdge:#d48a35;
--sky1:#1b2a3a;--sky2:#1a221b;--grassD:#36592a;--grassL:#4f7a3a;--shadow:rgba(0,0,0,.35)}}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.lane rect{fill:color-mix(in srgb,var(--accent) 6%,transparent);stroke:var(--line);stroke-width:1.5}
.lanet{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;fill:var(--muted)}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--ledge1) 30%,var(--card));stroke:var(--ledge2);stroke-width:2}
.nt{font:600 13.5px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:12px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="780" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="aflow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker>
</defs><g class="lane"><rect x="200" y="14" width="570" height="96" rx="14" /><text x="216" y="36" class="lanet">GAME SERVER · Python</text></g>
<g class="lane"><rect x="200" y="138" width="570" height="96" rx="14" /><text x="216" y="160" class="lanet">AGENT · TypeScript</text></g>
<g class="node"><rect x="10" y="96" width="160" height="58" rx="29" /><text x="90" y="121" class="nt">ledge-hops-v1</text><text x="90" y="139" class="ns">preset · switchboard</text></g>
<g class="node"><rect x="230" y="48" width="220" height="50" rx="12" /><text x="340" y="70" class="nt">POKEBENCH_FEATURES_OFF</text><text x="340" y="87" class="ns">serverFeatureEnv</text></g>
<g class="node hot"><rect x="520" y="48" width="232" height="50" rx="12" /><text x="636" y="70" class="nt">LocalMap.text(ledges)</text><text x="636" y="87" class="ns">v ^ &lt; &gt; + legend, or #</text></g>
<g class="node"><rect x="230" y="172" width="220" height="50" rx="12" /><text x="340" y="194" class="nt">withNavigation</text><text x="340" y="211" class="ns">prompt line · tool text</text></g>
<g class="node hot"><rect x="520" y="172" width="232" height="50" rx="12" /><text x="636" y="194" class="nt">planNavigation</text><text x="636" y="211" class="ns">hop edge · cost 2 · expect 2 tiles</text></g>
<path d="M170,116 C200,116 200,73 226,73" class="flow" marker-end="url(#aflow)" />
<path d="M170,134 C200,134 200,197 226,197" class="flow" marker-end="url(#aflow)" />
<path d="M450,73 L516,73" class="flow" marker-end="url(#aflow)" />
<path d="M450,197 L516,197" class="flow" marker-end="url(#aflow)" />
</svg>
