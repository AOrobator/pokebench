   <path class="arrow" d="M182 57 H198" marker-end="url(#a)" />
   <rect class="game" x="198" y="30" width="110" height="54" rx="6" /><text class="t" x="208" y="52">6 · page 1</text><text class="s" x="208" y="70">waits: any button</text>
   <path class="arrow" d="M308 57 H324" marker-end="url(#a)" /><text class="s" x="300" y="24">B</text>
   <rect class="box" x="324" y="30" width="78" height="54" rx="6" /><text class="t" x="334" y="52">7</text><text class="s" x="334" y="70">draw page 2</text>
   <path class="arrow" d="M402 57 H418" marker-end="url(#a)" />
   <rect class="game" x="418" y="30" width="110" height="54" rx="6" /><text class="t" x="428" y="52">8 · page 2</text><text class="s" x="428" y="70">waits: any button</text>
   <path class="arrow" d="M528 57 H544" marker-end="url(#a)" /><text class="s" x="520" y="24">B</text>
   <rect class="box" x="544" y="30" width="78" height="54" rx="6" /><text class="t" x="554" y="52">9–10</text><text class="s" x="554" y="70">close</text>
   <path class="arrow" d="M622 57 H638" marker-end="url(#a)" />
   <rect class="box" x="638" y="30" width="72" height="54" rx="6" /><text class="t" x="646" y="52">next</text><text class="s" x="646" y="70">learn move…</text>
   <text class="s" x="10" y="112">gBattleScripting.drawlvlupboxState (0x02024492). Recorded: 6 from raw RAM 5088 to 5102 (T357–T359), 8 from 5103 to 5124 (T359–T362), 10 at 5125.</text>
   <text class="s" x="10" y="132">Green states are the two waits the readout names and auto-advance presses. Both test gMain.newKeys != 0.</text>
   <text class="s" x="10" y="152">* The banner slides in only when the Pokémon that leveled up is not the one in battle (Exp. Share).</text>
  </svg>
