<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" role="img" aria-label="Pages listed and B presses" height="200">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arrow{stroke:var(--soft);fill:none;stroke-width:1.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--soft)" /></marker></defs>
   <text class="t" x="10" y="20">ON (replay of raw RAM 5076–5130)</text>
   <rect class="box" x="10" y="30" width="128" height="40" rx="6" /><text class="s" x="18" y="54">1 fainted! · B</text>
   <rect class="box" x="146" y="30" width="128" height="40" rx="6" /><text class="s" x="154" y="54">2 27 EXP. · B</text>
   <rect class="box" x="282" y="30" width="128" height="40" rx="6" /><text class="s" x="290" y="54">3 LV. 6! · B</text>
   <rect class="game" x="418" y="30" width="110" height="40" rx="6" /><text class="s" x="426" y="54">4 box page 1 · B</text>
   <rect class="game" x="536" y="30" width="110" height="40" rx="6" /><text class="s" x="544" y="54">5 box page 2 · B</text>
   <path class="arrow" d="M646 50 H690" marker-end="url(#c)" /><text class="s" x="650" y="86">field free</text>
   <text class="t" x="10" y="120">OFF (what the run did)</text>
   <rect class="box" x="10" y="130" width="128" height="40" rx="6" /><text class="s" x="18" y="154">1 fainted! · B</text>
   <rect class="box" x="146" y="130" width="128" height="40" rx="6" /><text class="s" x="154" y="154">2 27 EXP. · B</text>
   <rect class="box" x="282" y="130" width="128" height="40" rx="6" /><text class="s" x="290" y="154">3 LV. 6! · B</text>
   <rect class="prior" x="418" y="130" width="228" height="40" rx="6" /><text class="s" x="426" y="154">3 × 600-frame waits → battle_busy</text>
   <text class="s" x="10" y="192">Each box page is listed before its B press, e.g. "Level-up stats box, page 1 of 2 (stat increases): MAX. HP +2, …".</text>
  </svg>
