<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" role="img" aria-label="Conditions read from the tool result's state" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.nav{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="680" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="14" width="210" height="34" rx="5" class="box" /><text x="20" y="36">Free field: no battle, unlocked</text>
<rect x="10" y="56" width="210" height="34" rx="5" class="box" /><text x="20" y="78">Player's party (not tutorial)</text>
<rect x="10" y="98" width="210" height="34" rx="5" class="box" /><text x="20" y="120">Lead below half HP (3/21)</text>
<rect x="10" y="140" width="210" height="34" rx="5" class="box" /><text x="20" y="162">Map ROUTE 103, rival battle not won</text>
<rect x="10" y="182" width="210" height="34" rx="5" class="box" /><text x="20" y="204">RIVAL_MAY_* / RIVAL_BRENDAN_* loaded</text>
<path class="arr" d="M220 31 C260 31 260 110 290 112" /><path class="arr" d="M220 73 C255 73 255 112 290 114" /><path class="arr" d="M220 115 L290 115" /><path class="arr" d="M220 157 C255 157 255 118 290 116" /><path class="arr" d="M220 199 C260 199 260 120 290 118" />
<rect x="292" y="92" width="120" height="46" rx="5" class="nav" /><text x="304" y="112" class="t">all true</text><text x="304" y="128" class="s">and armed</text>
<path class="arr g" d="M412 115 L452 115" />
<rect x="454" y="70" width="210" height="34" rx="5" class="game hot" /><text x="464" y="92">Paragraph appended to the result</text>
<rect x="454" y="126" width="210" height="34" rx="5" class="game" /><text x="464" y="148">low_hp_trainer_warning event</text>
<text x="10" y="238" class="s">Every input is the state the tool result already carries: no timers, no sleeps, no polling.</text>
</svg>
