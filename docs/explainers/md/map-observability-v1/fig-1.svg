<svg xmlns="http://www.w3.org/2000/svg" class="mechanism" viewBox="0 0 920 315" role="img" aria-labelledby="flow-title flow-desc" width="920" height="315">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
.mechanism{display:block;min-width:790px;width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="920" height="315" style="fill:#ffffff;stroke:none" /><title id="flow-title">A captured game state becomes one map observation</title>
<desc id="flow-desc">Live tiles, map-qualified puzzle tiles and current gate edges feed the same schema. A central renderer supplies tokens and labels to the map and accompanying descriptions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#365f86" /></marker></defs>
<g fill="#e8eef6" stroke="#365f86" stroke-width="2">
<rect x="10" y="20" width="250" height="68" rx="9" />
<rect x="10" y="120" width="250" height="68" rx="9" />
<rect x="10" y="220" width="250" height="68" rx="9" />
<rect x="350" y="92" width="235" height="125" rx="9" fill="#fff8dd" />
<rect x="675" y="92" width="235" height="125" rx="9" />
</g>
<g stroke="#365f86" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M260 54 H305 V128 H348" /><path d="M260 154 H348" /><path d="M260 254 H305 V180 H348" /><path d="M585 154 H673" />
</g>
<g fill="#183752" font-family="system-ui,sans-serif" text-anchor="middle">
<text x="135" y="48" font-size="17">Current live tiles</text><text x="135" y="72" font-size="13">behavior · collision · elevation</text>
<text x="135" y="148" font-size="17">Qualified puzzle graphics</text><text x="135" y="172" font-size="13">map · metatile · current state</text>
<text x="135" y="248" font-size="17">Current rotating gates</text><text x="135" y="272" font-size="13">orientation · visible edge geometry</text>
<text x="468" y="125" font-size="17">Map observation v1</text><text x="468" y="152" font-size="13">one canonical JSON schema</text><text x="468" y="177" font-size="13">Python + TypeScript generated</text><text x="468" y="201" font-size="13">current facts · unavailable facts</text>
<text x="793" y="125" font-size="17">One renderer</text><text x="793" y="152" font-size="13">tokens · labels · coordinates</text><text x="793" y="177" font-size="13">overlapping layers · gate edges</text><text x="793" y="201" font-size="13">same meaning in accompanying text</text>
</g></svg>
