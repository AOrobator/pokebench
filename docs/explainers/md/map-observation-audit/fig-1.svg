*{box-sizing:border-box}
svg{display:block;max-width:none}
.b-bad rect{fill:var(--bad)}
.b-bad text{font:600 11.5px var(--body);fill:#fff;text-anchor:middle}
.card{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
.card-hot{fill:var(--panel);stroke:var(--bad);stroke-width:2.5}
.c-t{font:700 14px var(--body);fill:var(--fg)}
.c-s{font:11.5px var(--mono);fill:var(--soft)}
.ic{fill:none;stroke:var(--accent);stroke-width:2}
.ic-f{fill:var(--accent)}
.ic-hot{fill:rgba(224,72,62,.15);stroke:var(--bad);stroke-width:2}
.pipe{fill:none;stroke:var(--soft);stroke-width:2}
.pipe-raw{stroke-dasharray:6 5}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
