<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="stairs elevation">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f5ef; --fg:#1f2522; --soft:#5f6b64; --rule:#e2ded2; --panel:#fffdf8; --chip:#efece3;
 --good:#2f9e5b; --bad:#e0483e; --warn:#e3a12f; --accent:#5b6cf0;
 --ground:#efe0bd; --ground2:#e2cf9f; --floor:#f2e6cf; --wall:#7c8794; --wall2:#5f6a77; --wall-hi:#a9b3be;
 --grass:#7cc36a; --blade:#3f8a3a; --water:#6fb1e6; --wave:#e8f5ff; --sand:#f4d98f; --grain:#c9a54c;
 --counter:#c08a52; --counter2:#9a6a3a; --bridge:#c9a06a; --plank:#8f6a3c;
 --term:#14181d; --term-fg:#cfd8d3; --term-dim:#5f6d68;
 --sky1:#dff0ff; --sky2:#f6fbff; --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#121614; --fg:#e7ece8; --soft:#9aa69f; --rule:#29312d; --panel:#1a201d; --chip:#232b27;
 --ground:#5b5139; --ground2:#71654a; --floor:#4e4636; --wall:#465059; --wall2:#343c44; --wall-hi:#66727e;
 --grass:#3f7d3a; --blade:#9ed98f; --water:#2f6a9a; --wave:#9cc9ef; --sand:#8a7536; --grain:#c7ad5f;
 --counter:#86603a; --counter2:#634526; --bridge:#7d6440; --plank:#b38a55;
 --term:#0b0e11; --sky1:#1c2a38; --sky2:#151d26; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614; --fg:#e7ece8; --soft:#9aa69f; --rule:#29312d; --panel:#1a201d; --chip:#232b27;
 --ground:#5b5139; --ground2:#71654a; --floor:#4e4636; --wall:#465059; --wall2:#343c44; --wall-hi:#66727e;
 --grass:#3f7d3a; --blade:#9ed98f; --water:#2f6a9a; --wave:#9cc9ef; --sand:#8a7536; --grain:#c7ad5f;
 --counter:#86603a; --counter2:#634526; --bridge:#7d6440; --plank:#b38a55;
 --term:#0b0e11; --sky1:#1c2a38; --sky2:#151d26; color-scheme:dark}
*{box-sizing:border-box}
svg{display:block;max-width:none}
.x-bg{fill:var(--bad)}
.x-ink{stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.b-bad rect{fill:var(--bad)}
.b-ok rect{fill:var(--good)}
.b-bad text,.b-ok text{font:600 11.5px var(--body);fill:#fff;text-anchor:middle}
.xs-ground{fill:var(--grass)}
.xs-lab{font:600 12.5px var(--body);fill:var(--fg)}
.xs-small{font:11px var(--mono);fill:var(--soft)}
.xs-try{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:6 5}
.xs-ok{fill:none;stroke:var(--good);stroke-width:2.5}
.xs-bg{fill:var(--chip)}
.xs-stair{fill:var(--ground2)}
.xs-step{stroke:var(--plank);stroke-width:1.5}
.xs-plateau{fill:var(--wall-hi)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="560" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="head-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0483e" /></marker>
<marker id="head-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b" /></marker>
</defs><rect width="560" height="230" rx="14" class="xs-bg" />
 <rect x="30" y="150" width="90" height="40" class="xs-ground" /><rect x="120" y="128" width="40" height="62" class="xs-stair" /><path d="M120 166 h40" class="xs-step" /><path d="M120 158 h40" class="xs-step" /><path d="M120 150 h40" class="xs-step" /><rect x="160" y="106" width="90" height="84" class="xs-plateau" /><text x="75" y="208" class="xs-small" text-anchor="middle">e3</text><text x="140" y="208" class="xs-small" text-anchor="middle">e0 stairs</text><text x="205" y="208" class="xs-small" text-anchor="middle">e4</text><text x="140" y="34" class="xs-lab" text-anchor="middle">pokeemerald</text><path d="M70 138 Q115 92 140 116" class="xs-ok" marker-end="url(#head-ok)" /><path d="M145 112 Q175 70 202 96" class="xs-ok" marker-end="url(#head-ok)" /><g class="b-ok"><rect x="50" y="51" width="152.8" height="22" rx="11" /><text x="126.4" y="66">elevation becomes 0</text></g><rect x="310" y="150" width="90" height="40" class="xs-ground" /><rect x="400" y="128" width="40" height="62" class="xs-stair" /><path d="M400 166 h40" class="xs-step" /><path d="M400 158 h40" class="xs-step" /><path d="M400 150 h40" class="xs-step" /><rect x="440" y="106" width="90" height="84" class="xs-plateau" /><text x="355" y="208" class="xs-small" text-anchor="middle">e3</text><text x="420" y="208" class="xs-small" text-anchor="middle">e0 stairs</text><text x="485" y="208" class="xs-small" text-anchor="middle">e4</text><text x="420" y="34" class="xs-lab" text-anchor="middle">navigate_to today</text><path d="M350 138 Q395 92 420 116" class="xs-ok" marker-end="url(#head-ok)" /><path d="M425 112 Q455 70 482 96" class="xs-try" marker-end="url(#head-bad)" /><g transform="translate(456,78)"><circle r="8" class="x-bg" /><path d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" class="x-ink" /></g><g class="b-bad"><rect x="320" y="51" width="160.0" height="22" rx="11" /><text x="400.0" y="66">still thinks it is 3</text></g>
</svg>
