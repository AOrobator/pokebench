<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="860" height="510" role="img" aria-label="tile classes collapsing to glyphs"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f5ef; --fg:#1f2522; --soft:#5f6b64; --rule:#e2ded2; --panel:#fffdf8; --chip:#efece3;
 --good:#2f9e5b; --bad:#e0483e; --warn:#e3a12f; --accent:#5b6cf0;
 --ground:#efe0bd; --ground2:#e2cf9f; --floor:#f2e6cf; --wall:#7c8794; --wall2:#5f6a77; --wall-hi:#a9b3be;
 --grass:#7cc36a; --blade:#3f8a3a; --water:#6fb1e6; --wave:#e8f5ff; --sand:#f4d98f; --grain:#c9a54c;
 --counter:#c08a52; --counter2:#9a6a3a; --bridge:#c9a06a; --plank:#8f6a3c;
 --term:#14181d; --term-fg:#cfd8d3; --term-dim:#5f6d68;
 --sky1:#dff0ff; --sky2:#f6fbff; --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#121614; --fg:#e7ece8; --soft:#9aa69f; --rule:#29312d; --panel:#1a201d; --chip:#232b27;
 --ground:#5b5139; --ground2:#71654a; --floor:#4e4636; --wall:#465059; --wall2:#343c44; --wall-hi:#66727e;
 --grass:#3f7d3a; --blade:#9ed98f; --water:#2f6a9a; --wave:#9cc9ef; --sand:#8a7536; --grain:#c7ad5f;
 --counter:#86603a; --counter2:#634526; --bridge:#7d6440; --plank:#b38a55;
 --term:#0b0e11; --sky1:#1c2a38; --sky2:#151d26; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614; --fg:#e7ece8; --soft:#9aa69f; --rule:#29312d; --panel:#1a201d; --chip:#232b27;
 --ground:#5b5139; --ground2:#71654a; --floor:#4e4636; --wall:#465059; --wall2:#343c44; --wall-hi:#66727e;
 --grass:#3f7d3a; --blade:#9ed98f; --water:#2f6a9a; --wave:#9cc9ef; --sand:#8a7536; --grain:#c7ad5f;
 --counter:#86603a; --counter2:#634526; --bridge:#7d6440; --plank:#b38a55;
 --term:#0b0e11; --sky1:#1c2a38; --sky2:#151d26; color-scheme:dark}
*{box-sizing:border-box}
svg{display:block;max-width:none}
.flow{fill:none;stroke-width:2.4}
.fam{stroke-width:1.2}
.fam-ok{fill:var(--chip);stroke:var(--rule)}
.fam-bad{fill:rgba(224,72,62,.10);stroke:rgba(224,72,62,.45)}
.fam-fixed{fill:rgba(91,108,240,.10);stroke:rgba(91,108,240,.45)}
.fam-warn{fill:rgba(227,161,47,.12);stroke:rgba(227,161,47,.5)}
.fam-t{font:13px var(--body);fill:var(--fg)}
.h-lab{font:700 11px var(--body);fill:var(--soft);text-anchor:middle;letter-spacing:.06em;text-transform:uppercase}
.gbox{fill:var(--term)}
.gbig{font:700 24px var(--mono);fill:#e8efe9;text-anchor:middle}
.glab{font:13px var(--body);fill:var(--soft)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="510" style="fill:#ffffff;stroke:none" /><text x="140" y="22" class="h-lab">What pokeemerald distinguishes</text><text x="720" y="22" class="h-lab">What the model is told</text><path d="M282 52 C 470 52, 470 372.5, 640 372.5" class="flow" stroke="var(--good)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="40" width="272" height="24" rx="12" class="fam fam-ok" /><circle cx="26" cy="52" r="5" fill="var(--good)" /><text x="40" y="56.5" class="fam-t">Plain ground</text><path d="M282 82 C 470 82, 470 177.5, 640 177.5" class="flow" stroke="var(--good)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="70" width="272" height="24" rx="12" class="fam fam-ok" /><circle cx="26" cy="82" r="5" fill="var(--good)" /><text x="40" y="86.5" class="fam-t">Tall / long grass</text><path d="M282 112 C 470 112, 470 275.0, 640 275.0" class="flow" stroke="var(--good)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="100" width="272" height="24" rx="12" class="fam fam-ok" /><circle cx="26" cy="112" r="5" fill="var(--good)" /><text x="40" y="116.5" class="fam-t">Pond, deep, ocean water</text><path d="M282 142 C 470 142, 470 80.0, 640 80.0" class="flow" stroke="var(--good)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="130" width="272" height="24" rx="12" class="fam fam-ok" /><circle cx="26" cy="142" r="5" fill="var(--good)" /><text x="40" y="146.5" class="fam-t">Solid wall</text><path d="M282 172 C 470 172, 470 80.0, 640 80.0" class="flow" stroke="var(--accent)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="160" width="272" height="24" rx="12" class="fam fam-fixed" /><circle cx="26" cy="172" r="5" fill="var(--accent)" /><text x="40" y="176.5" class="fam-t">Ledge → v ^ &lt; &gt; (ledge-hops-v1)</text><path d="M282 202 C 470 202, 470 80.0, 640 80.0" class="flow" stroke="var(--accent)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="190" width="272" height="24" rx="12" class="fam fam-fixed" /><circle cx="26" cy="202" r="5" fill="var(--accent)" /><text x="40" y="206.5" class="fam-t">Counter → = (counter-talk-v1)</text><path d="M282 232 C 470 232, 470 275.0, 640 275.0" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="220" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="232" r="5" fill="var(--bad)" /><text x="40" y="236.5" class="fam-t">Waterfall (needs HM)</text><path d="M282 262 C 470 262, 470 372.5, 640 372.5" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="250" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="262" r="5" fill="var(--bad)" /><text x="40" y="266.5" class="fam-t">Currents, seaweed</text><path d="M282 292 C 470 292, 470 372.5, 640 372.5" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="280" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="292" r="5" fill="var(--bad)" /><text x="40" y="296.5" class="fam-t">Different elevation</text><path d="M282 322 C 470 322, 470 372.5, 640 372.5" class="flow" stroke="var(--accent)" stroke-opacity="0.55" stroke-dasharray="4 4" /><rect x="10" y="310" width="272" height="24" rx="12" class="fam fam-fixed" /><circle cx="26" cy="322" r="5" fill="var(--accent)" /><text x="40" y="326.5" class="fam-t">One-way wall → + (one-way-tiles-v1)</text><path d="M282 352 C 470 352, 470 372.5, 640 372.5" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="340" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="352" r="5" fill="var(--bad)" /><text x="40" y="356.5" class="fam-t">Ice, slides, holes</text><path d="M282 382 C 470 382, 470 372.5, 640 372.5" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="370" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="382" r="5" fill="var(--bad)" /><text x="40" y="386.5" class="fam-t">Bike-only slopes, rails</text><path d="M282 412 C 470 412, 470 372.5, 640 372.5" class="flow" stroke="var(--warn)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="400" width="272" height="24" rx="12" class="fam fam-warn" /><circle cx="26" cy="412" r="5" fill="var(--warn)" /><text x="40" y="416.5" class="fam-t">Cave / sand encounter floor</text><path d="M282 442 C 470 442, 470 372.5, 640 372.5" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="430" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="442" r="5" fill="var(--bad)" /><text x="40" y="446.5" class="fam-t">Invisible object</text><path d="M282 472 C 470 472, 470 470.0, 640 470.0" class="flow" stroke="var(--bad)" stroke-opacity="0.9" stroke-dasharray="none" /><rect x="10" y="460" width="272" height="24" rx="12" class="fam fam-bad" /><circle cx="26" cy="472" r="5" fill="var(--bad)" /><text x="40" y="476.5" class="fam-t">Map exit vs map border</text><rect x="640" y="58.0" width="56" height="44" rx="10" class="gbox" /><text x="668" y="88.0" class="gbig">#</text><text x="708" y="85.0" class="glab">collision</text><rect x="640" y="155.5" width="56" height="44" rx="10" class="gbox" /><text x="668" y="185.5" class="gbig">g</text><text x="708" y="182.5" class="glab">grass</text><rect x="640" y="253.0" width="56" height="44" rx="10" class="gbox" /><text x="668" y="283.0" class="gbig">~</text><text x="708" y="280.0" class="glab">water</text><rect x="640" y="350.5" width="56" height="44" rx="10" class="gbox" /><text x="668" y="380.5" class="gbig">.</text><text x="708" y="377.5" class="glab">clear terrain</text><rect x="640" y="448.0" width="56" height="44" rx="10" class="gbox" /><text x="668" y="478.0" class="gbig">?</text><text x="708" y="475.0" class="glab">outside map</text></svg>
