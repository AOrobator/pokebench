<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Wiring from the run's features to read_world_context" width="900" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--win:#dbe9f5;--trig:#f6d7a8;--route:#2d5f8a;--grid:#b9c8bf}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker></defs>
<rect class="box" x="10" y="50" width="205" height="100" rx="8" />
<text x="22" y="76">Run features</text>
<text x="22" y="98" class="small">POKEBENCH_FEATURES_OFF</text>
<text x="22" y="116" class="small">(server env)</text>
<path class="arrow" d="M215 100 H240" marker-end="url(#a)" />
<rect class="box" x="245" y="50" width="250" height="100" rx="8" />
<text x="257" y="76">rerender.read_state</text>
<text x="257" y="98" class="small">on unless this switch or</text>
<text x="257" y="116" class="small">coordinate-script-conditions-v1</text>
<text x="257" y="134" class="small">is off</text>
<path class="arrow" d="M495 100 H520" marker-end="url(#a)" />
<rect class="box" x="525" y="50" width="155" height="100" rx="8" />
<text x="537" y="76">read_game_state</text>
<text x="537" y="98" class="small">map_wide_triggers_</text>
<text x="537" y="116" class="small">enabled</text>
<path class="arrow" d="M680 100 H700" marker-end="url(#a)" />
<rect class="onbox" x="705" y="50" width="185" height="100" rx="8" />
<text x="717" y="76">read_world_context</text>
<text x="717" y="98" class="small">skips the 7-tile filter</text>
<text x="717" y="116" class="small">for triggers; records</text>
<text x="717" y="134" class="small">the player's tile</text>
</svg>
