<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Shop screens and whether the block is shown">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#d8f0e0;--page:#f6ffff;--fg:#202020;--muted:#506058;--fr:#318b73;--rb:#629cde;--pn:#9cdea4;--rw:#f6ffff;--ln:#62b48b;--win:#f8f8f8;--winline:#5a6a8c;--winin:#a8c0e8;--shadow:#d0d0c8;--cursor:#e04030;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef7f0;--box:#e6f4ea;--line:#62b48b;--panel:#f6ffff}
@media (min-width:1000000px){:root{--bg:#10241c;--page:#17302a;--fg:#ecf2ee;--muted:#a9c2b6;--pn:#2f5a44;--rw:#1c3a31;--ln:#4f9a78;--win:#f8f8f8;--shadow:#0c1a14;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#1c3a31;--box:#24463a;--line:#4f9a78;--panel:#17302a}}
*{box-sizing:border-box}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--fg)" /></marker></defs>
<rect x="10" y="20" width="170" height="70" rx="6" fill="var(--box)" stroke="var(--drop)" />
<text x="20" y="45">BUY / SELL / QUIT</text><text x="20" y="65" class="small">field callback, Task_ShopMenu</text><text x="20" y="82" class="small">no block</text>
<line x1="180" y1="55" x2="225" y2="55" stroke="var(--fg)" marker-end="url(#a)" /><text x="186" y="48" class="small">BUY</text>
<rect x="230" y="20" width="190" height="70" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="240" y="45">Buy list</text><text x="240" y="65" class="small">CB2_BuyMenu, Task_BuyMenu owns input</text><text x="240" y="82" class="small">list + Highlighted + money</text>
<line x1="420" y1="55" x2="465" y2="55" stroke="var(--fg)" marker-end="url(#a)" /><text x="428" y="48" class="small">A</text>
<rect x="470" y="20" width="180" height="70" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="480" y="45">Quantity / YES-NO</text><text x="480" y="65" class="small">CB2_BuyMenu, other task</text><text x="480" y="82" class="small">list + money, no Highlighted</text>
<line x1="650" y1="55" x2="695" y2="55" stroke="var(--fg)" marker-end="url(#a)" /><text x="656" y="48" class="small">YES</text>
<rect x="700" y="20" width="150" height="70" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="710" y="45">"Here you go!"</text><text x="710" y="65" class="small">CB2_BuyMenu</text><text x="710" y="82" class="small">list + money</text>
<rect x="230" y="140" width="190" height="70" rx="6" fill="var(--box)" stroke="var(--drop)" />
<text x="240" y="165">Decoration shop</text><text x="240" y="185" class="small">martType 1 or 2 (gDecorations)</text><text x="240" y="202" class="small">no block</text>
<rect x="470" y="140" width="250" height="70" rx="6" fill="var(--box)" stroke="var(--drop)" />
<text x="480" y="165">Save block not read this frame</text><text x="480" y="185" class="small">torn or mid-transition snapshot</text><text x="480" y="202" class="small">no block (money is unread too)</text>
</svg>
