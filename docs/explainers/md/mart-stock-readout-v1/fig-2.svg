<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270" role="img" aria-label="Sources of the list fields in game memory">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#d8f0e0;--page:#f6ffff;--fg:#202020;--muted:#506058;--fr:#318b73;--rb:#629cde;--pn:#9cdea4;--rw:#f6ffff;--ln:#62b48b;--win:#f8f8f8;--winline:#5a6a8c;--winin:#a8c0e8;--shadow:#d0d0c8;--cursor:#e04030;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef7f0;--box:#e6f4ea;--line:#62b48b;--panel:#f6ffff}
@media (min-width:1000000px){:root{--bg:#10241c;--page:#17302a;--fg:#ecf2ee;--muted:#a9c2b6;--pn:#2f5a44;--rw:#1c3a31;--ln:#4f9a78;--win:#f8f8f8;--shadow:#0c1a14;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#1c3a31;--box:#24463a;--line:#4f9a78;--panel:#17302a}}
*{box-sizing:border-box}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
svg .mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="270" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--fg)" /></marker></defs>
<rect x="10" y="20" width="230" height="95" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="20" y="42">sMartInfo 0x02039F60</text>
<text x="20" y="62" class="small">+8 itemList (ROM pointer)</text>
<text x="20" y="80" class="small">+12 itemCount (1–100)</text>
<text x="20" y="98" class="small">+15 martType (0 = items)</text>
<line x1="240" y1="65" x2="300" y2="65" stroke="var(--fg)" marker-end="url(#b)" /><text x="246" y="58" class="small">item ids</text>
<rect x="305" y="20" width="250" height="95" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="315" y="42">gItems 0x085839A0, 44 B rows</text>
<text x="315" y="62" class="small">name[14] → "SUPER POTION"</text>
<text x="315" y="80" class="small">+16 price → 700</text>
<text x="315" y="98" class="small">+20 description → "Restores the HP …"</text>
<line x1="555" y1="65" x2="610" y2="65" stroke="var(--fg)" marker-end="url(#b)" />
<rect x="615" y="20" width="235" height="95" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="625" y="42">row line</text>
<text x="625" y="62" class="small mono">3 SUPER POTION ¥700 —</text>
<text x="625" y="80" class="small mono">"Restores the HP of a</text>
<text x="625" y="98" class="small mono">POKéMON by 50 points."</text>
<rect x="10" y="150" width="230" height="95" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="20" y="172">Task_BuyMenu data[7]</text>
<text x="20" y="192" class="small">list menu: scroll + cursor row</text>
<text x="20" y="210" class="small">row id must equal itemList[row]</text>
<text x="20" y="228" class="small">(CANCEL row id = LIST_CANCEL)</text>
<line x1="240" y1="195" x2="610" y2="195" stroke="var(--fg)" marker-end="url(#b)" /><text x="300" y="188" class="small">index, else a HARNESS BUG line</text>
<rect x="615" y="150" width="235" height="95" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="625" y="172">Highlighted: 3 SUPER POTION</text>
<text x="625" y="198" class="small">Your money: from the save block</text>
<text x="625" y="216" class="small">(the same value as the Money line)</text>
</svg>
