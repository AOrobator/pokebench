<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" style="max-width:900px;min-width:640px;height:auto;display:block" role="img" aria-label="The model sends menu_id null; pi-ai validation converts it to 0; the tool compares 0 with the START menu's null and refuses." height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#283038;--muted:#5a6b80;--line:#c9d6e6;--off:#c83030;--on:#2f8a4a;--code:#eef3fa;--box:#ffffff}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="150" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#283038" /></marker></defs>
<g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#283038">
<rect x="10" y="30" width="230" height="110" rx="8" fill="#fff" stroke="#283038" stroke-width="2" />
<text x="24" y="56" font-weight="bold">Model's tool call</text>
<text x="24" y="82">phase: "start_menu"</text>
<text x="24" y="104">menu_id: null</text>
<text x="24" y="126">option: "BAG"</text>
<rect x="320" y="30" width="250" height="110" rx="8" fill="#fff4d6" stroke="#c83030" stroke-width="3" />
<text x="334" y="56" font-weight="bold">pi-ai validateToolArguments</text>
<text x="334" y="82">typebox Value.Convert on</text>
<text x="334" y="104">Integer | Null: null → 0</text>
<text x="334" y="126">menu_id: 0</text>
<rect x="650" y="30" width="240" height="110" rx="8" fill="#fff" stroke="#283038" stroke-width="2" />
<text x="664" y="56" font-weight="bold">select_menu_option</text>
<text x="664" y="82">START view menu_id: null</text>
<text x="664" y="104">asked menu_id: 0</text>
<text x="664" y="126">null !== 0 → refused</text>
<line x1="240" y1="85" x2="316" y2="85" stroke="#283038" stroke-width="2" marker-end="url(#a)" />
<line x1="570" y1="85" x2="646" y2="85" stroke="#283038" stroke-width="2" marker-end="url(#a)" />
</g></svg>
