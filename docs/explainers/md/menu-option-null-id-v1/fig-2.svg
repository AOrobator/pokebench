<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" style="max-width:900px;min-width:640px;height:auto;display:block" role="img" aria-label="Preset or switchboard feature set flows to playGameTools, then withMenuOptionTool, then the tool's id comparison." height="120">
