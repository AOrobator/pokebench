</style><rect x="0" y="0" width="900" height="230" style="fill:#ffffff;stroke:none" /><g fill="#e7f3fb" stroke="#163957" stroke-width="3"><rect x="10" y="25" width="270" height="160" rx="10" /><rect x="315" y="25" width="270" height="160" rx="10" /><rect x="620" y="25" width="270" height="160" rx="10" /></g><g font-family="system-ui" fill="#163957" text-anchor="middle"><text x="145" y="65" font-size="22">Verify BAG</text><text x="145" y="105" font-size="18">Recorded selected index 2</text><text x="145" y="140" font-size="18">Check owner and readiness</text><text x="450" y="65" font-size="22">DOWN</text><text x="450" y="105" font-size="18">Verify POKéNAV at index 3</text><text x="450" y="140" font-size="18">Stop if highlight is wrong</text><text x="755" y="65" font-size="22">A once</text><text x="755" y="105" font-size="18">Return the resulting state</text><text x="755" y="140" font-size="18">No task-completion claim</text></g></svg>
