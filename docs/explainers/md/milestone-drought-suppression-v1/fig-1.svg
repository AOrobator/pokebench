<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="A five-minute milestone drought produces a model warning with the switch off, but only a recorded diagnostic with it on." width="760" height="220"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{width:100%;height:auto}
text{font-family:system-ui,sans-serif;font-size:15px}
svg{min-width:540px}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="220" style="fill:#ffffff;stroke:none" /><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#173653" /></marker></defs><g fill="#edf6ff" stroke="#173653" stroke-width="2"><rect x="10" y="65" width="210" height="90" rx="8" /><rect x="310" y="10" width="435" height="75" rx="8" /><rect x="310" y="125" width="435" height="80" rx="8" /></g><g fill="none" stroke="#173653" stroke-width="2" marker-end="url(#a)"><path d="M220 85L300 48" /><path d="M220 135L300 165" /></g><g fill="#173653"><text x="28" y="98">5 minutes without</text><text x="28" y="123">a recorded milestone</text><text x="330" y="39">OFF: existing supervisor intervention</text><text x="330" y="65">“You are stalling…” reaches the model</text><text x="330" y="153">ON: diagnostic event retained</text><text x="330" y="179">No drought instruction reaches the model</text></g></svg>
