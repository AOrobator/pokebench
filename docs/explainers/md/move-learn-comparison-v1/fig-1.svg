<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Fields of one move line and their game sources">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--box:#f4f1ea}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--box:#2a2925}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
svg .mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--fg)" /></marker></defs>
<rect x="10" y="120" width="840" height="40" rx="6" fill="var(--fill)" stroke="var(--accent)" />
<text x="20" y="145" class="mono">New move: DOUBLE KICK  FIGHTING  physical  pow 30  acc 100  PP 30/30 — "A double-kicking attack that strikes the foe twice."</text>
<line x1="120" y1="120" x2="90" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="10" y="20" width="160" height="50" rx="6" fill="var(--box)" stroke="var(--line)" /><text x="20" y="40">name</text><text x="20" y="60" class="small">gMoveNames 0x0831977C, 13 B</text>
<line x1="230" y1="120" x2="260" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<line x1="300" y1="120" x2="300" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<line x1="370" y1="120" x2="350" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<line x1="430" y1="120" x2="400" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<line x1="490" y1="120" x2="440" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="190" y="20" width="300" height="50" rx="6" fill="var(--box)" stroke="var(--line)" /><text x="200" y="40">type, power, accuracy, max PP</text><text x="200" y="60" class="small">gBattleMoves 0x0831C898, 12 B row: +1 pow +2 type +3 acc +4 PP</text>
<line x1="620" y1="120" x2="660" y2="70" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="510" y="20" width="340" height="50" rx="6" fill="var(--box)" stroke="var(--line)" /><text x="520" y="40">description (what the summary screen shows)</text><text x="520" y="60" class="small">gMoveDescriptionPointers 0x0861C524 [move − 1]</text>
<line x1="300" y1="160" x2="300" y2="200" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="190" y="200" width="300" height="50" rx="6" fill="var(--box)" stroke="var(--line)" /><text x="200" y="220">kind: from type and power</text><text x="200" y="240" class="small">pow 0 status · type &lt; 9 physical · type &gt; 9 special</text>
<line x1="520" y1="160" x2="600" y2="200" stroke="var(--fg)" marker-end="url(#a)" />
<rect x="510" y="200" width="340" height="50" rx="6" fill="var(--box)" stroke="var(--line)" /><text x="520" y="220">current PP: the party's move PP (known moves)</text><text x="520" y="240" class="small">a new move starts at its full PP, so 30/30</text>
<text x="10" y="280" class="small">Learner types: gSpeciesInfo 0x083203CC +6/+7, one shown when both match (TORCHIC FIRE, COMBUSKEN FIRE/FIGHTING). acc 0 prints "never misses".</text>
</svg>
