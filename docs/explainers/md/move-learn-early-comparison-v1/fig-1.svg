<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Evolution move-learning steps and when the comparison shows, off and on">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#566079;--line:#c9cfdc;--on:#2f7d4f;--off:#9a3b3b;--box:#f4f6fb}
.t{font:13px -apple-system,Helvetica,Arial,sans-serif;fill:#1d2433}
.s{font:11px -apple-system,Helvetica,Arial,sans-serif;fill:#566079}
.t{font:13px -apple-system,Helvetica,Arial,sans-serif;fill:#1d2433}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="880" height="250" style="fill:#ffffff;stroke:none" /><style>.t{font:13px -apple-system,Helvetica,Arial,sans-serif;fill:#1d2433}.s{font:11px -apple-system,Helvetica,Arial,sans-serif;fill:#566079}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#566079" /></marker></defs>
<g>
<rect x="10" y="20" width="150" height="58" rx="6" fill="#f4f6fb" stroke="#c9cfdc" />
<text class="t" x="20" y="42">step 0–1</text><text class="s" x="20" y="60">"… is trying to</text><text class="s" x="20" y="73">learn DOUBLE KICK."</text>
<rect x="185" y="20" width="150" height="58" rx="6" fill="#f4f6fb" stroke="#c9cfdc" />
<text class="t" x="195" y="42">step 2</text><text class="s" x="195" y="60">"But, … can't learn</text><text class="s" x="195" y="73">more than four moves."</text>
<rect x="360" y="20" width="150" height="58" rx="6" fill="#f4f6fb" stroke="#c9cfdc" />
<text class="t" x="370" y="42">step 3</text><text class="s" x="370" y="60">"Delete a move …?"</text><text class="s" x="370" y="73">printing, box drawn</text>
<rect x="535" y="20" width="150" height="58" rx="6" fill="#f4f6fb" stroke="#c9cfdc" />
<text class="t" x="545" y="42">step 4</text><text class="s" x="545" y="60">YES/NO box</text><text class="s" x="545" y="73">takes input</text>
<rect x="710" y="20" width="160" height="58" rx="6" fill="#f4f6fb" stroke="#c9cfdc" />
<text class="t" x="720" y="42">step 5–6</text><text class="s" x="720" y="60">summary screen's</text><text class="s" x="720" y="73">forget-a-move list</text>
<line x1="160" y1="49" x2="183" y2="49" stroke="#566079" marker-end="url(#a)" />
<line x1="335" y1="49" x2="358" y2="49" stroke="#566079" marker-end="url(#a)" />
<line x1="510" y1="49" x2="533" y2="49" stroke="#566079" marker-end="url(#a)" />
<line x1="685" y1="49" x2="708" y2="49" stroke="#566079" marker-end="url(#a)" />
</g>
<text class="t" x="10" y="118">OFF</text>
<rect x="535" y="104" width="335" height="22" rx="4" fill="#e3f3e9" stroke="#2f7d4f" />
<text class="s" x="545" y="119">comparison block</text>
<text class="t" x="10" y="168">ON</text>
<rect x="10" y="154" width="500" height="22" rx="4" fill="#e3f3e9" stroke="#2f7d4f" stroke-dasharray="5 3" />
<text class="s" x="20" y="169">comparison block, no question line (new)</text>
<rect x="535" y="154" width="335" height="22" rx="4" fill="#e3f3e9" stroke="#2f7d4f" />
<text class="s" x="545" y="169">comparison block, as before</text>
<text class="s" x="10" y="215">d951 turn 430: learn_move was called here, at step 1 ↑, and answered both questions in one call.</text>
<line x1="80" y1="200" x2="80" y2="82" stroke="#9a3b3b" stroke-dasharray="3 3" />
</svg>
