<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120" role="img" aria-label="Switch wiring from the preset to the readout">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#566079;--line:#c9cfdc;--on:#2f7d4f;--off:#9a3b3b;--box:#f4f6fb}
.t{font:13px -apple-system,Helvetica,Arial,sans-serif;fill:#1d2433}
.t{font:13px -apple-system,Helvetica,Arial,sans-serif;fill:#1d2433}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="880" height="120" style="fill:#ffffff;stroke:none" /><style>.t{font:13px -apple-system,Helvetica,Arial,sans-serif;fill:#1d2433}</style>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#566079" /></marker></defs>
<rect x="10" y="30" width="170" height="50" rx="6" fill="#f4f6fb" stroke="#c9cfdc" /><text class="t" x="20" y="52">run preset</text><text class="t" x="20" y="70">features[id]</text>
<rect x="225" y="30" width="190" height="50" rx="6" fill="#f4f6fb" stroke="#c9cfdc" /><text class="t" x="235" y="52">POKEBENCH_FEATURES_OFF</text><text class="t" x="235" y="70">(serverFeatureEnv)</text>
<rect x="460" y="30" width="190" height="50" rx="6" fill="#e3f3e9" stroke="#2f7d4f" /><text class="t" x="470" y="52">read_move_learning</text><text class="t" x="470" y="70">early=True</text>
<rect x="695" y="30" width="175" height="50" rx="6" fill="#f4f6fb" stroke="#c9cfdc" /><text class="t" x="705" y="52">readout: comparison</text><text class="t" x="705" y="70">lines (unchanged)</text>
<line x1="180" y1="55" x2="223" y2="55" stroke="#566079" marker-end="url(#b)" />
<line x1="415" y1="55" x2="458" y2="55" stroke="#566079" marker-end="url(#b)" />
