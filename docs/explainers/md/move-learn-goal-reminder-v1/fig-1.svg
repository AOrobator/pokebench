</style><rect x="0" y="0" width="640" height="150" style="fill:#ffffff;stroke:none" /><rect x="5" y="10" width="185" height="110" fill="#e8f1ff" stroke="#203554" /><text x="15" y="40" font-size="16">Delivered ready choice</text><text x="15" y="67" font-size="16">Same native state</text><text x="15" y="94" font-size="16">Tool result or readiness</text><path d="M190 65H220" stroke="#203554" /><rect x="220" y="10" width="185" height="110" fill="#ddf1d4" stroke="#203554" /><text x="230" y="40" font-size="16">General task reminder</text><text x="230" y="67" font-size="16">No prior claim required</text><text x="230" y="94" font-size="16">Model still chooses</text><path d="M405 65H435" stroke="#203554" /><rect x="435" y="10" width="200" height="110" fill="#fff6cd" stroke="#203554" /><text x="445" y="40" font-size="16">Optional extra sentence</text><text x="445" y="67" font-size="16">Only after a recorded</text><text x="445" y="94" font-size="16">explicit skip plan</text></svg>
