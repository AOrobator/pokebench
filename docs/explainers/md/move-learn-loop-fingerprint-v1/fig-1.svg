<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Four states in a cycle, each B press moving to the next" width="900" height="400">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .offarrow{stroke:var(--off);stroke-width:2;fill:none;stroke-dasharray:6 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="400" style="fill:#ffffff;stroke:none" /><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8432c" /></marker></defs>
<rect class="offbox" x="40" y="30" width="360" height="80" rx="8" /><text x="56" y="60">"Delete a move to make room</text><text x="56" y="82">for DOUBLE KICK?"</text><text x="56" y="100" class="small">YES/NO box</text>
<rect class="offbox" x="500" y="30" width="360" height="80" rx="8" /><text x="516" y="60">"Stop learning DOUBLE KICK?"</text><text x="516" y="100" class="small">YES/NO box</text>
<rect class="offbox" x="500" y="280" width="360" height="80" rx="8" /><text x="516" y="310">"COMBUSKEN is trying to learn</text><text x="516" y="332">DOUBLE KICK."</text><text x="516" y="350" class="small">page (MVSTATE 1)</text>
<rect class="offbox" x="40" y="280" width="360" height="80" rx="8" /><text x="56" y="310">"But, COMBUSKEN can't learn</text><text x="56" y="332">more than four moves."</text><text x="56" y="350" class="small">page (MVSTATE 2)</text>
<path class="offarrow" d="M400 70H496" marker-end="url(#m1)" /><text x="425" y="60">B = NO</text>
<path class="offarrow" d="M680 110V276" marker-end="url(#m1)" /><text x="690" y="200">B = NO</text>
<path class="offarrow" d="M500 320H404" marker-end="url(#m1)" /><text x="430" y="310">B</text>
<path class="offarrow" d="M220 280V114" marker-end="url(#m1)" /><text x="230" y="200">B</text>
<text x="300" y="390" class="small">15 turns round this cycle, then a blind A forgot SCRATCH</text>
</svg>
