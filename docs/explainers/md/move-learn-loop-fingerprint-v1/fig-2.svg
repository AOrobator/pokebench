<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Off: null fingerprint for every state; on: one fingerprint per state, a cycle counted after two repeats" width="900" height="260">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .mono{font:12px ui-monospace,Menlo,monospace;fill:var(--fg)}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="260" style="fill:#ffffff;stroke:none" /><rect class="offbox" x="20" y="20" width="400" height="220" rx="8" />
<text x="36" y="48">OFF</text>
<text x="36" y="80" class="mono">Delete box      → null</text>
<text x="36" y="104" class="mono">Stop box        → null</text>
<text x="36" y="128" class="mono">trying-to-learn → null</text>
<text x="36" y="152" class="mono">four-moves page → null</text>
<text x="36" y="190" class="small">no state counted; no cycle, no ineffective notice</text>
<rect class="onbox" x="460" y="20" width="420" height="220" rx="8" />
<text x="476" y="48">ON (moveLearningState)</text>
<text x="476" y="80" class="small">phase, highlighted answer, evolution MVSTATE</text>
<text x="476" y="100" class="small">and question (its YES/NO next states), the move</text>
<text x="476" y="120" class="small">to learn, the waiting page, the party's moves.</text>
<text x="476" y="140" class="small">In battle: the learn_move / stop_learning_move</text>
<text x="476" y="160" class="small">boxes and the sText_TryToLearnMove1/2 pages.</text>
<text x="476" y="198">4 distinct fingerprints → cycle rule</text>
<text x="476" y="220" class="small">a cycle made only of these: reported at 2 repeats</text>
</svg>
