<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Frame timeline of an observation waiting from MVSTATE 3 to MVSTATE 4">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--box:#f4f1ea;--warn:#a86a12}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--box:#2a2925;--warn:#e0b05a}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="300" style="fill:#ffffff;stroke:none" /><text x="20" y="22" class="small">emulated frames →</text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--line)" stroke-width="2" />
<rect x="20" y="70" width="190" height="40" fill="var(--box)" stroke="var(--line)" /><text x="30" y="95">MVSTATE 10: page prints</text>
<rect x="210" y="70" width="330" height="40" fill="var(--fill)" stroke="var(--accent)" /><text x="220" y="95">MVSTATE 3: wait for printer 0 idle, draw box</text>
<rect x="540" y="70" width="300" height="40" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" /><text x="552" y="95">MVSTATE 4: YES/NO input</text>
<line x1="280" y1="40" x2="280" y2="150" stroke="var(--drop)" stroke-width="2" />
<text x="232" y="36">observation arrives</text>
<line x1="280" y1="160" x2="540" y2="160" stroke="var(--accent)" stroke-width="2" />
<polygon points="540,160 530,155 530,165" fill="var(--accent)" />
<text x="300" y="180">busy on every frame: the observation waits</text>
<text x="300" y="198" class="small">frames counted; no sleep, no polling</text>
<line x1="540" y1="40" x2="540" y2="150" stroke="var(--keep)" stroke-width="2" />
<text x="548" y="140" class="small">first ready frame: capture</text>
<text x="548" y="180">Settled(frames=N, reason "move_learning")</text>
<text x="20" y="232">OFF: capture at the red line → the readout says "input not ready; … no menu choice is open"</text>
<text x="20" y="254">ON: capture at the green line → the readout shows the open YES/NO box</text>
<text x="20" y="280" class="small">Bound: if the scene is still busy after 600 emulated frames (SETTLE_BOUND_FRAMES in move_learn.py), capture anyway, reason "move_learning_bound".</text>
</svg>
