<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="From Stop learning: B, A, A to reach Delete; at Delete: A on YES; forget list: UP or DOWN one step at a time with a check; A; verify party moves" width="900" height="470">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .onarrow{stroke:var(--on);stroke-width:2.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="470" style="fill:#ffffff;stroke:none" /><defs><marker id="l1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c7a4b" /></marker></defs>
<rect class="box" x="20" y="20" width="250" height="70" rx="8" /><text x="36" y="48">"Stop learning …?"</text><text x="36" y="70" class="small">B answers NO</text>
<rect class="box" x="320" y="20" width="250" height="70" rx="8" /><text x="336" y="48">"… is trying to learn …"</text><text x="336" y="70" class="small">A advances</text>
<rect class="box" x="620" y="20" width="260" height="70" rx="8" /><text x="636" y="48">"… can't learn more</text><text x="636" y="70">than four moves."  A</text>
<path class="onarrow" d="M270 55H316" marker-end="url(#l1)" /><text x="282" y="45" class="small">B</text>
<path class="onarrow" d="M570 55H616" marker-end="url(#l1)" /><text x="582" y="45" class="small">A</text>
<rect class="onbox" x="620" y="140" width="260" height="80" rx="8" /><text x="636" y="168">"Delete a move to make</text><text x="636" y="190">room for …?"</text><text x="636" y="210" class="small">NO highlighted: UP first</text>
<path class="onarrow" d="M750 90V136" marker-end="url(#l1)" /><text x="760" y="118" class="small">A</text>
<rect class="onbox" x="320" y="140" width="250" height="80" rx="8" /><text x="336" y="168">forget list (summary)</text><text x="336" y="190" class="small">5 rows: 4 moves + new move</text><text x="336" y="210" class="small">names must equal party moves</text>
<path class="onarrow" d="M620 180H574" marker-end="url(#l1)" /><text x="592" y="170" class="small">A</text>
<rect class="onbox" x="20" y="140" width="250" height="80" rx="8" /><text x="36" y="168">UP or DOWN, one step</text><text x="36" y="190" class="small">the shorter way round;</text><text x="36" y="210" class="small">highlight checked after each</text>
<path class="onarrow" d="M320 180H274" marker-end="url(#l1)" />
<path class="onarrow" d="M145 220V250H170V226" marker-end="url(#l1)" /><text x="182" y="246" class="small">until the named move</text>
<rect class="onbox" x="20" y="290" width="250" height="70" rx="8" /><text x="36" y="318">A on the named move</text><text x="36" y="340" class="small">"1, 2, and… … … Poof!"</text>
<path class="onarrow" d="M80 220V286" marker-end="url(#l1)" />
<rect class="onbox" x="320" y="290" width="560" height="70" rx="8" /><text x="336" y="318">verify the party: new move in that slot, the other three unchanged</text><text x="336" y="340" class="small">report the buttons, the party's moves and the pages the game printed</text>
<path class="onarrow" d="M270 325H316" marker-end="url(#l1)" />
<text x="20" y="400" class="small">Every press: the screen must still match the planned state before it is sent, then the next state must be the expected one.</text>
<text x="20" y="422" class="small">Waits: the game server's move-learning wait (GET /pokebench/move-learn/wait), held until the first emulated frame that needs input; no sleeps.</text>
<text x="20" y="444" class="small">At most 16 presses per call. The call can start at any of these states; it starts from where the game is.</text>
</svg>
