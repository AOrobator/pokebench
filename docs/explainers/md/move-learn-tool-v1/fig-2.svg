<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="Delete box: B answers NO; Stop learning box: A answers YES; verify moves unchanged and the did-not-learn text" width="900" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .onarrow{stroke:var(--on);stroke-width:2.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="l2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c7a4b" /></marker></defs>
<rect class="onbox" x="20" y="30" width="230" height="80" rx="8" /><text x="36" y="58">"Delete a move …?"</text><text x="36" y="80" class="small">or the forget list</text>
<rect class="onbox" x="320" y="30" width="230" height="80" rx="8" /><text x="336" y="58">"Stop learning …?"</text><text x="336" y="80" class="small">NO highlighted: UP first</text>
<rect class="onbox" x="620" y="30" width="260" height="80" rx="8" /><text x="636" y="58">"… did not learn …"</text><text x="636" y="80" class="small">moves unchanged: verified</text>
<path class="onarrow" d="M250 70H316" marker-end="url(#l2)" /><text x="262" y="60" class="small">B = NO</text>
<path class="onarrow" d="M550 70H616" marker-end="url(#l2)" /><text x="562" y="60" class="small">A = YES</text>
<text x="20" y="150" class="small">Verified only when the party's moves are unchanged and the game printed "… did not learn …" (or the evolution scene is at that step).</text>
<text x="20" y="172" class="small">Tests: B,A from Delete; UP,A from Stop with NO highlighted; B,A from the forget list.</text>
</svg>
