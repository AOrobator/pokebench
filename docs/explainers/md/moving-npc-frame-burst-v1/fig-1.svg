<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OFF one frame versus ON chronological burst during follow" viewBox="0 0 720 220" width="720" height="220">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#283038;--muted:#5a6b80;--line:#c9d6e6;--panel:#fff;--code:#eef3fa;--link:#2a62b8}
svg{max-width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="220" style="fill:#ffffff;stroke:none" /><g fill="#edf7df" stroke="#173e60" stroke-width="2">
  <rect x="20" y="40" width="300" height="150" rx="10" />
  <rect x="400" y="40" width="300" height="150" rx="10" />
 </g>
 <g fill="#173e60" font-family="system-ui" font-size="15" text-anchor="middle">
  <text x="170" y="28">OFF: one final screenshot</text>
  <text x="550" y="28">ON: up to six frames in order</text>
  <text x="170" y="95">NPC elsewhere</text>
  <text x="170" y="120">during the chase</text>
  <text x="170" y="155">model sees only the end</text>
  <text x="460" y="95">1</text><text x="500" y="95">2</text><text x="540" y="95">3</text>
  <text x="580" y="95">4</text><text x="620" y="95">5</text><text x="660" y="95">6</text>
  <text x="550" y="155">patrol motion visible</text>
 </g>
 <g fill="none" stroke="#173e60" stroke-width="2">
  <rect x="445" y="75" width="30" height="30" rx="4" /><rect x="485" y="75" width="30" height="30" rx="4" />
  <rect x="525" y="75" width="30" height="30" rx="4" /><rect x="565" y="75" width="30" height="30" rx="4" />
  <rect x="605" y="75" width="30" height="30" rx="4" /><rect x="645" y="75" width="30" height="30" rx="4" />
 </g>
</svg>
