<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Off: the player chases and never catches up. On: the player waits beside the loop and steps in between the two walkers.">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--floor:#f4f1e6;--table:#b98b5a;--player:#d8452f;--briney:#2f6fd8;--peeko:#e2b23c;--ok:#2f8f4e;--bad:#b23a3a}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="260" style="fill:#ffffff;stroke:none" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6785" /></marker></defs>
<text x="150" y="20" text-anchor="middle" font-weight="700">OFF: chase the current tile</text>
<text x="480" y="20" text-anchor="middle" font-weight="700">ON: wait beside the path, step in</text>
<g transform="translate(40,40)">
 <rect x="0" y="0" width="200" height="200" fill="var(--floor)" stroke="var(--line)" />
 <rect x="50" y="50" width="100" height="100" fill="var(--table)" />
 <text x="100" y="105" text-anchor="middle" fill="#fff" font-size="12">table</text>
 <rect x="0" y="0" width="200" height="200" fill="none" stroke="var(--muted)" stroke-dasharray="4 4" />
 <circle cx="175" cy="125" r="12" fill="var(--briney)" /><text x="175" y="129" text-anchor="middle" fill="#fff" font-size="10">B</text>
 <circle cx="125" cy="175" r="10" fill="var(--peeko)" /><text x="125" y="179" text-anchor="middle" font-size="10">P</text>
 <circle cx="225" cy="75" r="12" fill="var(--player)" /><text x="225" y="79" text-anchor="middle" fill="#fff" font-size="10">you</text>
 <path d="M225 92 L225 155" stroke="var(--player)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
 <path d="M225 155 L225 95" stroke="var(--player)" stroke-width="2" stroke-dasharray="5 4" />
 <text x="100" y="225" text-anchor="middle" font-size="12" fill="var(--bad)">32 steps up and down, no talk</text>
</g>
<g transform="translate(380,40)">
 <rect x="0" y="0" width="200" height="200" fill="var(--floor)" stroke="var(--line)" />
 <rect x="50" y="50" width="100" height="100" fill="var(--table)" />
 <text x="100" y="105" text-anchor="middle" fill="#fff" font-size="12">table</text>
 <rect x="0" y="0" width="200" height="200" fill="none" stroke="var(--muted)" stroke-dasharray="4 4" />
 <circle cx="175" cy="75" r="10" fill="var(--peeko)" /><text x="175" y="79" text-anchor="middle" font-size="10">P</text>
 <circle cx="75" cy="25" r="12" fill="var(--briney)" /><text x="75" y="29" text-anchor="middle" fill="#fff" font-size="10">B</text>
 <rect x="100" y="0" width="50" height="50" fill="none" stroke="var(--ok)" stroke-width="3" />
 <text x="125" y="-6" text-anchor="middle" font-size="11" fill="var(--ok)">T</text>
 <text x="75" y="-6" text-anchor="middle" font-size="11" fill="var(--muted)">P→</text>
 <circle cx="125" cy="-25" r="12" fill="var(--player)" /><text x="125" y="-21" text-anchor="middle" fill="#fff" font-size="10">S</text>
 <path d="M125 -12 L125 18" stroke="var(--player)" stroke-width="3" marker-end="url(#arrow)" />
 <text x="100" y="225" text-anchor="middle" font-size="12" fill="var(--ok)">B walks in place at P; face him, A</text>
</g>
</svg>
