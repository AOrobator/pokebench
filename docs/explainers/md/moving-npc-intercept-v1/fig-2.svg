<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Sequence: navigate_to_target sees the person move, the server watches, the agent picks S and T, walks to S, the server steps in, the follow faces and presses A.">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--floor:#f4f1e6;--table:#b98b5a;--player:#d8452f;--briney:#2f6fd8;--peeko:#e2b23c;--ok:#2f8f4e;--bad:#b23a3a}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6785" /></marker></defs>
<g font-size="12">
 <rect x="10" y="10" width="180" height="44" rx="6" fill="#fff" stroke="var(--line)" /><text x="100" y="30" text-anchor="middle">navigate_to_target object</text><text x="100" y="46" text-anchor="middle" fill="var(--muted)">person seen to move</text>
 <rect x="230" y="10" width="190" height="44" rx="6" fill="#eaf1ff" stroke="var(--briney)" stroke-width="2" /><text x="325" y="30" text-anchor="middle">server watch, no input</text><text x="325" y="46" text-anchor="middle" fill="var(--muted)">every frame, ≤240 frames</text>
 <rect x="460" y="10" width="170" height="44" rx="6" fill="#fff" stroke="var(--line)" /><text x="545" y="30" text-anchor="middle">steps repeat?</text><text x="545" y="46" text-anchor="middle" fill="var(--muted)">"loop closed"</text>
 <rect x="460" y="100" width="170" height="44" rx="6" fill="#fff" stroke="var(--line)" /><text x="545" y="120" text-anchor="middle">pick step P→T and S</text><text x="545" y="136" text-anchor="middle" fill="var(--muted)">S off path, reachable</text>
 <rect x="230" y="100" width="190" height="44" rx="6" fill="#fff" stroke="var(--line)" /><text x="325" y="120" text-anchor="middle">walk to S</text><text x="325" y="136" text-anchor="middle" fill="var(--muted)">ordinary navigate_to</text>
 <rect x="10" y="100" width="180" height="44" rx="6" fill="#eaf1ff" stroke="var(--briney)" stroke-width="3" /><text x="100" y="120" text-anchor="middle" font-weight="700">server step-in</text><text x="100" y="136" text-anchor="middle" fill="var(--muted)">face T, wait, step</text>
 <rect x="10" y="200" width="180" height="44" rx="6" fill="#eef8ef" stroke="var(--ok)" /><text x="100" y="220" text-anchor="middle">follow: face, A once</text><text x="100" y="236" text-anchor="middle" fill="var(--muted)">existing checks</text>
 <rect x="230" y="200" width="190" height="44" rx="6" fill="#fbeeee" stroke="var(--bad)" /><text x="325" y="220" text-anchor="middle">anything else</text><text x="325" y="236" text-anchor="middle" fill="var(--muted)">ordinary follow, ≤2 tries</text>
 <path d="M190 32 H228" stroke="#5b6785" marker-end="url(#a2)" />
 <path d="M420 32 H458" stroke="#5b6785" marker-end="url(#a2)" />
 <path d="M545 54 V98" stroke="#5b6785" marker-end="url(#a2)" /><text x="552" y="80" fill="var(--ok)">yes</text>
 <path d="M460 122 H422" stroke="#5b6785" marker-end="url(#a2)" />
 <path d="M230 122 H192" stroke="#5b6785" marker-end="url(#a2)" />
 <path d="M100 144 V198" stroke="#5b6785" marker-end="url(#a2)" /><text x="108" y="174" fill="var(--ok)">entered</text>
 <path d="M150 144 L300 198" stroke="#5b6785" stroke-dasharray="4 4" marker-end="url(#a2)" /><text x="240" y="165" fill="var(--bad)">budget / blocked</text>
 <path d="M600 54 C 640 200, 500 230, 422 222" stroke="#5b6785" stroke-dasharray="4 4" fill="none" marker-end="url(#a2)" /><text x="600" y="190" fill="var(--bad)">no</text>
</g>
</svg>
