</style><rect x="0" y="0" width="640" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#173e60" /></marker></defs><g fill="#edf7df" stroke="#173e60"><rect x="15" y="35" width="290" height="145" rx="12" /><rect x="335" y="35" width="290" height="145" rx="12" /></g><g font-family="system-ui" fill="#173e60" text-anchor="middle"><text x="160" y="25">OFF: target moved → return</text><text x="480" y="25">ON: fresh approach → talk</text><text x="65" y="100">Player</text><text x="230" y="75">Old tile</text><text x="230" y="150">NPC now</text><text x="385" y="100">Player</text><text x="550" y="75">Old tile</text><text x="550" y="150">NPC now</text></g><g fill="none" stroke="#173e60" stroke-width="3" marker-end="url(#arrow)"><path d="M100 95L185 75" stroke-dasharray="7 5" /><path d="M420 100L465 100L465 145L505 145" /></g></svg>
