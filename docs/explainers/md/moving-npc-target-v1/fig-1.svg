<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Off aborts at the old NPC tile; on replans to the same NPC at its live tile" viewBox="0 0 640 200" style="width:100%;min-width:520px;height:auto" width="640" height="200"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

