<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" role="img" aria-label="Littleroot Town doors with their labels off and on" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --bld:#d9d5ca; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --bld:#3a3c40; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --bld:#3a3c40; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.bld{fill:var(--bld);stroke:var(--rule)}
.ground{fill:var(--ground);stroke:var(--rule)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="330" style="fill:#ffffff;stroke:none" /><rect x="20" y="20" width="300" height="300" class="ground" />
<text x="20" y="14" class="s">Littleroot Town, 20×20 tiles (15 px per tile)</text>
<rect x="50" y="95" width="90" height="60" class="bld" /><text x="58" y="115" class="s">player's house</text>
<rect x="200" y="95" width="90" height="60" class="bld" /><text x="208" y="115" class="s">May's house</text>
<rect x="65" y="215" width="105" height="60" class="bld" /><text x="73" y="235" class="s">lab</text>
<rect x="95" y="140" width="15" height="15" class="navb" /><text x="97" y="151" class="m">W</text>
<rect x="230" y="140" width="15" height="15" class="navb hot" /><text x="232" y="151" class="m">W</text>
<rect x="125" y="260" width="15" height="15" class="navb" /><text x="127" y="271" class="m">W</text>
<rect x="125" y="140" width="15" height="15" class="box" /><text x="127" y="151" class="m">S</text>
<rect x="200" y="140" width="15" height="15" class="box" /><text x="202" y="151" class="m">S</text>
<rect x="110" y="275" width="15" height="15" class="box" /><text x="112" y="286" class="m">S</text>
<text x="340" y="36" class="t">OFF: what each W says today</text>
<text x="340" y="56" class="m">(5,8)  -&gt; map 1/0</text>
<text x="340" y="74" class="m">(14,8) -&gt; map 1/2</text>
<text x="340" y="92" class="m">(7,16) -&gt; map 1/4</text>
<text x="340" y="112" class="s">Signs (S) are listed separately: Brendans House Sign (7,8),</text>
<text x="340" y="126" class="s">Mays House Sign (12,8), Birchs Lab Sign (6,17).</text>
<text x="340" y="176" class="t">ON: names grounded in the nearby signs</text>
<rect x="336" y="186" width="350" height="76" rx="6" class="game" />
<text x="344" y="206" class="m">(5,8)  -&gt; RED's HOUSE 1F</text>
<text x="344" y="226" class="m">(14,8) -&gt; PROF. BIRCH'S HOUSE 1F</text>
<text x="344" y="246" class="m">(7,16) -&gt; PROF. BIRCH'S POKéMON LAB</text>
<text x="340" y="282" class="s">Each keeps its ID in parentheses, e.g. "(map 1/2)", so nothing</text>
<text x="340" y="296" class="s">the model already relies on disappears.</text>
</svg>
