<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" role="img" aria-label="Player on the goal tile and the two answers" height="230">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
