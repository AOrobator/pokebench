<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" role="img" aria-label="Timeline of turns 888 to 920 on Route 103" height="360">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --warn:#9a6b00; --warn-bg:#fbf1d6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --warn:#e8b84a; --warn-bg:#352b14; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --warn:#e8b84a; --warn-bg:#352b14; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.warnb{fill:var(--warn-bg);stroke:var(--warn)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="360" style="fill:#ffffff;stroke:none" /><defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)" /></marker>
</defs>
<path class="arr" d="M60,20 L60,340" />
<g>
<circle cx="60" cy="40" r="6" fill="var(--game)" />
<text class="t" x="80" y="36">Turn 888 · readout</text>
<text x="80" y="54">MAY at (10,3). The ledge row and an open route around it are on the map.</text>
<text class="s" x="80" y="70">navigate_to(9,6) had just arrived in 2 presses.</text>
</g>
<g>
<rect class="warnb" x="76" y="86" width="560" height="44" rx="5" />
<text class="t" x="88" y="104">Turns 887–893 · model thinking (stated belief only)</text>
<text x="88" y="121">A tile-by-tile search over the ASCII map. It misreads the ledge glyphs.</text>
</g>
<g>
<circle cx="60" cy="160" r="6" fill="var(--prior)" />
<text class="t" x="80" y="156">Turns 889–894 · hand presses</text>
<text x="80" y="174">UP into the ledge (no net movement), then LEFT/UP to (7,6), into grass.</text>
<text class="s" x="80" y="190">It never gave navigate_to a tile near MAY.</text>
</g>
<g>
<circle cx="60" cy="220" r="6" fill="var(--soft)" />
<text class="t" x="80" y="216">Turns 895–918 · wild battle</text>
<text class="s" x="80" y="234">24 turns spent because of the step into grass.</text>
</g>
<g>
<circle cx="60" cy="270" r="6" fill="var(--nav)" />
<text class="t" x="80" y="266">Turn 920 · navigate_to(9,3)</text>
<text x="80" y="284">Walked 8 presses, stopped at (8,3), one tile short: "command limit".</text>
<text class="s" x="80" y="300">The local tool's cap is 8 presses (MAX_NAVIGATION_COMMANDS=8).</text>
</g>
<g>
<circle cx="60" cy="330" r="6" fill="var(--soft)" />
<text x="80" y="334">The model finished with one RIGHT press by hand.</text>
</g>
</svg>
