<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" role="img" aria-label="Order of the rendered prompt and where each change lands" height="420">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --warn:#9a6b00; --warn-bg:#fbf1d6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --warn:#e8b84a; --warn-bg:#352b14; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --warn:#e8b84a; --warn-bg:#352b14; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="420" style="fill:#ffffff;stroke:none" /><text class="s" x="0" y="14">rendered first</text>
<rect class="box" x="0" y="24" width="400" height="90" rx="6" />
<text class="t" x="14" y="46"># Tools (JSON)</text>
<text class="m" x="14" y="66">observe · press · get_dialogue</text>
<rect class="game" x="10" y="76" width="380" height="28" rx="4" />
<text class="m" x="20" y="94">navigate_to: description gains a prefix</text>

<rect class="box" x="0" y="128" width="400" height="190" rx="6" />
<text class="t" x="14" y="150">System prompt</text>
<text class="m" x="14" y="170">goal sentence</text>
<rect class="game" x="10" y="180" width="380" height="28" rx="4" />
<text class="m" x="20" y="198">tool list: navigate_to line, press line</text>
<text class="m" x="14" y="228">controls, naming, warps, evidence, ...</text>
<text class="s" x="14" y="246">(one-line NAVIGATE_TO_USAGE removed)</text>
<rect class="game" x="10" y="258" width="380" height="28" rx="4" />
<text class="m" x="20" y="276">Moving around (last section)</text>
<text class="s" x="14" y="306">objective text, if on, still follows it</text>

<rect class="box" x="0" y="332" width="400" height="80" rx="6" />
<text class="t" x="14" y="354">Conversation</text>
<rect class="game" x="10" y="364" width="380" height="28" rx="4" />
<text class="m" x="20" y="382">press result + Reminder (every 3rd)</text>
<text class="s" x="0" y="418">nearest the model's next turn</text>

<path class="arr g" d="M396,90 L470,90" marker-end="url(#ag2)" />
<path class="arr g" d="M396,194 L470,194" marker-end="url(#ag2)" />
<path class="arr g" d="M396,272 L470,272" marker-end="url(#ag2)" />
<path class="arr g" d="M396,378 L470,378" marker-end="url(#ag2)" />
<defs><marker id="ag2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--game)" /></marker></defs>
<text class="t" x="480" y="86">A. "The main way to move"</text>
<text class="s" x="480" y="102">plus the command-limit hint (local)</text>
<text class="t" x="480" y="190">B. navigate_to before press</text>
<text class="s" x="480" y="206">press: "not for walking"</text>
<text class="t" x="480" y="268">C. When and how to walk</text>
<text class="s" x="480" y="284">replaces the one-line usage rule</text>
<text class="t" x="480" y="374">D. Reminder line</text>
<text class="s" x="480" y="390">only on the free field</text>
</svg>
