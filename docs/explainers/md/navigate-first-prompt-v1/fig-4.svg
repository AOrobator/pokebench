<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" role="img" aria-label="Reminder counter state diagram" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --warn:#9a6b00; --warn-bg:#fbf1d6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --warn:#e8b84a; --warn-bg:#352b14; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --warn:#e8b84a; --warn-bg:#352b14; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game);stroke-width:2}
.arr.p{stroke:var(--prior);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="300" style="fill:#ffffff;stroke:none" /><defs>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)" /></marker>
<marker id="agg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--game)" /></marker>
<marker id="app" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--prior)" /></marker>
</defs>
<rect class="box" x="20" y="100" width="100" height="56" rx="28" />
<text class="t" x="44" y="133">count 0</text>
<rect class="box" x="180" y="100" width="100" height="56" rx="28" />
<text class="t" x="204" y="133">count 1</text>
<rect class="box" x="340" y="100" width="100" height="56" rx="28" />
<text class="t" x="364" y="133">count 2</text>
<rect class="game" x="500" y="92" width="200" height="72" rx="10" />
<text class="t" x="514" y="116">count 3, 6, 9 ...</text>
<text x="514" y="134">press result gets</text>
<text x="514" y="150">the Reminder line</text>

<path class="arr g" d="M120,128 L178,128" marker-end="url(#agg)" />
<path class="arr g" d="M280,128 L338,128" marker-end="url(#agg)" />
<path class="arr g" d="M440,128 L498,128" marker-end="url(#agg)" />
<text class="s" x="124" y="88">counting press</text>
<text class="s" x="290" y="88">counting press</text>
<text class="s" x="446" y="88">counting press</text>
<path class="arr g" d="M600,92 C600,40 230,40 230,98" marker-end="url(#agg)" />
<text class="s" x="330" y="36">next counting presses continue the count (4, 5, 6 ...)</text>

<path class="arr p" d="M230,158 C230,220 70,220 70,160" marker-end="url(#app)" />
<path class="arr p" d="M390,158 C390,240 70,240 70,160" marker-end="url(#app)" />
<path class="arr p" d="M600,166 C600,262 70,262 70,160" marker-end="url(#app)" />
<text class="t" x="20" y="286" style="fill:var(--prior)">Reset to 0:</text>
<text x="100" y="286">any other tool call (navigate_to, observe ...) · a press with any non-direction button · a press that ends off the free field</text>
</svg>
