<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Decision tree for the refusal reason" width="900" height="430">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor:#f3ead6;--wall:#7d776d;--water:#8cc3ea;--npc:#8c8f86;--obj:#b08a5a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--accent2) 22%,var(--card));stroke:var(--accent2);stroke-width:2}
.nt{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:11.5px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
.fl{font:11px -apple-system,Helvetica,sans-serif;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="430" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker>
</defs><g class="node"><rect x="330" y="10" width="240" height="46" rx="10" /><text x="450" y="38" class="nt">navigate_to refuses</text></g>
<path class="flow" d="M390 56 L190 100" marker-end="url(#a)" /><text x="230" y="76" class="fl">field not ready (before or after a step)</text>
<path class="flow" d="M510 56 L700 100" marker-end="url(#a)" /><text x="610" y="76" class="fl">planner found no path</text>
<g class="node"><rect x="20" y="100" width="360" height="300" rx="10" /></g>
<text x="200" y="124" class="nt">first match wins</text>
<text x="200" y="152" class="ns">1. in_battle → a battle is in progress</text>
<text x="200" y="178" class="ns">2. not started / screen ≠ overworld → not on the field</text>
<g class="node hot"><rect x="40" y="192" width="320" height="40" rx="8" /></g>
<text x="200" y="217" class="nt">3. message or dialogue present → dismiss with B</text>
<text x="200" y="256" class="ns">4. any active_ui (ready or not) → a menu is open (phase)</text>
<text x="200" y="282" class="ns">5. field_controls_locked = true → locked by a script</text>
<text x="200" y="308" class="ns">6. field_controls_locked null → control state unavailable</text>
<text x="200" y="334" class="ns">7. otherwise → navigation geometry unavailable</text>
<text x="200" y="370" class="ns">After a step, the same text is prefixed</text>
<text x="200" y="388" class="ns">"walk interrupted: "</text>
<g class="node"><rect x="420" y="100" width="460" height="300" rx="10" /></g>
<text x="650" y="124" class="nt">first match wins (same grid the planner used)</text>
<text x="650" y="152" class="ns">0. counter-talk-v1 on and a counter is involved → counter hint (unchanged)</text>
<text x="650" y="178" class="ns">1. x ≥ width or y ≥ height → outside this map, with its bounds</text>
<text x="650" y="204" class="ns">2. target is a listed warp → who stands on it, or the door's entry tile (below)</text>
<g class="node hot"><rect x="440" y="218" width="420" height="58" rx="8" /></g>
<text x="650" y="240" class="nt">3. a person/object on it, or an A-target on a solid tile</text>
<text x="650" y="262" class="ns">→ name it; list free reachable neighbours with facing</text>
<g class="node hot"><rect x="440" y="288" width="420" height="58" rx="8" /></g>
<text x="650" y="310" class="nt">4. tile not walkable → ledge / water / wall / terrain</text>
<text x="650" y="332" class="ns">→ nearest reachable walkable tile within 3 steps</text>
<text x="650" y="372" class="ns">5. otherwise (unknown tile, enclosed floor, elevation)</text>
<text x="650" y="390" class="ns">→ generic text, as with the switch off</text>
</svg>
