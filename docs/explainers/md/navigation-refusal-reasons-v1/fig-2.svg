<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Grid with MOM in the centre and four green stand tiles" width="300" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor:#f3ead6;--wall:#7d776d;--water:#8cc3ea;--npc:#8c8f86;--obj:#b08a5a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
*{min-width:0}
.floor{fill:var(--floor);stroke:var(--line)}
.npc{fill:var(--npc);stroke:#fff;stroke-width:2.5}
.player{fill:var(--accent);stroke:#fff;stroke-width:3}
.goal{fill:none;stroke:var(--bad);stroke-width:3;stroke-dasharray:5 4}
.stand{fill:none;stroke:var(--good);stroke-width:3}
.t{font:12px -apple-system,Helvetica,sans-serif;fill:var(--fg)}
.tm{font:11px ui-monospace,Menlo,monospace;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="300" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)" /></marker>
</defs><g transform="translate(30,30)">
<rect class="floor" x="0" y="0" width="80" height="80" /><rect class="floor" x="80" y="0" width="80" height="80" /><rect class="floor" x="160" y="0" width="80" height="80" />
<rect class="floor" x="0" y="80" width="80" height="80" /><rect class="floor" x="80" y="80" width="80" height="80" /><rect class="floor" x="160" y="80" width="80" height="80" />
<rect class="floor" x="0" y="160" width="80" height="80" /><rect class="floor" x="80" y="160" width="80" height="80" /><rect class="floor" x="160" y="160" width="80" height="80" />
<circle class="player" cx="40" cy="40" r="16" /><text x="40" y="74" class="tm" text-anchor="middle">you (0,0)</text>
<circle class="npc" cx="120" cy="120" r="20" /><text x="120" y="125" class="t" text-anchor="middle">MOM</text>
<rect class="goal" x="84" y="84" width="72" height="72" />
<rect class="stand" x="86" y="6" width="68" height="68" /><path d="M120 50 L120 78" stroke="var(--good)" stroke-width="3" marker-end="url(#g)" />
<rect class="stand" x="86" y="166" width="68" height="68" /><path d="M120 190 L120 162" stroke="var(--good)" stroke-width="3" marker-end="url(#g)" />
<rect class="stand" x="6" y="86" width="68" height="68" /><path d="M50 120 L78 120" stroke="var(--good)" stroke-width="3" marker-end="url(#g)" />
<rect class="stand" x="166" y="86" width="68" height="68" /><path d="M190 120 L162 120" stroke="var(--good)" stroke-width="3" marker-end="url(#g)" />
</g></svg>
