<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="Littleroot around the lab door at T107: the local window ends at row 16, the door's only entry tile (7,17) lies below it" width="560" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor:#f3ead6;--wall:#7d776d;--water:#8cc3ea;--npc:#8c8f86;--obj:#b08a5a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.floor{fill:var(--floor);stroke:var(--line)}
.wall{fill:var(--wall);stroke:var(--line)}
.obj{fill:var(--obj);stroke:var(--line)}
.player{fill:var(--accent);stroke:#fff;stroke-width:3}
.goal{fill:none;stroke:var(--bad);stroke-width:3;stroke-dasharray:5 4}
.stand{fill:none;stroke:var(--good);stroke-width:3}
.t{font:12px -apple-system,Helvetica,sans-serif;fill:var(--fg)}
.tm{font:11px ui-monospace,Menlo,monospace;fill:var(--muted)}
.tg{font:700 12px -apple-system,Helvetica,sans-serif;fill:var(--good)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="560" height="330" style="fill:#ffffff;stroke:none" /><defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)" /></marker>
</defs><rect class="wall" x="200" y="20" width="240" height="160" /><text x="320" y="105" class="t" text-anchor="middle">Birch's lab (walls, rows 13–16)</text>
<rect class="obj" x="280" y="140" width="40" height="40" /><text x="300" y="165" class="t" text-anchor="middle">door</text><text x="300" y="132" class="tm" text-anchor="middle">(7,16)</text>
<rect class="goal" x="280" y="140" width="40" height="40" />
<line x1="0" y1="190" x2="560" y2="190" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="7 5" /><text x="10" y="206" class="tm">local window edge: rows 2–16 from (5,9)</text>
<rect class="floor" x="280" y="200" width="40" height="40" style="stroke-dasharray:4 3" /><rect class="stand" x="280" y="200" width="40" height="40" /><text x="300" y="256" class="tg" text-anchor="middle">(7,17) entry tile</text>
<path d="M300 236 L300 186" stroke="var(--good)" stroke-width="3" marker-end="url(#g)" /><text x="330" y="226" class="t">walk UP into the door</text>
<circle class="player" cx="120" cy="60" r="14" /><text x="120" y="92" class="tm" text-anchor="middle">player (5,9)</text>
<text x="10" y="300" class="t">Recorded at T107 (seq 1956), T151 (2998), T153 (3028): the planner cannot reach (7,16) because (7,17) is not in its grid.</text>
</svg>
