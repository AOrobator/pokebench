<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" role="img" aria-label="Request is checked, refused and returned to the model without native input" width="500" height="310"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f5f4ef;--card:#fff;--ink:#172c35;--muted:#455c65;--accent:#076b63;--line:#b5cbc6}
@media(min-width:1000000px){:root{--bg:#111c21;--card:#1b2b32;--ink:#edf7f5;--muted:#bfd2d1;--accent:#88dfcb;--line:#44615f}}
*{box-sizing:border-box}
svg{width:100%;height:auto}
svg text{fill:var(--ink);font-family:system-ui}
svg rect{fill:var(--bg);stroke:var(--line)}
svg path{stroke:var(--accent)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="500" height="310" style="fill:#ffffff;stroke:none" /><rect x="10" y="10" width="480" height="70" rx="10" /><text x="250" y="40" text-anchor="middle" font-size="18">Fresh state and requested input</text><text x="250" y="64" text-anchor="middle" font-size="15">Switch ON and eligible?</text><path d="M250 80v32" fill="none" stroke-width="3" /><text x="265" y="104" font-size="14">yes ↓</text><rect x="10" y="115" width="480" height="70" rx="10" /><text x="250" y="145" text-anchor="middle" font-size="21">Reject batch</text><text x="250" y="170" text-anchor="middle" font-size="17">0 native inputs</text><path d="M250 185v32" fill="none" stroke-width="3" /><text x="265" y="208" font-size="14">tool result ↓</text><rect x="10" y="220" width="480" height="70" rx="10" /><text x="250" y="249" text-anchor="middle" font-size="18">Current facts → next model decision</text><text x="250" y="274" text-anchor="middle" font-size="15">No destination inferred</text></svg>
