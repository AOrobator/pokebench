<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-label="Page capture at scroll and clear prompts" width="900" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#ffffff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#e0802a;--bad:#d2493a;--good:#2e9d63;
--floor:#f3ead6;--wall:#7d776d;--water:#8cc3ea;--npc:#8c8f86;--obj:#b08a5a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor:#3a362c;--wall:#5b5750;--water:#3f78a8;--npc:#6d7068;--obj:#8a6a3a;--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.tm{font:11px ui-monospace,Menlo,monospace;fill:var(--muted)}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--accent2) 22%,var(--card));stroke:var(--accent2);stroke-width:2}
.nt{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:11.5px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="210" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker></defs><text x="10" y="22" class="tm">printer state (pokeemerald RenderText)</text>
<g class="node"><rect x="10" y="34" width="200" height="44" rx="8" /><text x="110" y="54" class="nt">scroll_wait (\l)</text><text x="110" y="70" class="ns">RENDER_STATE_SCROLL_START</text></g>
<g class="node"><rect x="10" y="94" width="200" height="44" rx="8" /><text x="110" y="114" class="nt">page_wait (\p)</text><text x="110" y="130" class="ns">RENDER_STATE_CLEAR</text></g>
<g class="node"><rect x="10" y="154" width="200" height="44" rx="8" /><text x="110" y="174" class="nt">button_wait / dismiss_wait</text><text x="110" y="190" class="ns">RENDER_STATE_WAIT / message end</text></g>
<path class="flow" d="M210 56 L300 56" marker-end="url(#a)" /><path class="flow" d="M210 116 L300 116" marker-end="url(#a)" /><path class="flow" d="M210 176 L300 176" marker-end="url(#a)" />
<g class="node"><rect x="302" y="34" width="270" height="44" rx="8" /><text x="437" y="54" class="nt">OFF: cut a page here</text><text x="437" y="70" class="ns">a sentence splits at the scroll</text></g>
<g class="node hot"><rect x="590" y="34" width="300" height="44" rx="8" /><text x="740" y="54" class="nt">ON: keep reading, no page</text><text x="740" y="70" class="ns">the box scrolls one line; same page</text></g>
<g class="node"><rect x="302" y="94" width="588" height="44" rx="8" /><text x="596" y="120" class="nt">both: the page ends; the game clears the box</text></g>
<g class="node"><rect x="302" y="154" width="588" height="44" rx="8" /><text x="596" y="180" class="nt">both: the page ends</text></g>
</svg>
