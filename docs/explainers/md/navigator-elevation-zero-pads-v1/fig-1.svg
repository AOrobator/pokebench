<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="Walking from elevation 3 onto elevation 0 keeps previous elevation 3, which matches the warp" width="760" height="160">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="160" style="fill:#ffffff;stroke:none" /><rect x="20" y="40" width="150" height="60" rx="8" fill="#e3eaf3" stroke="#345779" /><text x="95" y="66" text-anchor="middle">Tile, elevation 3</text><text x="95" y="84" text-anchor="middle" class="small">previous = 3</text>
<rect x="220" y="40" width="150" height="60" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="295" y="66" text-anchor="middle">Pad, elevation 0</text><text x="295" y="84" text-anchor="middle" class="small">previous stays 3</text>
<rect x="420" y="40" width="320" height="60" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="580" y="66" text-anchor="middle">Warp event at elevation 3</text><text x="580" y="84" text-anchor="middle" class="small">matches previous, so it fires</text>
<path d="M170 70H220M370 70H420" stroke="#5a6b80" fill="none" />
</svg>
