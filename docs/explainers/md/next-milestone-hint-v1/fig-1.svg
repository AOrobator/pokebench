<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-label="Tool and pinned message paths" width="700" height="220">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="220" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="200" height="66" rx="10" class="box" /><text x="24" y="44" class="t">Model calls</text><text x="24" y="62" class="s">get_next_milestone (any time)</text>
 <rect x="10" y="130" width="200" height="66" rx="10" class="box" /><text x="24" y="154" class="t">Native milestone earned</text><text x="24" y="172" class="s">on the main path, observed in this run</text>
 <rect x="260" y="70" width="180" height="76" rx="10" class="game hot" /><text x="274" y="96" class="t">Main-path ladder</text><text x="274" y="114" class="s">28 milestones, human order;</text><text x="274" y="130" class="s">next = one after the furthest earned</text>
 <rect x="490" y="20" width="200" height="66" rx="10" class="navb" /><text x="504" y="44" class="t">Tool reply</text><text x="504" y="62" class="s">next goal + how many done</text>
 <rect x="490" y="130" width="200" height="66" rx="10" class="navb" /><text x="504" y="154" class="t">Pinned message</text><text x="504" y="172" class="s">MILESTONE REACHED … Next …</text>
 <path d="M210 53 C235 53 235 100 258 100" class="arr" marker-end="url(#a)" />
 <path d="M210 163 C235 163 235 118 258 118" class="arr" marker-end="url(#a)" />
 <path d="M440 100 C465 100 465 53 488 53" class="arr" marker-end="url(#a)" />
 <path d="M440 118 C465 118 465 163 488 163" class="arr" marker-end="url(#a)" />
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--soft)" /></marker></defs>
</svg>
