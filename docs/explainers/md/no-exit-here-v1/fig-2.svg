<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="What the game does at a map edge with no connection" width="720" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg{min-width:520px}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navf{fill:var(--nav-bg);stroke:var(--nav)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="200" style="fill:#ffffff;stroke:none" /><rect class="box" x="10" y="20" width="200" height="64" rx="8" /><text x="22" y="44">press toward the edge</text><text class="s" x="22" y="62">player on the last tile; the step</text><text class="s" x="22" y="76">is one cell into the padding</text>
<rect class="navf" x="250" y="20" width="220" height="64" rx="8" /><text class="m" x="262" y="44">InitMapLayoutData</text><text class="s" x="262" y="62">layout = map + 7-cell padding, filled</text><text class="s" x="262" y="76">MAPGRID_UNDEFINED; connections overwrite</text>
<rect class="navf" x="500" y="20" width="210" height="64" rx="8" /><text class="m" x="512" y="44">MapGridGetCollisionAt</text><text class="s" x="512" y="62">MAPGRID_UNDEFINED: returns 1</text><text class="s" x="512" y="76">(src/fieldmap.c)</text>
<rect class="navf" x="250" y="120" width="220" height="64" rx="8" /><text class="m" x="262" y="144">GetCollisionAtCoords</text><text class="s" x="262" y="162">COLLISION_IMPASSABLE</text><text class="s" x="262" y="176">(src/event_object_movement.c)</text>
<rect class="prior" x="500" y="120" width="210" height="64" rx="8" /><text class="m" x="512" y="144">PlayerNotOnBikeCollide</text><text class="s" x="512" y="162">bump, walk in place; no script,</text><text class="s" x="512" y="176">no text (src/field_player_avatar.c)</text>
<path d="M210 52 L250 52 M470 52 L500 52 M605 84 L470 140 M470 152 L500 152" class="arr" />
</svg>
