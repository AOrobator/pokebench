<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-label="An open goal is unchanged; a reached or done line gains a plain first line" width="760" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="170" style="fill:#ffffff;stroke:none" /><rect x="20" y="20" width="200" height="50" rx="8" fill="#e3eaf3" stroke="#345779" /><text x="120" y="50" text-anchor="middle">Latest line still open</text>
<rect x="20" y="100" width="200" height="50" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="120" y="130" text-anchor="middle">Latest line reached or done</text>
<rect x="290" y="20" width="440" height="50" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="510" y="50" text-anchor="middle">Story goal: "the line" (speaker, turn) unchanged</text>
<rect x="290" y="100" width="440" height="50" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="510" y="122" text-anchor="middle">Story goal: none open (latest line reached).</text><text x="510" y="140" text-anchor="middle" class="small">then the existing line, as evidence</text>
<path d="M220 45H290M220 125H290" stroke="#5a6b80" fill="none" />
</svg>
