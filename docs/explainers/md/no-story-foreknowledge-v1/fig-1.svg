<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="A name is shown once a delivered dialogue or battle page shows it" width="760" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--fg:#172a29;--muted:#546562;--line:#36735b;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--panel:#ffffff;--keep:#2a62b8;--keepbg:#eaf1fb}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:12px;fill:var(--muted)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2.5}
svg .keepbox{fill:var(--keepbg);stroke:var(--keep);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#36735b" /></marker></defs>
<rect class="box" x="10" y="20" width="220" height="70" rx="8" />
<text x="120" y="48" text-anchor="middle">dialogue page, field or battle</text>
<text class="small" x="120" y="70" text-anchor="middle">"MAY: Hi!" or "I'm ROXANNE, ..."</text>
<rect class="box" x="10" y="110" width="220" height="70" rx="8" />
<text x="120" y="138" text-anchor="middle">its call's result is delivered</text>
<text class="small" x="120" y="160" text-anchor="middle">no error (or it is this very result)</text>
<rect class="onbox" x="290" y="60" width="200" height="80" rx="8" />
<text x="390" y="92" text-anchor="middle">ShownStoryNames</text>
<text class="small" x="390" y="114" text-anchor="middle">NAME: label or name in caps</text>
<rect class="keepbox" x="550" y="20" width="200" height="70" rx="8" />
<text x="650" y="50" text-anchor="middle">shown: the name</text>
<text class="small" x="650" y="72" text-anchor="middle">"your rival MAY"</text>
<rect class="box" x="550" y="110" width="200" height="70" rx="8" />
<text x="650" y="140" text-anchor="middle">not yet: a role word</text>
<text class="small" x="650" y="162" text-anchor="middle">"your rival"</text>
<path class="arrow" d="M230,55L288,90" marker-end="url(#a)" />
<path class="arrow" d="M230,145L288,110" marker-end="url(#a)" />
<path class="arrow" d="M490,90L548,58" marker-end="url(#a)" />
<path class="arrow" d="M490,110L548,142" marker-end="url(#a)" />
</svg>
