<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Whole dialogue and observed progress remain separate" width="900" height="250"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f4f5ef;--ink:#202d26;--card:#fff;--line:#91a799;--accent:#28664d}
@media(min-width:1000000px){:root{--bg:#15211b;--ink:#e4eee7;--card:#213128;--line:#628b73;--accent:#9ed7b6}}
*{box-sizing:border-box}
svg{display:block;min-width:640px;width:100%;height:auto}
svg text{fill:var(--ink);font:16px system-ui}
svg rect{fill:var(--card);stroke:var(--line);stroke-width:2}
svg path{stroke:var(--accent);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="250" height="200" rx="12" /><text x="30" y="60">Delivered dialogue</text><text x="30" y="100">Head for RUSTBORO CITY</text><text x="30" y="135">Challenge GYM LEADER</text><text x="30" y="165">ROXANNE</text><path d="M260 100 H335 M325 90 L335 100 L325 110" /><text x="270" y="75">retain</text><rect x="340" y="20" width="250" height="200" rx="12" /><text x="360" y="60">Historical instruction</text><text x="360" y="100">Every selected page</text><text x="360" y="135">Exact words + sources</text><text x="360" y="170">No inferred completion</text><path d="M595 120 H650" /><text x="605" y="95">and</text><rect x="655" y="20" width="235" height="200" rx="12" /><text x="675" y="60">Observed progress</text><text x="675" y="100">Delivered location</text><text x="675" y="135">Delivered Story line</text><text x="675" y="170">Earlier location observations</text></svg>
