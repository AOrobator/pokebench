<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" role="img" aria-label="Route 103 sketch: the 15 by 15 readout window around the player at (11,21) and MAY's template at (10,3) outside it, with the other 18 listed objects" height="320">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --dot:#8a857a;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --dot:#8d9096; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --dot:#8d9096; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.win{fill:var(--nav-bg);stroke:var(--nav);stroke-width:2}
.dot{fill:var(--dot)}
.may{fill:var(--prior)}
.me{fill:var(--nav)}
.grid{stroke:var(--rule);stroke-width:1}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.p{stroke:var(--prior);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="320" style="fill:#ffffff;stroke:none" /><defs>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--prior)" /></marker>
</defs>
<text class="s" x="46" y="20">0</text><text class="s" x="124" y="20">10</text><text class="s" x="204" y="20">20</text><text class="s" x="284" y="20">30</text><text class="s" x="364" y="20">40</text><text class="s" x="444" y="20">50</text><text class="s" x="524" y="20">60</text><text class="s" x="604" y="20">70</text>
<text class="s" x="30" y="34">0</text><text class="s" x="24" y="114">10</text><text class="s" x="24" y="194">20</text>
<line class="grid" x1="50" y1="30" x2="650" y2="30" /><line class="grid" x1="50" y1="30" x2="50" y2="270" />
<rect class="win" x="82" y="142" width="120" height="120" rx="2" />
<text class="t" x="210" y="230">Readout window</text>
<text class="m" x="210" y="246">x 4..18, y 14..28</text>
<text class="s" x="210" y="262">local map + Field objects</text>
