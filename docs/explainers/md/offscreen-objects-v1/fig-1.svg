<circle class="dot" cx="446" cy="130" r="4" /><circle class="dot" cx="622" cy="122" r="4" /><circle class="dot" cx="574" cy="130" r="4" /><circle class="dot" cx="566" cy="130" r="4" /><circle class="dot" cx="454" cy="98" r="4" /><circle class="dot" cx="518" cy="74" r="4" /><circle class="dot" cx="526" cy="74" r="4" /><circle class="dot" cx="534" cy="74" r="4" /><circle class="dot" cx="214" cy="114" r="4" /><circle class="dot" cx="502" cy="138" r="4" /><circle class="dot" cx="454" cy="74" r="4" /><circle class="dot" cx="590" cy="90" r="4" /><circle class="dot" cx="630" cy="98" r="4" /><circle class="dot" cx="590" cy="74" r="4" /><circle class="dot" cx="590" cy="106" r="4" /><circle class="dot" cx="342" cy="82" r="4" /><circle class="dot" cx="342" cy="138" r="4" /><circle class="dot" cx="566" cy="90" r="4" />
</g>
<text class="s" x="222" y="110">BOY_1 (20,10)</text>
<text class="s" x="420" y="170">18 other objects of map 0/18, grey dots</text>
<text class="s" x="420" y="186">(trainers, berry trees, item balls, cuttable trees)</text>
<text class="s" x="50" y="300">Drawn to scale in tiles (8 px per tile) from the turn 416 ON readout. Terrain and the map border are not drawn.</text>
