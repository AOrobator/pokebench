<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" role="img" aria-label="Switch wiring from preset to the readout block" height="220">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --dot:#8a857a;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --dot:#8d9096; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --dot:#8d9096; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.hot{stroke:var(--hot);stroke-width:2.4}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="220" style="fill:#ffffff;stroke:none" /><defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)" /></marker></defs>
<rect class="box" x="10" y="20" width="150" height="56" rx="6" /><text class="t" x="22" y="42">Preset / switchboard</text><text class="m" x="22" y="62">offscreen-objects-v1</text>
<rect class="box" x="190" y="20" width="160" height="56" rx="6" /><text class="t" x="202" y="42">serverFeatureEnv</text><text class="m" x="202" y="62">POKEBENCH_FEATURES_OFF</text>
<rect class="box" x="380" y="20" width="150" height="56" rx="6" /><text class="t" x="392" y="42">rerender.read_state</text><text class="m" x="392" y="62">offscreen_objects_enabled</text>
<rect class="box" x="560" y="20" width="150" height="56" rx="6" /><text class="t" x="572" y="42">GameState</text><text class="m" x="572" y="62">.offscreen_objects</text>
<path class="arr" d="M160,48 L188,48" marker-end="url(#ax)" /><path class="arr" d="M350,48 L378,48" marker-end="url(#ax)" /><path class="arr" d="M530,48 L558,48" marker-end="url(#ax)" />
<path class="arr" d="M635,76 L635,128" marker-end="url(#ax)" /><text class="s" x="545" y="100">on, overworld, not in battle;</text><text class="s" x="545" y="114">else None (not read)</text>
<rect class="game hot" x="380" y="130" width="330" height="72" rx="6" /><text class="t" x="392" y="152">format_readout</text><text class="m" x="392" y="172">offscreen_text(...) after Field objects</text><text class="m" x="392" y="188">needs live-object-sprites-v1</text>
<rect class="box" x="10" y="130" width="330" height="72" rx="6" /><text class="t" x="22" y="152">StoryCharacters.text(placed)</text><text class="m" x="22" y="172">placed = {local id: object}</text><text class="m" x="22" y="188">OUT_OF_VIEW → "MAY at 10,3 (…)"</text>
<path class="arr" d="M378,166 L342,166" marker-end="url(#ax)" /><text class="s" x="346" y="124">passes tiles</text>
</svg>
