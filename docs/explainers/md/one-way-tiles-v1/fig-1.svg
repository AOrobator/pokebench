<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="A one-way tile: open west and east, walled north and south" width="720" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#fff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#c2410c;--bad:#d2493a;--good:#2e9d63;
--floor1:#efe6d2;--floor2:#e3d8bf;--wall1:#7d776d;--wall2:#6a645b;--grid:rgba(0,0,0,.10);--warp:#b9d3f7;--chair1:#c98c4a;--chair2:#8a5a2b;--edge:#d2493a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f59e5b;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#38352c;--floor2:#2f2c25;--wall1:#5b5750;--wall2:#4a4640;--grid:rgba(255,255,255,.08);--warp:#2c4a73;--chair1:#a5713a;--chair2:#6e4520;--edge:#ff7a6a;--shadow:rgba(0,0,0,.35)}}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.glyph{font:700 16px ui-monospace,Menlo,monospace;fill:var(--fg);text-anchor:middle}
.chair{fill:var(--chair1);stroke:var(--chair2);stroke-width:2.5;opacity:.85}
.edge{stroke:var(--edge);stroke-width:5;stroke-linecap:round}
.ok{fill:none;stroke:var(--good);stroke-width:4;stroke-linecap:round}
.no{fill:none;stroke:var(--bad);stroke-width:4;stroke-linecap:round;stroke-dasharray:6 6}
.lbl{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.sub{font:12px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="ano" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)" /></marker>
<marker id="aok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)" /></marker>
<pattern id="floor" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--floor1)" /><circle cx="2" cy="2" r="1" fill="var(--floor2)" /><circle cx="7" cy="7" r="1" fill="var(--floor2)" /></pattern>
</defs><rect x="300" y="65" width="120" height="120" fill="url(#floor)" stroke="var(--line)" />
<rect x="318" y="83" width="84" height="84" rx="14" class="chair" />
<text x="360" y="137" class="glyph" style="font-size:34px">+</text>
<line x1="296" y1="65" x2="424" y2="65" class="edge" style="stroke-width:8" /><line x1="296" y1="185" x2="424" y2="185" class="edge" style="stroke-width:8" />
<path d="M190,125 L285,125" class="ok" marker-start="url(#aok)" marker-end="url(#aok)" /><path d="M435,125 L530,125" class="ok" marker-start="url(#aok)" marker-end="url(#aok)" />
<path d="M360,10 L360,52" class="no" marker-start="url(#ano)" marker-end="url(#ano)" /><path d="M360,198 L360,240" class="no" marker-start="url(#ano)" marker-end="url(#ano)" />
<text x="140" y="120" class="lbl">west side</text><text x="140" y="138" class="sub">open, both ways</text>
<text x="580" y="120" class="lbl">east side</text><text x="580" y="138" class="sub">open, both ways</text>
<text x="470" y="30" class="lbl">north side walled</text><text x="470" y="47" class="sub">refused in and out</text>
<text x="470" y="215" class="lbl">south side walled</text><text x="470" y="232" class="sub">refused in and out</text>
<text x="140" y="232" class="sub">0xC0 · collision 0</text><text x="140" y="214" class="sub">MB_IMPASSABLE_SOUTH_AND_NORTH</text>
</svg>
