<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Exit check on current tile and entry check on next tile" width="720" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#fff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#c2410c;--bad:#d2493a;--good:#2e9d63;
--floor1:#efe6d2;--floor2:#e3d8bf;--wall1:#7d776d;--wall2:#6a645b;--grid:rgba(0,0,0,.10);--warp:#b9d3f7;--chair1:#c98c4a;--chair2:#8a5a2b;--edge:#d2493a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f59e5b;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#38352c;--floor2:#2f2c25;--wall1:#5b5750;--wall2:#4a4640;--grid:rgba(255,255,255,.08);--warp:#2c4a73;--chair1:#a5713a;--chair2:#6e4520;--edge:#ff7a6a;--shadow:rgba(0,0,0,.35)}}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.route{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.sub{font:12px -apple-system,Helvetica,sans-serif;fill:var(--muted);text-anchor:middle}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="200" style="fill:#ffffff;stroke:none" /><defs><marker id="ago" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" /></marker>
<pattern id="floor" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--floor1)" /><circle cx="2" cy="2" r="1" fill="var(--floor2)" /><circle cx="7" cy="7" r="1" fill="var(--floor2)" /></pattern>
</defs><rect x="110" y="50" width="110" height="110" fill="url(#floor)" stroke="var(--line)" /><rect x="220" y="50" width="110" height="110" fill="url(#floor)" stroke="var(--line)" />
<text x="165" y="110" class="lbl">current</text><text x="275" y="110" class="lbl">next</text>
<path d="M150,140 L295,140" class="route" marker-end="url(#ago)" /><text x="222" y="185" class="sub">moving RIGHT</text>
<line x1="216" y1="54" x2="216" y2="156" stroke="var(--accent2)" stroke-width="5" /><line x1="224" y1="54" x2="224" y2="156" stroke="var(--accent)" stroke-width="5" />
<text x="216" y="40" class="sub" style="text-anchor:end">current's east side walled?</text><text x="226" y="40" class="sub" style="text-anchor:start">  next's west side walled?</text>
<text x="520" y="70" class="lbl" style="text-anchor:start">Refused if either is walled</text>
<text x="400" y="98" class="sub" style="text-anchor:start">gOppositeDirectionBlockedMetatileFuncs[dir](current)</text>
<text x="400" y="118" class="sub" style="text-anchor:start">gDirectionBlockedMetatileFuncs[dir](next)</text>
<text x="400" y="146" class="sub" style="text-anchor:start">IsMetatileDirectionallyImpassable</text>
<text x="400" y="166" class="sub" style="text-anchor:start">Ledge jumps skip it (ShouldJumpLedge runs first)</text>
</svg>
