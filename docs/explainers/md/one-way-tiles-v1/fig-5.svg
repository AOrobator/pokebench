<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="Switch wiring" width="760" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#fff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#c2410c;--bad:#d2493a;--good:#2e9d63;
--floor1:#efe6d2;--floor2:#e3d8bf;--wall1:#7d776d;--wall2:#6a645b;--grid:rgba(0,0,0,.10);--warp:#b9d3f7;--chair1:#c98c4a;--chair2:#8a5a2b;--edge:#d2493a;--shadow:rgba(30,30,20,.10)}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f59e5b;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#38352c;--floor2:#2f2c25;--wall1:#5b5750;--wall2:#4a4640;--grid:rgba(255,255,255,.08);--warp:#2c4a73;--chair1:#a5713a;--chair2:#6e4520;--edge:#ff7a6a;--shadow:rgba(0,0,0,.35)}}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.node.hot rect{fill:color-mix(in srgb,var(--chair1) 22%,var(--card));stroke:var(--chair2);stroke-width:2}
.nt{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.ns{font:11.5px ui-monospace,Menlo,monospace;fill:var(--muted);text-anchor:middle}
.flow{fill:none;stroke:var(--muted);stroke-width:2}
.fl{font:11px -apple-system,Helvetica,sans-serif;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="210" style="fill:#ffffff;stroke:none" /><defs><marker id="aflow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker>
</defs><g class="node"><rect x="10" y="80" width="150" height="50" rx="10" /><text x="85" y="102" class="nt">Run preset</text><text x="85" y="119" class="ns">one-way-tiles-v1</text></g>
<g class="node"><rect x="215" y="20" width="170" height="50" rx="10" /><text x="300" y="42" class="nt">serverFeatureEnv</text><text x="300" y="59" class="ns">POKEBENCH_FEATURES_OFF</text></g>
<g class="node hot"><rect x="440" y="20" width="200" height="50" rx="10" /><text x="540" y="42" class="nt">LocalMap.text(edge_walls)</text><text x="540" y="59" class="ns">+ glyph, legend, list</text></g>
<g class="node"><rect x="215" y="140" width="170" height="50" rx="10" /><text x="300" y="162" class="nt">withNavigation</text><text x="300" y="179" class="ns">navigationTool({oneWay})</text></g>
<g class="node hot"><rect x="440" y="140" width="200" height="50" rx="10" /><text x="540" y="162" class="nt">planNavigation</text><text x="540" y="179" class="ns">exit + entry checks</text></g>
<path d="M160,95 L212,50" class="flow" marker-end="url(#aflow)" /><path d="M160,115 L212,160" class="flow" marker-end="url(#aflow)" />
<path d="M385,45 L437,45" class="flow" marker-end="url(#aflow)" /><path d="M385,165 L437,165" class="flow" marker-end="url(#aflow)" />
<text x="650" y="49" class="fl">model text</text><text x="650" y="169" class="fl">button presses</text>
<text x="10" y="150" class="fl">absent in old presets → OFF</text>
</svg>
