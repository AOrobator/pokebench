<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="Story strip with where the game first names a gym and Rustboro, and where the prompt names them" height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.tick{stroke:var(--soft);stroke-width:1}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="200" style="fill:#ffffff;stroke:none" /><line x1="20" y1="100" x2="680" y2="100" class="arr" />
<g><line x1="30" y1="92" x2="30" y2="108" class="tick" /><text x="30" y="126" class="s" text-anchor="middle">boot</text></g>
<g><line x1="150" y1="92" x2="150" y2="108" class="tick" /><text x="150" y="126" class="s" text-anchor="middle">house (TV)</text></g>
<g><line x1="290" y1="92" x2="290" y2="108" class="tick" /><text x="290" y="126" class="s" text-anchor="middle">rival battle</text></g>
<g><line x1="400" y1="92" x2="400" y2="108" class="tick" /><text x="400" y="126" class="s" text-anchor="middle">Petalburg (Dad)</text></g>
<g><line x1="520" y1="92" x2="520" y2="108" class="tick" /><text x="520" y="126" class="s" text-anchor="middle">Route 104</text></g>
<g><line x1="600" y1="92" x2="600" y2="108" class="tick" /><text x="600" y="126" class="s" text-anchor="middle">Petalburg Woods</text></g>
<rect x="20" y="30" width="190" height="44" rx="6" class="prior" />
<text x="30" y="49" class="t">prompt, turn 1</text>
<text x="30" y="65" class="s">"Gym Leader in Rustboro City"</text>
<line x1="30" y1="74" x2="30" y2="92" class="arr" />
<rect x="110" y="140" width="190" height="44" rx="6" class="game" />
<text x="120" y="159" class="t">first "GYM" from the game</text>
<text x="120" y="175" class="s">MOM: "It's PETALBURG GYM!"</text>
<line x1="150" y1="140" x2="150" y2="108" class="arr" />
<rect x="455" y="140" width="235" height="44" rx="6" class="game" />
<text x="465" y="159" class="t">first "RUSTBORO" from the game</text>
<text x="465" y="175" class="s">map edge, then Woods dialogue</text>
<line x1="520" y1="140" x2="520" y2="108" class="arr" />
<rect x="230" y="30" width="200" height="44" rx="6" class="prior" />
<text x="240" y="49" class="t">4caa T273</text>
<text x="240" y="65" class="s">"the LAB (Rustboro City)"</text>
<line x1="290" y1="74" x2="290" y2="92" class="arr" />
</svg>
