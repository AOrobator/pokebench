<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" width="660" height="210" role="img" aria-label="Action counter with a banked hold and a retirement">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="210" style="fill:#ffffff;stroke:none" /><rect x="1" y="1" width="658" height="208" fill="#fff" stroke="#ddd" />
<g font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#1a1a1a">
<line x1="30" y1="60" x2="620" y2="60" stroke="#bbb" />
<g fill="#666">
<text x="30" y="52">0</text><text x="150" y="52">10</text><text x="270" y="52">20</text><text x="390" y="52">30</text><text x="510" y="52">40</text><text x="600" y="52">50</text>
</g>
<rect x="30" y="70" width="170" height="26" fill="#eef2f8" stroke="#8aa" />
<text x="36" y="87">open loss · counting</text>
<rect x="200" y="70" width="70" height="26" fill="#f8f2ee" stroke="#aa8" />
<text x="206" y="87">battle</text>
<rect x="270" y="70" width="60" height="26" fill="#f8f2ee" stroke="#aa8" />
<text x="276" y="87">hold</text>
<rect x="330" y="70" width="290" height="26" fill="#eef6ee" stroke="#7a7" />
<text x="336" y="87">field free again: the banked note is sent at the first free result</text>
<path d="M390 100 V128" stroke="#555" marker-end="url(#b)" />
<text x="398" y="140" fill="#333">level 1 sent at the next free result (not restarted)</text>
<path d="M620 100 V164" stroke="#555" marker-end="url(#b)" />
<text x="330" y="180" fill="#333">a win against that leader, or the game's defeated flag, retires the record: no more notes</text>
<rect x="240" y="150" width="80" height="24" fill="#f4f4f4" stroke="#bbb" />
<text x="246" y="167">retired</text>
</g>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#555" /></marker></defs>
</svg>
