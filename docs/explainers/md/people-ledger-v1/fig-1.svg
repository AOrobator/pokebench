<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Readout layout off and on" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="300" style="fill:#ffffff;stroke:none" /><text x="20" y="22" class="t">Off (today)</text>
<text x="370" y="22" class="t">On</text>
<g>
<rect x="20" y="34" width="300" height="250" class="box" rx="6" />
<text x="32" y="56" class="m">1  Navigation: …</text>
<text x="32" y="74" class="m">2  Screen: overworld</text>
<text x="32" y="92" class="m">7  Location: …MAYS HOUSE 1F</text>
<text x="32" y="110" class="m">8  Position: X=2, Y=6, facing up</text>
<text x="32" y="128" class="m">9  Party (player): TORCHIC Lv5 …</text>
<text x="32" y="150" class="s">… local map, warps, field objects …</text>
<rect x="28" y="196" width="284" height="22" class="prior" rx="3" />
<text x="32" y="211" class="m">49 Story characters here: none. Not on…</text>
<text x="32" y="246" class="s">… interaction candidates, connections …</text>
<text x="32" y="270" class="m">67 Warp destination at (2,2): …</text>
</g>
<g>
<rect x="370" y="34" width="310" height="250" class="box" rx="6" />
<text x="382" y="56" class="m">1  Navigation: …</text>
<text x="382" y="74" class="m">7  Location: …MAYS HOUSE 1F</text>
<text x="382" y="92" class="m">8  Position: X=2, Y=6, facing up</text>
<rect x="378" y="100" width="294" height="78" class="game" rx="3" />
<text x="382" y="116" class="m">9  People and objects here (…):</text>
<text x="382" y="134" class="m">10 - object 4, sprite WOMAN_4 … turn 145</text>
<text x="382" y="152" class="m">11 - object 6, sprite NINJA_BOY … not talked</text>
<text x="382" y="170" class="m">12 Story characters here: none. Not on…</text>
<text x="382" y="196" class="m">13 Party (player): TORCHIC Lv5 …</text>
<text x="382" y="230" class="s">… the rest is byte-for-byte unchanged,</text>
<text x="382" y="246" class="s">including the presence line, now at 53</text>
</g>
</svg>
