<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" role="img" aria-label="Faced object and counter rule" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --wall:#9b968a; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --wall:#55585e; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.wall{fill:var(--wall);stroke:var(--rule)}
.ground{fill:var(--ground);stroke:var(--rule)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="170" style="fill:#ffffff;stroke:none" /><g transform="translate(20,30)">
<text x="0" y="-10" class="t">Adjacent (T145)</text>
<rect x="0" y="20" width="40" height="40" class="ground" /><text x="20" y="45" text-anchor="middle" class="m">@ →</text>
<rect x="40" y="20" width="40" height="40" class="game" /><text x="60" y="45" text-anchor="middle" class="m">4</text>
<text x="0" y="85" class="s">player (2,8) facing right;</text>
<text x="0" y="100" class="s">object 4 WOMAN_4 at (3,8)</text>
</g>
<g transform="translate(230,30)">
<text x="0" y="-10" class="t">Across a counter</text>
<rect x="0" y="20" width="40" height="40" class="ground" /><text x="20" y="45" text-anchor="middle" class="m">@ ↑</text>
<rect x="40" y="20" width="40" height="40" class="wall" /><text x="60" y="45" text-anchor="middle" class="m">0x80</text>
<rect x="80" y="20" width="40" height="40" class="game" /><text x="100" y="45" text-anchor="middle" class="m">3</text>
<text x="0" y="85" class="s">empty counter tile, so the clerk</text>
<text x="0" y="100" class="s">one tile beyond is the one talked to</text>
</g>
<g transform="translate(450,30)">
<text x="0" y="-10" class="t">Not a talk</text>
<rect x="0" y="20" width="40" height="40" class="ground" /><text x="20" y="45" text-anchor="middle" class="m">@ ↑</text>
<rect x="40" y="20" width="40" height="40" class="wall" /><text x="60" y="45" text-anchor="middle" class="m">#</text>
<rect x="80" y="20" width="40" height="40" class="prior" /><text x="100" y="45" text-anchor="middle" class="m">3</text>
<text x="0" y="85" class="s">a plain wall is not a counter:</text>
<text x="0" y="100" class="s">nobody is faced</text>
</g>
</svg>
