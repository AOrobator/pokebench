<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" role="img" aria-label="How the switch reaches the model" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#d8f0e0;--page:#f6ffff;--fg:#202020;--muted:#506058;--fr:#318b73;--rb:#629cde;--pn:#9cdea4;--rw:#f6ffff;--ln:#62b48b;--win:#f8f8f8;--winline:#5a6a8c;--winin:#a8c0e8;--shadow:#d0d0c8;--cursor:#e04030;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef7f0;--box:#e6f4ea;--line:#62b48b;--panel:#f6ffff}
@media (min-width:1000000px){:root{--bg:#10241c;--page:#17302a;--fg:#ecf2ee;--muted:#a9c2b6;--pn:#2f5a44;--rw:#1c3a31;--ln:#4f9a78;--win:#f8f8f8;--shadow:#0c1a14;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#1c3a31;--box:#24463a;--line:#4f9a78;--panel:#17302a}}
*{box-sizing:border-box}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="150" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--fg)" /></marker></defs>
<rect x="10" y="25" width="230" height="90" rx="8" fill="var(--page)" stroke="var(--ln)" stroke-width="2" />
<text x="22" y="52">Preset / bundle arm</text>
<text class="small" x="22" y="74">the switch is ON only in the</text>
<text class="small" x="22" y="90">bundle arm</text>
<path d="M242 70 L262 70" stroke="var(--fg)" stroke-width="2" marker-end="url(#a)" />
<rect x="265" y="25" width="230" height="90" rx="8" fill="var(--pn)" stroke="var(--ln)" stroke-width="4" />
<text x="277" y="52">Game server (env/pokebench_env)</text>
<text class="small" x="277" y="74">pokedex_own.py read_pokedex,</text>
<text class="small" x="277" y="90">wild_foes, dex_lines</text>
<path d="M497 70 L517 70" stroke="var(--fg)" stroke-width="2" marker-end="url(#a)" />
<rect x="520" y="25" width="230" height="90" rx="8" fill="var(--page)" stroke="var(--ln)" stroke-width="2" />
<text x="532" y="52">Tool result the model reads</text>
<text class="small" x="532" y="74">Line after the Party line; one</text>
<text class="small" x="532" y="90">line per wild foe in battle</text>
<text class="small" x="10" y="140">The highlighted box is the only code that changes what the model reads. OFF: it adds nothing.</text></svg>
