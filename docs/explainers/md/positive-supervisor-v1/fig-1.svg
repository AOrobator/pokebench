<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" role="img" aria-label="Probe results, 32 samples a side" height="220">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="220" style="fill:#ffffff;stroke:none" /><g font-size="12">
<text x="0" y="20">Party menu mid-battle (827): backs out with B</text>
<rect x="300" y="8" width="62" height="14" fill="var(--muted)" /><text x="368" y="20">off 10/32</text>
<rect x="300" y="26" width="200" height="14" fill="var(--keep)" /><text x="506" y="38">on 32/32</text>
<text x="0" y="80">Woods cycle (3411): takes the wrong south warp</text>
<rect x="300" y="68" width="31" height="14" fill="var(--muted)" /><text x="337" y="80">off 5/32</text>
<rect x="300" y="86" width="1" height="14" fill="var(--keep)" /><text x="306" y="98">on 0/32</text>
<text x="0" y="140">Route 102 ledge pocket (3259): repeats the failed walk</text>
<rect x="300" y="128" width="56" height="14" fill="var(--muted)" /><text x="362" y="140">off 9/32</text>
<rect x="300" y="146" width="131" height="14" fill="var(--drop)" /><text x="437" y="158">on 21/32</text>
<text x="0" y="200">Bundle loops (f28d 451, 2301, 2862): no change over the breaker and stall gate</text>
</g>
</svg>
