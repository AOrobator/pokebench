<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 205" role="img" aria-label="Refused battle to town to healing place, then return" width="820" height="205"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f5f4ee;--fg:#172a29;--panel:#fff;--line:#36735b;--muted:#546562}
