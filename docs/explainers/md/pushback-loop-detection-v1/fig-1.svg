<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="A push-back on Route 101 and one at the Littleroot twin" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="18" class="t">Birch, one call (T263)</text>
<rect x="10" y="30" width="60" height="60" rx="4" class="prior" /><text x="40" y="56" text-anchor="middle">(6,15)</text><text x="40" y="74" text-anchor="middle" class="s">script</text>
<rect x="74" y="30" width="60" height="60" rx="4" class="game" /><text x="104" y="56" text-anchor="middle">(7,15)</text><text x="104" y="74" text-anchor="middle" class="s">anchor</text>
<path d="M98 34 C 90 10, 54 10, 46 30" class="arr p" /><text x="72" y="12" text-anchor="middle" class="s">LEFT</text>
<path d="M46 90 C 54 112, 90 112, 98 90" class="arr g" /><text x="72" y="122" text-anchor="middle" class="s">script walks back</text>
<text x="160" y="50">press LEFT,LEFT,LEFT,UP,UP,UP from settled (7,15)</text>
<text x="160" y="68">→ left the tile, a message held the controls</text>
<text x="160" y="86">→ result settled at (7,15) again = push-back of that input</text>
<text x="10" y="150" class="t">Twin, two calls (T143 + T144)</text>
<rect x="10" y="162" width="60" height="60" rx="4" class="prior" /><text x="40" y="188" text-anchor="middle">(11,1)</text><text x="40" y="206" text-anchor="middle" class="s">script</text>
<rect x="74" y="162" width="60" height="60" rx="4" class="game" /><text x="104" y="188" text-anchor="middle">(11,2)</text><text x="104" y="206" text-anchor="middle" class="s">anchor</text>
<text x="160" y="182">UP → (11,1), result locked (script running): not settled, keep going</text>
<text x="160" y="200">UP → message, auto-advance, script walks back → settled (11,2)</text>
<text x="160" y="218">= push-back of the inputs [UP],[UP]</text>
</svg>
