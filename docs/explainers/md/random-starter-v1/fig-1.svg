<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Flow from the model's press at the starter bag to the harness pick and back to the model">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#5b6475;--line:#8a93a6;--ok:#2f7d4f;--warn:#b5651d;--box:#ffffff;--hi:#fff4c8}
svg text{font-family:inherit;font-size:13px;fill:var(--ink)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="820" height="260" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475" /></marker></defs>
<rect x="10" y="20" width="170" height="70" rx="8" fill="#ffffff" stroke="#8a93a6" />
<text x="24" y="46">Model calls press</text><text x="24" y="66">(any buttons)</text>
<rect x="230" y="20" width="200" height="70" rx="8" fill="#fff4c8" stroke="#b5651d" />
<text x="244" y="44">Bag open, party empty?</text><text x="244" y="64">active_ui.phase starter_*</text><text x="244" y="82">(read before any input)</text>
<rect x="480" y="20" width="320" height="70" rx="8" fill="#ffffff" stroke="#2f7d4f" />
<text x="494" y="44">Pick once per run: TREECKO or MUDKIP</text><text x="494" y="64">50/50 from crypto.randomInt(2)</text><text x="494" y="82">The model's buttons are not sent</text>
<rect x="480" y="130" width="320" height="110" rx="8" fill="#ffffff" stroke="#2f7d4f" />
<text x="494" y="154">One button per press, state read after each:</text>
<text x="494" y="176">selection: LEFT or RIGHT until highlighted, then A</text>
<text x="494" y="196">YES/NO: UP if NO is highlighted, then A</text>
<text x="494" y="216">transition: wait (100 ms reads, 10 s cap)</text>
<text x="494" y="234">cap: 12 presses</text>
<rect x="10" y="150" width="380" height="70" rx="8" fill="#ffffff" stroke="#8a93a6" />
<text x="24" y="176">Result: the screen after the pick, headed by</text>
<text x="24" y="198">"Starter pick: the harness chose MUDKIP at random…"</text>
<line x1="180" y1="55" x2="228" y2="55" stroke="#5b6475" marker-end="url(#a)" />
<line x1="430" y1="55" x2="478" y2="55" stroke="#5b6475" marker-end="url(#a)" /><text x="436" y="48">yes</text>
<line x1="640" y1="90" x2="640" y2="128" stroke="#5b6475" marker-end="url(#a)" />
<line x1="480" y1="185" x2="392" y2="185" stroke="#5b6475" marker-end="url(#a)" /><text x="400" y="178">bag closed</text>
<line x1="330" y1="90" x2="330" y2="148" stroke="#5b6475" stroke-dasharray="5 4" marker-end="url(#a)" /><text x="338" y="122">no: press as before</text>
</svg>
