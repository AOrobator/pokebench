<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Decision for the field-message and menu lines" width="720" height="300">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.nav{fill:var(--nav-bg);stroke:var(--nav)}
.arrow{stroke:var(--soft);fill:none;stroke-width:1.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="300" style="fill:#ffffff;stroke:none" /><rect class="box" x="10" y="10" width="220" height="70" rx="6" />
   <text class="t" x="22" y="32">Field message box</text>
   <text class="s" x="22" y="50">mode 0x020375BC = 0 (hidden)</text>
   <text class="s" x="22" y="66">window 0 not drawn, printer 0 idle</text>
   <text class="s" x="22" y="78">no Task_DrawFieldMessage, no read failure</text>
   <rect class="game" x="270" y="10" width="200" height="40" rx="6" />
   <text x="282" y="34">"none (no message box is open)"</text>
   <rect class="prior" x="270" y="60" width="200" height="40" rx="6" />
   <text x="282" y="84">otherwise: today's "unavailable"</text>
   <path class="arrow" d="M230 35 L270 30" /><path class="arrow" d="M230 60 L270 80" />
   <rect class="box" x="510" y="10" width="200" height="90" rx="6" />
   <text class="t" x="522" y="32">Script context</text>
   <text class="s" x="522" y="50">status 0x03000E38, mode 0x03000E41</text>
   <text class="s" x="522" y="66">SHUTDOWN or STOPPED: no script</text>
   <text class="s" x="522" y="82">NATIVE 0x0809A671: movement_wait</text>
   <path class="arrow" d="M470 30 L510 40" />
   <rect class="box" x="10" y="150" width="220" height="80" rx="6" />
   <text class="t" x="22" y="172">Menu line (no selection)</text>
   <text class="s" x="22" y="190">needs active-ui-ownership-v1</text>
   <text class="s" x="22" y="206">an interface owns input?</text>
   <text class="s" x="22" y="222">field free, or no sMenu window drawn?</text>
   <rect class="nav" x="270" y="140" width="250" height="36" rx="6" />
   <text x="282" y="162">owner: "no menu choice open (…Interface…)"</text>
   <rect class="game" x="270" y="184" width="250" height="36" rx="6" />
   <text x="282" y="206">free field or no window: "Menu: none open"</text>
   <rect class="prior" x="270" y="228" width="250" height="52" rx="6" />
   <text x="282" y="248">locked + drawn sMenu window, no owner:</text>
   <text x="282" y="266">today's "Unverified menu buffer" (could be real)</text>
   <path class="arrow" d="M230 170 L270 158" /><path class="arrow" d="M230 190 L270 202" /><path class="arrow" d="M230 215 L270 250" />
  </svg>
