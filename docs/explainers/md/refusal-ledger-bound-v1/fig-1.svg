<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="760" role="img" aria-label="Newest entries kept within 4,000 chars" height="120">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#5b6578;--line:#c9d1df}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="120" style="fill:#ffffff;stroke:none" /><g font-size="12">
<text x="10" y="18">Entries on this map, oldest → newest (each about 3,000 chars at 9e33)</text>
<g fill="#f1d9d3" stroke="#b5523b"><rect x="10" y="30" width="80" height="30" /><rect x="95" y="30" width="80" height="30" /><rect x="180" y="30" width="80" height="30" /><rect x="265" y="30" width="80" height="30" /><rect x="350" y="30" width="80" height="30" /></g>
<g fill="#dcefe3" stroke="#2f7d4f"><rect x="435" y="30" width="80" height="30" /></g>
<text x="220" y="82" text-anchor="middle" fill="#b5523b">"N older refusal entries on this map are left out."</text>
<text x="475" y="82" text-anchor="middle" fill="#2f7d4f">kept while ≤ 4,000 chars</text>
<text x="10" y="108">The newest entry always stays, even if it alone is over 4,000 chars. Kept entries are shown in their usual order.</text>
</g></svg>
