<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 256" width="690" height="256" role="img" aria-label="Per-direction loop">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f6f8;--fg:#162333;--card:#fff;--muted:#5a6878;--floor:#e9efe3;--grass:#9fd08a;--ledge:#c9a46a;--walk:#2b6b9d;--stop:#c0392b;--dash:#8a96a3}
*{box-sizing:border-box}
svg text{font:12px system-ui,-apple-system,sans-serif;fill:var(--fg)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="690" height="256" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--walk)" /><text x="22" y="44">read fresh state</text><text x="22" y="62">just before the press</text>
 <rect x="190" y="20" width="160" height="56" rx="8" fill="var(--card)" stroke="var(--walk)" /><text x="200" y="44">check this direction</text><text x="200" y="62">by navigate_to's rules</text>
 <rect x="380" y="20" width="140" height="56" rx="8" fill="var(--card)" stroke="var(--walk)" /><text x="392" y="44">one ordinary press</text><text x="392" y="62">(no running)</text>
 <rect x="550" y="20" width="130" height="56" rx="8" fill="var(--card)" stroke="var(--walk)" /><text x="560" y="44">landed where</text><text x="560" y="62">expected?</text>
 <path d="M160 48 H186" stroke="var(--fg)" marker-end="url(#b)" /><path d="M350 48 H376" stroke="var(--fg)" marker-end="url(#b)" /><path d="M520 48 H546" stroke="var(--fg)" marker-end="url(#b)" />
 <path d="M615 76 V120 H85 V80" fill="none" stroke="var(--fg)" marker-end="url(#b)" /><text x="250" y="114">yes, and not a warp: next direction</text>
 <path d="M270 76 V170" stroke="var(--stop)" marker-end="url(#c)" /><text x="190" y="190">refused: "Stopped before step N: reason"</text>
 <path d="M640 76 V220" stroke="var(--stop)" marker-end="url(#c)" /><text x="330" y="232">no, map changed, battle or message, or a warp:</text><text x="330" y="246">"Stopped after step N: …"</text>
 <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)" /></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--stop)" /></marker></defs>
</svg>
