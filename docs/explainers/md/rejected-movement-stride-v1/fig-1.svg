</style><rect x="0" y="0" width="600" height="150" style="fill:#ffffff;stroke:none" /><g fill="#eef6dc" stroke="#172d4d"><rect x="20" y="25" width="90" height="70" /><rect x="110" y="25" width="90" height="70" /><rect x="200" y="25" width="90" height="70" /><rect x="290" y="25" width="90" height="70" /></g><g fill="#172d4d" font-size="18"><text x="35" y="65">START</text><text x="140" y="65">1 →</text><text x="230" y="65">2 →</text><text x="320" y="65">3</text><text x="400" y="65">↑ dropped</text><text x="20" y="130">RIGHT, RIGHT, RIGHT, UP → return after step 3</text></g></svg>
