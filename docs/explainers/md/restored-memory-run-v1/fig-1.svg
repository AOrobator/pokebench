<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 230" role="img" aria-label="Saved history stays unchanged; an in-memory copy uses the continuation run ID before fresh observations update the same readers" width="650" height="230"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="650" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#173654" /></marker></defs><g fill="#fff" stroke="#173654" stroke-width="2"><rect x="15" y="25" width="180" height="65" rx="8" /><rect x="235" y="25" width="180" height="65" rx="8" /><rect x="455" y="25" width="180" height="65" rx="8" /><rect x="235" y="150" width="180" height="65" rx="8" /></g><g font-family="system-ui" font-size="15" text-anchor="middle" fill="#173654"><text x="105" y="50">Original history on disk</text><text x="105" y="73">source run ID preserved</text><text x="325" y="50">Memory dispatch copy</text><text x="325" y="73">continuation run ID</text><text x="545" y="50">Existing memory readers</text><text x="545" y="73">history + current evidence</text><text x="325" y="177">Fresh game observations</text><text x="325" y="201">continuation run ID</text></g><g fill="none" stroke="#173654" stroke-width="2" marker-end="url(#arrow)"><path d="M195 57H230" /><path d="M415 57H450" /><path d="M415 181H545V95" /></g></svg>
