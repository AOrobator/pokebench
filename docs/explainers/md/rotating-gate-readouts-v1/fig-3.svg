<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" width="660" role="img" aria-label="A walking batch of three steps, each compared with the read before it, carried to the last press line" height="190">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:600px}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="190" style="fill:#ffffff;stroke:none" /><g font-size="12" fill="#283038" text-anchor="middle">
<rect x="10" y="10" width="190" height="56" fill="#fff" stroke="#9aa6c4" /><text x="105" y="32">Step 1 RIGHT</text><text x="105" y="50">orientation 0 to 1: Gate 2 turned</text>
<rect x="235" y="10" width="190" height="56" fill="#fff" stroke="#9aa6c4" /><text x="330" y="32">Step 2 RIGHT</text><text x="330" y="50">same byte: no gate turned</text>
<rect x="460" y="10" width="190" height="56" fill="#fff" stroke="#9aa6c4" /><text x="555" y="32">Step 3 UP, no move</text><text x="555" y="50">arm across that step, same byte</text>
<rect x="60" y="120" width="540" height="56" fill="#fff" stroke="#c83030" /><text x="330" y="142">The last press line carries every step that mattered,</text><text x="330" y="160">because a walking batch keeps only its last result</text>
</g>
<g stroke="#5a6b80" stroke-width="2" fill="none"><path d="M105 66 L200 120" /><path d="M330 66 L330 120" /><path d="M555 66 L460 120" /></g>
</svg>
