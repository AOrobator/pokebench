<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="A push refused by a wall, and the note the model gets" width="620" height="230">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="620" height="230" style="fill:#ffffff;stroke:none" /><g font-family="ui-monospace,monospace" font-size="14" fill="#283038">
<g fill="#e3eaf3" stroke="#5a6b80"><rect x="60" y="30" width="50" height="50" fill="#5a6b80" /><rect x="110" y="30" width="50" height="50" /><rect x="60" y="80" width="50" height="50" /><rect x="110" y="80" width="50" height="50" /></g>
<text x="66" y="24">(1,5) wall</text><text x="125" y="60">@</text>
<line x1="110" y1="80" x2="160" y2="80" stroke="#c83030" stroke-width="5" />
<line x1="110" y1="80" x2="60" y2="80" stroke="#c83030" stroke-width="5" />
<line x1="110" y1="80" x2="110" y2="130" stroke="#c83030" stroke-width="5" />
<circle cx="110" cy="80" r="5" fill="#283038" />
<text x="20" y="160">Pushing the east arm south</text>
<text x="20" y="178">asks for a clockwise turn.</text>
<text x="20" y="196">The west arm would swing</text>
<text x="20" y="214">into the wall at (1,5).</text>
<text x="290" y="40" font-weight="700">Press result</text>
<text x="290" y="62" font-size="12">Gate 3's arm between (2,5) and (2,6)</text>
<text x="290" y="78" font-size="12">did not turn: turning clockwise would</text>
<text x="290" y="94" font-size="12">swing an arm into the wall at (1,5)</text>
<text x="290" y="130" font-weight="700">Note before each decision</text>
<text x="290" y="152" font-size="12">Gate 3: counterclockwise free;</text>
<text x="290" y="168" font-size="12">clockwise blocked, an arm would swing</text>
<text x="290" y="184" font-size="12">into the wall at (1,5).</text>
</g>
</svg>
