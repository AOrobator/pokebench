<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="Steps that build one line" width="720" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="210" style="fill:#ffffff;stroke:none" /><g font-size="13" text-anchor="middle">
<rect x="10" y="20" width="150" height="60" rx="6" fill="#e4edfb" stroke="#233" /><text x="85" y="46">Plan the route the</text><text x="85" y="64">tool would walk</text>
<rect x="195" y="20" width="150" height="60" rx="6" fill="#e4edfb" stroke="#233" /><text x="270" y="46">Ask the game server</text><text x="270" y="64">who sees its tiles</text>
<rect x="380" y="20" width="150" height="60" rx="6" fill="#e4edfb" stroke="#233" /><text x="455" y="46">Keep off seen tiles,</text><text x="455" y="64">plan again</text>
<rect x="565" y="20" width="145" height="60" rx="6" fill="#e3f4ec" stroke="#233" /><text x="637" y="46">One line: steps,</text><text x="637" y="64">sight, way around</text>
</g>
<g stroke="#233" fill="none"><path d="M160 50h35M345 50h35M530 50h35" /><path d="M455 80v40h-185v-40" /></g>
<text x="362" y="140" font-size="13" text-anchor="middle">repeats until a route is clear, none is left, or the 16 checks for this readout run out</text>
</svg>
