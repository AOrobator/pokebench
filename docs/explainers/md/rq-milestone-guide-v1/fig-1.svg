<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="A milestone advances the guide; its current step is added as the final message of every request" style="width:100%;max-width:420px;height:auto" width="320" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="320" height="250" style="fill:#ffffff;stroke:none" /><g font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">
<rect x="50" y="6" width="220" height="44" rx="6" fill="#fff" stroke="#203a5e" stroke-width="2" /><text x="160" y="33">A milestone or new map fires</text>
<path d="M160 50v22" stroke="#203a5e" stroke-width="2" /><path d="M154 66l6 8 6-8" fill="#203a5e" />
<rect x="50" y="76" width="220" height="44" rx="6" fill="#fff" stroke="#203a5e" stroke-width="2" /><text x="160" y="103">The guide moves to the furthest step</text>
<path d="M160 120v22" stroke="#203a5e" stroke-width="2" /><path d="M154 136l6 8 6-8" fill="#203a5e" />
<rect x="50" y="146" width="220" height="44" rx="6" fill="#fff" stroke="#203a5e" stroke-width="2" /><text x="160" y="173">That step is the last message</text>
<path d="M160 190v22" stroke="#203a5e" stroke-width="2" /><path d="M154 206l6 8 6-8" fill="#203a5e" />
<rect x="50" y="216" width="220" height="30" rx="6" fill="#fff" stroke="#203a5e" stroke-width="2" /><text x="160" y="236">On every request until the next step</text>
</g></svg>
