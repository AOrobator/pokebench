<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-label="An ordinary press leaves a gap after every 11 frames, so the bike stays slow. Back-to-back beats reach one tile per 4 frames by the third tile, so the first crack must be tile 3 or later." style="max-width:100%;height:auto" width="640" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}

:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="150" style="fill:#ffffff;stroke:none" /><text x="0" y="16" font-size="13">press: 11 held, 8 released</text>
<g fill="#7a8">
<rect x="0" y="24" width="88" height="18" /><rect x="152" y="24" width="88" height="18" /><rect x="304" y="24" width="88" height="18" /><rect x="456" y="24" width="88" height="18" />
</g>
<text x="0" y="60" font-size="12">each gap resets the speed: never faster than 16 or 8 frames a tile</text>
<text x="0" y="88" font-size="13">mach_dash: 4-frame beats, no gap</text>
<g fill="#48a">
<rect x="0" y="96" width="128" height="18" /><rect x="130" y="96" width="62" height="18" /><rect x="194" y="96" width="30" height="18" /><rect x="226" y="96" width="30" height="18" /><rect x="258" y="96" width="30" height="18" /><rect x="290" y="96" width="30" height="18" /><rect x="322" y="96" width="30" height="18" />
</g>
<text x="0" y="130" font-size="12">tile 1: 16 frames</text><text x="130" y="130" font-size="12">tile 2: 8</text><text x="194" y="130" font-size="12">tile 3 on: 4 each, first crack here or later</text>
</svg>
