<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Old viewer stops, new viewer starts, sees the trial in runner.json and the lease, waits for it, records it once and launches the next trial" width="900" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f4f3ed;--ink:#20271f;--muted:#5d665a;--panel:#fff;--edge:#b8c1b2;--good:#1f7a3f;--bad:#b3261e;--soft:#eef1ea;--viewer:#c9d6e6;--play:#cfe5c4;--server:#f2d27a;--group:#e9e3d2}
@media(min-width:1000000px){:root{--bg:#151c17;--ink:#e2eadf;--muted:#a8b3a4;--panel:#202b22;--edge:#536650;--good:#6fdc8c;--bad:#ff8a80;--soft:#26322a;--viewer:#33465c;--play:#2f5a33;--server:#7a6420;--group:#2b2a22}}
*{box-sizing:border-box}
svg{width:100%;height:auto;min-width:560px;display:block}
.box{stroke:var(--edge);stroke-width:1.5}
.v{fill:var(--viewer)}
.p{fill:var(--play)}
.lab{fill:var(--ink);font:600 14px system-ui,sans-serif}
.sub{fill:var(--muted);font:12.5px system-ui,sans-serif}
.arr{stroke:var(--ink);stroke-width:2;fill:none;marker-end:url(#h)}
.no{fill:var(--bad);font:700 14px system-ui,sans-serif}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke" /></marker></defs><defs><marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke" /></marker></defs>
<rect class="box v" x="10" y="30" width="150" height="80" rx="12" /><text class="lab" x="24" y="58">old viewer stops</text><text class="sub" x="24" y="78">leaves the lease and</text><text class="sub" x="24" y="94">runner.json behind</text>
<rect class="box v" x="200" y="30" width="160" height="80" rx="12" /><text class="lab" x="214" y="58">new viewer starts</text><text class="sub" x="214" y="78">the queue shows the</text><text class="sub" x="214" y="94">experiment RUNNING</text>
<rect class="box p" x="400" y="30" width="170" height="80" rx="12" /><text class="lab" x="414" y="58">adopt</text><text class="sub" x="414" y="78">take the lease back,</text><text class="sub" x="414" y="94">wait while it plays</text>
<rect class="box p" x="610" y="30" width="130" height="80" rx="12" /><text class="lab" x="624" y="58">run_end</text><text class="sub" x="624" y="78">record one outcome</text><text class="sub" x="624" y="94">for that run</text>
<rect class="box v" x="780" y="30" width="110" height="80" rx="12" /><text class="lab" x="792" y="58">next trial</text><text class="sub" x="792" y="78">launched as</text><text class="sub" x="792" y="94">usual</text>
<g style="marker-end:url(#h2)"><path class="arr" d="M160 70H198" style="marker-end:url(#h2)" /><path class="arr" d="M360 70H398" style="marker-end:url(#h2)" /><path class="arr" d="M570 70H608" style="marker-end:url(#h2)" /><path class="arr" d="M740 70H778" style="marker-end:url(#h2)" /></g>
<text class="sub" x="400" y="150">"Still plays" = no run_end yet and its game server answers /health,</text>
<text class="sub" x="400" y="168">or its recorded play pid is alive. Checked every 5 s.</text>
<text class="sub" x="10" y="150">No run_end at all once it stopped: the old path</text>
<text class="sub" x="10" y="168">(logged as interrupted, then rerun). Operator stop: held.</text>
<text class="no" x="10" y="215">Before: the new viewer waited on "lease is held" forever, or reran the trial and lost its result.</text>
</svg>
