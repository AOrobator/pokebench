<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img" aria-label="A validated straight corridor stops before the next bend" width="400" height="190"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:light-dark(#faf9f5,#15191b);--fg:light-dark(#24312e,#e1eae7);--muted:light-dark(#586864,#a8b8b2);--line:light-dark(#cad6cf,#40554b);--route:light-dark(#196778,#69cadb);--stop:light-dark(#a34d26,#eab28b)}
*{box-sizing:border-box}
