<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" role="img" aria-label="Switch wiring from preset to loop guard event">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--warn:#b07a12;}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--warn:#e2b25a}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="170" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker></defs>
<rect x="10" y="20" width="150" height="54" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="20" y="42">FeatureSet</text><text x="20" y="62" class="small">preset / bundle arm</text>
<line x1="160" y1="47" x2="192" y2="47" stroke="var(--muted)" marker-end="url(#b)" />
<rect x="194" y="20" width="160" height="54" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="204" y="42">attachLoopGuard</text><text x="204" y="62" class="small">live.ts, decision-probe.ts</text>
<line x1="354" y1="47" x2="386" y2="47" stroke="var(--muted)" marker-end="url(#b)" />
<rect x="388" y="20" width="160" height="54" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="398" y="42">LoopCoordinator</text><text x="398" y="62" class="small">episode, notices</text>
<line x1="548" y1="47" x2="580" y2="47" stroke="var(--muted)" marker-end="url(#b)" />
<rect x="582" y="20" width="200" height="54" rx="6" fill="var(--fill)" stroke="var(--accent)" stroke-width="2" /><text x="592" y="42">SameTargetNoProgress</text><text x="592" y="62" class="small">loop/same-target.ts (the change)</text>
<line x1="468" y1="74" x2="468" y2="104" stroke="var(--muted)" marker-end="url(#b)" />
<rect x="300" y="106" width="200" height="54" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="310" y="128">loop_guard event</text><text x="310" y="148" class="small">kind same_target_no_progress</text>
<line x1="500" y1="133" x2="532" y2="133" stroke="var(--muted)" marker-end="url(#b)" />
<rect x="534" y="106" width="250" height="54" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="544" y="128">Activity History, raw inspector</text><text x="544" y="148" class="small">not drawn on the closed TIMELINE</text>
<line x1="388" y1="60" x2="170" y2="125" stroke="var(--muted)" marker-end="url(#b)" />
<rect x="10" y="106" width="158" height="54" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="20" y="128">context()</text><text x="20" y="148" class="small">note at each model call</text>
</svg>
