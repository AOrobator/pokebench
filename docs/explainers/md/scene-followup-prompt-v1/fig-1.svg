<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" role="img" aria-label="Five game-state conditions, all required" height="250">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#55607a;--line:#9aa6c0}
svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="250" style="fill:#ffffff;stroke:none" /><rect x="10" y="10" width="740" height="230" rx="10" fill="#fff" stroke="#9aa6c0" />
 <text x="30" y="40" font-weight="700">One game-tool call auto-advanced dialogue, and ALL of these hold on its pages:</text>
 <text x="40" y="75">1. At least 2 pages show no speaker while other people are on screen.</text>
 <text x="40" y="105">2. Who is on screen changed between those pages (someone moved, appeared or left).</text>
 <text x="40" y="135">3. The player stood on the same tile on those pages.</text>
 <text x="40" y="165">4. Control returned to the field when the call ended.</text>
 <text x="40" y="195">5. No page has a speaker by name (nobody in the scene addressed the player).</text>
 <text x="40" y="225" fill="#2f7d4f" font-weight="700">→ the next request gets the note; it's gone once the model has answered it.</text>
</svg>
