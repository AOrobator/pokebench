</style><rect x="0" y="0" width="760" height="290" style="fill:#ffffff;stroke:none" /><g font-family="system-ui" font-size="17" fill="#152d45" text-anchor="middle"><rect x="210" y="8" width="340" height="50" rx="8" fill="#d5efdf" stroke="#32684e" /><text x="380" y="39">Existing emulator frame finishes</text><path d="M380 58V82" stroke="#244b67" stroke-width="3" /><rect x="210" y="82" width="340" height="50" rx="8" fill="#dbeaf5" stroke="#244b67" /><text x="380" y="113">Copy RAM + CPU; check safe idle</text><path d="M300 132L190 180M460 132L570 180" stroke="#244b67" stroke-width="3" /><text x="230" y="158">Safe</text><text x="530" y="158">Not confirmed</text><rect x="10" y="180" width="355" height="85" rx="8" fill="#d5efdf" stroke="#32684e" /><text x="188" y="213">Decode visible scene events</text><text x="188" y="241">Resume a new continuity baseline</text><rect x="395" y="180" width="355" height="85" rx="8" fill="#fff0c1" stroke="#876d2c" /><text x="572" y="213">Count a deferral; retain raw evidence</text><text x="572" y="241">Retry on the next natural frame</text></g></svg>
