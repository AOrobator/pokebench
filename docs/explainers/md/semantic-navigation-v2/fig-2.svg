<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="Result wrappers now include navigate_to_target and explore_map">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#fff;--ink:#182033;--muted:#5e687a;--line:#ccd3df;--accent:#2f7a5b;--old:#9a5b16;--stop:#b23b3b;--code:#eef1f7}
@media(min-width:1000000px){:root{--bg:#111521;--card:#1a2030;--ink:#eef2fb;--muted:#a5aec0;--line:#343d52;--accent:#6fcf9f;--old:#e2a765;--stop:#ef8080;--code:#232a3c}}
svg text{fill:var(--ink);font:13px system-ui,sans-serif}
svg .muted{fill:var(--muted)}
svg .box{fill:var(--code);stroke:var(--line)}
svg .hot{fill:none;stroke:var(--accent);stroke-width:2.5}
svg .arr{stroke:var(--muted);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="210" style="fill:#ffffff;stroke:none" /><rect class="box" x="0" y="80" width="150" height="44" /><text x="12" y="100">navigate_to_target</text><text x="12" y="116" class="muted">or explore_map</text>
<path class="arr" d="M150 102 H200" />
<rect class="hot" x="200" y="10" width="250" height="190" rx="8" />
<text x="214" y="34">dialogue auto-advance</text><text x="214" y="56">Story goal + trust header</text><text x="214" y="78">conversation ledger, people ledger</text>
<text x="214" y="100">ID cards, untaken exits</text><text x="214" y="122">story destinations, result facts</text><text x="214" y="144">loop supervisor (target counts as tried)</text><text x="214" y="166">recorder: state, frames</text><text x="214" y="188" class="muted">same wrappers navigate_to already had</text>
<path class="arr" d="M450 102 H500" />
<rect class="box" x="500" y="80" width="140" height="44" /><text x="512" y="100">model's next</text><text x="512" y="116">result</text>
</svg>
