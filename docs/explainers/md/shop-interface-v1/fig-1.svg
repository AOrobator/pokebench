<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img" aria-label="Buy screen tasks and what each reader reports">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#d8f0e0;--page:#f6ffff;--fg:#202020;--muted:#506058;--fr:#318b73;--rb:#629cde;--pn:#9cdea4;--rw:#f6ffff;--ln:#62b48b;--win:#f8f8f8;--winline:#5a6a8c;--winin:#a8c0e8;--shadow:#d0d0c8;--cursor:#e04030;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef7f0;--box:#e6f4ea;--line:#62b48b;--panel:#f6ffff}
*{box-sizing:border-box}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--fg)" /></marker></defs>
<rect x="10" y="20" width="250" height="90" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="20" y="42">Task_BuyMenu</text>
<text x="20" y="62" class="small">row id = item id (BuyMenuSetListEntry)</text>
<text x="20" y="80" class="small">OFF: id used as a stock index</text>
<text x="20" y="98" class="small">ON: row name + that item id, or CANCEL</text>
<line x1="260" y1="65" x2="300" y2="65" stroke="var(--fg)" marker-end="url(#a)" /><text x="266" y="58" class="small">A</text>
<rect x="305" y="20" width="250" height="90" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="315" y="42">Task_BuyHowManyDialogueHandleInput</text>
<text x="315" y="62" class="small">tItemId data[5], tItemCount data[1]</text>
<text x="315" y="80" class="small">OFF: "ITEM 22"</text>
<text x="315" y="98" class="small">ON: the item's name</text>
<line x1="555" y1="65" x2="595" y2="65" stroke="var(--fg)" marker-end="url(#a)" /><text x="560" y="58" class="small">A, YES</text>
<rect x="600" y="20" width="250" height="90" rx="6" fill="var(--fill)" stroke="var(--keep)" />
<text x="610" y="42">Task_ReturnToItemList…Purchase</text>
<text x="610" y="62" class="small">waits for A or B on "Here you go!"</text>
<text x="610" y="80" class="small">OFF: no known owner</text>
<text x="610" y="98" class="small">ON: shop_purchase_message, ready</text>
<path d="M725,110 C725,180 135,180 135,112" fill="none" stroke="var(--fg)" marker-end="url(#a)" /><text x="400" y="172" class="small">A or B: back to the list</text>
</svg>
