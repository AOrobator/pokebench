<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="The same Mart with the switch off and on: shelf tiles are listed off and unlisted on, the clerk is listed in both">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--shelf:#d8a02f;--clerk:#2f6fd8;--gone:#d8452f}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="560" height="190" style="fill:#ffffff;stroke:none" /><g font-size="13" fill="#1f2a44"><text x="20" y="20">Off: 16 shelf tiles listed</text><text x="300" y="20">On: shelves not listed, clerk still is</text></g>
<g fill="#d8a02f" stroke="#1f2a44"><rect x="60" y="40" width="26" height="26" /><rect x="86" y="40" width="26" height="26" /><rect x="112" y="40" width="26" height="26" /><rect x="60" y="92" width="26" height="26" /><rect x="86" y="92" width="26" height="26" /><rect x="112" y="92" width="26" height="26" /></g>
<g fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle"><text x="73" y="59" fill="#1f2a44">A</text><text x="99" y="59" fill="#1f2a44">A</text><text x="125" y="59" fill="#1f2a44">A</text><text x="73" y="111" fill="#1f2a44">A</text><text x="99" y="111" fill="#1f2a44">A</text><text x="125" y="111" fill="#1f2a44">A</text></g>
<circle cx="190" cy="66" r="12" fill="#2f6fd8" /><text x="190" y="96" font-size="12" text-anchor="middle" fill="#1f2a44">clerk</text>
<g fill="#d8a02f" stroke="#1f2a44" opacity=".55"><rect x="340" y="40" width="26" height="26" /><rect x="366" y="40" width="26" height="26" /><rect x="392" y="40" width="26" height="26" /><rect x="340" y="92" width="26" height="26" /><rect x="366" y="92" width="26" height="26" /><rect x="392" y="92" width="26" height="26" /></g>
<circle cx="470" cy="66" r="12" fill="#2f6fd8" /><text x="470" y="96" font-size="12" text-anchor="middle" fill="#1f2a44">clerk</text>
<text x="300" y="150" font-size="12" fill="#5b6785">Shelves are still drawn and still solid: nothing but the list changes.</text>
</svg>
