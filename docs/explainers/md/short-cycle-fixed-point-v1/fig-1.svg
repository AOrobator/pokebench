<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Two two-state loops: the clock interfaces in ef9f and the house door in 97a0">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--warn:#b07a12;--warnfill:#f7efdf;}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--warn:#e2b25a;--warnfill:#3a3020}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="330" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)" /></marker></defs>
<text x="10" y="20" class="small">ef9f · the same call both ways</text>
<rect x="20" y="50" width="220" height="70" rx="8" fill="var(--fill)" stroke="var(--accent)" />
<text x="130" y="80" text-anchor="middle">clock_adjustment</text><text x="130" y="100" text-anchor="middle" class="small">nothing highlighted</text>
<rect x="420" y="50" width="220" height="70" rx="8" fill="var(--warnfill)" stroke="var(--warn)" />
<text x="530" y="80" text-anchor="middle">clock_confirmation</text><text x="530" y="100" text-anchor="middle" class="small">NO highlighted</text>
<path d="M240,65 C310,25 350,25 420,65" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)" />
<text x="330" y="32" text-anchor="middle">press RIGHT, A</text>
<path d="M420,105 C350,145 310,145 240,105" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)" />
<text x="330" y="150" text-anchor="middle">press RIGHT, A</text>
<text x="10" y="190" class="small">97a0 · two different calls taking turns</text>
<rect x="20" y="220" width="220" height="70" rx="8" fill="var(--fill)" stroke="var(--accent)" />
<text x="130" y="250" text-anchor="middle">LITTLEROOT TOWN (14,9)</text><text x="130" y="270" text-anchor="middle" class="small">map 0/9, facing down</text>
<rect x="420" y="220" width="220" height="70" rx="8" fill="var(--warnfill)" stroke="var(--warn)" />
<text x="530" y="250" text-anchor="middle">PROF. BIRCH'S HOUSE (2,8)</text><text x="530" y="270" text-anchor="middle" class="small">map 1/2, facing up</text>
<path d="M240,235 C310,195 350,195 420,235" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)" />
<text x="330" y="202" text-anchor="middle">navigate_to_target warp (14,8)</text>
<path d="M420,275 C350,315 310,315 240,275" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a)" />
<text x="330" y="322" text-anchor="middle">navigate_to_target warp (2,8)</text>
</svg>
