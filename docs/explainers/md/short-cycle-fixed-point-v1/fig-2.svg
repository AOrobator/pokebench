<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img" aria-label="Runs of turns and whether they count as a short cycle">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--warn:#b07a12;--warnfill:#f7efdf;}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--warn:#e2b25a;--warnfill:#3a3020}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="200" style="fill:#ffffff;stroke:none" /><g font-size="12">
<text x="10" y="30">fires</text>
<g transform="translate(70,12)">
<rect x="0" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="17" y="19" text-anchor="middle">A</text>
<rect x="38" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="55" y="19" text-anchor="middle">B</text>
<rect x="76" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="93" y="19" text-anchor="middle">A</text>
<rect x="114" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="131" y="19" text-anchor="middle">B</text>
<rect x="152" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="169" y="19" text-anchor="middle">A</text>
<rect x="190" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="207" y="19" text-anchor="middle">B</text>
</g>
<text x="310" y="30" class="small">2-turn cycle, 3 copies → keep the last A, B</text>
<text x="10" y="80">fires</text>
<g transform="translate(70,62)">
<rect x="0" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="17" y="19" text-anchor="middle">A</text>
<rect x="38" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="55" y="19" text-anchor="middle">B</text>
<rect x="76" width="34" height="28" rx="4" fill="var(--panel)" stroke="var(--keep)" /><text x="93" y="19" text-anchor="middle">C</text>
<text x="130" y="19" class="small">× 3 (9 turns)</text>
</g>
<text x="310" y="80" class="small">3-turn cycle, 3 copies → keep the last A, B, C (4-turn cycles: 12 turns)</text>
<text x="10" y="130">no</text>
<g transform="translate(70,112)">
<rect x="0" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="17" y="19" text-anchor="middle">A</text>
<rect x="38" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="55" y="19" text-anchor="middle">B</text>
<rect x="76" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="93" y="19" text-anchor="middle">A</text>
<rect x="114" width="34" height="28" rx="4" fill="var(--panel)" stroke="var(--drop)" /><text x="131" y="19" text-anchor="middle">B′</text>
<rect x="152" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="169" y="19" text-anchor="middle">A</text>
<rect x="190" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="207" y="19" text-anchor="middle">B</text>
</g>
<text x="310" y="130" class="small">B′: another call, a move, a party change, YES highlighted, a reply with no tool call</text>
<text x="10" y="180">no</text>
<g transform="translate(70,162)">
<rect x="0" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="17" y="19" text-anchor="middle">A</text>
<rect x="38" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="55" y="19" text-anchor="middle">B</text>
<rect x="76" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="93" y="19" text-anchor="middle">A</text>
<rect x="114" width="34" height="28" rx="4" fill="var(--warnfill)" stroke="var(--warn)" /><text x="131" y="19" text-anchor="middle">B</text>
<rect x="152" width="34" height="28" rx="4" fill="var(--fill)" stroke="var(--accent)" /><text x="169" y="19" text-anchor="middle">A</text>
</g>
<text x="310" y="180" class="small">5 turns: fewer than 3 copies</text>
</g>
</svg>
