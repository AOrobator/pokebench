<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="Switch wiring from the preset to Activity History">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--warn:#b07a12;--warnfill:#f7efdf;}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--warn:#e2b25a;--warnfill:#3a3020}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="640" height="170" style="fill:#ffffff;stroke:none" /><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" /></marker></defs>
<g font-size="12">
<rect x="10" y="20" width="130" height="44" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="75" y="40" text-anchor="middle">preset / bundle arm</text><text x="75" y="56" text-anchor="middle" class="small">FeatureSet</text>
<rect x="170" y="20" width="140" height="44" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="240" y="40" text-anchor="middle">contextTools</text><text x="240" y="56" text-anchor="middle" class="small">play-wiring.ts</text>
<rect x="340" y="20" width="150" height="44" rx="6" fill="var(--warnfill)" stroke="var(--warn)" stroke-width="2" /><text x="415" y="40" text-anchor="middle">FixedPointBreaker</text><text x="415" y="56" text-anchor="middle" class="small">cycle pass (new)</text>
<rect x="520" y="20" width="110" height="44" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="575" y="40" text-anchor="middle">model request</text><text x="575" y="56" text-anchor="middle" class="small">turns left out</text>
<rect x="340" y="110" width="150" height="44" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="415" y="130" text-anchor="middle">loop_breaker event</text><text x="415" y="146" text-anchor="middle" class="small">trigger short_cycle</text>
<rect x="520" y="110" width="110" height="44" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="575" y="130" text-anchor="middle">Activity History</text><text x="575" y="146" text-anchor="middle" class="small">no timeline mark</text>
<line x1="140" y1="42" x2="168" y2="42" stroke="var(--muted)" marker-end="url(#b)" />
<line x1="310" y1="42" x2="338" y2="42" stroke="var(--muted)" marker-end="url(#b)" />
<line x1="490" y1="42" x2="518" y2="42" stroke="var(--muted)" marker-end="url(#b)" />
<line x1="415" y1="64" x2="415" y2="108" stroke="var(--muted)" marker-end="url(#b)" />
<line x1="490" y1="132" x2="518" y2="132" stroke="var(--muted)" marker-end="url(#b)" />
<text x="240" y="92" text-anchor="middle" class="small">built only if duplicate-turn-collapse-v1</text>
<text x="240" y="106" text-anchor="middle" class="small">or fixed-point-breaker-v1 is on</text>
</g>
</svg>
