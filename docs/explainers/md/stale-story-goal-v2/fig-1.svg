<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="The starter handoff retires the early lab invitation while the later return instruction remains active until the Pokedex" width="760" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f3ec;--fg:#20211f;--soft:#66675f;--panel:#fff;--rule:#d9d5c9;--old:#a33d32;--oldbg:#f9e5df;--live:#176b4c;--livebg:#def2e8;--game:#275eb5;--gamebg:#e4ecfa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
@media(min-width:1000000px){:root{--bg:#151614;--fg:#ecece6;--soft:#aaa99f;--panel:#20211f;--rule:#393a35;--old:#ff806f;--oldbg:#3b211c;--live:#59d49c;--livebg:#18342a;--game:#8ab2ff;--gamebg:#1c2940}}
*{box-sizing:border-box}
svg{display:block;min-width:700px;width:100%;height:auto}
text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{fill:var(--soft);font-size:12px}
.title{font-weight:700;font-size:14px}
rect{fill:var(--panel);stroke:var(--rule)}
.old{fill:var(--oldbg);stroke:var(--old)}
.live{fill:var(--livebg);stroke:var(--live)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="210" style="fill:#ffffff;stroke:none" /><rect class="old" x="15" y="20" width="210" height="72" rx="10" /><text class="title" x="30" y="45">Invitation heard</text><text class="small" x="30" y="67">Birch lab stage 2</text><text class="small" x="30" y="83">“come by my LAB later”</text>
<rect x="275" y="20" width="210" height="72" rx="10" /><text class="title" x="290" y="45">Starter handoff</text><text class="small" x="290" y="67">native stage becomes 3</text><text class="small" x="290" y="83">early episode is complete</text>
<rect class="live" x="535" y="20" width="210" height="72" rx="10" /><text class="title" x="550" y="45">Later return heard</text><text class="small" x="550" y="67">issued at stage 3+</text><text class="small" x="550" y="83">active through stage 4</text>
<path d="M225 56H267M485 56H527" stroke="currentColor" fill="none" /><path d="M260 50l8 6-8 6M520 50l8 6-8 6" fill="currentColor" />
<rect x="275" y="128" width="210" height="62" rx="10" /><text class="title" x="290" y="153">Pokédex received</text><text class="small" x="290" y="174">stage 5 retires the later episode</text><path d="M640 92V110H380V120" stroke="currentColor" fill="none" /><path d="M374 113l6 8 6-8" fill="currentColor" />
</svg>
