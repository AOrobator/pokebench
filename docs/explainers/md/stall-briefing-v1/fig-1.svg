<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="Map round trips and the drought clock" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="20" class="t">1 · Map back-and-forth (counted per pair of maps)</text>
<rect x="20" y="40" width="90" height="40" rx="6" class="navb" /><text x="65" y="65" text-anchor="middle">HOUSE 1F</text>
<rect x="170" y="40" width="90" height="40" rx="6" class="navb" /><text x="215" y="65" text-anchor="middle">HOUSE 2F</text>
<rect x="320" y="40" width="90" height="40" rx="6" class="navb" /><text x="365" y="65" text-anchor="middle">HOUSE 1F</text>
<rect x="470" y="40" width="90" height="40" rx="6" class="navb" /><text x="515" y="65" text-anchor="middle">HOUSE 2F</text>
<rect x="600" y="40" width="90" height="40" rx="6" class="prior hot" /><text x="645" y="65" text-anchor="middle">HOUSE 1F</text>
<path d="M110 60 H168" class="arr" /><path d="M260 60 H318" class="arr" /><path d="M410 60 H468" class="arr" /><path d="M560 60 H598" class="arr p" />
<text x="139" y="98" class="s" text-anchor="middle">move 1</text><text x="289" y="98" class="s" text-anchor="middle">move 2</text>
<text x="439" y="98" class="s" text-anchor="middle">move 3</text><text x="579" y="98" class="s" text-anchor="middle">move 4</text>
<text x="645" y="98" class="s" text-anchor="middle">2nd round trip:</text><text x="645" y="112" class="s" text-anchor="middle">briefing</text>
<text x="10" y="150" class="t">2 · Milestone drought (active play only)</text>
<rect x="20" y="170" width="660" height="22" rx="4" class="box" />
<rect x="20" y="170" width="220" height="22" rx="4" class="game" />
<rect x="240" y="170" width="120" height="22" class="box" style="stroke-dasharray:4 3" />
<rect x="360" y="170" width="110" height="22" class="game" />
<text x="130" y="186" text-anchor="middle">play</text><text x="300" y="186" text-anchor="middle" class="s">operator pause</text><text x="415" y="186" text-anchor="middle">play</text>
<path d="M470 162 V200" class="arr hot" /><text x="470" y="215" text-anchor="middle" class="s">5:00 of play: briefing</text>
<path d="M20 162 V200" class="arr g" /><text x="20" y="215" class="s">last new milestone</text>
<text x="20" y="238" class="s">Milestones already present at start and GAME_RUNNING never restart the clock. Briefs again at 10, 15, … minutes.</text>
</svg>
