<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" width="700" role="img" aria-label="Wiring from preset to model" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="150" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="120" height="44" rx="6" class="box" /><text x="70" y="40" text-anchor="middle">FeatureSet</text><text x="70" y="55" text-anchor="middle" class="s">stall-briefing-v1</text>
<rect x="160" y="20" width="140" height="44" rx="6" class="prior hot" /><text x="230" y="40" text-anchor="middle">stallBriefing()</text><text x="230" y="55" text-anchor="middle" class="s">play-wiring.ts</text>
<rect x="330" y="20" width="160" height="44" rx="6" class="box" /><text x="410" y="40" text-anchor="middle">LoopDetector.stall()</text><text x="410" y="55" text-anchor="middle" class="s">loop_guard event</text>
<rect x="520" y="20" width="170" height="44" rx="6" class="game" /><text x="605" y="40" text-anchor="middle">context() note</text><text x="605" y="55" text-anchor="middle" class="s">next model call</text>
<path d="M130 42 H158" class="arr" /><path d="M300 42 H328" class="arr" /><path d="M490 42 H518" class="arr g" />
<text x="10" y="95" class="s">Checked after each tool result, so the facts match the readout the model just saw.</text>
<text x="10" y="113" class="s">The note shows until the model's next call completes. Refused while a loop-guard briefing is open (it fires after recovery),</text>
<text x="10" y="131" class="s">in diagnostic mode and after a stop. OFF: the factory returns null and adds no subscriber.</text>
</svg>
