<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" style="min-width:700px" role="img" aria-label="The line's place in a result, bundle and control" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--wall:#8f8a7f;--floor:#f4f1ea;--grass:#cfe3bf;--water:#bcd6ee;--may:#c2416b;--box:#f6f3ec;--hl:#fff3c4}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--wall:#55524b;--floor:#2a2925;--grass:#2f4a2a;--water:#24405a;--may:#e27a9c;--box:#24231f;--hl:#4a4224}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
svg .box{fill:var(--box);stroke:var(--line)}
svg .hl{fill:var(--hl);stroke:var(--accent);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor" /></marker></defs>
<text x="20" y="22">Bundle arm (harness-trust-v1 on)</text>
<rect class="box" x="20" y="34" width="340" height="30" /><text x="30" y="54">Read from game memory, always true:</text>
<rect class="hl" x="20" y="68" width="340" height="30" /><text x="30" y="88">TORCHIC has 5/22 HP. MAY's battle cannot …</text>
<rect class="box" x="20" y="102" width="340" height="30" /><text x="30" y="122">Exits you can walk to from where you stand: …</text>
<rect class="box" x="20" y="136" width="340" height="30" /><text x="30" y="156">Navigation: walked from (14,12) …</text>
<text class="small" x="20" y="188">The probed position: right under the header line.</text>
<text x="400" y="22">Control arm (no harness-trust-v1)</text>
<rect class="hl" x="400" y="34" width="340" height="30" /><text x="410" y="54">TORCHIC has 5/22 HP. MAY's battle cannot …</text>
<rect class="box" x="400" y="68" width="340" height="30" /><text x="410" y="88">Navigation: walked from (14,12) …</text>
<rect class="box" x="400" y="102" width="340" height="30" /><text x="410" y="122">Screen: overworld</text>
<rect class="box" x="400" y="136" width="340" height="30" /><text x="410" y="156">…</text>
<text class="small" x="400" y="188">No header: the line is the result's first line.</text>
<text class="small" x="20" y="226">The wrapper sits outside every other wrapper in playGameTools, harness-trust-v1 included, so nothing is ever put above it.</text>
</svg>
