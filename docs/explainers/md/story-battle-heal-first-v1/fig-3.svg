<rect x="20" y="190" width="400" height="56" fill="var(--floor)" stroke="var(--line)" />
<text x="30" y="210">OLDALE TOWN (map 0/10)</text>
<rect x="200" y="214" width="110" height="26" class="yes" /><text class="small" x="208" y="231">POKéMON CENTER (6,16)</text>
<text class="small" x="440" y="60">Heard at turn 147 on ROUTE101:</text>
<text class="small" x="440" y="76">the boy (YOUNGSTER sprite):</text>
<text class="small" x="440" y="92">"There's a POKéMON CENTER</text>
