<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" style="min-width:700px" role="img" aria-label="Decision flow of the gate" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--wall:#8f8a7f;--floor:#f4f1ea;--grass:#cfe3bf;--ledge:#d8c9a6;--may:#c2416b;--box:#f6f3ec}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--wall:#55524b;--floor:#2a2925;--grass:#2f4a2a;--ledge:#4f4532;--may:#e27a9c;--box:#26251f}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
svg .box{fill:var(--box);stroke:var(--line)}
svg .stop{fill:var(--fill);stroke:var(--drop);stroke-width:2}
svg .go{fill:var(--fill);stroke:var(--keep);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)" /></marker></defs>
<rect class="box" x="10" y="20" width="170" height="64" rx="6" /><text x="22" y="44">press with A,</text><text x="22" y="62">navigate_to_target object,</text><text x="22" y="78">navigate_to (own call)</text>
<rect class="box" x="220" y="20" width="200" height="64" rx="6" /><text x="232" y="40">Engaged? free field, every</text><text x="232" y="58">HP read, one below max, a</text><text x="232" y="76">covered opponent on the map</text>
<rect class="box" x="460" y="20" width="160" height="64" rx="6" /><text x="472" y="44">Would it reach one?</text><text x="472" y="62" class="small">talk · approach facing ·</text><text x="472" y="78" class="small">GYM sight on the route</text>
<rect class="go" x="220" y="150" width="200" height="50" rx="6" /><text x="232" y="172">Runs as today.</text><text x="232" y="190" class="small">No event.</text>
<rect class="go" x="460" y="150" width="140" height="50" rx="6" /><text x="472" y="172">Runs as today.</text><text x="472" y="190" class="small">event: clear</text>
<rect class="box" x="640" y="20" width="110" height="64" rx="6" /><text x="652" y="44">confirm: true?</text>
<rect class="stop" x="600" y="230" width="150" height="56" rx="6" /><text x="612" y="252">Not started.</text><text x="612" y="270" class="small">event: refused</text>
<rect class="go" x="620" y="140" width="130" height="56" rx="6" /><text x="632" y="162">Runs as today.</text><text x="632" y="180" class="small">event: confirmed</text>
<line x1="180" y1="52" x2="218" y2="52" stroke="var(--muted)" marker-end="url(#fa)" />
<line x1="420" y1="52" x2="458" y2="52" stroke="var(--muted)" marker-end="url(#fa)" /><text x="428" y="46" class="small">yes</text>
<line x1="620" y1="52" x2="638" y2="52" stroke="var(--muted)" marker-end="url(#fa)" />
<line x1="320" y1="84" x2="320" y2="148" stroke="var(--muted)" marker-end="url(#fa)" /><text x="326" y="122" class="small">no</text>
<line x1="530" y1="84" x2="530" y2="148" stroke="var(--muted)" marker-end="url(#fa)" /><text x="536" y="122" class="small">no</text>
<line x1="700" y1="84" x2="700" y2="138" stroke="var(--muted)" marker-end="url(#fa)" /><text x="706" y="116" class="small">yes</text>
<line x1="645" y1="84" x2="645" y2="228" stroke="var(--muted)" marker-end="url(#fa)" /><text x="610" y="216" class="small">no</text>
</svg>
