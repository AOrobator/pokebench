<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="MOM's seven pages, the candidate list for He, and the Story goal with the switch off and on" width="900" height="470">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--name:#2d5f8a;--grid:#b9c8bf}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
svg .name{fill:var(--name);font-weight:700}
svg .struck{fill:var(--off);text-decoration:line-through}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
svg .arrow-off{stroke:var(--off);stroke-width:2;fill:none}
svg .arrow-on{stroke:var(--on);stroke-width:2;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="470" style="fill:#ffffff;stroke:none" /><defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker>
<marker id="aoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8432c" /></marker>
<marker id="aon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c7a4b" /></marker>
</defs>
<rect class="box" x="10" y="10" width="380" height="450" rx="8" />
<text x="24" y="36">MOM's pages, e9ee seq 1628 (turn 33)</text>
<text x="24" y="56" class="small">BRENDAN'S HOUSE 1F, map 1/0</text>
<text x="24" y="90" class="mono">1 MOM: Oh! <tspan class="name">BRENDAN</tspan>, <tspan class="name">BRENDAN</tspan>!</text>
<text x="40" y="108" class="mono">Quick! Come quickly!</text>
<text x="24" y="140" class="mono">2 MOM: Look! It's PETALBURG GYM!</text>
<text x="40" y="158" class="mono">Maybe DAD will be on!</text>
<text x="24" y="190" class="mono">3 MOM: Oh… It's over.</text>
<text x="24" y="222" class="mono">4 I think DAD was on, but we missed</text>
<text x="40" y="240" class="mono">him. Too bad.</text>
<text x="24" y="272" class="mono">5 Oh, yes. One of DAD's friends</text>
<text x="40" y="290" class="mono">lives in town.</text>
<text x="24" y="322" class="mono">6 <tspan class="name">PROF. BIRCH</tspan> is his name.</text>
<text x="24" y="354" class="mono">7 He lives right next door, so you</text>
<text x="40" y="372" class="mono">should go over and introduce</text>
<text x="40" y="390" class="mono">yourself.</text>
<text x="24" y="430" class="small">Blue: story-character names heard before</text>
<text x="24" y="448" class="small">page 7. The game prints the player's name.</text>

<path class="arrow" d="M390 360 H430" marker-end="url(#a1)" />
<rect class="box" x="435" y="300" width="160" height="110" rx="8" />
<text x="448" y="324">Candidates</text>
<text x="448" y="344">for "He"</text>
<text x="448" y="370" class="name">BRENDAN</text>
<text x="448" y="392" class="name">PROF. BIRCH</text>

<path class="arrow-off" d="M595 330 C 620 330, 620 120, 640 120" marker-end="url(#aoff)" />
<text x="600" y="210" class="small">OFF</text>
<rect class="offbox" x="645" y="20" width="245" height="215" rx="8" />
<text x="658" y="44">OFF: two candidates</text>
<text x="658" y="70" class="mono">"He lives": not resolved:</text>
<text x="658" y="88" class="mono">"He" could be BRENDAN</text>
<text x="658" y="106" class="mono">or PROF. BIRCH.</text>
<text x="658" y="140">Story goal stays on the</text>
<text x="658" y="160">older line: "Look! It's</text>
<text x="658" y="180">PETALBURG GYM! …"</text>
<text x="658" y="200">(MOM, turn 33)</text>
<text x="658" y="222" class="small">24 tool results, seq 1630–3812</text>

<path class="arrow-on" d="M595 380 C 620 380, 620 330, 640 330" marker-end="url(#aon)" />
<text x="600" y="372" class="small">ON</text>
<rect class="onbox" x="645" y="250" width="245" height="210" rx="8" />
<text x="658" y="274">ON: drop the Player line</text>
<text x="658" y="298" class="struck">BRENDAN</text>
<text x="740" y="298" class="small">= Player: BRENDAN</text>
<text x="658" y="320" class="name">PROF. BIRCH</text>
<text x="760" y="320" class="small">one left</text>
<text x="658" y="350" class="mono">= PROF. BIRCH'S HOUSE 1F</text>
<text x="658" y="368" class="mono">(map 1/2). Way in: door</text>
<text x="658" y="386" class="mono">on this map at (14,8).</text>
<text x="658" y="420">Seen from LITTLEROOT</text>
<text x="658" y="440">TOWN (map 0/9).</text>
</svg>
