:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker></defs>
