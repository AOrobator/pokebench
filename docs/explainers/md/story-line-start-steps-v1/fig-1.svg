<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="Save flags are recorded as present at the start, then listed before the run's own steps" width="760" height="150">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="150" style="fill:#ffffff;stroke:none" /><rect x="20" y="45" width="200" height="60" rx="8" fill="#e3eaf3" stroke="#345779" /><text x="120" y="72" text-anchor="middle">Save's flags at run start</text><text x="120" y="90" text-anchor="middle" class="small">read from game memory</text>
<rect x="270" y="45" width="200" height="60" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="370" y="72" text-anchor="middle">Milestones recorded</text><text x="370" y="90" text-anchor="middle" class="small">origin: present_at_start</text>
<rect x="520" y="45" width="220" height="60" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="630" y="72" text-anchor="middle">Story line, briefing</text><text x="630" y="90" text-anchor="middle" class="small">listed before the run's own steps</text>
<path d="M220 75H270M470 75H520" stroke="#5a6b80" fill="none" />
</svg>
