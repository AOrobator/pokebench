<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150" role="img" aria-label="Wiring">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--mo:#c08a1e}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--mo:#e2b65a}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="150" style="fill:#ffffff;stroke:none" /><rect x="10" y="50" width="170" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="22" y="77">FeatureSet (preset)</text>
<rect x="230" y="10" width="250" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="242" y="37">play-wiring stallBriefing()</text>
<rect x="230" y="90" width="250" height="44" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="242" y="110">loopSupervisor(), textOnlySupervisor()</text><text x="242" y="126" class="small">stallBriefing() too</text>
<rect x="540" y="10" width="300" height="44" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" /><text x="552" y="37">StallBriefing.observe(milestone)</text>
<rect x="540" y="90" width="300" height="44" rx="6" fill="var(--panel)" stroke="var(--keep)" stroke-width="2" /><text x="552" y="117">SupervisorBriefing.observe(milestone)</text>
<line x1="180" y1="70" x2="230" y2="32" stroke="var(--fg)" /><line x1="180" y1="74" x2="230" y2="112" stroke="var(--fg)" />
<line x1="480" y1="32" x2="540" y2="32" stroke="var(--fg)" /><line x1="480" y1="112" x2="540" y2="112" stroke="var(--fg)" />
</svg>
