<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 130" width="760" role="img" aria-label="Newest pages kept within the budget" height="130">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1d2433;--muted:#5b6578;--line:#c9d1df;--old:#b5523b;--new:#2f7d4f}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="130" style="fill:#ffffff;stroke:none" /><g font-size="12">
<text x="10" y="18">Pages since the previous story step, oldest → newest</text>
<g fill="#f1d9d3" stroke="#b5523b">
<rect x="10" y="30" width="60" height="30" /><rect x="75" y="30" width="60" height="30" /><rect x="140" y="30" width="60" height="30" /><rect x="205" y="30" width="60" height="30" /><rect x="270" y="30" width="60" height="30" />
</g>
<g fill="#dcefe3" stroke="#2f7d4f">
<rect x="335" y="30" width="60" height="30" /><rect x="400" y="30" width="60" height="30" /><rect x="465" y="30" width="60" height="30" /><rect x="530" y="30" width="60" height="30" /><rect x="595" y="30" width="60" height="30" />
</g>
<text x="135" y="82" text-anchor="middle" fill="#b5523b">left out, counted: "N earlier pages are left out"</text>
<text x="495" y="82" text-anchor="middle" fill="#2f7d4f">kept: filled newest first while ≤ 4,000 chars</text>
<line x1="655" y1="100" x2="340" y2="100" stroke="#2f7d4f" marker-end="url(#a)" />
<text x="500" y="118" text-anchor="middle">fill direction (the newest page always stays)</text>
</g>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f7d4f" /></marker></defs>
</svg>
