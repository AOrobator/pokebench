<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 125" role="img" aria-label="Recorded evidence flows through this switch into the next model request" width="820" height="125"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f6f3eb;--fg:#202a27;--card:#fffdf7;--line:#a8b7ae;--accent:#147158}
@media(min-width:1000000px){:root{--bg:#16201d;--fg:#edf1e9;--card:#21302a;--line:#71877c;--accent:#8fdfbd}}
*{box-sizing:border-box}
svg{width:100%;min-width:570px;height:auto}
svg rect{fill:var(--card);stroke:var(--accent);stroke-width:2}
svg text{fill:var(--fg);font:16px system-ui}
svg path{stroke:var(--accent);fill:none;stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="820" height="125" style="fill:#ffffff;stroke:none" /><rect x="5" y="20" width="220" height="80" rx="10" /><text x="115" y="56" text-anchor="middle">Recorded game evidence</text><text x="115" y="80" text-anchor="middle">state + tool outcomes</text><path d="M230 60 H285 l-8 -6 m8 6 l-8 6" /><text x="257" y="35" text-anchor="middle">qualify</text><rect x="290" y="20" width="230" height="80" rx="10" /><text x="405" y="56" text-anchor="middle">Switch OFF / ON</text><text x="405" y="80" text-anchor="middle">existing owner</text><path d="M525 60 H585 l-8 -6 m8 6 l-8 6" /><text x="554" y="35" text-anchor="middle">deliver</text><rect x="590" y="20" width="225" height="80" rx="10" /><text x="702" y="56" text-anchor="middle">Next model request</text><text x="702" y="80" text-anchor="middle">model chooses action</text></svg>
