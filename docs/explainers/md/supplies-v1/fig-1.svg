<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-label="Arrival timeline" width="760" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#283038;--muted:#5a6b80;--line:#c9d6e6}
svg{min-width:640px;max-width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="170" style="fill:#ffffff;stroke:none" /><line x1="20" y1="80" x2="740" y2="80" stroke="#345779" stroke-width="3" />
<circle cx="80" cy="80" r="9" fill="#ffffff" stroke="#345779" stroke-width="3" /><text x="80" y="55" text-anchor="middle" font-size="12">ROUTE104</text><text x="80" y="115" text-anchor="middle" font-size="12">nothing sold</text>
<circle cx="230" cy="80" r="11" fill="#2f7d4a" /><text x="230" y="55" text-anchor="middle" font-size="12">arrive PETALBURG CITY</text><text x="230" y="115" text-anchor="middle" font-size="12">line: mart door</text>
<circle cx="370" cy="80" r="9" fill="#ffffff" stroke="#345779" stroke-width="3" /><text x="370" y="55" text-anchor="middle" font-size="12">walk in town</text><text x="370" y="115" text-anchor="middle" font-size="12">nothing</text>
<circle cx="510" cy="80" r="11" fill="#2f7d4a" /><text x="510" y="55" text-anchor="middle" font-size="12">enter the MART</text><text x="510" y="115" text-anchor="middle" font-size="12">line: this map</text>
<circle cx="660" cy="80" r="11" fill="#2f7d4a" /><text x="660" y="55" text-anchor="middle" font-size="12">buy list opens</text><text x="660" y="115" text-anchor="middle" font-size="12">line again</text>
<text x="380" y="155" text-anchor="middle" font-size="12">Once per arrival, at the first field result on the new map. Each opening of the buy list shows it again.</text>
</svg>
