<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" role="img" aria-label="On foot the tool stops at the shore. The model presses A. Then the tool crosses water and lands." height="200">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--land:#c9b98a;--water:#7db4e6;--force:#3f7fc4;--route:#c83030}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="200" style="fill:#ffffff;stroke:none" /><rect x="20" y="60" width="160" height="70" fill="#c9b98a" /><rect x="180" y="60" width="360" height="70" fill="#7db4e6" /><rect x="540" y="60" width="160" height="70" fill="#c9b98a" />
<text x="100" y="50" text-anchor="middle" font-size="14">land, elevation 3</text><text x="360" y="50" text-anchor="middle" font-size="14">water, elevation 1</text><text x="620" y="50" text-anchor="middle" font-size="14">land, elevation 3</text>
<line x1="40" y1="95" x2="170" y2="95" stroke="#c83030" stroke-width="3" /><circle cx="170" cy="95" r="7" fill="#c83030" />
<line x1="190" y1="95" x2="680" y2="95" stroke="#c83030" stroke-width="3" stroke-dasharray="8 6" />
<text x="100" y="155" text-anchor="middle" font-size="13">1. walks, stops facing the water</text>
<text x="240" y="178" text-anchor="middle" font-size="13">2. the model presses A, then YES</text>
<text x="450" y="155" text-anchor="middle" font-size="13">3. frame-owned water strides</text>
<text x="620" y="178" text-anchor="middle" font-size="13">4. one press lands</text>
</svg>
