<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" role="img" aria-label="Two rows of replies. Off: tool call, then three text-only replies, then run ends model_error. On: same three text-only replies, then a SUPERVISOR note, then a tool call and the run continues." height="230">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.hot{stroke:var(--hot);stroke-width:2.2}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.g{stroke:var(--game)}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="230" style="fill:#ffffff;stroke:none" /><text x="10" y="22" class="t">OFF</text>
<rect class="game" x="60" y="40" width="80" height="40" rx="6" /><text x="70" y="64">tool call</text>
<rect class="prior" x="160" y="40" width="80" height="40" rx="6" /><text x="170" y="58">text only</text><text x="170" y="73" class="s">retry 1/3</text>
<rect class="prior" x="260" y="40" width="80" height="40" rx="6" /><text x="270" y="58">text only</text><text x="270" y="73" class="s">retry 2/3</text>
<rect class="prior" x="360" y="40" width="80" height="40" rx="6" /><text x="370" y="58">text only</text><text x="370" y="73" class="s">retry 3/3</text>
<path class="arr p" d="M440 60 H500" />
<rect class="prior hot" x="500" y="40" width="190" height="40" rx="6" /><text x="512" y="64">run ends: model_error</text>
<text x="10" y="132" class="t">ON</text>
<rect class="game" x="60" y="150" width="80" height="40" rx="6" /><text x="70" y="174">tool call</text>
<rect class="prior" x="160" y="150" width="80" height="40" rx="6" /><text x="170" y="168">text only</text><text x="170" y="183" class="s">retry 1/3</text>
<rect class="prior" x="260" y="150" width="80" height="40" rx="6" /><text x="270" y="168">text only</text><text x="270" y="183" class="s">retry 2/3</text>
<rect class="prior" x="360" y="150" width="80" height="40" rx="6" /><text x="370" y="168">text only</text><text x="370" y="183" class="s">retry 3/3</text>
<path class="arr g" d="M440 170 H470" />
<rect class="navb hot" x="470" y="150" width="120" height="40" rx="6" /><text x="480" y="168">SUPERVISOR</text><text x="480" y="183" class="s">note 1 of 3</text>
<path class="arr g" d="M590 170 H610" />
<rect class="game" x="610" y="150" width="90" height="40" rx="6" /><text x="620" y="168">tool call</text><text x="620" y="183" class="s">run goes on</text>
</svg>
