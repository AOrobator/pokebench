<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="Tool list on the left, system prompt sections on the right; off, choose_evolution and battle_action have no section; on, each has one" width="900" height="390">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .mono{font:12px ui-monospace,Menlo,monospace;fill:var(--fg)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
svg .arrow{stroke:var(--line);stroke-width:2;fill:none}
svg .offarrow{stroke:var(--off);stroke-width:2;fill:none;stroke-dasharray:6 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="390" style="fill:#ffffff;stroke:none" /><defs><marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#36735b" /></marker></defs>
<text x="20" y="28">Tool list (playTools)</text>
<text x="330" y="28">OFF: system prompt</text>
<text x="620" y="28">ON: system prompt</text>
<rect class="box" x="20" y="40" width="240" height="330" rx="8" />
<text x="36" y="70" class="mono">press</text>
<text x="36" y="100" class="mono">navigate_to</text>
<text x="36" y="130" class="mono">navigate_to_target</text>
<text x="36" y="160" class="mono">observe</text>
<text x="36" y="190" class="mono">get_dialogue … (others)</text>
<text x="36" y="240" class="mono">choose_evolution</text>
<text x="36" y="300" class="mono">battle_action</text>
<rect class="offbox" x="320" y="40" width="250" height="330" rx="8" />
<text x="336" y="70" class="small">press section</text>
<text x="336" y="100" class="small">navigation sections</text>
<text x="336" y="130" class="small">navigate_to_target section</text>
<text x="336" y="160" class="small">observe section</text>
<text x="336" y="190" class="small">other sections</text>
<text x="336" y="240" fill="#a8432c">no choose_evolution text</text>
<text x="336" y="300" fill="#a8432c">no battle_action text</text>
<path class="offarrow" d="M220 236H330" />
<path class="offarrow" d="M200 296H330" />
<rect class="onbox" x="610" y="40" width="270" height="330" rx="8" />
<text x="626" y="70" class="small">the same sections, unchanged</text>
<text x="626" y="100" class="small">…</text>
<text x="626" y="240">CHOOSE_EVOLUTION_SECTION</text>
<text x="626" y="260" class="small">with evolution-decision-v1, every scene</text>
<text x="626" y="300">BATTLE_ACTION_SECTION</text>
<text x="626" y="320" class="small">with battle-move-tool-v1, where battle shows</text>
<path class="arrow" d="M580 236H616" marker-end="url(#t1)" />
<path class="arrow" d="M580 296H616" marker-end="url(#t1)" />
</svg>
