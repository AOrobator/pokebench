<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Battle scene: five tools kept in the list whose overworld section is hidden; on, one line each" width="900" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .mono{font:12px ui-monospace,Menlo,monospace;fill:var(--fg)}
svg .box{fill:var(--panel);stroke:var(--line);stroke-width:2}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="250" style="fill:#ffffff;stroke:none" /><rect class="box" x="20" y="20" width="270" height="210" rx="8" />
<text x="36" y="48">battle scene, tools kept</text>
<text x="36" y="80" class="mono">get_dialogue</text>
<text x="36" y="105" class="mono">recall_dialogue</text>
<text x="36" y="130" class="mono">remember_destination</text>
<text x="36" y="155" class="mono">note_contradiction</text>
<text x="36" y="180" class="mono">get_next_milestone</text>
<rect class="offbox" x="320" y="20" width="250" height="210" rx="8" />
<text x="336" y="48">OFF</text>
<text x="336" y="80" class="small">overworld sections hidden;</text>
<text x="336" y="100" class="small">these five tools are named</text>
<text x="336" y="120" class="small">nowhere in the scene prompt</text>
<rect class="onbox" x="600" y="20" width="280" height="210" rx="8" />
<text x="616" y="48">ON (SCENE_TOOL_LINES)</text>
<text x="616" y="80" class="small">one line per kept tool,</text>
<text x="616" y="100" class="small">e.g. "- get_dialogue: searches</text>
<text x="616" y="120" class="small">every dialogue page the harness</text>
<text x="616" y="140" class="small">advanced through this run …"</text>
<text x="616" y="180" class="small">choose_evolution: every scene</text>
</svg>
