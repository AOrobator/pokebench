<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" style="min-width:640px" role="img" aria-label="CheckTrainer steps" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--wall:#8f8a7f;--floor:#f4f1ea;--youngster:#c77d12;--hiker:#7a4fb0}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--wall:#55524b;--floor:#2a2925;--youngster:#e8a94a;--hiker:#b58ee6}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="210" style="fill:#ffffff;stroke:none" /><g><rect x="10" y="20" width="190" height="70" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="22" y="44">1. Not beaten</text><text x="22" y="64" class="small">trainerbattle script, trainer flag</text><text x="22" y="80" class="small">0x500 + id clear (CheckTrainer)</text></g>
<g><rect x="225" y="20" width="190" height="70" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="237" y="44">2. In its line</text><text x="237" y="64" class="small">same row or column, along its facing</text><text x="237" y="80" class="small">(BURIED: any), 1..sight tiles</text></g>
<g><rect x="440" y="20" width="190" height="70" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="452" y="44">3. Nothing between</text><text x="452" y="64" class="small">no collision, wall side, other height</text><text x="452" y="80" class="small">or other object on tiles between</text></g>
<g><rect x="655" y="20" width="190" height="70" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="667" y="44">4. Player's tile open</text><text x="667" y="64" class="small">passable and at the trainer's</text><text x="667" y="80" class="small">height (GetCollisionAtCoords)</text></g>
<path d="M200 55h25M415 55h25M630 55h25" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah2)" />
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)" /></marker></defs>
<text x="10" y="125">Where the trainer stands and faces:</text>
<text x="10" y="147" class="small">Loaded (gObjectEvents): its tile now and its facing now, plus every direction its movement type turns to.</text>
<text x="10" y="165" class="small">Not loaded: the map's template tile (SaveBlock1.objectEventTemplates) and every direction its movement type faces; a wandering type anywhere in its range.</text>
<text x="10" y="183" class="small">A double-battle trainer counts only while two party Pokémon can battle (GetMonsStateToDoubles_2). SEE_ALL_DIRECTIONS trainers are skipped, as the game skips them.</text>
</svg>
