<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-label="Battle start timeline">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}
svg{display:block;max-width:none;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arrow{stroke:var(--soft);fill:none;stroke-width:1.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="740" height="300" style="fill:#ffffff;stroke:none" /><text x="10" y="18" class="t">What the game does, frame by frame (pokeemerald battle_main.c, battle_controllers.c)</text>
   <rect x="10" y="34" width="170" height="70" rx="6" class="prior" />
   <text x="18" y="52" class="t">CB2_InitBattle</text>
   <text x="18" y="68" class="s">main ← BeginBattleIntroDummy</text>
   <text x="18" y="82" class="s">positions ← 0xFF 0xFF</text>
   <text x="18" y="96" class="s">inBattle ← 1</text>
   <rect x="190" y="34" width="170" height="70" rx="6" class="prior" />
   <text x="198" y="52" class="t">CB2_HandleStartBattle</text>
   <text x="198" y="68" class="s">state 15: positions, count</text>
   <text x="198" y="82" class="s">main ← BeginBattleIntro</text>
   <text x="198" y="96" class="m">callback2 0x08036FAD</text>
   <rect x="370" y="34" width="170" height="70" rx="6" class="prior" />
   <text x="378" y="52" class="t">BeginBattleIntro</text>
   <text x="378" y="68" class="s">outcome ← 0, turn ← 0</text>
   <text x="378" y="82" class="s">then GetMonsData,</text>
   <text x="378" y="96" class="s">PrepareBackgroundSlide</text>
   <rect x="550" y="34" width="180" height="70" rx="6" class="game" />
   <text x="558" y="52" class="t">DrawTrainersOrMonsSprites</text>
   <text x="558" y="68" class="s">gBattleMons ← new battlers</text>
   <text x="558" y="82" class="s">main ← DrawPartySummary…</text>
   <text x="558" y="96" class="m">0x0803AF81: battle is current</text>
   <path class="arrow" d="M180 69 H190 M360 69 H370 M540 69 H550" />
   <text x="10" y="130" class="t">What is still the previous battle's</text>
   <rect x="10" y="140" width="530" height="22" rx="4" class="prior" />
   <text x="18" y="155" class="s">gBattleMons (foe, HP, PP, stages): stale until DrawTrainersOrMonsSprites</text>
   <rect x="10" y="168" width="360" height="22" rx="4" class="prior" />
   <text x="18" y="183" class="s">gBattleOutcome = won, turn counter: stale until BeginBattleIntro</text>
   <rect x="10" y="196" width="180" height="22" rx="4" class="prior" />
   <text x="18" y="211" class="s">gBattlersCount = 2 (never reset)</text>
   <text x="10" y="244" class="t">OFF reads</text>
   <text x="90" y="244" class="m">0xFF positions → STATE COVERAGE ERROR · stale outcome → finishing (outcome won)</text>
   <text x="10" y="266" class="t">ON reads</text>
   <text x="90" y="266" class="m">main in the five intro functions, or all positions 0xFF → initializing</text>
   <text x="10" y="288" class="s">Intro functions (US ROM): 0x08039EC9 Dummy · 0x08039ECD BeginBattleIntro · 0x0803ABC1 · 0x0803AC35 · 0x0803AC85</text>
  </svg>
