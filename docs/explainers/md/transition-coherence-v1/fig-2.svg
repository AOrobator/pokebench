<svg xmlns="http://www.w3.org/2000/svg" width="740" height="250" viewBox="0 0 740 250" role="img" aria-label="Save block move across frames">
   <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; color-scheme:dark}
svg{display:block;max-width:none;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arrow{stroke:var(--soft);fill:none;stroke-width:1.4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="740" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="18" class="t">MoveSaveBlocks_ResetHeap (load_save.c:84), run at every warp, return to field and battle start</text>
   <rect x="10" y="34" width="150" height="56" rx="6" class="box" />
   <text x="18" y="52" class="t">1 copy blocks</text>
   <text x="18" y="68" class="s">to gHeap</text>
   <rect x="170" y="34" width="150" height="56" rx="6" class="prior" />
   <text x="178" y="52" class="t">2 move pointers</text>
   <text x="178" y="68" class="s">gSaveBlock1Ptr = new</text>
   <text x="178" y="82" class="s">data still at old place</text>
   <rect x="330" y="34" width="160" height="56" rx="6" class="prior" />
   <text x="338" y="52" class="t">3 copy back</text>
   <text x="338" y="68" class="s">~107 KB, spans a VBlank</text>
   <rect x="500" y="34" width="230" height="56" rx="6" class="prior" />
   <text x="508" y="52" class="t">4 re-key bag, money, stats</text>
   <text x="508" y="68" class="s">then store the new key</text>
   <path class="arrow" d="M160 62 H170 M320 62 H330 M490 62 H500" />
   <line x1="420" y1="100" x2="420" y2="134" stroke="var(--prior)" stroke-width="2" />
   <text x="300" y="148" class="m">frame ends here: PC in memcpy, LR in MoveSaveBlocks</text>
   <rect x="10" y="166" width="720" height="70" rx="6" class="game" />
   <text x="18" y="186" class="t">Coherence rule</text>
   <text x="18" y="204" class="s">AgbMain runs every callback, then WaitForVBlank (ROM 0x080008AC-0x080008D3) spins on gMain.intrCheck.</text>
   <text x="18" y="222" class="s">A frame that ends with the main thread there (user/system mode, Thumb) has no callback half done.</text>
  </svg>
