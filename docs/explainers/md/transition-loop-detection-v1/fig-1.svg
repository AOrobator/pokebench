<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="One door bounce with the switch off and on" height="270">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.navb{fill:var(--nav-bg);stroke:var(--nav)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="270" style="fill:#ffffff;stroke:none" /><text x="10" y="18" class="t">The 2919 cycle (T202–T204), one model turn per box</text>
<rect x="10" y="30" width="200" height="54" rx="6" class="navb" /><text x="110" y="50" text-anchor="middle">DOWN×5: lab → town</text><text x="110" y="68" text-anchor="middle" class="s">after: (7,17) locked, door closing</text>
<rect x="250" y="30" width="200" height="54" rx="6" class="navb" /><text x="350" y="50" text-anchor="middle">A×5 in town</text><text x="350" y="68" text-anchor="middle" class="s">before: locked · after: unlocked</text>
<rect x="490" y="30" width="200" height="54" rx="6" class="navb" /><text x="590" y="50" text-anchor="middle">UP×7: town → lab</text><text x="590" y="68" text-anchor="middle" class="s">after: lab (6,12)</text>
<path d="M210 57 H248" class="arr" /><path d="M450 57 H488" class="arr" />
<text x="10" y="114" class="t">OFF</text>
<rect x="50" y="100" width="160" height="28" rx="4" class="prior" /><text x="130" y="119" text-anchor="middle">history cleared</text>
<rect x="290" y="100" width="160" height="28" rx="4" class="prior" /><text x="370" y="119" text-anchor="middle">history cleared</text>
<rect x="530" y="100" width="160" height="28" rx="4" class="box" /><text x="610" y="119" text-anchor="middle">1 entry</text>
<text x="50" y="146" class="s">Never more than one entry, so the 3-repeat check never matches. No map moves are counted.</text>
<text x="10" y="186" class="t">ON</text>
<rect x="50" y="172" width="160" height="28" rx="4" class="game" /><text x="130" y="191" text-anchor="middle">skipped · move lab&gt;town</text>
<rect x="290" y="172" width="160" height="28" rx="4" class="game" /><text x="370" y="191" text-anchor="middle">skipped</text>
<rect x="530" y="172" width="160" height="28" rx="4" class="game" /><text x="610" y="191" text-anchor="middle">entry · move town&gt;lab</text>
<text x="50" y="220" class="s">Map moves: lab&gt;town, town&gt;lab, lab&gt;town, town&gt;lab, lab&gt;town, town&gt;lab. The third repeat of the</text>
<text x="50" y="236" class="s">2-move pattern (6 moves) is a cycle. Moves reset on story, party, money, badge, bag or PC item change,</text>
<text x="50" y="252" class="s">and on a newly observed milestone. Patterns of 2 to 4 map moves count; 12 moves are kept.</text>
</svg>
