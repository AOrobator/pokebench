<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="Three snapshots: shown on 2F, before on 1F, after on 1F" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb; --hot:#c2432f;
 --bld:#d9d5ca; --ground:#eef0e6;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --bld:#3a3c40; --ground:#1f2420; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740; --hot:#ff7a63;
 --bld:#3a3c40; --ground:#1f2420; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
svg .m{font-family:var(--mono);font-size:11px}
.box{fill:var(--panel);stroke:var(--rule)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
.arr.p{stroke:var(--prior);stroke-dasharray:5 4}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="700" height="250" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--soft)" /></marker></defs>
<rect class="prior" x="10" y="20" width="200" height="80" rx="8" />
<text class="t" x="22" y="44">Last result shown (seq 683)</text><text x="22" y="66">BRENDANS HOUSE 2F [map 1/1]</text><text class="m" x="22" y="86">(7,1), controls locked</text>
<rect class="box" x="250" y="20" width="200" height="80" rx="8" />
<text class="t" x="262" y="44">Before this press (seq 690)</text><text x="262" y="66">BRENDANS HOUSE 1F [map 1/0]</text><text class="m" x="262" y="86">(8,3)</text>
<rect class="box" x="490" y="20" width="200" height="80" rx="8" />
<text class="t" x="502" y="44">After this press (seq 697)</text><text x="502" y="66">BRENDANS HOUSE 1F [map 1/0]</text><text class="m" x="502" y="86">(8,2)</text>
<path class="arr p" d="M210,60 L248,60" marker-end="url(#a)" /><path class="arr" d="M450,60 L488,60" marker-end="url(#a)" />
<text class="s" x="140" y="125">map changed between results: off never compares these</text>
<text class="s" x="440" y="125">today's comparison</text>
<rect class="prior" x="10" y="150" width="680" height="34" rx="6" /><text class="m" x="20" y="172">Off: moved (8,3) -&gt; (8,2)</text>
<rect class="game" x="10" y="192" width="680" height="50" rx="6" />
<text class="m" x="20" y="212">On: warped before this press (carried over from your previous action; your last result still</text>
<text class="m" x="20" y="230">showed the old map): ... 2F [map 1/1] (7,1) -&gt; ... 1F [map 1/0] (8,3); this press: moved (8,3) -&gt; (8,2)</text>
</svg>
