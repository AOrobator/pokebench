<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A script-free route is planned around the script. When every route crosses it, navigation walks one step into the script and returns an observation." viewBox="0 0 660 240" style="width:100%;max-width:660px" width="660" height="240"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:620px;display:block}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="660" height="240" style="fill:#ffffff;stroke:none" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#22517c" /></marker></defs><g fill="#eef6f3" stroke="#22517c" stroke-width="2"><rect x="15" y="25" width="630" height="80" rx="8" /><rect x="15" y="130" width="630" height="80" rx="8" /></g><g font-family="system-ui" font-size="17" fill="#173651"><text x="30" y="52">around</text><text x="115" y="72">Player</text><text x="310" y="72">Script</text><text x="550" y="72">Goal</text><text x="30" y="157">across</text><text x="115" y="180">Player</text><text x="310" y="180">Script</text><text x="550" y="180">Goal</text></g><path d="M180 65H285" stroke="#22517c" stroke-width="3" marker-end="url(#arrow)" /><path d="M180 172H290" stroke="#22517c" stroke-width="3" marker-end="url(#arrow)" /><g font-family="system-ui" font-size="13" fill="#173651"><text x="195" y="92">route planned around it</text><text x="380" y="180">return observation</text></g></svg>
