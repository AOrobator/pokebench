<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" role="img" aria-label="Events that restart the action clock">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f6f8;--fg:#162333;--card:#fff;--muted:#5a6878;--act:#2b6b9d;--nudge:#c0392b;--reset:#2e8b57;--held:#b8860b;--dash:#8a96a3}
*{box-sizing:border-box}
svg text{font:12px system-ui,-apple-system,sans-serif;fill:var(--fg)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="210" style="fill:#ffffff;stroke:none" /><line x1="20" y1="100" x2="840" y2="100" stroke="var(--dash)" />
 <g fill="var(--act)"><circle cx="60" cy="100" r="4" /><circle cx="90" cy="100" r="4" /><circle cx="120" cy="100" r="4" /><circle cx="150" cy="100" r="4" /></g>
 <g fill="var(--reset)"><rect x="175" y="88" width="24" height="24" rx="4" /><rect x="335" y="88" width="24" height="24" rx="4" /><rect x="495" y="88" width="24" height="24" rx="4" /><rect x="655" y="88" width="24" height="24" rx="4" /></g>
 <text x="150" y="60">New story milestone</text>
 <text x="300" y="140">Level went up</text>
 <text x="300" y="156" fill="var(--muted)">same identified POKéMON, higher level</text>
 <text x="455" y="60">Trainer battle won</text>
 <text x="455" y="76" fill="var(--muted)">trainer shown not defeated → defeated</text>
 <text x="625" y="140">Full heal</text>
 <text x="625" y="156" fill="var(--muted)">same party: below full → all full</text>
 <text x="20" y="195" fill="var(--muted)">Blue dots: actions (tool results). Walking, failed presses and refused calls count as actions; they never restart the clock.</text>
</svg>
