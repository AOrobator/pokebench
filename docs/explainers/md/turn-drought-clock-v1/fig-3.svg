 <text x="702" y="52">stallText()</text><text x="702" y="70" fill="var(--muted)">action_drought facts</text>
 <g stroke="var(--fg)"><line x1="180" y1="55" x2="228" y2="55" /><line x1="420" y1="55" x2="468" y2="55" /><line x1="640" y1="55" x2="688" y2="55" /></g>
</svg>
