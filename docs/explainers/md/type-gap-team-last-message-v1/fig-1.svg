<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The request with the switch off and on" width="760" height="330">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#283038;--muted:#5a6b80;--line:#c9d6e6}
svg{min-width:640px;max-width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="330" style="fill:#ffffff;stroke:none" /><g font-size="12">
<text x="20" y="22" font-weight="bold">Off (type-gap-team-v1 alone)</text>
<rect x="20" y="34" width="330" height="34" fill="#eef3fa" stroke="#345779" /><text x="32" y="56">system prompt, tools, earlier turns</text>
<rect x="20" y="76" width="330" height="34" fill="#eef3fa" stroke="#345779" /><text x="32" y="98">assistant: press A</text>
<rect x="20" y="118" width="330" height="96" fill="#ffffff" stroke="#345779" /><text x="32" y="140">tool result: readout, then</text>
<rect x="36" y="150" width="298" height="52" fill="#fff4c2" stroke="#c83030" stroke-width="3" /><text x="48" y="172">Gym type facts (this run's own</text><text x="48" y="190">evidence and the game's type chart): …</text>
<text x="20" y="240" fill="#5a6b80">the model decides here</text>

<text x="410" y="22" font-weight="bold">On (both places)</text>
<rect x="410" y="34" width="330" height="34" fill="#eef3fa" stroke="#345779" /><text x="422" y="56">system prompt, tools, earlier turns</text>
<rect x="410" y="76" width="330" height="34" fill="#eef3fa" stroke="#345779" /><text x="422" y="98">assistant: press A</text>
<rect x="410" y="118" width="330" height="96" fill="#ffffff" stroke="#345779" /><text x="422" y="140">tool result: readout, then</text>
<rect x="426" y="150" width="298" height="52" fill="#fff4c2" stroke="#c83030" stroke-width="3" /><text x="438" y="172">Gym type facts (this run's own</text><text x="438" y="190">evidence and the game's type chart): …</text>
<rect x="410" y="222" width="330" height="64" fill="#ffffff" stroke="#345779" /><text x="422" y="242">user message, last in the request:</text>
<rect x="426" y="250" width="298" height="28" fill="#fff4c2" stroke="#c83030" stroke-width="3" /><text x="438" y="269">the same block, byte for byte</text>
<text x="410" y="310" fill="#5a6b80">the model decides here</text>
</g>
</svg>
