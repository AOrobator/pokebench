<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="Three triggers" width="760" height="210">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#283038;--muted:#5a6b80;--line:#c9d6e6;--on:#2f7d4a;--off:#9a3b3b;--hi:#fff4c2}
svg{min-width:640px;max-width:100%;height:auto}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="210" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="235" height="80" rx="8" fill="#eef3fa" stroke="#345779" stroke-width="2" /><text x="127" y="48" text-anchor="middle" font-size="13">(a) wild battle action menu</text><text x="127" y="70" text-anchor="middle" font-size="12">the wild foe has a type the</text><text x="127" y="88" text-anchor="middle" font-size="12">party lacks</text>
<rect x="262" y="20" width="235" height="80" rx="8" fill="#eef3fa" stroke="#345779" stroke-width="2" /><text x="380" y="48" text-anchor="middle" font-size="13">(b) loss to a GYM LEADER</text><text x="380" y="70" text-anchor="middle" font-size="12">first field result after it,</text><text x="380" y="88" text-anchor="middle" font-size="12">once per loss</text>
<rect x="514" y="20" width="235" height="80" rx="8" fill="#eef3fa" stroke="#345779" stroke-width="2" /><text x="631" y="48" text-anchor="middle" font-size="13">(c) gym type first known</text><text x="631" y="70" text-anchor="middle" font-size="12">first field result after it,</text><text x="631" y="88" text-anchor="middle" font-size="12">once per gym</text>
<rect x="10" y="130" width="235" height="60" rx="8" fill="#fff4c2" stroke="#283038" /><text x="127" y="157" text-anchor="middle" font-size="12">adds: the wild foe's types</text><text x="127" y="175" text-anchor="middle" font-size="12">and its moves now</text>
<rect x="262" y="130" width="487" height="60" rx="8" fill="#fff4c2" stroke="#283038" /><text x="505" y="157" text-anchor="middle" font-size="12">adds: wild POKéMON this run met in its own battles</text><text x="505" y="175" text-anchor="middle" font-size="12">whose types the party lacks (never the encounter tables)</text>
<line x1="127" y1="100" x2="127" y2="128" stroke="#345779" stroke-width="2" /><line x1="380" y1="100" x2="380" y2="128" stroke="#345779" stroke-width="2" /><line x1="631" y1="100" x2="631" y2="128" stroke="#345779" stroke-width="2" />
