<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" style="min-width:640px" role="img" aria-label="Own walk from the south half of Route 104 to the Rustboro gym" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--warn:#a86b12}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--warn:#e0a94f}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="820" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--keep)" /></marker>
<marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--drop)" /></marker></defs>
<rect x="20" y="190" width="170" height="70" rx="6" fill="var(--fill)" stroke="var(--line)" /><text x="30" y="212">ROUTE104, south half</text><text x="30" y="232" class="small">you are here at turn 400</text><text x="30" y="248" class="small">door (10,38) reachable on foot</text>
<rect x="240" y="190" width="150" height="70" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="250" y="212">PETALBURG WOODS</text><text x="250" y="232" class="small">left by door (15,5)</text>
<rect x="440" y="100" width="170" height="70" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="450" y="122">ROUTE104, north half</text><text x="450" y="142" class="small">left by the NORTH edge</text>
<rect x="440" y="10" width="170" height="60" rx="6" fill="var(--panel)" stroke="var(--line)" /><text x="450" y="32">RUSTBORO CITY</text><text x="450" y="52" class="small">left by door (27,19)</text>
<rect x="660" y="10" width="140" height="60" rx="6" fill="var(--fill)" stroke="var(--keep)" /><text x="670" y="32">RUSTBORO CITY GYM</text><text x="670" y="52" class="small">ROXANNE still open</text>
<path d="M190 225 L236 225" stroke="var(--keep)" stroke-width="3" marker-end="url(#a)" />
<path d="M390 210 L436 150" stroke="var(--keep)" stroke-width="3" marker-end="url(#a)" />
<path d="M525 100 L525 74" stroke="var(--keep)" stroke-width="3" marker-end="url(#a)" />
<path d="M610 40 L656 40" stroke="var(--keep)" stroke-width="3" marker-end="url(#a)" />
<path d="M105 190 C105 150 300 160 436 150" stroke="var(--drop)" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#x)" />
<text x="30" y="88" fill="var(--drop)">readout: "Way in: this map's NORTH edge"</text><text x="30" y="104" class="small">not reachable on foot from the south half</text>
<path d="M440 24 C410 6 410 60 440 52" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" /><text x="250" y="30" class="small">POKéMON CENTER round trips</text><text x="250" y="44" class="small">taken out as loops</text>
</svg>
