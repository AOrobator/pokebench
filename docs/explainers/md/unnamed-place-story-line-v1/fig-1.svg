<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-label="A field line passes four checks and becomes the Story goal" width="760" height="170">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
svg{min-width:640px;width:100%;height:auto}
svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#283038}
svg .small{font-size:11px;fill:#5a6b80}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="170" style="fill:#ffffff;stroke:none" /><rect x="20" y="50" width="130" height="60" rx="8" fill="#e3eaf3" stroke="#345779" /><text x="85" y="78" text-anchor="middle">Field line</text><text x="85" y="96" text-anchor="middle" class="small">any speaker</text>
<rect x="175" y="50" width="170" height="60" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="260" y="78" text-anchor="middle">Not noise</text><text x="260" y="96" text-anchor="middle" class="small">see the list below</text>
<rect x="370" y="50" width="170" height="60" rx="8" fill="#fff3c9" stroke="#b08a1e" /><text x="455" y="78" text-anchor="middle">Names a known place</text><text x="455" y="96" text-anchor="middle" class="small">not only the map it was heard on</text>
<rect x="565" y="50" width="175" height="60" rx="8" fill="#e0f2e6" stroke="#2f7d4f" /><text x="652" y="78" text-anchor="middle">Story goal</text><text x="652" y="96" text-anchor="middle" class="small">when it is the newest</text>
<path d="M150 80H175M345 80H370M540 80H565" stroke="#5a6b80" fill="none" />
</svg>
