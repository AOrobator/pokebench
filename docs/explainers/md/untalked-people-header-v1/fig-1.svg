<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="The trust header with the switch off and on" width="900" height="290">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f4ee;--fg:#172a29;--panel:#ffffff;--line:#36735b;--muted:#546562;--off:#a8432c;--offbg:#fbeeea;--on:#2c7a4b;--onbg:#e8f4ec;--tile:#eef3ea;--grid:#b9c8bf;--player:#2d5f8a}
*{box-sizing:border-box}
svg{min-width:680px;width:100%;height:auto}
svg text{fill:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg .small{font-size:13px;fill:var(--muted)}
svg .offbox{fill:var(--offbg);stroke:var(--off);stroke-width:2}
svg .onbox{fill:var(--onbg);stroke:var(--on);stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="900" height="290" style="fill:#ffffff;stroke:none" /><rect class="offbox" x="10" y="10" width="880" height="110" rx="8" />
<text x="25" y="35">OFF</text>
<text x="25" y="60" class="small">Read from game memory, always true:</text>
<text x="25" y="80" class="small">Story goal: …</text>
<text x="25" y="100" class="small">Exits you can walk to from where you stand: …</text>
<rect class="onbox" x="10" y="135" width="880" height="145" rx="8" />
<text x="25" y="160">ON</text>
<text x="25" y="185" class="small">Read from game memory, always true:</text>
<text x="25" y="205" class="small">Story goal: …</text>
<text x="25" y="225" class="small">Exits you can walk to from where you stand: …</text>
<text x="25" y="250" class="small">People on this map you have not talked to since your last story milestone: object 4, sprite WOMAN_4,</text>
<text x="25" y="270" class="small">at (2,1), last talked to on turn 3; object 2, sprite BOY_1, at (5,5), not talked to this run.</text>
</svg>
