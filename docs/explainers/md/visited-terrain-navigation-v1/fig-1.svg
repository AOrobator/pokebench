<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Three overlapping local observations become one visited terrain map while unknown cells stay hidden" width="760" height="300">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f6f2e8;--card:#fffdf7;--text:#18221d;--muted:#58655e;--line:#b9c4bc;--known:#b9e3c6;--now:#69b883;--unknown:#d6d8d5;--accent:#175f3b;--warn:#b36a18}
@media(min-width:1000000px){:root{--bg:#111713;--card:#19221c;--text:#edf5ef;--muted:#adbbb1;--line:#435147;--known:#255b39;--now:#3c9360;--unknown:#303733;--accent:#83d6a2;--warn:#f0ae55}}
*{box-sizing:border-box}
svg{min-width:650px;width:100%;height:auto}
.box{fill:var(--card);stroke:var(--line);stroke-width:2}
.known{fill:var(--known)}
.now{fill:var(--now)}
.unknown{fill:var(--unknown)}
.arrow{stroke:var(--accent);stroke-width:4;fill:none;marker-end:url(#a)}
svg text{fill:var(--text);font:14px system-ui,sans-serif}
.small{font-size:12px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="760" height="300" style="fill:#ffffff;stroke:none" /><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)" /></marker></defs>
<rect class="box" x="10" y="28" width="180" height="220" rx="14" /><text x="25" y="55">Result 1</text><rect class="known" x="30" y="75" width="90" height="90" /><rect class="unknown" x="120" y="75" width="50" height="90" /><text x="55" y="125">shown</text><text x="130" y="125">?</text><text class="small" x="25" y="205">15×15 local window</text>
<rect class="box" x="220" y="28" width="180" height="220" rx="14" /><text x="235" y="55">Result 2</text><rect class="known" x="240" y="75" width="45" height="90" /><rect class="now" x="285" y="75" width="90" height="90" /><text x="245" y="125">old</text><text x="305" y="125">new</text><text class="small" x="235" y="205">only after delivery</text>
<path class="arrow" d="M410 138H475" /><rect class="box" x="490" y="28" width="250" height="220" rx="14" /><text x="505" y="55">Stitched known terrain</text><rect class="known" x="510" y="75" width="70" height="120" /><rect class="now" x="580" y="75" width="90" height="120" /><rect class="unknown" x="670" y="75" width="50" height="120" /><text x="530" y="140">seen</text><text x="600" y="140">seen</text><text x="690" y="140">?</text><text class="small" x="505" y="220">A* may cross green cells; never ?</text></svg>
