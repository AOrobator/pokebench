<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-label="Run preset wires a per-run memory to model-visible results and known-cell navigation" width="780" height="230">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{color-scheme:light dark;--bg:#f6f2e8;--card:#fffdf7;--text:#18221d;--muted:#58655e;--line:#b9c4bc;--known:#b9e3c6;--now:#69b883;--unknown:#d6d8d5;--accent:#175f3b;--warn:#b36a18}
@media(min-width:1000000px){:root{--bg:#111713;--card:#19221c;--text:#edf5ef;--muted:#adbbb1;--line:#435147;--known:#255b39;--now:#3c9360;--unknown:#303733;--accent:#83d6a2;--warn:#f0ae55}}
*{box-sizing:border-box}
svg{min-width:650px;width:100%;height:auto}
.box{fill:var(--card);stroke:var(--line);stroke-width:2}
.arrow{stroke:var(--accent);stroke-width:4;fill:none;marker-end:url(#a)}
svg text{fill:var(--text);font:14px system-ui,sans-serif}
.small{font-size:12px;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="780" height="230" style="fill:#ffffff;stroke:none" /><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)" /></marker></defs><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)" /></marker></defs>
<rect class="box" x="10" y="65" width="150" height="75" rx="12" /><text x="28" y="94">run preset</text><text class="small" x="28" y="118">switch ON</text><path class="arrow" marker-end="url(#b)" d="M165 102H235" />
<rect class="box" x="240" y="45" width="190" height="115" rx="12" /><text x="258" y="78">per-run memory</text><text class="small" x="258" y="103">starts empty</text><text class="small" x="258" y="126">keyed by map id</text><path class="arrow" marker-end="url(#b)" d="M435 75H505" /><path class="arrow" marker-end="url(#b)" d="M435 133H505" />
<rect class="box" x="510" y="20" width="250" height="75" rx="12" /><text x="528" y="50">model-visible tool result</text><text class="small" x="528" y="73">append stitched map, then remember</text>
<rect class="box" x="510" y="120" width="250" height="75" rx="12" /><text x="528" y="150">navigate_to planner</text><text class="small" x="528" y="173">copy known cells; current facts override</text></svg>
