<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" role="img" aria-label="Six tile types, each drawn as a dot, refused before and walkable now" width="740" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f6f4ee;--fg:#1f2421;--muted:#6b6f68;--card:#fff;--line:#e3dfd3;--accent:#2f6fde;--accent2:#c9792a;--bad:#d2493a;--good:#2e9d63;
--floor1:#efe9d8;--floor2:#e3dbc4;--wall1:#7d776d;--wall2:#6a645b;--grass1:#9fd07c;--grass2:#7fb85d;--sand1:#f4dc9c;--sand2:#e2c174;--cave1:#cdb79a;--cave2:#b39c7e;
--water1:#8cc4f0;--water2:#6aa8de;--mtn1:#d6d0c4;--puddle:#a9cfe9;--shadow:rgba(30,30,20,.10);--sky1:#fdf3d8;--sky2:#f6f4ee}
@media (min-width:1000000px){:root:not([data-theme=light]){--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;
--floor1:#3a372e;--floor2:#312e26;--wall1:#5b5750;--wall2:#4a4640;--grass1:#4f7a3a;--grass2:#3e6530;--sand1:#8f7a43;--sand2:#76632f;--cave1:#5e5243;--cave2:#4c4236;
--water1:#2f5f88;--water2:#244c70;--mtn1:#5a564e;--puddle:#36607e;--shadow:rgba(0,0,0,.35);--sky1:#2a2516;--sky2:#121512}}
:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;--floor1:#3a372e;--floor2:#312e26;--wall1:#5b5750;--wall2:#4a4640;--grass1:#4f7a3a;--grass2:#3e6530;--sand1:#8f7a43;--sand2:#76632f;--cave1:#5e5243;--cave2:#4c4236;--water1:#2f5f88;--water2:#244c70;--mtn1:#5a564e;--puddle:#36607e;--shadow:rgba(0,0,0,.35);--sky1:#2a2516;--sky2:#121512}
*{box-sizing:border-box}
svg{display:block;max-width:100%;height:auto}
.sw text{font:600 13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:middle}
.sw .h{font:12px ui-monospace,Menlo,monospace;fill:var(--muted)}
.glyph{font:700 34px ui-monospace,Menlo,monospace;fill:var(--fg);text-anchor:middle}
.okc{fill:var(--good)}
.noc{fill:var(--bad)}
.mark{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rowlab{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="740" height="250" style="fill:#ffffff;stroke:none" /><defs><pattern id="cave" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="var(--cave1)" /><path d="M1,4 q3,-2 5,0 M8,11 q3,-2 5,0" stroke="var(--cave2)" stroke-width="1.3" fill="none" /></pattern>
<pattern id="floor" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="var(--floor1)" /><circle cx="2" cy="2" r="1" fill="var(--floor2)" /><circle cx="7" cy="7" r="1" fill="var(--floor2)" /></pattern>
<pattern id="mtn" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="var(--mtn1)" /><path d="M1,10 l4,-6 l4,6" stroke="var(--wall2)" stroke-width="1" fill="none" opacity=".5" /></pattern>
<pattern id="puddle" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="var(--floor1)" /><ellipse cx="6" cy="6" rx="5" ry="3" fill="var(--puddle)" /></pattern>
<pattern id="sand" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="var(--sand1)" /><circle cx="2" cy="3" r=".9" fill="var(--sand2)" /><circle cx="6.5" cy="7" r=".9" fill="var(--sand2)" /><circle cx="7" cy="1.5" r=".6" fill="var(--sand2)" /></pattern>
<pattern id="water" width="16" height="10" patternUnits="userSpaceOnUse"><rect width="16" height="10" fill="var(--water1)" /><path d="M0,5 q4,-3 8,0 t8,0" stroke="var(--water2)" stroke-width="1.4" fill="none" /></pattern>
</defs><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)" /><stop offset="1" stop-color="var(--sky2)" /></linearGradient></defs>
<rect width="740" height="250" rx="14" fill="url(#sky)" />
<text x="28" y="44" class="rowlab">MAP SAYS</text><text x="28" y="168" class="rowlab">OFF</text><text x="28" y="214" class="rowlab">ON</text>
<g class="sw">
<g transform="translate(150,0)"><text y="44" class="glyph">.</text><rect x="-32" y="62" width="64" height="64" rx="10" fill="url(#floor)" stroke="var(--line)" /><text y="146">Plain</text><text y="160" class="h" dy="0" /><circle cy="164" r="12" class="okc" /><path d="M-5,164 l4,4 l7,-8" class="mark" /><circle cy="210" r="12" class="okc" /><path d="M-5,210 l4,4 l7,-8" class="mark" /></g>
<g transform="translate(250,0)"><text y="44" class="glyph">.</text><rect x="-32" y="62" width="64" height="64" rx="10" fill="url(#sand)" stroke="var(--line)" /><text y="146">Sand</text><circle cy="164" r="12" class="noc" /><path d="M-5,159 l10,10 M5,159 l-10,10" class="mark" /><circle cy="210" r="12" class="okc" /><path d="M-5,210 l4,4 l7,-8" class="mark" /></g>
<g transform="translate(350,0)"><text y="44" class="glyph">.</text><rect x="-32" y="62" width="64" height="64" rx="10" fill="url(#cave)" stroke="var(--line)" /><text y="146">Cave</text><circle cy="164" r="12" class="noc" /><path d="M-5,159 l10,10 M5,159 l-10,10" class="mark" /><circle cy="210" r="12" class="okc" /><path d="M-5,210 l4,4 l7,-8" class="mark" /></g>
<g transform="translate(450,0)"><text y="44" class="glyph">.</text><rect x="-32" y="62" width="64" height="64" rx="10" fill="url(#mtn)" stroke="var(--line)" /><text y="146">Mountain</text><circle cy="164" r="12" class="noc" /><path d="M-5,159 l10,10 M5,159 l-10,10" class="mark" /><circle cy="210" r="12" class="okc" /><path d="M-5,210 l4,4 l7,-8" class="mark" /></g>
<g transform="translate(550,0)"><text y="44" class="glyph">.</text><rect x="-32" y="62" width="64" height="64" rx="10" fill="url(#puddle)" stroke="var(--line)" /><text y="146">Puddle</text><circle cy="164" r="12" class="noc" /><path d="M-5,159 l10,10 M5,159 l-10,10" class="mark" /><circle cy="210" r="12" class="okc" /><path d="M-5,210 l4,4 l7,-8" class="mark" /></g>
<g transform="translate(650,0)"><text y="44" class="glyph">.</text><rect x="-32" y="62" width="64" height="64" rx="10" fill="url(#water)" stroke="var(--line)" /><text y="146">Shallow water</text><circle cy="164" r="12" class="noc" /><path d="M-5,159 l10,10 M5,159 l-10,10" class="mark" /><circle cy="210" r="12" class="okc" /><path d="M-5,210 l4,4 l7,-8" class="mark" /></g>
</g></svg>
