:root[data-theme=dark]{--bg:#121512;--fg:#e9ece6;--muted:#9ba196;--card:#1b1f1b;--line:#2d332d;--accent:#78a8ff;--accent2:#f0a050;--bad:#ff7a6a;--good:#58cf8d;--floor1:#3a372e;--floor2:#312e26;--wall1:#5b5750;--wall2:#4a4640;--grass1:#4f7a3a;--grass2:#3e6530;--sand1:#8f7a43;--sand2:#76632f;--cave1:#5e5243;--cave2:#4c4236;--water1:#2f5f88;--water2:#244c70;--mtn1:#5a564e;--puddle:#36607e;--shadow:rgba(0,0,0,.35);--sky1:#2a2516;--sky2:#121512}
*{box-sizing:border-box}
