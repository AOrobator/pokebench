.bl{font:13px -apple-system,Helvetica,sans-serif;fill:var(--fg);text-anchor:end}
.bh{font:11px ui-monospace,Menlo,monospace;fill:var(--muted)}
.bv{font:600 12px ui-monospace,Menlo,monospace;fill:var(--fg)}
.bar{fill:var(--accent);opacity:.85}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
