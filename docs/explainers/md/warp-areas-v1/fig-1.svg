<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" role="img" aria-label="Fifteen per-pad lines become seven area lines" height="250">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--ink:#1f2a44;--muted:#5b6785;--line:#9aa6c4;--a:#2f6fd8;--b:#2f9e6e;--c:#d8452f}
svg text{font-family:inherit}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="18" font-size="14" font-weight="700">Off: one long line per pad</text>
<text x="400" y="18" font-size="14" font-weight="700">On: one line per landing area</text>
<g fill="#2f6fd8"><rect x="10" y="30" width="300" height="9" /><rect x="10" y="43" width="300" height="9" /><rect x="10" y="56" width="300" height="9" /><rect x="10" y="69" width="300" height="9" /><rect x="10" y="82" width="300" height="9" /></g>
<g fill="#2f9e6e"><rect x="10" y="95" width="230" height="9" /><rect x="10" y="108" width="230" height="9" /><rect x="10" y="121" width="230" height="9" /></g>
<g fill="#e2b23c"><rect x="10" y="134" width="190" height="9" /><rect x="10" y="147" width="190" height="9" /><rect x="10" y="160" width="190" height="9" /></g>
<g fill="#b9c3da"><rect x="10" y="173" width="330" height="9" /><rect x="10" y="186" width="210" height="9" /><rect x="10" y="199" width="190" height="9" /><rect x="10" y="212" width="245" height="9" /></g>
<g fill="#2f6fd8"><rect x="400" y="30" width="300" height="20" /></g>
<g fill="#2f9e6e"><rect x="400" y="56" width="230" height="20" /></g>
<g fill="#e2b23c"><rect x="400" y="82" width="190" height="20" /></g>
<g fill="#b9c3da"><rect x="400" y="108" width="280" height="14" /><rect x="400" y="127" width="210" height="14" /><rect x="400" y="146" width="190" height="14" /><rect x="400" y="165" width="245" height="14" /></g>
<text x="400" y="205" font-size="12" fill="#5b6785">Each warp keeps a short name line.</text>
<text x="400" y="222" font-size="12" fill="#5b6785">Its detail moves to its area's one line.</text>
</svg>
