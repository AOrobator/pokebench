<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" role="img" aria-label="Lab door entry timeline in emulated frames" height="250">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --fade:#b7791f; --fade-bg:#fbf0dc; --black:#3a3c40;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --fade:#f0b35a; --fade-bg:#3a2c14; --black:#8a8d93; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --fade:#f0b35a; --fade-bg:#3a2c14; --black:#8a8d93; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.warp{fill:var(--nav-bg);stroke:var(--nav)}
.fade{fill:var(--fade-bg);stroke:var(--fade)}
.blk{fill:var(--black);stroke:var(--black)}
.mark-off{stroke:var(--prior);stroke-width:2.5}
.mark-on{stroke:var(--game);stroke-width:2.5}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="250" style="fill:#ffffff;stroke:none" /><text x="10" y="18" class="t">Littleroot → Birch's lab door, measured on the real ROM (frames after the lock is set)</text>
 <text x="10" y="58">warp task + lock</text>
 <rect x="150" y="44" width="253" height="20" class="warp" /><text x="156" y="58" class="s">Task_DoDoorWarp 0–57</text>
 <rect x="403" y="44" width="151" height="20" class="warp" /><text x="408" y="58" class="s">WarpAndLoadMap 57–91</text>
 <rect x="554" y="44" width="40" height="20" class="box" /><text x="557" y="58" class="s">none</text>
 <rect x="594" y="44" width="106" height="20" class="warp" /><text x="598" y="58" class="s">ExitNonDoor</text><text x="598" y="38" class="s">100–124</text>
 <text x="10" y="98">palette fading</text>
 <rect x="403" y="84" width="93" height="20" class="fade" /><text x="408" y="98" class="s">57–78</text>
 <rect x="594" y="84" width="97" height="20" class="fade" /><text x="598" y="98" class="s">100–122</text>
 <text x="10" y="138">palette all black</text>
 <rect x="478" y="124" width="129" height="20" class="blk" /><text x="520" y="138" class="s" style="fill:var(--bg)">74–103</text>
 <line x1="150" y1="170" x2="700" y2="170" class="arr" />
 <text x="146" y="186" class="s">0</text><text x="397" y="186" class="s">57</text><text x="548" y="186" class="s">91</text><text x="690" y="186" class="s">124</text>
 <line x1="290" y1="36" x2="290" y2="200" class="mark-off" />
 <text x="196" y="216" style="fill:var(--prior)">OFF: settled at once here</text>
 <text x="196" y="232" class="s">(no fade, not black; the lock is the door)</text>
 <line x1="700" y1="36" x2="700" y2="200" class="mark-on" />
 <text x="560" y="232" style="fill:var(--game)">ON: captured at 124</text>
</svg>
