<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" role="img" aria-label="Settle decision per emulated frame" height="230">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f7f6f2; --fg:#1c1d1f; --soft:#5b5d61; --rule:#dedcd5; --panel:#ffffff;
 --game:#1a7f5a; --game-bg:#e3f4ec; --prior:#c2432f; --prior-bg:#fbe7e2; --nav:#2a62c9; --nav-bg:#e4edfb;
 --fade:#b7791f; --fade-bg:#fbf0dc; --black:#3a3c40;
 --body:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;}
@media (min-width:1000000px){:root:not([data-theme="light"]){--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --fade:#f0b35a; --fade-bg:#3a2c14; --black:#8a8d93; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151618; --fg:#e8e8e6; --soft:#a2a3a6; --rule:#2d2f33; --panel:#1d1f22;
 --game:#4cc794; --game-bg:#16302a; --prior:#ff7a63; --prior-bg:#3a1f1a; --nav:#7aa7ff; --nav-bg:#1a2740;
 --fade:#f0b35a; --fade-bg:#3a2c14; --black:#8a8d93; color-scheme:dark}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body);font-size:12px;fill:var(--fg)}
svg .s{fill:var(--soft);font-size:11px}
svg .t{font-weight:600;font-size:13px}
.box{fill:var(--panel);stroke:var(--rule)}
.warp{fill:var(--nav-bg);stroke:var(--nav)}
.fade{fill:var(--fade-bg);stroke:var(--fade)}
.game{fill:var(--game-bg);stroke:var(--game)}
.prior{fill:var(--prior-bg);stroke:var(--prior)}
.arr{stroke:var(--soft);stroke-width:1.5;fill:none}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="230" style="fill:#ffffff;stroke:none" /><rect x="10" y="20" width="200" height="56" class="box" rx="6" />
 <text x="22" y="42" class="t">field controls locked</text><text x="22" y="62" class="s">0x03000F2C ≠ 0, and</text>
 <rect x="10" y="90" width="200" height="74" class="warp" rx="6" />
 <text x="22" y="112" class="t">a warp task is live</text><text x="22" y="130" class="s">gTasks 0x03005E00, 16 × 0x28,</text><text x="22" y="146" class="s">func in the five addresses below</text>
 <text x="230" y="100" class="t">OR</text>
 <rect x="270" y="20" width="200" height="56" class="fade" rx="6" />
 <text x="282" y="42" class="t">palette fade active</text><text x="282" y="62" class="s">gPaletteFade byte 7 bit 7</text>
 <rect x="270" y="90" width="200" height="56" class="fade" rx="6" />
 <text x="282" y="112" class="t">palette RAM all zero</text><text x="282" y="132" class="s">0x05000000, 0x400 bytes</text>
 <path d="M470 90 H520" class="arr" />
 <rect x="520" y="20" width="190" height="72" class="prior" rx="6" />
 <text x="532" y="42" class="t">hold the observation</text><text x="532" y="62" class="s">until the bound: 300 frames once</text><text x="532" y="78" class="s">a warp task was seen, else 146</text>
 <rect x="520" y="110" width="190" height="56" class="game" rx="6" />
 <text x="532" y="132" class="t">otherwise capture now</text><text x="532" y="152" class="s">and record settle frames/reason</text>
 <text x="10" y="196" class="s">A script, message or menu lock with no warp task fails the left box, so it is captured at once and keeps today's label.</text>
 <text x="10" y="214" class="s">OFF evaluates only the two fade boxes, exactly as before.</text>
</svg>
