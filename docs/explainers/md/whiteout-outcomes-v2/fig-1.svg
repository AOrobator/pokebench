<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="A lost or drawn battle needs a native callback receipt, or all three transition effects together" width="680" height="300"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
@media(max-width:640px){svg{display:none}}
svg{width:100%;height:auto}
text{font-size:16px;fill:#102c48}
rect{fill:#edf5ff;stroke:#214c75}
path{stroke:#214c75;fill:none;stroke-width:2}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="680" height="300" style="fill:#ffffff;stroke:none" /><rect x="10" y="10" width="660" height="50" rx="10" /><text x="30" y="41">Lost or drawn battle → first overworld observation</text><path d="M340 60V90H170V110M340 90H510V110" /><rect x="10" y="110" width="310" height="80" rx="10" /><text x="28" y="143">Verified whiteout callback</text><text x="28" y="170">or fresh frame-latch receipt</text><rect x="340" y="110" width="330" height="120" rx="10" /><text x="358" y="140">All three sampled effects:</text><text x="358" y="167">Position or map changed</text><text x="358" y="192">Money became floor(before ÷ 2)</text><text x="358" y="217">Same party: all fainted → full HP</text><path d="M170 190V260H340M510 230V260H340V280" /><text x="175" y="298">Record whiteout in existing battle memory</text></svg>
