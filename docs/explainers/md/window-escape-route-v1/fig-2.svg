<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="Decision flow">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f6f8;--fg:#162333;--card:#fff;--muted:#5a6878;--floor:#e9efe3;--grass:#9fd08a;--ledge:#c9a46a;--wall:#55606c;--walk:#2b6b9d;--later:#6aa0c8;--stop:#c0392b;--ok:#2e7d32;--dash:#8a96a3;--hi:#fff4c2}
*{box-sizing:border-box}
svg{display:block;width:100%;height:auto;min-width:560px}
svg text{font:12px system-ui,-apple-system,sans-serif;fill:var(--fg)}
svg text.m{fill:var(--muted)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="270" style="fill:#ffffff;stroke:none" /><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)" /></marker></defs>
 <rect x="10" y="20" width="160" height="56" rx="8" fill="var(--card)" stroke="var(--dash)" /><text x="20" y="44">plan in the 15x15</text><text x="20" y="62">local map</text>
 <rect x="210" y="20" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--dash)" /><text x="220" y="44">route found?</text><text x="220" y="62" class="m">yes: press, re-plan</text>
 <rect x="400" y="20" width="150" height="56" rx="8" fill="var(--card)" stroke="var(--walk)" stroke-width="3" /><text x="410" y="44">switch on and</text><text x="410" y="62">map_grid in state?</text>
 <rect x="590" y="20" width="120" height="56" rx="8" fill="var(--card)" stroke="var(--walk)" stroke-width="3" /><text x="600" y="44">plan over the</text><text x="600" y="62">whole map</text>
 <path d="M170 48 H206" stroke="var(--fg)" marker-end="url(#f)" />
 <path d="M360 48 H396" stroke="var(--fg)" marker-end="url(#f)" /><text x="366" y="40" class="m">no</text>
 <path d="M550 48 H586" stroke="var(--fg)" marker-end="url(#f)" /><text x="556" y="40" class="m">yes</text>
 <path d="M660 76 V116" stroke="var(--fg)" marker-end="url(#f)" /><text x="666" y="102" class="m">route</text>
 <rect x="540" y="120" width="175" height="64" rx="8" fill="#e8f5e9" stroke="var(--ok)" stroke-width="2" /><text x="548" y="142">walk it; re-plan over the</text><text x="548" y="158">whole map before every</text><text x="548" y="174">press for the rest of the call</text>
 <path d="M475 76 V214" stroke="var(--stop)" marker-end="url(#f)" /><text x="482" y="150" class="m">no</text>
 <path d="M596 76 C560 100 525 150 505 226" stroke="var(--stop)" fill="none" stroke-dasharray="5 4" marker-end="url(#f)" /><text x="526" y="214" class="m">no route either</text>
 <rect x="300" y="216" width="200" height="44" rx="8" fill="#fdecea" stroke="var(--stop)" stroke-width="2" /><text x="310" y="236">refusal as before</text><text x="310" y="252" class="m">same reasons, same words</text>
 <text x="10" y="120" class="m">At most 8 ordinary button attempts per call,</text>
 <text x="10" y="138" class="m">ON as OFF (8 planned route steps when</text>
 <text x="10" y="156" class="m">safe-navigation-strides-v1 is on, as in f3b2).</text>
</svg>
