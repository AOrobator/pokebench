<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120" role="img" aria-label="Wiring">
 <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#f5f6f8;--fg:#162333;--card:#fff;--muted:#5a6878;--floor:#e9efe3;--grass:#9fd08a;--ledge:#c9a46a;--wall:#55606c;--walk:#2b6b9d;--later:#6aa0c8;--stop:#c0392b;--ok:#2e7d32;--dash:#8a96a3;--hi:#fff4c2}
*{box-sizing:border-box}
svg{display:block;width:100%;height:auto;min-width:560px}
svg text{font:12px system-ui,-apple-system,sans-serif;fill:var(--fg)}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="720" height="120" style="fill:#ffffff;stroke:none" /><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--fg)" /></marker></defs>
 <rect x="10" y="10" width="140" height="44" rx="8" fill="var(--card)" stroke="var(--dash)" /><text x="20" y="30">run preset</text><text x="20" y="46">features</text>
 <rect x="180" y="10" width="200" height="44" rx="8" fill="var(--card)" stroke="var(--dash)" /><text x="190" y="30">POKEBENCH_FEATURES_OFF</text><text x="190" y="46">(server switch)</text>
 <rect x="410" y="10" width="300" height="44" rx="8" fill="var(--card)" stroke="var(--walk)" stroke-width="3" /><text x="420" y="30">rerender.py: full_map_enabled when</text><text x="420" y="46">full-map-navigation-v1 or this switch is on</text>
 <rect x="180" y="70" width="200" height="44" rx="8" fill="var(--card)" stroke="var(--dash)" /><text x="190" y="90">withNavigation ports</text><text x="190" y="106">windowEscape</text>
 <rect x="410" y="70" width="300" height="44" rx="8" fill="var(--card)" stroke="var(--walk)" stroke-width="3" /><text x="420" y="90">navigation.ts: local plan null → whole-map</text><text x="420" y="106">plan; WINDOW_ESCAPE_SENTENCE</text>
 <path d="M150 32 H176" stroke="var(--fg)" marker-end="url(#h)" /><path d="M380 32 H406" stroke="var(--fg)" marker-end="url(#h)" />
