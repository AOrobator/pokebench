<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="A YES over NO box and what each button does">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#283038}
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#5d5b55;--line:#d9d5cc;--panel:#ffffff;--keep:#2f7d4f;--drop:#b4442f;--accent:#2d5f9a;--fill:#eef3f8;--box:#f4f1ea;}
@media (min-width:1000000px){:root{--bg:#161614;--fg:#ecebe6;--muted:#a8a59c;--line:#3a3833;--panel:#1f1e1b;--keep:#6cc08f;--drop:#e98a74;--accent:#86b3e6;--fill:#22303f;--box:#2a2925}}
svg text{fill:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
svg .small{font-size:11px;fill:var(--muted)}
svg .mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
:root,:root *{--bg:#f8f8f8!important;--panel:#ffffff!important;--card:#ffffff!important;
  --ink:#283038!important;--fg:#283038!important;--muted:#5a6b80!important;--dim:#5a6b80!important;--soft:#5a6b80!important;
  --line:#c9d6e6!important;--rule:#c9d6e6!important;--grid:#e3eaf3!important;--code:#eef3fa!important;--link:#2a62b8!important;}
:root{position:static!important;opacity:1!important;transform:none!important}
</style><rect x="0" y="0" width="860" height="250" style="fill:#ffffff;stroke:none" /><rect x="20" y="30" width="150" height="110" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="60" y="72" class="mono">YES</text><text x="60" y="118" class="mono">NO</text>
<text x="40" y="118" class="mono">▶</text>
<text x="20" y="20" class="small">cursor on NO (row 1)</text>
<rect x="330" y="30" width="150" height="110" rx="6" fill="var(--box)" stroke="var(--line)" />
<text x="370" y="72" class="mono">YES</text><text x="370" y="118" class="mono">NO</text>
<text x="350" y="72" class="mono">▶</text>
<text x="330" y="20" class="small">cursor on YES (row 0)</text>
<line x1="175" y1="100" x2="325" y2="70" stroke="var(--keep)" stroke-width="2" /><text x="215" y="72">UP</text>
<line x1="325" y1="110" x2="175" y2="125" stroke="var(--accent)" stroke-width="2" /><text x="230" y="138">DOWN</text>
<text x="20" y="170">A on NO → the NO branch (clock: back to adjusting)</text>
<text x="20" y="190">A on YES → the YES branch (clock: time set)</text>
<text x="20" y="216" class="small">UP on YES stays on YES and DOWN on NO stays on NO (Menu_MoveCursorNoWrapAround clamps).</text>
<text x="20" y="234" class="small">B returns MENU_B_PRESSED; each listed handler puts it in the same case as NO.</text>
<rect x="600" y="30" width="245" height="110" rx="6" fill="var(--panel)" stroke="var(--accent)" />
<text x="612" y="54">wallclock.c</text>
<text x="612" y="76" class="mono" style="font-size:11px">case 0: // YES → Confirmed</text>
<text x="612" y="96" class="mono" style="font-size:11px">case 1: // NO</text>
<text x="612" y="116" class="mono" style="font-size:11px">case MENU_B_PRESSED: → HandleInput</text>
</svg>
