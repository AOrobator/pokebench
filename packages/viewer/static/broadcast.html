<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeBench · Broadcast</title><link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="/broadcast.css"></head>
<body><div id="stage">
<div class="top"><div class="logo">POKéBENCH</div><div class="who" data-b="who"></div><div class="pill" data-b="pill"></div><div class="where" data-b="where"></div></div>
<div class="gbox"><img class="gba" data-b="game" alt=""></div>
<button type="button" class="sound" data-b="sound" hidden>SOUND ON</button>
<div class="cap" data-b="cap" hidden><div class="lbl">THINKING<br>OUT LOUD</div><div class="say" data-b="say"></div></div>
<div class="side"><div class="tb think"><div class="lbl" data-b="think-label">THINKING</div><div class="body" data-b="think"></div></div>
<div class="tb"><div class="lbl">LAST ACTION</div><div class="ac" data-b="action"></div></div>
<div class="tb"><div class="lbl">PARTY</div><div data-b="party"></div></div></div>
<div class="bar"><div class="clk"><div class="lbl">RUN CLOCK</div><span data-b="clock">0:00:00</span></div><div class="tl"><div class="lane" data-b="lane"></div><span class="now">NOW</span></div><div class="bdgs" data-b="badges"></div><div class="cost"><div class="lbl">API COST</div><span data-b="cost">—</span></div></div>
</div><script type="module" src="/app/broadcast-boot.js"></script></body></html>
