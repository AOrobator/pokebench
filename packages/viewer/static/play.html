<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeBench · Human Play</title><link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/human.css"></head>
<body class="human-page"><main class="human-shell">
<header class="human-bar"><strong>HUMAN PLAY</strong><span data-play="time">0:00:00</span><span data-play="status" role="status">Waiting for a human run</span><button data-play="sound">Sound</button><button data-play="pause" disabled>Start run</button><button data-play="finish" disabled>Finish</button><button data-play="restart" disabled>Start over</button></header>
<div class="human-layout"><section class="human-game"><div data-play="surface" tabindex="0" aria-label="Game screen"><img data-play="screen" alt="Pokémon Emerald game screen"></div><p data-play="focus" role="status">Ready · press Start run</p><p class="human-legend">WASD directions · Z Select · X Start · O A · P B · 1 L · 2 R</p></section>
<section class="human-timeline"><h2>Timeline</h2><div data-play="timeline"></div></section>
<aside class="human-splits"><h2>Splits</h2><div data-play="splits">Milestones appear as you play.</div></aside></div>
<p data-play="problem" class="human-problem" role="alert"></p><footer><a data-play="inspect" href="/">Inspect recording in viewer</a></footer>
</main><script type="module" src="/app/human-main.js"></script></body></html>
