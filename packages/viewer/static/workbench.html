<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeBench · Runs & Comparisons</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script type="module" src="/app/workbench-main.js"></script></head>
<body><div class="pn wb-page"><header class="bar"><a class="logo" href="/">POKE BENCH</a><nav class="nav-chips" aria-label="Pages"><span class="nav-chip" aria-current="page">RUNS &amp; COMPARISONS</span><a class="nav-chip" href="/reports">REPORTS</a><a class="nav-chip" href="/probes">PROBES</a></nav></header>
<main class="wb-workspace"><section class="wb-heading"><div><h1>RUNS & COMPARISONS</h1><p>Recorded story progress and queued experiments.</p></div><div data-wb="current"><a class="wb-button" href="/">← BACK TO VIEWER</a></div></section>
<div class="wb-problems" data-wb="problem" role="status" hidden></div>
<pre class="wb-problems" data-wb="data-problems" hidden></pre>
<section class="box wb-filters wb-primary-filters" aria-label="Comparison filters"><label>EXPERIMENT<select data-wb="cohort" aria-label="Experiment"></select></label><label>MODEL<select data-wb="model" aria-label="Model"></select></label><label>CONFIGURATION<select data-wb="preset" aria-label="Configuration"></select></label><label>OVERLAY RUNS<select data-wb="overlay" aria-label="Overlay runs"></select></label></section>
<section class="box wb-frontier-panel" aria-label="Persistent progress references"><div class="wb-frontier-head"><h2>STORY FRONTIER · ALL SELECTED RUNS</h2><div class="wb-segmented" role="group" aria-label="Story frontier range" data-wb="frontier-view"><button type="button" data-frontier-view="zoom" aria-pressed="true">FRONTIER</button><button type="button" data-frontier-view="full" aria-pressed="false">FULL BASELINE</button><button type="button" data-frontier-outliers aria-label="HIDE TIME OUTLIERS" aria-pressed="true" title="Hide extreme ended overlay runs; references and current runs stay visible">HIDE TIME OUTLIERS</button></div></div><div class="wb-fgx"><div data-wb="frontier-legend" class="wb-legend-host"></div><div data-wb="frontier-full" class="wb-plot">Loading recorded runs…</div></div></section>
<div class="eq-root eq-stats" data-ui="experiment-queue"><section class="box"><h2>EXPERIMENT QUEUE</h2><div data-eq="chips"></div><div data-eq="queue"><p class="eq-empty">Loading the experiment queue…</p></div><div data-eq="pending"></div></section></div>
</main><div data-wb="detail" class="wb-detail" role="dialog" aria-modal="true" aria-label="Run configuration details" hidden><section class="wb-drawer" data-wb="detail-body"></section></div></div></body></html>
